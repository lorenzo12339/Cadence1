/* ---------- Réglages datés d’une habitude ----------
   Les réglages qui changent le calcul (jours, fréquence) et ceux qui servent aux analyses
   (heure, objectif de série, mini-version) sont conservés en versions datées dans
   h.history, triées par date d’effet. Les champs « à plat » de l’habitude (h.days,
   h.freq…) reflètent la version en vigueur aujourd’hui : ils servent à l’affichage et aux
   exports, jamais aux calculs historiques, qui passent par configAt(). */
const CONFIG_KEYS = ['days', 'freq', 'time', 'streakGoal', 'minLabel'];
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
function cleanFreq(f) {
  if (f && f.type === 'weekly') return { type: 'weekly', count: clamp(Math.round(Number(f.count) || 3), 1, 6) };
  return { type: 'days' };
}
function cleanDays(days) {
  const list = Array.isArray(days) ? [...new Set(days.map(Number).filter((n) => Number.isInteger(n) && n >= 0 && n <= 6))].sort() : [];
  return list.length ? list : ALL_DAYS.slice();
}
function configOf(h) {
  return { days: cleanDays(h.days), freq: cleanFreq(h.freq), time: h.time || null, streakGoal: Number(h.streakGoal) || 0, minLabel: String(h.minLabel || '') };
}
function sameSchedule(a, b) {
  const fa = cleanFreq(a.freq); const fb = cleanFreq(b.freq);
  if (fa.type !== fb.type) return false;
  if (fa.type === 'weekly') return fa.count === fb.count;
  return cleanDays(a.days).join() === cleanDays(b.days).join();
}
function sameConfig(a, b) {
  return sameSchedule(a, b) && (a.time || null) === (b.time || null) && (Number(a.streakGoal) || 0) === (Number(b.streakGoal) || 0) && String(a.minLabel || '') === String(b.minLabel || '');
}
function cleanVersion(v, fallbackFrom) {
  return {
    from: /^\d{4}-\d{2}-\d{2}$/.test(v && v.from) ? v.from : fallbackFrom,
    days: cleanDays(v && v.days),
    freq: cleanFreq(v && v.freq),
    time: v && /^\d{2}:\d{2}$/.test(v.time || '') ? v.time : null,
    streakGoal: Number(v && v.streakGoal) || 0,
    minLabel: String((v && v.minLabel) || '').slice(0, 80),
    reason: String((v && v.reason) || '').slice(0, 80),
    note: String((v && v.note) || '').slice(0, 300),
    at: (v && v.at) || new Date().toISOString(),
  };
}
/* Garantit un historique valide : au moins une version, triée, sans doublon de date,
   et dont la première version couvre la date de début de l’habitude. */
function ensureHistory(h) {
  const base = configOf(h);
  let list = Array.isArray(h.history) ? h.history.filter((v) => v && typeof v === 'object').map((v) => ({ ...v, ...cleanVersion(v, h.startDate) })) : [];
  if (!list.length) list = [cleanVersion({ ...base, from: h.startDate, at: h.createdAt }, h.startDate)];
  list.sort((a, b) => a.from.localeCompare(b.from));
  const byDate = new Map();
  for (const v of list) byDate.set(v.from, v); // à date égale, la dernière saisie gagne
  list = [...byDate.values()];
  /* Les versions entièrement antérieures au début ne servent plus : la dernière d’entre
     elles devient la version de départ. */
  let firstIdx = 0;
  for (let i = 0; i < list.length; i++) if (list[i].from <= h.startDate) firstIdx = i;
  list = list.slice(firstIdx);
  list[0].from = h.startDate;
  h.history = list;
  return h;
}
/* Version en vigueur à une date (la plus récente dont la date d’effet est passée). */
function configAt(h, k) {
  const hist = h.history;
  if (!hist || !hist.length) return { from: h.startDate, ...configOf(h) };
  let cur = hist[0];
  for (let i = 1; i < hist.length; i++) { if (hist[i].from <= k) cur = hist[i]; else break; }
  return cur;
}
/* Recopie la version en vigueur aujourd’hui dans les champs à plat de l’habitude. */
function syncMirror(h, k = todayKey()) {
  const c = configAt(h, k);
  h.days = c.days.slice(); h.freq = { ...c.freq }; h.time = c.time; h.streakGoal = c.streakGoal; h.minLabel = c.minLabel;
  return h;
}
/* Enregistre de nouveaux réglages à partir d’une date.
   mode 'from' : à partir de `from` (les versions postérieures sont remplacées) ;
   mode 'all'  : depuis le début, l’historique est réécrit (choix explicite de l’utilisateur). */
function setConfig(h, cfg, { from = todayKey(), mode = 'from', reason = '', note = '' } = {}) {
  ensureHistory(h);
  const at = new Date().toISOString();
  const v = cleanVersion({ ...configAt(h, from), ...cfg, from: mode === 'all' ? h.startDate : D.max(from, h.startDate), reason, note, at }, h.startDate);
  if (mode === 'all') h.history = [v];
  else {
    const kept = h.history.filter((x) => x.from < v.from);
    const prev = kept[kept.length - 1];
    /* Rien à dater si la version précédente est déjà identique. */
    if (prev && sameConfig(prev, v)) h.history = kept;
    else h.history = [...kept, v];
  }
  ensureHistory(h);
  syncMirror(h);
  h.updatedAt = at;
  return h;
}
/* Libellé du rythme : « Tous les jours », « Lu · Me · Ve », « 3 fois par semaine ». */
function freqLabel(c) {
  const f = cleanFreq(c.freq);
  if (f.type === 'weekly') return `${f.count}${NB}fois par semaine`;
  return scheduleLabel(cleanDays(c.days));
}
function freqShort(c) {
  const f = cleanFreq(c.freq);
  return f.type === 'weekly' ? `${f.count}×/sem.` : `${cleanDays(c.days).length}${NB}j/sem.`;
}

/* ---------- Tâches récurrentes ----------
   Une tâche récurrente est un modèle : elle apparaît les jours où sa règle tombe, à
   partir de sa date de départ, et chaque occurrence se coche à part (doneDates). Une
   occurrence oubliée ne s’accumule pas en retard : elle est simplement passée. */
function taskOccursOn(t, k) {
  const r = t.recurrence;
  if (!r) return t.date === k;
  if (k < t.date) return false;
  if (t.until && k > t.until) return false;
  const dw = D.dow(k);
  if (r.type === 'daily') return true;
  if (r.type === 'weekdays') return dw >= 1 && dw <= 5;
  if (r.type === 'weekly') return (r.dow || [1]).includes(dw);
  if (r.type === 'monthly') { const [y, m, d] = D.parse(k); return d === Math.min(r.dom || 1, D.dim(y, m)); }
  return false;
}
function taskDoneOn(t, k) { return t.recurrence ? !!(t.doneDates && t.doneDates[k]) : !!t.done; }
function taskDoneAtOn(t, k) { return t.recurrence ? (t.doneDates || {})[k] || null : t.doneAt; }
function tasksForDay(k) { return state.tasks.filter((t) => taskOccursOn(t, k) && !(t.recurrence && t.skipped && t.skipped[k])); }
function overdueTasks(k) { return state.tasks.filter((t) => !t.recurrence && !t.done && t.date < k); }
function recurrenceLabel(r) {
  if (!r) return 'Ponctuelle';
  if (r.type === 'daily') return 'Tous les jours';
  if (r.type === 'weekdays') return 'En semaine';
  if (r.type === 'weekly') return `Chaque ${weekOrder().filter((d) => (r.dow || [1]).includes(d)).map((d) => WD_LONG[d]).join(', ')}`;
  if (r.type === 'monthly') return `Le ${r.dom === 1 ? '1er' : r.dom} de chaque mois`;
  return '';
}

    ['Travailler sur ses objectifs', 'target', 'cat-focus', '09:00', week, 'Une heure sur le projet prioritaire.', 30, '15 minutes sur une seule tâche'],
    ['Boire 2 litres d’eau', 'drop', 'cat-sante', null, all, 'Une gourde le matin, une l’après-midi.', 30, '1 litre'],
    ['Apprendre une nouvelle compétence', 'cap', 'cat-savoir', '18:30', week, '30 minutes de cours ou de pratique.', 21, '10 minutes'],
