const PARTS = [
  { id: 'morning', name: 'Matin', icon: 'sunrise', test: (t) => t < '12:00' },
  { id: 'afternoon', name: 'Après-midi', icon: 'sun', test: (t) => t < '18:00' },
  { id: 'evening', name: 'Soir', icon: 'moon', test: () => true },
];
function sortTasks(list) {
  return list.slice().sort((a, b) => (a.done - b.done)
    || ((PRIORITIES[a.priority] || PRIORITIES.medium).rank - (PRIORITIES[b.priority] || PRIORITIES.medium).rank)
    || String(a.time || '99').localeCompare(String(b.time || '99'))
    || String(a.createdAt).localeCompare(String(b.createdAt)));
}
function planCard(k) {
  const filter = state.settings.planFilter;
  const withTasks = state.settings.modules.tasksInPlan;
  const habits = activeHabits().filter((h) => isScheduled(h, k));
  const tasks = withTasks ? state.tasks.filter((t) => t.date === k) : [];
  const overdue = withTasks ? sortTasks(state.tasks.filter((t) => !t.done && t.date < k)) : [];
  const items = [];
  if (filter !== 'tasks') habits.forEach((h) => items.push({ type: 'habit', id: h.id, h, time: h.time || null, done: isDone(h, k), name: h.name }));
  if (filter !== 'habits') tasks.forEach((t) => items.push({ type: 'task', id: t.id, t, time: t.time || null, done: t.done, name: t.title }));
  items.sort((a, b) => String(a.time || '99:99').localeCompare(String(b.time || '99:99')) || (a.type === b.type ? 0 : a.type === 'habit' ? -1 : 1) || a.name.localeCompare(b.name, 'fr'));
  const now = nowHM();
  const next = items.find((i) => !i.done && i.time && i.time >= now);
  const rowOf = (i) => (i.type === 'habit' ? habitRow(i.h, k, { next: next === i }) : taskRow(i.t, { next: next === i }));
  const groups = PARTS.map((part) => ({ ...part, list: [] }));
  const anytime = [];
  for (const i of items) {
    if (!i.time) { anytime.push(i); continue; }
    groups.find((g) => g.test(i.time)).list.push(i);
  }
  let body = '';
  if (filter !== 'habits' && overdue.length) body += `<div class="plan-group"><h3 class="late">${icon('alert')}En retard</h3><div class="rows">${overdue.map((t) => taskRow(t, {})).join('')}</div></div>`;
  for (const g of groups) if (g.list.length) body += `<div class="plan-group"><h3>${icon(g.icon)}${g.name}</h3><div class="rows">${g.list.map(rowOf).join('')}</div></div>`;
  if (anytime.length) body += `<div class="plan-group"><h3>${icon('clock')}À tout moment</h3><div class="rows">${anytime.map(rowOf).join('')}</div></div>`;
  if (!body) {
    if (!state.habits.length) body = emptyState('repeat', 'Crée ta première habitude', 'Ajoute une habitude récurrente, puis coche-la chaque jour.', '<button type="button" class="btn primary" data-act="habit-new">' + icon('plus') + 'Nouvelle habitude</button>');
    else if (filter === 'tasks') body = emptyState('tasks', 'Aucune tâche aujourd’hui', 'Ajoute une tâche ponctuelle ci-dessous.');
    else body = emptyState('sun', 'Rien de prévu aujourd’hui', 'Tes habitudes ne sont pas programmées ce jour-là.');
  }
  const doneCount = items.filter((i) => i.done).length;
  const filters = seg([
    ['all', 'Tout'],
    ['habits', `${icon('repeat')}Habitudes`, `${habits.filter((h) => isDone(h, k)).length}/${habits.length}`],
    ...(withTasks ? [['tasks', `${icon('tasks')}Tâches`, `${tasks.filter((t) => t.done).length}/${tasks.length}`]] : []),
  ], filter, 'plan-filter', 'aria-label="Filtrer le plan du jour"');
  const quick = withTasks && filter !== 'habits'
    ? `<form class="quick-add" data-form="plan-task" autocomplete="off"><input class="input" id="plan-task-input" name="title" placeholder="Ajouter une tâche pour aujourd’hui" enterkeyhint="done" maxlength="140" aria-label="Nouvelle tâche pour aujourd’hui"><button type="submit" class="btn" aria-label="Ajouter la tâche">${icon('plus')}</button></form>`
    : '';
  return `<section class="card" aria-label="Plan du jour">
      <div class="card-head"><div class="card-title-group"><h2>Plan du jour</h2><span class="sub">${items.length ? `${doneCount} sur ${items.length} terminé${doneCount > 1 ? 's' : ''}` : '—'}</span></div>${filters}</div>
      ${body}${quick}
    </section>`;
}

function habitRow(h, k, { next = false } = {}) {
  const done = isDone(h, k);
  const cat = catById(h.categoryId);
  const st = habitStreak(h);
  const meta = [];
  if (h.time) meta.push(`<span>${icon('clock')}${h.time}</span>`);
  if (cat) meta.push(`<span>${catDot(cat)}${esc(cat.name)}</span>`);
  if (st.current > 0) meta.push(`<span class="flame">${icon('flame')}${st.current}${NB}j</span>`);
  if (next) meta.push('<span class="next-pill">Prochaine</span>');
  return `<div class="row habit ${done ? 'is-done' : ''}" data-row="${h.id}">
    <button type="button" class="row-hit" data-act="toggle-habit" data-id="${h.id}" data-k="${k}" aria-pressed="${done}">
      <span class="check" aria-hidden="true">${icon('check')}</span>${tile(h)}
      <span class="row-text"><span class="row-title">${esc(h.name)}</span><span class="row-meta">${meta.join('')}</span></span>
    </button>
    <button type="button" class="icon-btn row-more" data-act="habit-open" data-id="${h.id}" aria-label="Détails : ${esc(h.name)}">${icon('more')}</button>
  </div>`;
}
function taskRow(t, { next = false, showDate = false } = {}) {
  const pr = PRIORITIES[t.priority] || PRIORITIES.medium;
  const late = !t.done && t.date < ui.today;
  const meta = [`<span class="prio prio-${esc(t.priority)}">${icon('flag')}${pr.name}</span>`];
  if (t.time) meta.push(`<span>${icon('clock')}${t.time}</span>`);
  if (late) meta.push(`<span class="late-pill">${F.dayRel(t.date, ui.today)}</span>`);
  else if (showDate) meta.push(`<span>${icon('calendar')}${F.dayRel(t.date, ui.today)}</span>`);
  if (next) meta.push('<span class="next-pill">Prochaine</span>');
  return `<div class="row task ${t.done ? 'is-done' : ''}" data-row="${t.id}">
    <button type="button" class="row-hit" data-act="toggle-task" data-id="${t.id}" aria-pressed="${t.done}">
      <span class="check sq" aria-hidden="true">${icon('check')}</span>
      <span class="tile task-tile prio-${esc(t.priority)}">${icon('flag')}</span>
      <span class="row-text"><span class="row-title">${esc(t.title)}</span><span class="row-meta">${meta.join('')}</span></span>
    </button>
    <button type="button" class="icon-btn row-more" data-act="task-edit" data-id="${t.id}" aria-label="Modifier : ${esc(t.title)}">${icon('more')}</button>
  </div>`;
}

function weekCard(k) {
  const ws = weekStartKey(k);
  let sumD = 0; let sumS = 0;
  const cells = [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const dk = D.add(ws, i);
    const s = dayStats(dk);
    const future = dk > k;
    if (!future) { sumD += s.done; sumS += s.scheduled; }
    const label = `${F.cap(F.long(dk))} : ${future ? 'à venir' : s.scheduled ? `${P(Math.round(s.pct * 100))}, ${s.done} sur ${s.scheduled}` : 'rien de prévu'}`;
    return `<button type="button" class="wd ${dk === k ? 'is-today' : ''} ${future ? 'is-future' : ''}" data-act="day-open" data-k="${dk}" aria-label="${esc(label)}"><span class="wd-l">${WD_SHORT[D.dow(dk)]}</span>${miniRing(future ? 0 : s.pct)}<span class="wd-d">${D.parse(dk)[2]}</span></button>`;
  }).join('');
  return `<section class="card"><div class="card-head"><h2>${icon('calendar')}Cette semaine</h2><span class="sub">${sumS ? `Moyenne ${P(pct(sumD, sumS))}` : 'Pas encore de données'}</span></div><div class="week">${cells}</div></section>`;
}

const nextMilestone = (n) => MILESTONES.find((m) => m > n) || n + 10;
function streaksCard() {
  const list = activeHabits().map((h) => ({ h, st: habitStreak(h) })).filter((x) => x.st.current > 0).sort((a, b) => b.st.current - a.st.current).slice(0, 4);
  const t = totals();
  const gr = goalRuns();
  const items = list.length ? list.map(({ h, st }) => {
    const target = h.streakGoal && h.streakGoal > st.current ? h.streakGoal : nextMilestone(st.current);
    const v = Math.min(100, Math.round((st.current / target) * 100));
    const label = h.streakGoal && st.current >= h.streakGoal ? `Objectif de ${h.streakGoal}${NB}j atteint · prochain palier ${target}${NB}j` : `${target - st.current}${NB}j avant ${h.streakGoal && h.streakGoal === target ? 'ton objectif' : 'le prochain palier'} (${target}${NB}j)`;
    return `<div class="streak-item">${tile(h, 'sm')}<div style="min-width:0"><div class="name">${esc(h.name)}</div><div class="bar" role="img" aria-label="${v} %"><i style="--v:${v}"></i></div><div class="meta">${label}</div></div><span class="streak-val">${icon('flame')}${st.current}</span></div>`;
  }).join('') : '<p class="muted small">Coche une habitude deux jours de suite pour lancer ta première série.</p>';
  const rec = t.bestStreak;
  return `<section class="card"><div class="card-head"><h2>${icon('flame')}Séries en cours</h2><button type="button" class="link-btn" data-act="nav" data-view="stats">Statistiques</button></div>
      <div class="streak-list">${items}</div>
      <div class="record">${icon('trophy')}<div><b>Record personnel : ${rec.value}${NB}j</b><br><span>${rec.value ? `${esc(rec.habit)}${rec.date ? ` · atteint le ${F.short(rec.date)}` : ''}` : 'Ton premier record t’attend.'}</span></div></div>
      ${gr.current > 1 ? `<p class="small muted" style="margin-top:12px">${gr.current} jours de suite à ton objectif quotidien.</p>` : ''}
    </section>`;
}

/* ===================== TÂCHES ===================== */
const quickTask = { priority: 'medium', when: 'today' };
function viewTasks() {
  const k = ui.today;
  const todays = state.tasks.filter((t) => t.date === k);
  const overdue = sortTasks(state.tasks.filter((t) => !t.done && t.date < k));
  const upcoming = state.tasks.filter((t) => !t.done && t.date > k).sort((a, b) => a.date.localeCompare(b.date) || String(a.time || '99').localeCompare(String(b.time || '99')));
  const doneList = state.tasks.filter((t) => t.done).sort((a, b) => String(b.doneAt || b.date).localeCompare(String(a.doneAt || a.date)));
  const remaining = todays.filter((t) => !t.done).length + overdue.length;
  const doneToday = todays.filter((t) => t.done).length;
  const hs = dayStats(k);
  const tab = ui.tasksTab;
  let body = '';
  if (tab === 'today') {
    if (overdue.length) body += `<div class="plan-group"><h3 class="late">${icon('alert')}En retard <button type="button" class="link-btn" style="margin-left:auto;text-transform:none;letter-spacing:0" data-act="tasks-postpone">Tout reporter à aujourd’hui</button></h3><div class="rows">${overdue.map((t) => taskRow(t, {})).join('')}</div></div>`;
    if (todays.length) body += `<div class="plan-group"><h3>${icon('tasks')}Aujourd’hui</h3><div class="rows">${sortTasks(todays).map((t) => taskRow(t, {})).join('')}</div></div>`;
    if (!body) body = emptyState('tasks', 'Aucune tâche pour aujourd’hui', 'Ajoute une tâche ponctuelle avec le champ ci-dessus.');
  } else if (tab === 'upcoming') {
    const byDate = {};
    upcoming.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
    body = Object.keys(byDate).sort().map((d) => `<div class="plan-group"><h3>${icon('calendar')}${esc(F.dayRel(d, k))}</h3><div class="rows">${sortTasks(byDate[d]).map((t) => taskRow(t, {})).join('')}</div></div>`).join('') || emptyState('calendar', 'Rien à venir', 'Les tâches planifiées pour les prochains jours apparaîtront ici.');
  } else {
    const list = doneList.slice(0, 80);
    const byDay = {};
    list.forEach((t) => { const d = t.doneAt ? keyOfISO(t.doneAt) : t.date; (byDay[d] = byDay[d] || []).push(t); });
    body = Object.keys(byDay).sort().reverse().map((d) => `<div class="plan-group"><h3>${icon('check')}${esc(F.dayRel(d, k))}</h3><div class="rows">${byDay[d].map((t) => taskRow(t, { showDate: t.date !== d })).join('')}</div></div>`).join('') || emptyState('check', 'Aucune tâche terminée', 'Coche une tâche pour la retrouver ici.');
    if (doneList.length) body += `<div class="btn-row" style="margin-top:12px"><button type="button" class="btn sm ghost" data-act="tasks-clear-done">${icon('trash')}Effacer les tâches terminées</button></div>`;
  }
  const prio = Object.entries(PRIORITIES).map(([id, p]) => `<button type="button" data-act="tq-opt" data-k="priority" data-v="${id}" aria-pressed="${quickTask.priority === id}"><span class="prio prio-${id}">${icon('flag')}</span>${p.name}</button>`).join('');
  const when = [['today', 'Aujourd’hui'], ['tomorrow', 'Demain']].map(([v, l]) => `<button type="button" data-act="tq-opt" data-k="when" data-v="${v}" aria-pressed="${quickTask.when === v}">${l}</button>`).join('');
  return `<section class="page-head"><p class="eyebrow">${esc(F.cap(F.long(k)))}</p><h1 class="page-title">Checklist du jour</h1></section>
    <div class="tiles">
      <div class="tile-stat"><div class="k">Restantes</div><div class="v">${remaining}</div><div class="d">${overdue.length ? `dont ${overdue.length} en retard` : 'aujourd’hui'}</div></div>
      <div class="tile-stat"><div class="k">Terminées</div><div class="v">${doneToday}</div><div class="d">aujourd’hui</div></div>
      <div class="tile-stat"><div class="k">À venir</div><div class="v">${upcoming.length}</div><div class="d">prochains jours</div></div>
      <button type="button" class="tile-stat" data-act="nav" data-view="today"><div class="k">${icon('repeat')}Habitudes du jour</div><div class="v">${hs.done}<small>/${hs.scheduled}</small></div><div class="d">dans Aujourd’hui →</div></button>
    </div>
    <section class="card">
      <form data-form="task-quick" autocomplete="off" class="stack" style="gap:10px">
        <div class="quick-add" style="margin:0"><input class="input" id="task-quick-input" name="title" placeholder="Nouvelle tâche ponctuelle…" maxlength="140" enterkeyhint="done" aria-label="Nouvelle tâche"><button type="submit" class="btn primary">${icon('plus')}<span class="hide-mobile">Ajouter</span></button></div>
        <div class="filter-row wrap"><div class="seg" role="group" aria-label="Priorité">${prio}</div><div class="seg" role="group" aria-label="Date">${when}</div><button type="button" class="btn sm ghost" data-act="task-new">Plus d’options</button></div>
      </form>
    </section>
    <section class="card">
      <div class="card-head">${seg([['today', 'Aujourd’hui', remaining], ['upcoming', 'À venir', upcoming.length], ['done', 'Terminées', doneList.length]], tab, 'tasks-tab', 'aria-label="Afficher"')}</div>
      ${body}
    </section>`;
}

/* ===================== MATRICE ===================== */
function cellState(h, k, today) {
  if (k < h.startDate || (h.archivedAt && k >= h.archivedAt)) return 'na';
  const sch = h.days.includes(D.dow(k));
  if (k > today) return sch ? 'future' : 'off-future';
  const dn = isDone(h, k);
  if (dn) return sch ? 'done' : 'bonus';
  if (!sch) return 'off';
  return k === today ? 'pending' : 'miss';
}
const CELL_LABEL = { done: 'accomplie', bonus: 'bonus (jour non prévu)', pending: 'à faire aujourd’hui', miss: 'non réalisée', off: 'non prévue — touche pour un bonus', future: 'à venir', 'off-future': 'non prévue', na: 'hors période' };

function monthNav(y, m, prev, next, id, todayAct) {
  const [ty, tm] = D.parse(ui.today);
  const isCur = y === ty && m === tm;
  return `<div class="month-nav">
      <button type="button" class="icon-btn" data-act="${prev}" aria-label="Mois précédent">${icon('chevL')}</button>
      <label class="month-label">${esc(F.monthYear(y, m))}<input type="month" id="${id}" value="${y}-${D.pad(m)}" aria-label="Choisir le mois"></label>
      <button type="button" class="icon-btn" data-act="${next}" aria-label="Mois suivant">${icon('chevR')}</button>
      ${!isCur && todayAct ? `<button type="button" class="btn sm ghost" data-act="${todayAct}">Ce mois-ci</button>` : ''}
    </div>`;
}

function viewMatrix() {
  const { y, m } = ui.matrix;
  const [a, b] = monthBounds(y, m);
  const today = ui.today;
  const n = D.dim(y, m);
  const keys = Array.from({ length: n }, (_, i) => D.key(y, m, i + 1));
  const all = state.habits.filter((h) => h.startDate <= b && (!h.archivedAt || h.archivedAt > a)).sort((p, q) => (Number(!!p.archivedAt) - Number(!!q.archivedAt)) || byOrder(p, q));
  const catIds = [...new Set(all.map((h) => h.categoryId || 'none'))];
  if (ui.matrix.cat !== 'all' && !catIds.includes(ui.matrix.cat)) ui.matrix.cat = 'all';
  const rows = ui.matrix.cat === 'all' ? all : all.filter((h) => (h.categoryId || 'none') === ui.matrix.cat);
  let sch = 0; let done = 0; let bonus = 0;
  const perDay = keys.map(() => ({ s: 0, d: 0 }));
  const rowHtml = rows.map((h) => {
    let rs = 0; let rd = 0;
    const c = catColor(catById(h.categoryId));
    const cells = keys.map((k, i) => {
      const st = cellState(h, k, today);
      /* Le jour même, une habitude pas encore cochée n’est pas comptée comme manquée. */
      if (st === 'done' || st === 'miss') { rs++; perDay[i].s++; }
      if (st === 'done') { rd++; perDay[i].d++; }
      if (st === 'pending') perDay[i].s++;
      if (st === 'bonus') bonus++;
      const label = `${h.name}, ${F.long(k)} : ${CELL_LABEL[st]}`;
      if (['done', 'bonus', 'pending', 'miss', 'off'].includes(st)) {
        return `<button type="button" class="c ${st}" data-act="cell" data-id="${h.id}" data-k="${k}" aria-label="${esc(label)}" aria-pressed="${st === 'done' || st === 'bonus'}" data-tip="${esc(label)}"></button>`;
      }
      return `<span class="c ${st === 'off-future' ? 'off' : st}" aria-hidden="true"></span>`;
    }).join('');
    sch += rs; done += rd;
    return `<div class="mx-name ${h.archivedAt ? 'archived' : ''}"><button type="button" data-act="habit-open" data-id="${h.id}">${tile(h, 'sm')}<span class="t">${esc(h.name)}</span></button></div>
      <div style="display:contents;--c:${c};--cbg:${rgba(c, 0.45)}">${cells}</div>
      <div class="mx-end"><b>${rs ? P(pct(rd, rs)) : '—'}</b><span>${rd}/${rs}</span></div>`;
  }).join('');
  const heads = keys.map((k) => { const dow = D.dow(k); return `<div class="mx-dh ${k === today ? 'is-today' : ''} ${dow === 0 || dow === 6 ? 'is-we' : ''}"><span>${WD_LETTER[dow]}</span><b>${D.parse(k)[2]}</b></div>`; }).join('');
  const foot = keys.map((k, i) => {
    const pd = perDay[i];
    if (k > today || !pd.s) return `<div class="mx-bar none" aria-hidden="true"><i></i></div>`;
    const v = pct(pd.d, pd.s);
    return `<div class="mx-bar ${k === today ? 'is-today' : ''}" style="--v:${v}" data-tip="${esc(`${F.cap(F.long(k))} : ${P(v)} (${pd.d}/${pd.s})`)}" aria-hidden="true"><i></i></div>`;
  }).join('');
  const ms = rangeStats(a, b);
  const rate = sch ? pct(done, sch) : null;
  const catChips = catIds.length > 1 ? `<div class="filter-row">${[['all', 'Toutes']].concat(catIds.map((id) => { const c = catById(id); return [id, c ? `${catDot(c)}${esc(c.name)}` : 'Sans catégorie']; })).map(([id, l]) => `<button type="button" class="chip" data-act="mx-cat" data-v="${id}" aria-pressed="${ui.matrix.cat === id}">${l}</button>`).join('')}</div>` : '';
  const grid = rows.length
    ? `<div class="mx-scroll" id="mx-scroll" data-month="${y}-${m}"><div class="mx" style="--n:${n}" data-color="${state.settings.matrixColor === 'categorie' ? 'cat' : 'accent'}" aria-label="Matrice des habitudes">
        <div class="mx-corner">Habitude</div>${heads}<div class="mx-th-end">Mois</div>
        ${rowHtml}
        <div class="mx-sep"></div>
        <div class="mx-foot-l">Jour</div>${foot}<div class="mx-end"></div>
      </div></div>`
    : emptyState('grid', 'Aucune habitude sur ce mois', 'Les habitudes actives sur cette période apparaîtront ici.', state.habits.length ? '' : `<button type="button" class="btn primary" data-act="habit-new">${icon('plus')}Nouvelle habitude</button>`);
  return `<section class="page-head row-head"><div><p class="eyebrow">Habit matrix</p><h1 class="page-title">Matrice mensuelle</h1></div>${monthNav(y, m, 'mx-prev', 'mx-next', 'mx-month', 'mx-today')}</section>
    <div class="tiles four">
      <div class="tile-stat"><div class="k">Régularité du mois</div><div class="v">${rate === null ? '—' : P(rate)}</div><div class="d">${done} sur ${sch} prévues</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${done + bonus}</div><div class="d">${bonus ? `dont ${bonus} bonus` : 'cases cochées'}</div></div>
      <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${ms.perfect}</div><div class="d">100 % accompli</div></div>
      <div class="tile-stat"><div class="k">Jours à l’objectif</div><div class="v">${ms.goalDays}<small>/${ms.days}</small></div><div class="d">objectif ${P(state.goals.daily)}</div></div>
    </div>
    <section class="card">
      ${catChips ? `<div style="margin-bottom:14px">${catChips}</div>` : ''}
      ${grid}
      <div class="legend" style="margin-top:14px">
        <span><i class="c done"></i>Accomplie</span><span><i class="c miss"></i>Non réalisée</span><span><i class="c pending"></i>À faire</span>
        <span><i class="c future"></i>À venir</span><span><i class="c off"></i>Non prévue</span><span><i class="c bonus"></i>Bonus</span>
      </div>
      <p class="hint" style="margin-top:10px">Touche une case pour cocher ou décocher un jour passé.</p>
    </section>`;
}

/* ===================== STATISTIQUES ===================== */
const RANGES = [[7, '7 j'], [30, '30 j'], [90, '90 j'], [365, '12 mois']];
function viewStats() {
  const k = ui.today;
  const range = ui.stats.range;
  const goal = state.goals.daily;
  /* A. Régularité du jour */
  const s = dayStats(k);
  const yd = dayStats(D.add(k, -1));
  const pToday = s.scheduled ? Math.round((s.done / s.scheduled) * 100) : null;
  const pYest = yd.scheduled ? Math.round((yd.done / yd.scheduled) * 100) : null;
  const w7 = rangeStats(D.add(k, -7), D.add(k, -1));
  const delta = pToday !== null && pYest !== null ? pToday - pYest : null;
  const daily = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Daily consistency</h2><span class="sub">Aujourd’hui · ${esc(F.long(k))}</span></div></div>
    <div class="consistency"><div class="ring-wrap">${ring(s.pct || 0, { size: 112, stroke: 11, id: 'st-day', label: 'Régularité du jour', goal })}<div class="ring-center"><span class="hero-ring-v">${pToday === null ? '—' : pToday}<small>${pToday === null ? '' : '%'}</small></span></div></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Complétées</div><div class="v">${s.done}<small>/${s.scheduled}</small></div></div>
        <div class="tile-stat"><div class="k">Vs hier</div><div class="v ${delta > 0 ? 'delta-up' : delta < 0 ? 'delta-down' : ''}">${delta === null ? '—' : `${delta > 0 ? '+' : delta < 0 ? '−' : ''}${Math.abs(delta)}`}<small>${delta === null ? '' : 'pts'}</small></div></div>
        <div class="tile-stat" style="grid-column:1/-1"><div class="k">Moyenne des 7 derniers jours</div><div class="v">${w7.rate === null ? '—' : P(Math.round(w7.rate * 100))}</div></div>
      </div></div></section>`;
  /* B. Régularité du mois */
  const { y, m } = ui.stats;
  const [ma, mb] = monthBounds(y, m);
  const ms = rangeStats(ma, mb);
  const monthly = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Monthly consistency</h2><span class="sub">Objectif mensuel ${P(state.goals.monthly)}</span></div>${monthNav(y, m, 'st-prev', 'st-next', 'st-month', 'st-today')}</div>
    <div class="consistency"><div class="ring-wrap">${ring(ms.rate || 0, { size: 112, stroke: 11, id: 'st-month', label: 'Réussite du mois', goal: state.goals.monthly })}<div class="ring-center"><span class="hero-ring-v">${ms.rate === null ? '—' : Math.round(ms.rate * 100)}<small>${ms.rate === null ? '' : '%'}</small></span></div></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Réussite globale</div><div class="v">${ms.rate === null ? '—' : P(Math.round(ms.rate * 100))}</div><div class="d">${ms.done}/${ms.scheduled} prévues</div></div>
        <div class="tile-stat"><div class="k">Taux de régularité</div><div class="v">${ms.regularity === null ? '—' : P(Math.round(ms.regularity * 100))}</div><div class="d">${ms.goalDays}/${ms.days} jours à l’objectif</div></div>
        <div class="tile-stat"><div class="k">Validations</div><div class="v">${ms.validations}</div><div class="d">${ms.bonus ? `dont ${ms.bonus} bonus` : 'sur le mois'}</div></div>
        <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${ms.perfect}</div><div class="d">100 % accompli</div></div>
      </div></div></section>`;
  /* C. Tendance */
  const pts = trendSeries(range);
  const vals = pts.filter((p) => p.v !== null);
  const rs = range === 365 ? rangeStats(pts[0].k, k) : rangeStats(D.add(k, -(range - 1)), k);
  const avg = rs.rate === null ? null : Math.round(rs.rate * 100);
  const best = vals.reduce((b, p) => (b === null || p.v > b.v ? p : b), null);
  const half = Math.floor(pts.length / 2);
  const sum = (list) => { const d = list.reduce((a, p) => a + p.done, 0); const sc = list.reduce((a, p) => a + p.scheduled, 0); return sc ? (d / sc) * 100 : null; };
  const h1 = sum(pts.slice(0, half)); const h2 = sum(pts.slice(half));
  const evo = h1 === null || h2 === null ? null : Math.round(h2 - h1);
  const unit = range === 365 ? 'Hebdomadaire' : 'Quotidien';
  const trendTable = `<div class="table-wrap"><table class="data"><thead><tr><th>${range === 365 ? 'Semaine' : 'Jour'}</th><th class="r">Régularité</th><th class="r">Moyenne</th><th class="r">Faites</th></tr></thead><tbody>${pts.slice().reverse().map((p) => `<tr><td>${esc(p.label)}</td><td class="r">${p.v === null ? '—' : P(p.v)}</td><td class="r">${p.avg === null ? '—' : P(p.avg)}</td><td class="r">${p.done}/${p.scheduled}</td></tr>`).join('')}</tbody></table></div>`;
  const trend = `<section class="card span-2"><div class="card-head"><div class="card-title-group"><h2>Consistency trend</h2><span class="sub">Part des habitudes prévues réellement accomplies</span></div><button type="button" class="btn sm ghost" data-act="table-toggle" data-t="trend">${ui.tables.trend ? `${icon('chart')}Graphique` : `${icon('list')}Tableau`}</button></div>
    <div class="summary-line"><div><b>${avg === null ? '—' : P(avg)}</b><span>Moyenne de la période</span></div><div><b>${best ? P(best.v) : '—'}</b><span>${best ? `Meilleur : ${esc(best.label)}` : 'Meilleur jour'}</span></div><div><b class="${evo > 0 ? 'delta-up' : evo < 0 ? 'delta-down' : ''}">${evo === null ? '—' : `${evo > 0 ? '+' : evo < 0 ? '−' : '±'}${Math.abs(evo)}${NB}pts`}</b><span>Évolution (2ᵉ moitié vs 1ʳᵉ)</span></div></div>
    ${ui.tables.trend ? trendTable : `<div class="chart-legend"><span><i class="key" style="--k:var(--accent)"></i>${unit}</span><span><i class="key" style="--k:var(--ink-2)"></i>Moyenne ${range === 365 ? '4 semaines' : '7 jours'}</span><span><i class="key dash" style="--k:var(--ink-3)"></i>Objectif ${P(goal)}</span></div><div class="chart" data-chart="trend" style="height:210px"></div>`}
    </section>`;
  /* Comparaison des jours */
  const wd = weekdayStats(range);
  const wdVals = wd.filter((d) => d.v !== null);
  const bestD = wdVals.reduce((b, d) => (!b || d.v > b.v ? d : b), null);
  const worstD = wdVals.reduce((b, d) => (!b || d.v < b.v ? d : b), null);
  const wdTable = `<table class="data"><thead><tr><th>Jour</th><th class="r">Régularité</th><th class="r">Faites</th></tr></thead><tbody>${wd.map((d) => `<tr><td>${F.cap(d.long)}</td><td class="r">${d.v === null ? '—' : P(d.v)}</td><td class="r">${d.done}/${d.scheduled}</td></tr>`).join('')}</tbody></table>`;
  const weekday = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Comparaison des jours</h2><span class="sub">Régularité moyenne par jour de la semaine</span></div><button type="button" class="btn sm ghost" data-act="table-toggle" data-t="weekday">${ui.tables.weekday ? `${icon('chart')}Graphique` : `${icon('list')}Tableau`}</button></div>
    ${ui.tables.weekday ? wdTable : '<div class="chart" data-chart="weekday" style="height:180px"></div>'}
    ${bestD && worstD && bestD !== worstD ? `<p class="small muted" style="margin-top:8px">Point fort : <b style="color:var(--ink-1)">${bestD.long}</b> · À renforcer : <b style="color:var(--ink-1)">${worstD.long}</b></p>` : ''}
    </section>`;
  /* D. Top habitudes */
  const top = topHabits(range);
  const shown = ui.stats.allTop ? top : top.slice(0, 6);
  const topCard = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Top habits</h2><span class="sub">Classement par taux de réussite</span></div></div>
    ${top.length ? `<div class="rank">${shown.map((x, i) => `<div class="rank-item"><span class="rank-n">${i + 1}</span>${tile(x.h, 'sm')}<div style="min-width:0"><div class="name">${esc(x.h.name)}</div><div class="bar"><i style="--v:${Math.round(x.rate * 100)}"></i></div><div class="meta">${x.done} jour${x.done > 1 ? 's' : ''} accompli${x.done > 1 ? 's' : ''} sur ${x.scheduled}${x.streak.current ? ` · série ${x.streak.current}${NB}j` : ''}</div></div><div class="rank-v"><b>${P(Math.round(x.rate * 100))}</b></div></div>`).join('')}</div>
      ${top.length > 6 ? `<button type="button" class="link-btn" style="margin-top:14px" data-act="top-all">${ui.stats.allTop ? 'Afficher moins' : `Afficher les ${top.length}`}</button>` : ''}` : '<p class="muted small">Pas encore de données sur cette période.</p>'}
    </section>`;
  /* Séries & records */
  const t = totals();
  const gr = goalRuns();
  const perHabit = activeHabits().map((h) => ({ h, st: habitStreak(h) }));
  const streaks = `<section class="card"><div class="card-head"><h2>${icon('flame')}Séries & records</h2></div>
    <div class="tiles">
      <div class="tile-stat"><div class="k">Série en cours</div><div class="v">${gr.current}<small>j</small></div><div class="d">à l’objectif d’affilée</div></div>
      <div class="tile-stat"><div class="k">Meilleure série</div><div class="v">${Math.max(gr.best, state.records.bestGoalRun.value || 0)}<small>j</small></div><div class="d">à l’objectif d’affilée</div></div>
      <div class="tile-stat"><div class="k">Record personnel</div><div class="v">${t.bestStreak.value}<small>j</small></div><div class="d" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.bestStreak.value ? esc(t.bestStreak.habit) : 'sur une habitude'}</div></div>
      <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${t.perfect}</div><div class="d">depuis le début</div></div>
    </div>
    ${perHabit.length ? `<div class="table-wrap" style="margin-top:14px"><table class="data"><thead><tr><th>Habitude</th><th class="r">Actuelle</th><th class="r">Meilleure</th></tr></thead><tbody>${perHabit.map(({ h, st }) => `<tr><td>${esc(h.name)}</td><td class="r">${st.current}${NB}j</td><td class="r">${st.best}${NB}j</td></tr>`).join('')}</tbody></table></div>` : ''}
    </section>`;
  /* Trophées */
  const unlocked = ACHIEVEMENTS.filter((a) => state.achievements[a.id]).length;
  const trophies = `<section class="card span-2"><div class="card-head"><div class="card-title-group"><h2>${icon('trophy')}Trophées</h2><span class="sub">${unlocked} sur ${ACHIEVEMENTS.length} débloqués</span></div></div>
    <div class="trophies">${ACHIEVEMENTS.map((a) => { const at = state.achievements[a.id]; return `<div class="trophy ${at ? 'on' : 'off'}"><span class="medal">${icon(at ? a.icon : 'lock')}</span><b>${esc(a.name)}</b><span>${esc(a.desc)}</span>${at ? `<span class="when">Le ${F.short(keyOfISO(at))}</span>` : ''}</div>`; }).join('')}</div>
    </section>`;
  /* Historique */
  const year = ui.stats.year;
  const recent = [];
  for (const dk in state.completions) for (const id in state.completions[dk]) recent.push({ dk, id, ts: state.completions[dk][id] });
  recent.sort((p, q) => String(q.ts).localeCompare(String(p.ts)));
  const history = `<section class="card span-2"><div class="card-head"><div class="card-title-group"><h2>${icon('calendar')}Historique</h2><span class="sub">Chaque case est un jour. Touche-la pour voir le détail.</span></div>
      <div class="month-nav"><button type="button" class="icon-btn" data-act="hm-prev" aria-label="Année précédente">${icon('chevL')}</button><span class="month-label" style="min-width:84px">${year}</span><button type="button" class="icon-btn" data-act="hm-next" aria-label="Année suivante">${icon('chevR')}</button></div></div>
    <div class="hm-scroll" id="hm-scroll" data-year="${year}">${heatmap(year)}</div>
    <div class="hm-legend"><span>Moins</span><i class="hm-c l0"></i><i class="hm-c l1"></i><i class="hm-c l2"></i><i class="hm-c l3"></i><i class="hm-c l4"></i><span>Plus</span><span style="margin-left:12px">0 % · &lt;40 % · 40–69 % · 70–99 % · 100 %</span></div>
    <details class="fold" style="margin-top:16px"><summary>Activité récente ${icon('chevD')}</summary>
      ${recent.length ? `<ul class="plain activity">${recent.slice(0, 15).map((r) => { const h = habitById(r.id); return `<li>${h ? tile(h, 'sm') : ''}<span>${esc(h ? h.name : 'Habitude supprimée')}</span><span class="when">${esc(F.cap(F.dayShort(r.dk)))} · ${F.timeOfISO(r.ts)}</span></li>`; }).join('')}</ul>` : '<p class="muted small">Aucune validation pour l’instant.</p>'}
    </details>
    </section>`;
  const rangeSeg = seg(RANGES.map(([v, l]) => [v, l]), range, 'stats-range', 'aria-label="Période analysée"');
  return `<section class="page-head"><p class="eyebrow">Analyses</p><h1 class="page-title">Statistiques</h1></section>
    <div class="stats-grid">${daily}${monthly}</div>
    <div class="page-head row-head" style="padding-top:8px"><div><p class="eyebrow">Période analysée</p><p class="lede">Les modules ci-dessous portent sur ${range === 365 ? 'les 12 derniers mois' : `les ${range} derniers jours`}.</p></div>${rangeSeg}</div>
    <div class="stats-grid">${trend}${weekday}${topCard}${streaks}${trophies}${history}</div>`;
}

function heatmap(year) {
  const first = D.key(year, 1, 1);
  const last = D.key(year, 12, 31);
  const start = weekStartKey(first);
  const out = ['<span></span>'];
  weekOrder().forEach((d, i) => out.push(`<span class="hm-wl">${i % 2 === 0 ? WD_SHORT[d] : ''}</span>`));
  for (let w = start; w <= last; w = D.add(w, 7)) {
    let label = '';
    for (let i = 0; i < 7; i++) { const dk = D.add(w, i); if (dk.slice(8) === '01' && +dk.slice(0, 4) === year) { label = F.monthShort(+dk.slice(5, 7)); break; } }
    out.push(`<span class="hm-ml">${label}</span>`);
    for (let i = 0; i < 7; i++) {
      const dk = D.add(w, i);
      if (dk < first || dk > last) { out.push('<span class="hm-c blank"></span>'); continue; }
      if (dk > ui.today) { out.push('<span class="hm-c future"></span>'); continue; }
      const s = dayStats(dk);
      let cls = 'none';
      if (s.scheduled) { const p = s.done / s.scheduled; cls = p === 0 ? 'l0' : p < 0.4 ? 'l1' : p < 0.7 ? 'l2' : p < 1 ? 'l3' : 'l4'; }
      const tip = `${F.cap(F.dayShort(dk))} : ${s.scheduled ? `${P(Math.round(s.pct * 100))} (${s.done}/${s.scheduled})` : 'rien de prévu'}`;
      out.push(`<button type="button" class="hm-c ${cls} ${dk === ui.today ? 'is-today' : ''}" data-act="day-open" data-k="${dk}" data-tip="${esc(tip)}" aria-label="${esc(tip)}"></button>`);
    }
  }
  return `<div class="hm" style="grid-template-columns:20px">${out.join('')}</div>`;
}

/* ===================== HABITUDES ===================== */
function viewHabits() {
  const active = activeHabits();
  const archived = archivedHabits();
  const cats = state.categories;
  const counts = {};
  active.forEach((h) => { const id = catById(h.categoryId) ? h.categoryId : 'none'; counts[id] = (counts[id] || 0) + 1; });
  if (ui.habitsCat !== 'all' && !counts[ui.habitsCat]) ui.habitsCat = 'all';
  const chips = [['all', 'Toutes', active.length]].concat(cats.filter((c) => counts[c.id]).map((c) => [c.id, `${catDot(c)}${esc(c.name)}`, counts[c.id]])).concat(counts.none ? [['none', 'Sans catégorie', counts.none]] : []);
  const groups = cats.map((c) => ({ c, list: active.filter((h) => h.categoryId === c.id) })).concat([{ c: null, list: active.filter((h) => !catById(h.categoryId)) }])
    .filter((g) => g.list.length && (ui.habitsCat === 'all' || (g.c ? g.c.id : 'none') === ui.habitsCat));
  const k = ui.today;
  const from30 = D.add(k, -29);
  const card = (h) => {
    const st = habitStreak(h);
    const r30 = habitRange(h, from30, k);
    const idx = active.indexOf(h);
    return `<article class="card hcard ${h.archivedAt ? 'archived' : ''}">
        <button type="button" class="hcard-hit" data-act="habit-open" data-id="${h.id}">${tile(h, 'lg')}
          <span style="min-width:0;flex:1"><span class="name" style="display:block">${esc(h.name)}</span>${h.description ? `<span class="desc" style="display:block">${esc(h.description)}</span>` : ''}
          <span class="facts"><span>${icon('repeat')}${scheduleLabel(h.days)}</span>${h.time ? `<span>${icon('clock')}${h.time}</span>` : ''}<span class="flame">${icon('flame')}${st.current}${NB}j</span><span>${icon('chart')}${r30.rate === null ? '—' : P(Math.round(r30.rate * 100))} sur 30${NB}j</span></span></span>
        </button>
        <div class="hcard-actions">${ui.reorder
    ? `<button type="button" class="icon-btn" data-act="habit-up" data-id="${h.id}" aria-label="Monter" ${idx === 0 ? 'disabled' : ''}>${icon('arrowUp')}</button><button type="button" class="icon-btn" data-act="habit-down" data-id="${h.id}" aria-label="Descendre" ${idx === active.length - 1 ? 'disabled' : ''}>${icon('arrowDown')}</button>`
    : `<button type="button" class="icon-btn" data-act="habit-edit" data-id="${h.id}" aria-label="Modifier ${esc(h.name)}">${icon('edit')}</button>`}</div>
      </article>`;
  };
  const body = groups.length
    ? groups.map((g) => `<div><div class="cat-head">${g.c ? catDot(g.c) : ''}${g.c ? esc(g.c.name) : 'Sans catégorie'} <span class="n">${g.list.length}</span></div><div class="habit-cards">${g.list.map(card).join('')}</div></div>`).join('')
    : `<section class="card">${emptyState('repeat', 'Aucune habitude pour l’instant', 'Crée tes habitudes récurrentes : heure, jours, catégorie et icône.', `<div class="btn-row" style="justify-content:center"><button type="button" class="btn primary" data-act="habit-new">${icon('plus')}Nouvelle habitude</button><button type="button" class="btn" data-act="add-samples">${icon('sparkles')}Ajouter les 8 suggestions</button></div>`)}</section>`;
  const arch = archived.length ? `<section class="card"><button type="button" class="btn ghost block" style="justify-content:space-between" data-act="archived-toggle">${icon('archive')}<span style="flex:1;text-align:left">Habitudes archivées (${archived.length})</span>${icon(ui.showArchived ? 'chevD' : 'chevR')}</button>
      ${ui.showArchived ? `<div class="rows" style="margin-top:8px">${archived.map((h) => `<div class="row">${tile(h, 'sm')}<span class="row-text" style="padding:10px 4px"><span class="row-title">${esc(h.name)}</span><span class="row-meta"><span>Archivée le ${F.short(h.archivedAt)} · historique conservé</span></span></span><button type="button" class="btn sm" data-act="habit-restore" data-id="${h.id}">${icon('restore')}Restaurer</button><button type="button" class="icon-btn" data-act="habit-purge" data-id="${h.id}" aria-label="Supprimer définitivement">${icon('trash')}</button></div>`).join('')}</div>` : ''}
    </section>` : '';
  return `<section class="page-head row-head"><div><p class="eyebrow">${plural(active.length, 'habitude active', 'habitudes actives')}</p><h1 class="page-title">Mes habitudes</h1></div>
      <div class="btn-row">${active.length > 1 ? `<button type="button" class="btn sm ${ui.reorder ? 'primary' : ''}" data-act="habits-reorder">${icon(ui.reorder ? 'check' : 'list')}${ui.reorder ? 'Terminé' : 'Réorganiser'}</button>` : ''}<button type="button" class="btn sm" data-act="customize-cats">${icon('palette')}Catégories</button></div></section>
    ${chips.length > 2 ? `<div class="filter-row">${chips.map(([id, l, n]) => `<button type="button" class="chip" data-act="habits-cat" data-v="${id}" aria-pressed="${ui.habitsCat === id}">${l} <span class="muted">${n}</span></button>`).join('')}</div>` : ''}
    ${body}${arch}`;
}

      <div class="set-row"><div class="lbl"><b>Stockage</b><span>${esc(Store.label())}${Store.persisted ? ' · protégé contre l’effacement automatique' : ''}</span></div><div class="ctl"><span class="small muted">${Store.lastSavedAt ? `Enregistré ${esc(F.rel(new Date(Store.lastSavedAt).toISOString()))}` : 'À jour'}</span></div></div>
      <div class="set-row"><div class="lbl"><b>Contenu</b><span>${plural(state.habits.length, 'habitude', 'habitudes')} · ${plural(countChecks(state), 'validation', 'validations')} · ${plural(state.tasks.length, 'tâche', 'tâches')}</span></div></div>

    <p class="hint" style="margin-top:8px">Exporte régulièrement un fichier de sauvegarde (dans Fichiers ou iCloud Drive) : il te permet de retrouver tes données sur un autre appareil.</p>
    <details class="fold" style="margin-top:14px" id="backups-fold"><summary>Sauvegardes automatiques ${icon('chevD')}</summary><div id="backup-list"><p class="small muted">Chargement…</p></div></details>

async function renderBackupList() {
  const host = $('#backup-list');
  if (!host) return;
  const list = await Backups.list();
  host.innerHTML = list.length
    ? `<ul class="plain activity">${list.map((b) => `<li><span>${esc(BACKUP_REASONS[b.reason] || b.reason)}<br><span class="small muted">${esc(F.rel(b.at))} · ${b.habits} habitudes · ${b.checks} validations · v${esc(b.version)}</span></span><button type="button" class="btn sm" style="margin-left:auto" data-act="backup-restore" data-id="${b.id}">Restaurer</button></li>`).join('')}</ul>`

/* =====================================================================
   PANNEAUX — habitude, tâche, journée, personnalisation, accueil, guides
   ===================================================================== */

function refreshAll() {
  render();
  Sheet.stack.forEach((e) => { if (e.refresh) e.refresh(); });
}
/* Remplace toutes les données (démo, import, restauration…) : trophées déjà mérités débloqués sans fanfare. */
function adoptState(s) {
  state = s;
  Stats.reset();
  ui.today = todayKey();
  evaluateAchievements();
  commit();
  applyTheme();
}
function pressIn(root, selector, isOn) {
  $$(selector, root).forEach((b) => b.setAttribute('aria-pressed', String(!!isOn(b))));
}

/* ---------- Éditeur d’habitude ---------- */
function openHabitEditor(id = null, preset = {}) {
  const existing = id ? habitById(id) : null;
  const d = existing ? deepCopy(existing) : {
    name: '', description: '', icon: 'check', categoryId: (state.categories[0] || {}).id || null,
    time: null, days: [0, 1, 2, 3, 4, 5, 6], streakGoal: 21, startDate: ui.today, ...preset,
  };
  const colorOf = () => { const c = catColor(catById(d.categoryId)); return `--c:${c};--cbg:${rgba(c, 0.17)}`; };
  const catButtons = () => state.categories.map((c) => `<button type="button" data-sx="cat" data-v="${c.id}" aria-pressed="${d.categoryId === c.id}" style="--c:${catColor(c)};--cbg:${rgba(catColor(c), 0.16)}">${catDot(c)}${esc(c.name)}</button>`).join('')
    + `<button type="button" data-sx="cat" data-v="" aria-pressed="${!d.categoryId}" style="--c:var(--ink-3);--cbg:var(--surface-3)">Aucune</button>`;
  const isEmoji = String(d.icon).startsWith('emoji:');
  const body = `
    <div class="field"><span>Nom de l’habitude</span><input id="he-name" maxlength="80" value="${esc(d.name)}" placeholder="Ex. : Lire 20 minutes" autocomplete="off" enterkeyhint="next"></div>
    <div class="field"><span>Description <span class="muted">(facultatif)</span></span><textarea id="he-desc" maxlength="300" rows="2" placeholder="Pourquoi, comment, où…">${esc(d.description || '')}</textarea></div>
    <section><div class="section-title">Icône</div>
      <div class="icon-grid" id="he-icons" style="${colorOf()}">${HABIT_ICONS.map(([n, label]) => `<button type="button" data-sx="icon" data-v="${n}" aria-pressed="${d.icon === n}" aria-label="${label}" title="${label}">${icon(n)}</button>`).join('')}</div>
      <div class="field" style="margin-top:12px"><span>Ou un emoji</span><input id="he-emoji" maxlength="8" value="${isEmoji ? esc(d.icon.slice(6)) : ''}" placeholder="Ex. : 🏃" autocomplete="off"></div>
    </section>
    <section><div class="section-title">Catégorie</div><div class="cat-pick" id="he-cats">${catButtons()}</div>
      <form class="quick-add" data-sform="newcat" autocomplete="off"><input class="input" id="he-newcat" maxlength="30" placeholder="Nouvelle catégorie" aria-label="Nom de la nouvelle catégorie"><button type="submit" class="btn" aria-label="Créer la catégorie">${icon('plus')}</button></form>
    </section>
    <section><div class="section-title">Jours de répétition</div>
      <div class="days-pick" id="he-days">${weekOrder().map((dw) => `<button type="button" data-sx="day" data-v="${dw}" aria-pressed="${d.days.includes(dw)}" aria-label="${WD_LONG[dw]}">${WD_SHORT[dw]}</button>`).join('')}</div>
      <div class="chips" style="margin-top:10px"><button type="button" class="chip" data-sx="days" data-v="all">Tous les jours</button><button type="button" class="chip" data-sx="days" data-v="week">En semaine</button><button type="button" class="chip" data-sx="days" data-v="we">Le week-end</button></div>
    </section>
    <div class="field-row">
      <div class="field"><span>Heure de réalisation</span><input id="he-time" type="time" value="${d.time || ''}"><span class="hint">Vide : à tout moment</span></div>
      <div class="field"><span>Date de début</span><input id="he-start" type="date" value="${esc(d.startDate)}"><span class="hint">Les jours avant ne comptent pas</span></div>
    </div>
    <section><div class="section-title">Objectif de série</div><div class="chips" id="he-goals">${STREAK_GOALS.map((g) => `<button type="button" class="chip" data-sx="goal" data-v="${g}" aria-pressed="${(d.streakGoal || 0) === g}">${g ? `${g} jours` : 'Aucun'}</button>`).join('')}</div>
      <p class="hint" style="margin-top:8px">Atteindre l’objectif déclenche une petite célébration.</p></section>
    <p class="err" id="he-err" role="alert" hidden></p>`;
  const footer = `${existing ? `<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}${existing ? 'Enregistrer' : 'Créer'}</button>`;
  Sheet.open({
    title: existing ? 'Modifier l’habitude' : 'Nouvelle habitude',
    body,
    footer,
    onMount(el, entry) {
      const err = (msg) => { const e = $('#he-err', el); e.textContent = msg; e.hidden = !msg; };
      const syncDays = () => pressIn(el, '#he-days [data-sx="day"]', (b) => d.days.includes(+b.dataset.v));
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        if (sx === 'icon') { d.icon = b.dataset.v; $('#he-emoji', el).value = ''; pressIn(el, '#he-icons [data-sx="icon"]', (x) => x.dataset.v === d.icon); }
        if (sx === 'cat') { d.categoryId = b.dataset.v || null; pressIn(el, '#he-cats [data-sx="cat"]', (x) => (x.dataset.v || null) === d.categoryId); $('#he-icons', el).setAttribute('style', colorOf()); }
        if (sx === 'day') { const v = +b.dataset.v; d.days = d.days.includes(v) ? d.days.filter((x) => x !== v) : [...d.days, v].sort(); syncDays(); }
        if (sx === 'days') { d.days = { all: [0, 1, 2, 3, 4, 5, 6], week: [1, 2, 3, 4, 5], we: [0, 6] }[b.dataset.v]; syncDays(); }
        if (sx === 'goal') { d.streakGoal = +b.dataset.v; pressIn(el, '#he-goals [data-sx="goal"]', (x) => +x.dataset.v === d.streakGoal); }
        if (sx === 'delete' && existing) { removeHabitFlow(existing, entry); }
        if (sx === 'save') {
          const name = $('#he-name', el).value.trim();
          if (!name) { err('Donne un nom à ton habitude.'); $('#he-name', el).focus(); return; }
          if (!d.days.length) { err('Choisis au moins un jour de répétition.'); return; }
          const emoji = $('#he-emoji', el).value.trim();
          let ic = emoji ? `emoji:${emoji}` : d.icon;
          if (!emoji && String(ic).startsWith('emoji:')) ic = 'check';
          const startRaw = $('#he-start', el).value;
          const fields = {
            name,
            description: $('#he-desc', el).value.trim(),
            icon: ic,
            categoryId: d.categoryId,
            time: $('#he-time', el).value || null,
            days: d.days.slice().sort(),
            streakGoal: d.streakGoal || 0,
            startDate: /^\d{4}-\d{2}-\d{2}$/.test(startRaw) ? startRaw : (existing ? existing.startDate : ui.today),
            updatedAt: new Date().toISOString(),
          };
          if (existing) Object.assign(existing, fields);
          else state.habits.push(newHabit({ ...fields, order: Math.max(-1, ...state.habits.map((h) => h.order ?? 0)) + 1 }));
          commit();
          Sheet.close(entry);
          refreshAll();
          toast(existing ? 'Habitude mise à jour' : 'Habitude créée', { msg: name });
        }
      });
      el.addEventListener('submit', (e) => {
        const f = e.target.closest('[data-sform="newcat"]');
        if (!f) return;
        e.preventDefault();
        const input = $('#he-newcat', el);
        const c = addCategory(input.value);
        if (!c) return;
        d.categoryId = c.id;
        input.value = '';
        $('#he-cats', el).innerHTML = catButtons();
        $('#he-icons', el).setAttribute('style', colorOf());
      });
      if (!existing && ENV.hover) setTimeout(() => { const n = $('#he-name', el); if (n) n.focus(); }, 60);
    },
  });
}

function addCategory(rawName) {
  const name = String(rawName || '').trim().slice(0, 30);
  if (!name) return null;
  const found = state.categories.find((c) => c.name.toLowerCase() === name.toLowerCase());
  if (found) return found;
  const used = new Set(state.categories.map((c) => c.color));
  const color = (PALETTE.find((p) => !used.has(p.id)) || PALETTE[state.categories.length % PALETTE.length]).id;
  const c = { id: uid(), name, color };
  state.categories.push(c);
  commit();
  return c;
}

async function removeHabitFlow(h, entry = null) {
  const choice = await ask({
    title: `Supprimer « ${h.name} » ?`,
    message: 'Archiver la retire de tes journées mais garde son historique et ses statistiques. La suppression définitive efface aussi toutes ses validations.',
    buttons: [
      { label: 'Archiver (garder l’historique)', value: 'archive', style: 'primary' },
      { label: 'Supprimer définitivement', value: 'delete', style: 'danger' },
      { label: 'Annuler', value: null, style: 'ghost' },
    ],
  });
  if (!choice) return;
  if (entry) Sheet.close(entry);
  Sheet.stack.filter((e) => e.habitId === h.id).forEach((e) => Sheet.close(e));
  if (choice === 'archive') archiveHabit(h);
  else purgeHabit(h);
}
function archiveHabit(h) {
  h.archivedAt = ui.today;
  h.updatedAt = new Date().toISOString();
  commit();
  refreshAll();
  toast('Habitude archivée', { msg: 'Son historique est conservé.', ic: 'archive', action: { label: 'Annuler', fn: () => { h.archivedAt = null; commit(); refreshAll(); } } });
}
function purgeHabit(h) {
  const snapshot = deepCopy(state);
  state.habits = state.habits.filter((x) => x.id !== h.id);
  for (const k of Object.keys(state.completions)) { delete state.completions[k][h.id]; if (!Object.keys(state.completions[k]).length) delete state.completions[k]; }
  commit();
  refreshAll();
  toast('Habitude supprimée', { msg: h.name, ic: 'trash', action: { label: 'Annuler', fn: () => { state = snapshot; commit(); refreshAll(); } }, duration: 5000 });
}

/* ---------- Détail d’une habitude ---------- */
function habitDetailBody(h) {
  const k = ui.today;
  const st = habitStreak(h);
  const r30 = habitRange(h, D.add(k, -29), k);
  const all = habitRange(h, h.startDate, k);
  const cat = catById(h.categoryId);
  const start = D.add(weekStartKey(k), -28);
  const cells = [];
  for (let i = 0; i < 35; i++) {
    const dk = D.add(start, i);
    const s = cellState(h, dk, k);
    const day = D.parse(dk)[2];
    const label = `${F.long(dk)} : ${CELL_LABEL[s]}`;
    if (['done', 'bonus', 'pending', 'miss', 'off'].includes(s)) cells.push(`<button type="button" class="c ${s}" data-act="toggle-habit" data-id="${h.id}" data-k="${dk}" aria-label="${esc(label)}" aria-pressed="${s === 'done' || s === 'bonus'}">${day}</button>`);
    else cells.push(`<span class="c ${s === 'off-future' ? 'off' : s}" aria-hidden="true">${s === 'na' ? '' : day}</span>`);
  }
  const goal = h.streakGoal || 0;
  return `<div style="display:flex;gap:14px;align-items:center">${tile(h, 'lg')}<div style="min-width:0">
      <div class="row-meta" style="margin:0 0 4px">${cat ? `<span>${catDot(cat)}${esc(cat.name)}</span>` : ''}<span>${icon('repeat')}${scheduleLabel(h.days)}</span>${h.time ? `<span>${icon('clock')}${h.time}</span>` : ''}${h.archivedAt ? `<span>${icon('archive')}Archivée</span>` : ''}</div>
      ${h.description ? `<p class="small" style="color:var(--ink-2)">${esc(h.description)}</p>` : ''}</div></div>
    <div class="tiles">
      <div class="tile-stat"><div class="k">Série actuelle</div><div class="v">${st.current}<small>j</small></div></div>
      <div class="tile-stat"><div class="k">Meilleure série</div><div class="v">${st.best}<small>j</small></div></div>
      <div class="tile-stat"><div class="k">Réussite 30 jours</div><div class="v">${r30.rate === null ? '—' : P(Math.round(r30.rate * 100))}</div><div class="d">${r30.done}/${r30.scheduled}</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${st.total}</div><div class="d">depuis le ${F.short(h.startDate)}</div></div>
    </div>
    ${goal ? `<div><div class="small" style="display:flex;justify-content:space-between;gap:10px"><span>Objectif de série : ${goal} jours</span><b>${Math.min(st.current, goal)}/${goal}</b></div><div class="bar"><i style="--v:${Math.min(100, Math.round((st.current / goal) * 100))}"></i></div></div>` : ''}
    <section><div class="section-title">Cinq dernières semaines</div>
      <div class="mini-cal">${weekOrder().map((dw) => `<span class="h">${WD_LETTER[dw]}</span>`).join('')}${cells.join('')}</div>
      <p class="hint" style="margin-top:10px">Touche un jour passé pour le cocher ou le décocher. Réussite globale : ${all.rate === null ? '—' : P(Math.round(all.rate * 100))}.</p>
    </section>`;
}
function openHabitDetail(id) {
  const h = habitById(id);
  if (!h) return;
  const footer = `${h.archivedAt
    ? `<button type="button" class="btn ghost" data-sx="restore" aria-label="Restaurer">${icon('restore')}<span class="hide-mobile">Restaurer</span></button>`
    : `<button type="button" class="btn ghost" data-sx="archive" aria-label="Archiver">${icon('archive')}<span class="hide-mobile">Archiver</span></button>`}<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button><span class="spacer"></span><button type="button" class="btn primary" data-sx="edit">${icon('edit')}Modifier</button>`;
  const entry = Sheet.open({
    title: h.name,
    body: habitDetailBody(h),
    footer,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'edit') { Sheet.close(en); openHabitEditor(h.id); }
        if (b.dataset.sx === 'archive') { Sheet.close(en); archiveHabit(h); }
        if (b.dataset.sx === 'restore') { h.archivedAt = null; commit(); Sheet.close(en); refreshAll(); toast('Habitude restaurée', { msg: h.name }); }
        if (b.dataset.sx === 'delete') removeHabitFlow(h, en);
      });
    },
  });
  entry.habitId = h.id;
  entry.refresh = () => { const cur = habitById(id); if (cur) Sheet.setBody(entry, habitDetailBody(cur)); };
}

/* ---------- Éditeur de tâche ---------- */
function openTaskEditor(id = null, preset = {}) {
  const existing = id ? state.tasks.find((t) => t.id === id) : null;
  const d = existing ? deepCopy(existing) : { title: '', notes: '', priority: quickTask.priority || 'medium', date: ui.today, time: null, ...preset };
  const body = `
    <div class="field"><span>Tâche</span><input id="te-title" maxlength="140" value="${esc(d.title)}" placeholder="Ex. : Appeler le plombier" autocomplete="off"></div>
    <div class="field"><span>Notes <span class="muted">(facultatif)</span></span><textarea id="te-notes" maxlength="500" rows="2">${esc(d.notes || '')}</textarea></div>
    <section><div class="section-title">Priorité</div><div class="seg" id="te-prio">${Object.entries(PRIORITIES).map(([pid, p]) => `<button type="button" data-sx="prio" data-v="${pid}" aria-pressed="${d.priority === pid}"><span class="prio prio-${pid}">${icon('flag')}</span>${p.name}</button>`).join('')}</div></section>
    <div class="field-row">
      <div class="field"><span>Date</span><input id="te-date" type="date" value="${esc(d.date)}"></div>
      <div class="field"><span>Heure ou échéance</span><input id="te-time" type="time" value="${d.time || ''}"></div>
    </div>
    ${existing ? `<div class="set-row" style="border-top:1px solid var(--line)"><div class="lbl"><b>Terminée</b><span>${existing.doneAt ? `Cochée ${esc(F.rel(existing.doneAt))}` : 'Pas encore'}</span></div><div class="ctl">${switchCtl('te-done', existing.done)}</div></div>` : ''}
    <p class="err" id="te-err" role="alert" hidden></p>`;
  const footer = `${existing ? `<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}${existing ? 'Enregistrer' : 'Ajouter'}</button>`;
  Sheet.open({
    title: existing ? 'Modifier la tâche' : 'Nouvelle tâche',
    body,
    footer,
    onMount(el, entry) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'prio') { d.priority = b.dataset.v; pressIn(el, '#te-prio [data-sx="prio"]', (x) => x.dataset.v === d.priority); }
        if (b.dataset.sx === 'delete' && existing) { Sheet.close(entry); deleteTask(existing); }
        if (b.dataset.sx === 'save') {
          const title = $('#te-title', el).value.trim();
          if (!title) { const er = $('#te-err', el); er.textContent = 'Écris l’intitulé de la tâche.'; er.hidden = false; return; }
          const date = /^\d{4}-\d{2}-\d{2}$/.test($('#te-date', el).value) ? $('#te-date', el).value : ui.today;
          const fields = { title, notes: $('#te-notes', el).value.trim(), priority: d.priority, date, time: $('#te-time', el).value || null, updatedAt: new Date().toISOString() };
          if (existing) {
            const doneNow = $('#te-done', el) ? $('#te-done', el).checked : existing.done;
            Object.assign(existing, fields, { done: doneNow, doneAt: doneNow ? (existing.doneAt || new Date().toISOString()) : null });
          } else state.tasks.push(newTask(fields));
          commit();
          Sheet.close(entry);
          refreshAll();
          toast(existing ? 'Tâche mise à jour' : 'Tâche ajoutée', { msg: title, ic: 'tasks' });
        }
      });
      if (!existing && ENV.hover) setTimeout(() => { const n = $('#te-title', el); if (n) n.focus(); }, 60);
    },
  });
}
function deleteTask(t) {
  const idx = state.tasks.indexOf(t);
  state.tasks = state.tasks.filter((x) => x !== t);
  commit();
  refreshAll();
  toast('Tâche supprimée', { msg: t.title, ic: 'trash', action: { label: 'Annuler', fn: () => { state.tasks.splice(Math.max(0, idx), 0, t); commit(); refreshAll(); } }, duration: 5000 });
}

/* ---------- Détail d’une journée ---------- */
function dayBody(k) {
  const s = dayStats(k);
  const future = k > ui.today;
  const life = activeHabitsAt(k);
  const planned = life.filter((h) => h.days.includes(D.dow(k)));
  const others = life.filter((h) => !h.days.includes(D.dow(k)));
  const tasks = sortTasks(state.tasks.filter((t) => t.date === k));
  const p = s.scheduled ? Math.round((s.done / s.scheduled) * 100) : null;
  return `<div class="consistency"><div class="ring-wrap">${ring(s.pct || 0, { size: 96, stroke: 10, label: 'Régularité de la journée' })}<div class="ring-center"><span class="hero-ring-v" style="font-size:22px">${p === null ? '—' : p}<small>${p === null ? '' : '%'}</small></span></div></div>
      <div><p class="label">${future ? 'Journée à venir' : 'Bilan de la journée'}</p><p style="font-size:20px;font-weight:700">${s.done} sur ${s.scheduled} habitude${s.scheduled > 1 ? 's' : ''}</p><p class="small muted">${s.bonus ? `+ ${s.bonus} bonus · ` : ''}${tasks.length ? `${tasks.filter((t) => t.done).length}/${tasks.length} tâche${tasks.length > 1 ? 's' : ''} terminée${tasks.filter((t) => t.done).length > 1 ? 's' : ''}` : 'Aucune tâche ce jour-là'}</p></div></div>
    ${future ? '<p class="small muted">Ce jour n’est pas encore arrivé : tu pourras le cocher le moment venu.</p>' : ''}
    <section><div class="section-title">Habitudes prévues</div>${planned.length ? `<div class="rows">${planned.map((h) => (future ? `<div class="row">${tile(h, 'sm')}<span class="row-text" style="padding:10px 4px"><span class="row-title">${esc(h.name)}</span></span></div>` : habitRow(h, k))).join('')}</div>` : '<p class="small muted">Aucune habitude prévue ce jour-là.</p>'}</section>
    ${!future && others.length ? `<section><div class="section-title">Non prévues (bonus possible)</div><div class="rows">${others.map((h) => habitRow(h, k)).join('')}</div></section>` : ''}
    ${tasks.length ? `<section><div class="section-title">Tâches</div><div class="rows">${tasks.map((t) => taskRow(t, {})).join('')}</div></section>` : ''}`;
}
function activeHabitsAt(k) { return state.habits.filter((h) => inLife(h, k)).sort(byOrder); }
function openDay(k) {
  const entry = Sheet.open({ title: F.cap(F.full(k)), body: dayBody(k) });
  entry.refresh = () => Sheet.setBody(entry, dayBody(k));
}

function openCustomize(focus = null) {
  const after = () => { applyTheme(); commit(); render(); };
  Sheet.open({
    title: 'Personnaliser',
    variant: 'side',
    body: customizeBody(),
    onMount(el) {
      let openPal = null;
      const catsHost = () => $('#cz-cats-list', el);
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-cz]');
        if (!b) return;
        const cz = b.dataset.cz;
        const s = state.settings;
        if (['accent', 'background', 'radius', 'density', 'font', 'matrixShape', 'matrixColor'].includes(cz)) {
          s[cz] = b.dataset.v;
          pressIn(el, `[data-cz="${cz}"]`, (x) => x.dataset.v.toLowerCase() === String(s[cz]).toLowerCase());
          if (cz === 'accent') { const cu = $('.swatch.custom', el); if (cu) cu.setAttribute('aria-pressed', 'false'); $('#cz-custom', el).value = s.accent; }

        }
        if (cz === 'reset-look') {
          ['accent', 'background', 'radius', 'density', 'font', 'glow', 'matrixShape', 'matrixColor', 'reduceMotion'].forEach((key) => { s[key] = DEFAULT_SETTINGS[key]; });

          Sheet.setBody(Sheet.top(), customizeBody());
          toast('Apparence réinitialisée', { ic: 'restore' });

        if (cz === 'cat-pal') { openPal = openPal === b.dataset.id ? null : b.dataset.id; catsHost().innerHTML = categoriesEditor(openPal); }

        if (cz === 'cat-del') {
          const c = catById(b.dataset.id);
          if (!c) return;
          const used = state.habits.filter((h) => h.categoryId === c.id).length;
          const ok = await ask({ title: `Supprimer « ${c.name} » ?`, message: used ? `${used} habitude${used > 1 ? 's' : ''} passeront « Sans catégorie ». Leur historique est conservé.` : 'Aucune habitude n’utilise cette catégorie.', buttons: [{ label: 'Supprimer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
          if (!ok) return;
          state.categories = state.categories.filter((x) => x.id !== c.id);

          commit(); render();
          catsHost().innerHTML = categoriesEditor(openPal);

        const t = e.target;

    },
  });
}

/* ---------- Nouveautés ---------- */
function cmpVersion(a, b) {
  const pa = String(a).split('.').map(Number); const pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; }
  return 0;
}
function openWhatsNew(since = null) {

/* ---------- Copie, export, import ---------- */
function copyText(text, fallbackEl = null) {
  const ok = () => toast('Copié', { msg: 'Tu peux le coller où tu veux.', ic: 'copy' });
  const fallback = () => {
    try {
      const ta = fallbackEl || Object.assign(document.createElement('textarea'), { value: text });
      if (!fallbackEl) { ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); }
      ta.focus(); ta.select();
      const done = document.execCommand && document.execCommand('copy');
      if (!fallbackEl) ta.remove();
      if (done) { ok(); return; }
    } catch (e) { /* ignore */ }
    toast('Copie impossible', { msg: 'Sélectionne le texte et copie-le à la main.', tone: 'bad', ic: 'alert' });
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok, fallback); return; }
  } catch (e) { /* ignore */ }
  fallback();
}
function showExportText(payload) {
  Sheet.open({
    title: 'Exporter mes données',

/* =====================================================================
   MISES À JOUR — détection d’une nouvelle version, installation,
   préparation d’une demande de mise à jour
   ---------------------------------------------------------------------
   Le service worker (sw.js) garde l’app en cache pour le hors-ligne. À
   chaque ouverture, il compare index.html au fichier publié en ligne :
   s’il a changé, la nouvelle version est mise de côté et l’app propose
   de l’installer. Les données ne sont jamais touchées (stockage séparé).
   ===================================================================== */

const Updates = {
  supported: 'serviceWorker' in navigator && ENV.secure && !ENV.inFrame && !ENV.preview,
  reg: null,
  ready: false,
  readyVersion: null,
  checking: false,
  lastError: null,
  lastAuto: 0,
  async init() {
    if (!this.supported) return;
    try {
      this.reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    } catch (e) {
      this.supported = false;
      this.lastError = e;
      return;
    }
    navigator.serviceWorker.addEventListener('message', (e) => {
      const msg = e.data || {};
      if (msg.type === 'UPDATE_READY') this.markReady(msg.version);
    });
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) this.status_check();
      hadController = true;
    });
    this.status_check();
  },
  ask(type, timeout = 12000) {
    return new Promise((resolve) => {
      const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (!ctrl) { resolve(null); return; }
      const ch = new MessageChannel();
      const timer = setTimeout(() => resolve(null), timeout);
      ch.port1.onmessage = (e) => { clearTimeout(timer); resolve(e.data || null); };
      try { ctrl.postMessage({ type }, [ch.port2]); } catch (e) { clearTimeout(timer); resolve(null); }
    });
  },
  /* Une version a-t-elle été mise en cache après l’ouverture de cette page ? */
  async status_check() {
    const st = await this.ask('STATUS', 5000);
    if (st && st.updatedAt && st.updatedAt > PAGE_START) this.markReady(st.version);
  },
  markReady(version) {
    if (this.ready && this.readyVersion === version) return;
    this.ready = true;
    this.readyVersion = version || null;
    renderBanners();
    renderNav();
    renderTop();
    if (ui.view === 'reglages') renderView();
  },
  async check({ silent = false } = {}) {
    if (!this.supported) {
      if (!silent) toast('Vérification indisponible ici', { msg: ENV.inFrame || ENV.preview ? 'Elle fonctionne dans l’app installée.' : 'Ouvre l’app depuis son adresse https.', ic: 'info' });
      return;
    }
    if (navigator.onLine === false) { if (!silent) toast('Hors connexion', { msg: 'Connecte-toi à Internet pour vérifier les mises à jour.', ic: 'alert', tone: 'bad' }); return; }
    if (this.checking) return;
    this.checking = true;
    if (ui.view === 'reglages') renderView();
    try {
      try { if (this.reg) await this.reg.update(); } catch (e) { /* ignore */ }
      const res = await this.ask('CHECK', 15000);
      state.updates.lastCheck = new Date().toISOString();
      commit();
      if (!res || res.type === 'CHECK_FAILED') {
        if (!silent) toast('Vérification impossible', { msg: 'Le serveur ne répond pas. Réessaie plus tard.', ic: 'alert', tone: 'bad' });
      } else if (res.type === 'UPDATE_READY' || (res.updatedAt && res.updatedAt > PAGE_START)) {
        this.markReady(res.version);
        if (!silent) toast('Nouvelle version disponible', { msg: 'Touche « Installer » pour en profiter.', ic: 'rocket', tone: 'celebrate' });
      } else if (!silent) {
        toast('Tu as la dernière version', { msg: `Cadence ${APP.version}`, ic: 'check', tone: 'good' });
      }
    } finally {
      this.checking = false;
      if (ui.view === 'reglages') renderView();
    }
  },
  async autoCheck() {
    if (!this.supported || !state.settings.autoUpdate) return;
    if (Date.now() - this.lastAuto < 20 * 60 * 1000) return;
    this.lastAuto = Date.now();
    await this.check({ silent: true });
  },
  async install() {
    try { await Backups.create('avant mise à jour'); } catch (e) { /* ignore */ }
    await flush();
    toast('Installation…', { msg: 'Cadence redémarre avec la nouvelle version.', ic: 'rocket', duration: 1500 });
    setTimeout(() => location.reload(), 500);
  },
  status() {
    if (!this.supported) {
      return {
        badge: `<span class="status-badge">${icon('info')}Aperçu</span>`,
        text: ENV.inFrame || ENV.preview
          ? 'Dans cet aperçu, les mises à jour ne s’appliquent pas. Une fois Cadence installée sur ton appareil, elle détectera seule les nouvelles versions publiées.'
          : 'Les mises à jour automatiques nécessitent une adresse sécurisée (https), comme celle fournie par GitHub Pages.',
      };
    }
    if (this.ready) return { badge: `<span class="status-badge new">${icon('rocket')}Nouvelle version prête</span>`, text: 'Elle est déjà téléchargée. L’installation prend une seconde et conserve toutes tes données (une sauvegarde est faite juste avant).' };
    if (this.checking) return { badge: `<span class="status-badge">${icon('refresh', 'spin')}Vérification…</span>`, text: 'Recherche d’une version plus récente sur le serveur.' };
    return { badge: `<span class="status-badge ok">${icon('check')}À jour</span>`, text: 'Quand tu publies une nouvelle version sur GitHub, elle est détectée ici automatiquement, puis installée en un geste.' };
  },
};

function nextVersion(v) {
  const [a, b] = String(v).split('.').map((n) => parseInt(n, 10) || 0);
  return `${a}.${b + 1}.0`;
}
function buildUpdateRequest() {
  const items = state.updates.backlog.filter((i) => !i.done);
  const lines = [
    'Bonjour Claude,',
    '',
    `Voici une demande de mise à jour pour mon application Cadence (PWA de suivi d’habitudes). Version actuelle : ${APP.version}. Nouvelle version souhaitée : ${nextVersion(APP.version)}.`,
    'Je te joins les fichiers de l’app : index.html, sw.js et manifest.webmanifest (les icônes .png ne changent pas).',
    '',
    'Changements souhaités :',
    ...(items.length ? items.map((it, i) => `${i + 1}. ${it.text}`) : ['1. (ajoute tes idées dans Réglages → Préparer une mise à jour)']),
    '',
    'Contraintes :',
    `- Conserver toutes mes données existantes (base IndexedDB « cadence », schéma ${APP.schema}). Si le format des données change, ajouter une migration dans MIGRATIONS et incrémenter APP.schema.`,
    `- Passer APP.version à ${nextVersion(APP.version)} et ajouter une entrée en tête de CHANGELOG dans index.html.`,
    `- Mettre SW_VERSION à ${nextVersion(APP.version)} dans sw.js.`,
    '- Garder le style actuel (mode sombre, couleur principale personnalisable) et l’interface en français.',
    '- Me renvoyer les fichiers complets à remplacer dans mon dépôt GitHub.',
  ];
  return lines.join('\n');
}

/* =====================================================================
   ACTIONS — validations, célébrations, navigation, démarrage
   ===================================================================== */

function toggleHabit(id, k = ui.today) {
  const h = habitById(id);
  if (!h) return;
  if (k > ui.today) { toast('Ce jour n’est pas encore arrivé', { ic: 'calendar' }); return; }
  if (!inLife(h, k)) { toast('Jour hors de la période', { msg: 'Change la date de début de l’habitude pour remplir les jours précédents.', ic: 'info' }); return; }
  const day = state.completions[k] || (state.completions[k] = {});
  const was = !!day[id];
  if (was) {
    delete day[id];
    if (!Object.keys(day).length) delete state.completions[k];
  } else day[id] = new Date().toISOString();
  commit();
  if (!was) ui.pop = { id, k };
  refreshAll();
  if (!was) celebrate(h, k);
}

function toggleTask(id) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? new Date().toISOString() : null;
  t.updatedAt = new Date().toISOString();
  commit();
  if (t.done) ui.pop = { id, k: null };
  refreshAll();
  if (!t.done) return;
  const events = [];
  const today = state.tasks.filter((x) => x.date === ui.today);
  if (today.length >= 2 && today.every((x) => x.done) && !state.celebrated[`${ui.today}:tasks`]) {
    state.celebrated[`${ui.today}:tasks`] = 1;
    events.push({ title: 'Checklist terminée', msg: 'Toutes les tâches du jour sont faites.', ic: 'tasks' });
  }
  evaluateAchievements().forEach((a) => events.push({ title: `Trophée : ${a.name}`, msg: a.desc, ic: a.icon, big: true }));
  if (events.length) { commit(); showEvents(events); }
}

/* Récompenses visuelles : objectif du jour, journée parfaite, paliers de série, records, trophées. */
function celebrate(h, k) {
  const events = [];
  const mark = (key) => { if (state.celebrated[key]) return false; state.celebrated[key] = 1; return true; };
  if (k === ui.today) {
    const s = dayStats(k);
    if (s.scheduled && s.done === s.scheduled && mark(`${k}:perfect`)) events.push({ title: 'Journée parfaite !', msg: `${s.done} habitude${s.done > 1 ? 's' : ''} sur ${s.scheduled}. Bravo pour ta constance.`, ic: 'star', big: true });
    else if (s.scheduled && s.done < s.scheduled && metGoal(s) && mark(`${k}:goal`)) events.push({ title: 'Objectif du jour atteint', msg: `${P(Math.round((s.done / s.scheduled) * 100))} de ta journée est déjà faite.`, ic: 'target' });
  }
  if (isScheduled(h, k)) {
    const n = habitStreak(h).current;
    if (n >= 3 && n === h.streakGoal && mark(`${h.id}:goal${n}:${k}`)) events.push({ title: `Objectif de série atteint : ${n} jours`, msg: h.name, ic: 'trophy', big: true });
    else if (MILESTONES.includes(n) && mark(`${h.id}:s${n}:${k}`)) events.push({ title: `${n} jours de suite`, msg: h.name, ic: 'flame', big: n >= 7 });
    const rec = state.records.bestStreak;
    if (n > (rec.value || 0)) {
      const prev = rec.value || 0;
      state.records.bestStreak = { value: n, habit: h.name, date: k };
      if (prev >= 3 && mark(`${k}:record`)) events.push({ title: 'Nouveau record personnel', msg: `${n} jours de suite sur « ${h.name} ».`, ic: 'trophy', big: true });
    }
  }
  evaluateAchievements().forEach((a) => events.push({ title: `Trophée : ${a.name}`, msg: a.desc, ic: a.icon, big: true }));
  commit();
  if (events.length) showEvents(events);
}
function showEvents(events) {
  if (!state.settings.celebrations) return;
  const big = events.some((e) => e.big);
  events.slice(0, 2).forEach((e, i) => setTimeout(() => toast(e.title, { msg: e.msg, ic: e.ic, tone: 'celebrate', duration: 3400 }), i * 650));
  if (big) confetti(events.length > 1 ? 1.3 : 1);
  if (ui.view === 'stats') renderView();
}

/* ---------- Navigation ---------- */
function go(view) {
  if (!VIEWS[view]) view = 'today';
  if (view !== ui.view) { ui.prevView = ui.view; ui.view = view; }
  if (view !== 'reglages') lsSet('cadence:ui:view', view);
  Sheet.closeAll();
  window.scrollTo(0, 0);
  Stats.reset();
  ui.today = todayKey();
  document.body.dataset.view = ui.view;
  renderNav(); renderTop(); renderBanners();
  renderView(true);
  if (view === 'reglages') renderBackupList();
}
function shiftMonth(o, delta) {
  o.m += delta;
  if (o.m < 1) { o.m = 12; o.y -= 1; }
  if (o.m > 12) { o.m = 1; o.y += 1; }
  renderView();
}
function toCurrentMonth(o) { const [y, m] = D.parse(ui.today); o.y = y; o.m = m; renderView(); }

function moveHabit(id, dir) {
  const list = activeHabits();
  const i = list.findIndex((h) => h.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((h, idx) => { h.order = idx; });
  commit();
  renderView();
}

function addQuickTask(form, date, priority) {
  const input = form.querySelector('input[name="title"]');
  const title = input.value.trim();
  if (!title) { input.focus(); return; }
  state.tasks.push(newTask({ title: title.slice(0, 140), date, priority }));
  commit();
  const id = input.id;
  refreshAll();
  const again = document.getElementById(id);
  if (again) again.focus();
  if (date !== ui.today) toast('Tâche planifiée', { msg: `${F.dayRel(date, ui.today)} · ${title}`, ic: 'calendar' });
}

async function restoreBackup(id) {
  const meta = (await Backups.list()).find((b) => b.id === id);
  if (!meta) return;
  const ok = await ask({ title: 'Restaurer cette sauvegarde ?', message: `Sauvegarde du ${esc(F.rel(meta.at))} : ${meta.habits} habitudes, ${meta.checks} validations. Tes données actuelles seront remplacées (elles sont sauvegardées juste avant).`, buttons: [{ label: 'Restaurer', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  const snap = await Backups.read(id);
  if (!snap) { toast('Sauvegarde introuvable', { ic: 'alert', tone: 'bad' }); return; }
  await Backups.create('avant restauration');
  adoptState(migrate(snap));
  await flush();
  refreshAll();
  renderBackupList();
  toast('Sauvegarde restaurée', { ic: 'restore', tone: 'good' });
}
async function resetAll() {
  const ok = await ask({ title: 'Effacer toutes les données ?', message: 'Habitudes, validations, tâches et réglages seront supprimés de cet appareil. Une sauvegarde automatique est créée juste avant.', buttons: [{ label: 'Tout effacer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  try { await Backups.create('avant réinitialisation'); } catch (e) { /* ignore */ }
  adoptState(defaultState());
  await flush();
  go('today');
  openOnboarding();
}
async function clearDemo() {
  const ok = await ask({ title: 'Quitter le mode démo ?', message: 'Les données d’exemple seront effacées pour que tu partes sur tes propres habitudes.', buttons: [{ label: 'Effacer la démo', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
