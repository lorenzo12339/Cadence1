  if (home && ENV.preview && !ui.previewHidden) out.push(banner('accent', 'phone', 'Aperçu interactif', 'Données d’exemple. Pour installer Cadence sur ton iPhone, suis le guide.', `<button type="button" class="btn sm primary" data-act="install-guide">Guide</button><button type="button" class="icon-btn plain" data-act="preview-hide" aria-label="Masquer">${icon('x')}</button>`));
  else if (home && ENV.ios && !ENV.standalone && !ENV.inFrame && !ui.installHidden) out.push(banner('', 'homeAdd', 'Installe Cadence sur ton écran d’accueil', 'Elle s’ouvrira en plein écran et fonctionnera hors ligne.', `<button type="button" class="btn sm primary" data-act="install-guide">Comment&nbsp;?</button><button type="button" class="icon-btn plain" data-act="install-hide" aria-label="Masquer">${icon('x')}</button>`));
  if (home && state.meta.demo && !ENV.preview) out.push(banner('', 'info', 'Mode démo', 'Ces données sont des exemples.', '<button type="button" class="btn sm" data-act="demo-clear">Commencer pour de vrai</button>'));
  $('#banners').innerHTML = out.join('');
}

/* ===================== AUJOURD’HUI ===================== */
function viewToday() {
  const k = ui.today;
  const s = dayStats(k);
  const st = state.settings;
  const m = st.modules;
  const compact = st.todayView === 'compact';
  const name = (state.profile.name || '').trim();
  const make = {
    prompts: () => promptsHtml(k),
    hero: () => (compact ? compactHero(k, s) : heroCard(k, s)),
    plan: () => planCard(k),
    week: () => (m.week && !compact ? weekCard(k) : ''),
    streaks: () => (m.streaks && !compact ? streaksCard() : ''),
    journal: () => (m.journal === false ? '' : journalCard(k, compact)),
  };
  /* Chaque section porte son rang : sur téléphone, les deux colonnes s’effacent
     (display: contents) et l’ordre choisi s’applique à toute la page. */
  const cols = { main: [], side: [] };
  st.todaySections.forEach((id, i) => {
    const def = TODAY_SECTIONS.find((x) => x.id === id);
    const html = def ? make[id]() : '';
    if (html) cols[def.side ? 'side' : 'main'].push(`<div class="tsec" style="order:${i}">${html}</div>`);
  });
  return `<section class="page-head row-head"><div><p class="eyebrow">${esc(F.cap(F.long(k)))}</p><h1 class="greet">${greeting()}${name ? `, <b>${esc(name)}</b>` : ''}</h1></div>
      <button type="button" class="btn sm ghost" data-act="today-view" aria-pressed="${compact}" aria-label="${compact ? 'Afficher la vue détaillée' : 'Afficher la vue compacte'}">${icon(compact ? 'layout' : 'list')}<span class="hide-mobile">${compact ? 'Vue détaillée' : 'Vue compacte'}</span></button></section>
    <div class="today-grid ${compact ? 'is-compact' : ''}"><div class="today-col main">${cols.main.join('')}</div><div class="today-col side">${cols.side.join('')}</div></div>`;
}

function loadLine(k) {
  if (state.settings.modules.load === false) return '';
  const L = dailyLoad(k);
  if (!L.hasData) return '';
  return `<p class="load-line">${icon('timer')}<span>Charge du jour : <b>${F.dur(L.planned)}</b>${L.remaining ? ` · reste ${F.dur(L.remaining)}` : ' · tout est fait'}${L.unknown ? ` · ${plural(L.unknown, 'élément sans durée', 'éléments sans durée')}` : ''}</span></p>`;
}
function heroCard(k, s) {
  const active = activeHabits();
  const p = s.scheduled ? Math.round(s.pct * 100) : 0;
  const goal = state.goals.daily;
  const needed = Math.max(0, Math.ceil((goal / 100) * s.scheduled - s.credit - 1e-9));
  let chip;
  if (!s.scheduled) chip = `<span class="chip">${icon('sun')}${s.paused ? 'Journée en pause' : 'Journée libre'}</span>`;
  else if (s.done === s.scheduled) chip = `<span class="chip good">${icon('star')}Journée parfaite</span>`;
  else if (metGoal(s)) chip = `<span class="chip good">${icon('check')}Objectif ${P(goal)} atteint</span>`;
  else chip = `<span class="chip accent">${icon('target')}Objectif ${P(goal)} · encore ${needed}</span>`;
  return `<section class="card hero" aria-label="Progression du jour">
      <div class="ring-wrap">${ring(s.pct || 0, { size: 128, stroke: 12, id: 'today', label: `${p} % des habitudes du jour terminées`, goal })}
        <div class="ring-center"><span class="hero-ring-v">${s.done}<small>/${s.scheduled}</small></span><span class="hero-ring-l">habitudes</span></div></div>
      <div class="hero-main"><p class="label">Progression du jour</p><p class="hero-num">${p}<span>%</span></p>
        <p class="hero-sub">${s.scheduled ? `${s.done} terminée${s.done > 1 ? 's' : ''} sur ${s.scheduled} prévue${s.scheduled > 1 ? 's' : ''}${s.partial ? `, ${s.partial} en mini-version` : ''}` : s.paused ? 'Tes habitudes sont en pause aujourd’hui' : 'Rien de prévu aujourd’hui'}</p></div>
      <div class="hero-goal">${chip}</div>
      <dl class="hero-stats">
        <div><dt>Actives</dt><dd>${active.length}</dd></div>
        <div><dt>${s.partial ? 'Mini-versions' : 'Terminées'}</dt><dd>${s.partial ? s.partial : s.done}</dd></div>
        <div><dt>Restantes</dt><dd>${Math.max(0, s.scheduled - s.done - s.partial)}</dd></div>
      </dl>
      ${loadLine(k)}
      ${state.settings.motivation ? `<p class="motto">${icon('sparkles')}<span>${esc(mottoFor(s))}</span></p>` : ''}
    </section>`;
}
/* Vue compacte : une ligne de progression au lieu de l’anneau et des compteurs. */
function compactHero(k, s) {
  const p = s.scheduled ? Math.round(s.pct * 100) : 0;
  const goal = state.goals.daily;
  return `<section class="card hero-compact" aria-label="Progression du jour">
      <div class="hc-top"><b>${p}${NB}%</b><span>${s.scheduled ? `${s.done}/${s.scheduled} habitudes${s.partial ? ` · ${s.partial} mini` : ''}` : s.paused ? 'Journée en pause' : 'Rien de prévu'}</span>${metGoal(s) ? `<span class="chip good">${icon('check')}Objectif atteint</span>` : ''}</div>
      <div class="bar hc-bar" role="img" aria-label="${p} %"><i style="--v:${p}"></i><span class="hc-goal" style="--g:${goal}"></span></div>
      ${loadLine(k)}
    </section>`;
}

/* ---------- Invitations en tête de page ----------
   Au plus une carte de chaque sorte : une décision à prendre, une pause en cours,
   un constat de l’assistant, la rétrospective. Les autres attendent leur tour. */
function promptsHtml(k) {
  const m = state.settings.modules;
  const out = [];
  const dec = decisionsDue();
  if (dec.length) out.push(decisionCard(dec[0], dec.length - 1));
  const pc = pauseCard(k);
  if (pc) out.push(pc);
  if (m.alerts !== false && state.settings.assistant !== false) {
    const list = insights();
    if (list.length) out.push(insightCard(list[0], { home: true, more: list.length - 1 }));
  }
  if (m.review !== false) out.push(reviewCard());
  return out.filter(Boolean).join('');
}

function decisionCard(d, others = 0) {
  const h = d.h;
  if (d.kind === 'step') {
    const s = d.step;
    const target = s.to >= 7 ? 'tous les jours' : `${s.to}${NB}fois par semaine`;
    return `<section class="card review-card" aria-label="Palier progressif">
        <div class="alert-head">${icon('stairs')}<div><b>Palier atteint pour « ${esc(h.name)} »</b>
          <span>${s.weeks} semaine${s.weeks > 1 ? 's' : ''} de suite à ${s.from}${NB}fois par semaine. Passer à ${target} ${s.effective === ui.today ? 'dès aujourd’hui' : `à partir du ${esc(F.long(s.effective))}`} ?</span></div></div>
        <div class="btn-row"><button type="button" class="btn sm primary" data-act="step-accept" data-id="${h.id}">${icon('stairs')}Passer à ${s.to >= 7 ? 'tous les jours' : `${s.to}${NB}fois`}</button><button type="button" class="btn sm ghost" data-act="step-later" data-id="${h.id}">Pas maintenant</button></div>
      </section>`;
  }
  const p = d.phase; const r = d.r;
  const def = PHASES[p.kind];
  const fem = p.kind !== 'essai';
  const rate = r.rate === null ? '—' : P(Math.round(r.rate * 100));
  const base = p.base;
  const cur = configAt(h, ui.today);
  const btn = (dec, label, primary = false) => `<button type="button" class="btn sm ${primary ? 'primary' : 'ghost'}" data-act="phase-end" data-id="${h.id}" data-v="${dec}">${label}</button>`;
  let buttons = '';
  if (p.kind === 'essai') buttons = btn('garder', 'Garder l’habitude', true) + btn('ajuster', 'Ajuster') + btn('arreter', 'Arrêter');
  else if (p.kind === 'reprise') buttons = (base && !sameSchedule(base, cur) ? btn('revenir', `Revenir à ${esc(freqLabel(base).toLowerCase())}`, true) : '') + btn('garder', 'Garder ce rythme', !(base && !sameSchedule(base, cur)));
  else buttons = btn('augmenter', 'Augmenter', true) + btn('garder', 'Garder ce rythme');
  return `<section class="card review-card" aria-label="Fin de cycle">
      <div class="alert-head">${icon(def.icon)}<div><b>${def.name} terminé${fem ? 'e' : ''} : « ${esc(h.name)} »</b>
        <span>Du ${esc(F.short(p.from))} au ${esc(F.short(p.to))} : ${r.done} complète${r.done > 1 ? 's' : ''}${r.partial ? ` et ${r.partial} mini-version${r.partial > 1 ? 's' : ''}` : ''} sur ${r.scheduled} jour${r.scheduled > 1 ? 's' : ''} attendu${r.scheduled > 1 ? 's' : ''} (${rate}). Que décides-tu ?</span></div></div>
      <div class="btn-row">${buttons}</div>
      ${others > 0 ? `<p class="small muted" style="margin-top:10px">${plural(others, 'autre décision t’attend', 'autres décisions t’attendent')} ensuite.</p>` : ''}
    </section>`;
}

function pauseCard(k) {
  const list = activePauses(k);
  if (!list.length) return '';
  const global = list.find((p) => p.all);
  if (global) {
    const r = PAUSE_REASON[global.reason];
    return `<section class="card pause-card" aria-label="Pause en cours">
        <div class="alert-head">${icon('pause')}<div><b>Pause en cours · ${esc(r.name)}</b>
          <span>${global.to ? `Jusqu’au ${esc(F.long(global.to))} inclus.` : 'Sans date de fin.'} Ces jours ne comptent ni comme prévus ni comme manqués, et tes séries sont gelées.${global.note ? ` ${esc(global.note)}` : ''}</span></div></div>
        <div class="btn-row"><button type="button" class="btn sm primary" data-act="pause-end" data-id="${global.id}">${icon('play')}Reprendre aujourd’hui</button><button type="button" class="btn sm ghost" data-act="pause-edit" data-id="${global.id}">Modifier</button></div>
      </section>`;
  }
  const names = [...new Set(list.flatMap((p) => p.habits))].map((id) => habitById(id)).filter((h) => h && !h.archivedAt).map((h) => h.name);
  if (!names.length) return '';
  return `<section class="card pause-card slim" aria-label="Habitudes en pause"><div class="alert-head">${icon('pause')}<div><b>${plural(names.length, 'habitude en pause', 'habitudes en pause')}</b><span>${esc(names.join(', '))}</span></div></div>
      <div class="btn-row"><button type="button" class="btn sm ghost" data-act="pauses-open">Gérer les pauses</button></div></section>`;
}

/* ---------- Constat de l’assistant ---------- */
function insightActions(x) {
  return x.actions.map((a) => `<button type="button" class="btn sm ${a.primary ? 'primary' : 'ghost'}" data-act="${a.act}" ${a.id ? `data-id="${esc(a.id)}"` : ''} ${a.iid ? `data-iid="${esc(a.iid)}"` : ''} ${a.kind ? `data-kind="${esc(a.kind)}"` : ''} ${a.v ? `data-v="${esc(a.v)}"` : ''}>${esc(a.label)}</button>`).join('');
}
function insightCard(x, { home = false, more = 0, flat = false } = {}) {
  const fb = x.feedback && x.feedback.status === 'useful';
  return `<section class="${flat ? 'insight-flat' : 'card'} insight-card kind-${x.kind}" aria-label="${esc(x.kindName)}">
      <div class="alert-head">${icon(x.icon)}<div><span class="ins-kind">${esc(x.kindName)}</span><b>${esc(x.title)}</b><span>${esc(x.text)}</span></div></div>
      <details class="why"><summary>Sur quoi repose ce constat ${icon('chevD')}</summary><ul>${x.evidence.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></details>
      <div class="btn-row">${insightActions(x)}</div>
      <div class="ins-fb"><span>${fb ? `${icon('check')}Noté comme utile` : 'Ce constat t’aide-t-il ?'}</span>
        ${fb ? '' : `<button type="button" class="icon-btn plain" data-act="ins-fb" data-iid="${esc(x.id)}" data-v="useful" aria-label="Utile" data-tip="Utile">${icon('thumbUp')}</button>`}
        <button type="button" class="icon-btn plain" data-act="ins-fb" data-iid="${esc(x.id)}" data-v="irrelevant" aria-label="Pas pertinent (masqué 90 jours)" data-tip="Pas pertinent">${icon('thumbDown')}</button>
        <button type="button" class="icon-btn plain" data-act="ins-fb" data-iid="${esc(x.id)}" data-v="hidden" aria-label="Masquer 14 jours" data-tip="Masquer 14 jours">${icon('eyeOff')}</button></div>
      ${home && more > 0 ? `<p class="small muted" style="margin-top:8px">${plural(more, 'autre constat', 'autres constats')} dans <button type="button" class="link-btn inline" data-act="nav" data-view="stats">Statistiques</button>.</p>` : ''}
    </section>`;
}

/* ---------- Invitation à la rétrospective ---------- */
function reviewCard() {
  const ws = reviewDue();
  if (!ws) return '';
  const r = rangeStats(ws, D.add(ws, 6));
  return `<section class="card review-card" aria-label="Rétrospective de la semaine">
      <div class="alert-head">${icon('list')}<div><b>Rétrospective de la semaine du ${esc(F.short(ws))}</b>
        <span>Cinq minutes : ce qui a fonctionné, ce qui a bloqué, et un seul changement à décider. Régularité de la semaine : ${r.rate === null ? '—' : P(Math.round(r.rate * 100))}.</span></div></div>
      <div class="btn-row">
        <button type="button" class="btn sm primary" data-act="review-open" data-k="${ws}">${icon('check')}Commencer</button>
        <button type="button" class="btn sm ghost" data-act="review-later" data-k="${ws}">Plus tard</button>
      </div>
    </section>`;
}

/* ---------- Journal du jour ---------- */
function journalCard(k, compact = false) {
  const entry = state.journal[k];
  const recent = [];
  if (!compact) for (let i = 1; i <= 6 && recent.length < 3; i++) { const dk = D.add(k, -i); if (state.journal[dk] && state.journal[dk].text) recent.push({ k: dk, text: state.journal[dk].text }); }
  return `<section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('pen')}Journal du jour</h2><span class="sub">Une ligne suffit.</span></div></div>
      ${entry && entry.text
    ? `<button type="button" class="journal-note" data-act="journal-edit" data-k="${k}"><span>${esc(entry.text)}</span><i>${icon('edit')}</i></button>`
    : `<button type="button" class="btn ghost block" data-act="journal-edit" data-k="${k}">${icon('plus')}Écrire la ligne du jour</button>`}
      ${recent.length ? `<ul class="plain journal-list">${recent.map((r) => `<li><button type="button" data-act="journal-edit" data-k="${r.k}"><b>${esc(F.cap(F.dayShort(r.k)))}</b><span>${esc(r.text)}</span></button></li>`).join('')}</ul>` : ''}
    </section>`;
}

const PARTS = [
  { id: 'morning', name: 'Matin', icon: 'sunrise', test: (t) => t < '12:00' },
  { id: 'afternoon', name: 'Après-midi', icon: 'sun', test: (t) => t < '18:00' },
  { id: 'evening', name: 'Soir', icon: 'moon', test: () => true },
];
function sortTasks(list, k = ui.today) {
  return list.slice().sort((a, b) => (Number(taskDoneOn(a, k)) - Number(taskDoneOn(b, k)))
    || ((PRIORITIES[a.priority] || PRIORITIES.medium).rank - (PRIORITIES[b.priority] || PRIORITIES.medium).rank)
    || String(a.time || '99').localeCompare(String(b.time || '99'))
    || String(a.createdAt).localeCompare(String(b.createdAt)));
}
function planCard(k) {
  const filter = state.settings.planFilter;
  const withTasks = state.settings.modules.tasksInPlan;
  const fixed = []; const flex = []; const paused = [];
  for (const h of activeHabits()) {
    const st = dayState(h, k);
    if (st === 'pause') { paused.push(h); continue; }
    if (st === 'na') continue;
    if (isWeekly(h, k)) { flex.push(h); continue; }
    if (EXPECTED.has(st)) fixed.push(h);
  }
  const tasks = withTasks ? tasksForDay(k) : [];
  const overdue = withTasks ? sortTasks(overdueTasks(k)) : [];
  const items = [];
  if (filter !== 'tasks') fixed.forEach((h) => { const c = configAt(h, k); items.push({ type: 'habit', id: h.id, h, time: c.time || null, done: isDone(h, k), part: isPartial(h, k), name: h.name, fav: !!h.favorite, order: h.order ?? 0 }); });
  if (filter !== 'habits') tasks.forEach((t) => items.push({ type: 'task', id: t.id, t, time: t.time || null, done: taskDoneOn(t, k), part: false, name: t.title, fav: false, order: 0 }));
  items.sort((a, b) => String(a.time || '99:99').localeCompare(String(b.time || '99:99')) || (Number(b.fav) - Number(a.fav)) || (a.type === b.type ? a.order - b.order : a.type === 'habit' ? -1 : 1) || a.name.localeCompare(b.name, 'fr'));
  const now = nowHM();
  const next = items.find((i) => !i.done && !i.part && i.time && i.time >= now);
  const rowOf = (i) => (i.type === 'habit' ? habitRow(i.h, k, { next: next === i }) : taskRow(i.t, { next: next === i, k, postpone: true }));
  const groups = PARTS.map((part) => ({ ...part, list: [] }));
  const anytime = [];
  for (const i of items) {
    if (!i.time) { anytime.push(i); continue; }
    groups.find((g) => g.test(i.time)).list.push(i);
  }
  let body = '';
  if (filter !== 'habits' && overdue.length) body += `<div class="plan-group"><h3 class="late">${icon('alert')}En retard</h3><div class="rows">${overdue.map((t) => taskRow(t, { k, postpone: true })).join('')}</div></div>`;
  for (const g of groups) if (g.list.length) body += `<div class="plan-group"><h3>${icon(g.icon)}${g.name}</h3><div class="rows">${g.list.map(rowOf).join('')}</div></div>`;
  if (anytime.length) body += `<div class="plan-group"><h3>${icon('clock')}À tout moment</h3><div class="rows">${anytime.map(rowOf).join('')}</div></div>`;
  if (filter !== 'tasks' && flex.length) {
    flex.sort((a, b) => (Number(b.favorite) - Number(a.favorite)) || byOrder(a, b));
    body += `<div class="plan-group"><h3>${icon('calendar')}Cette semaine, au choix</h3><div class="rows">${flex.map((h) => habitRow(h, k)).join('')}</div></div>`;
  }
  if (filter !== 'tasks' && paused.length) body += `<p class="plan-paused">${icon('pause')}<span>En pause : ${esc(paused.map((h) => h.name).join(', '))}</span><button type="button" class="link-btn" data-act="pauses-open">Gérer</button></p>`;
  if (!body) {
    if (!state.habits.length) body = emptyState('repeat', 'Crée ta première habitude', 'Ajoute une habitude récurrente, puis coche-la chaque jour.', '<button type="button" class="btn primary" data-act="habit-new">' + icon('plus') + 'Nouvelle habitude</button>');
    else if (filter === 'tasks') body = emptyState('tasks', 'Aucune tâche aujourd’hui', 'Ajoute une tâche ponctuelle ci-dessous.');
    else body = emptyState('sun', 'Rien de prévu aujourd’hui', 'Tes habitudes ne sont pas programmées ce jour-là.');
  }
  const habitsCount = fixed.length + flex.filter((h) => isCounted(h, k)).length;
  const habitsDone = fixed.filter((h) => isCounted(h, k)).length + flex.filter((h) => isCounted(h, k)).length;
  const doneCount = items.filter((i) => i.done || i.part).length;
  const filters = seg([
    ['all', 'Tout'],
    ['habits', `${icon('repeat')}Habitudes`, `${habitsDone}/${habitsCount}`],
    ...(withTasks ? [['tasks', `${icon('tasks')}Tâches`, `${tasks.filter((t) => taskDoneOn(t, k)).length}/${tasks.length}`]] : []),
  ], filter, 'plan-filter', 'aria-label="Filtrer le plan du jour"');
  const quick = withTasks && filter !== 'habits'
    ? `<form class="quick-add" data-form="plan-task" autocomplete="off"><input class="input" id="plan-task-input" name="title" placeholder="Ajouter une tâche pour aujourd’hui" enterkeyhint="done" maxlength="140" aria-label="Nouvelle tâche pour aujourd’hui"><button type="submit" class="btn" aria-label="Ajouter la tâche">${icon('plus')}</button></form>`
    : '';
  return `<section class="card" aria-label="Plan du jour">
      <div class="card-head"><div class="card-title-group"><h2>Plan du jour</h2><span class="sub">${items.length ? `${doneCount} sur ${items.length} terminé${doneCount > 1 ? 's' : ''}` : '—'}</span></div>${filters}</div>
      ${body}${quick}
    </section>`;
}

function habitRow(h, k, { next = false } = {}) {
  const c = configAt(h, k);
  const st = dayState(h, k);
  const done = isDone(h, k);
  const part = !done && isPartial(h, k);
  const cat = catById(h.categoryId);
  const streak = habitStreak(h);
  const weekly = c.freq.type === 'weekly';
  const meta = [];
  if (part) meta.push(`<span class="part-pill">${icon('half')}Mini-version${c.minLabel ? ` · ${esc(c.minLabel)}` : ''}</span>`);
  if (weekly) {
    const w = weekStates(h, weekStartKey(k));
    meta.push(`<span class="week-pill ${w.met ? 'met' : ''}">${icon('calendar')}${w.req ? (w.met ? `Semaine tenue · ${w.done}/${w.req}` : `${w.counted}/${w.req} cette semaine`) : 'Semaine en pause'}</span>`);
  }
  if (st === 'pause') meta.push(`<span class="pause-pill">${icon('pause')}En pause</span>`);
  if (st === 'bonus' && !weekly) meta.push('<span class="part-pill">Bonus</span>');
  if (c.time) meta.push(`<span>${icon('clock')}${c.time}</span>`);
  if (h.duration) meta.push(`<span>${icon('timer')}${F.dur(h.duration)}</span>`);
  if (cat) meta.push(`<span>${catDot(cat)}${esc(cat.name)}</span>`);
  if (h.phase && k >= h.phase.from && k <= h.phase.to) meta.push(`<span class="phase-pill">${icon(PHASES[h.phase.kind].icon)}${PHASES[h.phase.kind].name} · J${D.diff(h.phase.from, k) + 1}/${D.diff(h.phase.from, h.phase.to) + 1}</span>`);
  if (streak.unit === 'week' ? streak.weeks.current > 0 : streak.current > 0) meta.push(`<span class="flame">${icon('flame')}${streakText(streak)}</span>`);
  if (next) meta.push('<span class="next-pill">Prochaine</span>');
  /* Le bouton principal valide l’habitude en entier ; le petit bouton valide la
     mini-version. Deux commandes distinctes valent mieux qu’un appui qui tourne
     entre trois états. */
  const mini = c.minLabel && !done
    ? `<button type="button" class="icon-btn row-mini ${part ? 'on' : ''}" data-act="toggle-min" data-id="${h.id}" data-k="${k}" aria-pressed="${part}" aria-label="${part ? 'Retirer la mini-version' : `Valider la mini-version : ${esc(c.minLabel)}`}" data-tip="Mini-version : ${esc(c.minLabel)}">${icon('half')}</button>`
    : '';
  return `<div class="row habit ${done ? 'is-done' : ''} ${part ? 'is-part' : ''}" data-row="${h.id}">
    <button type="button" class="row-hit" data-act="toggle-habit" data-id="${h.id}" data-k="${k}" aria-pressed="${done}">
      <span class="check" aria-hidden="true">${icon(part ? 'half' : 'check')}</span>${tile(h)}
      <span class="row-text"><span class="row-title">${esc(h.name)}${h.favorite ? `<span class="fav" aria-label="Favorite">${icon('star')}</span>` : ''}</span><span class="row-meta">${meta.join('')}</span></span>
    </button>
    ${mini}
    <button type="button" class="icon-btn row-more" data-act="habit-open" data-id="${h.id}" aria-label="Détails : ${esc(h.name)}">${icon('more')}</button>
  </div>`;
}
function taskRow(t, { next = false, showDate = false, k = ui.today, postpone = false } = {}) {
  const pr = PRIORITIES[t.priority] || PRIORITIES.medium;
  const done = taskDoneOn(t, k);
  const late = !t.recurrence && !t.done && t.date < ui.today;
  const meta = [`<span class="prio prio-${esc(t.priority)}">${icon('flag')}${pr.name}</span>`];
  if (t.recurrence) meta.push(`<span>${icon('repeat')}${esc(recurrenceLabel(t.recurrence))}</span>`);
  if (t.time) meta.push(`<span>${icon('clock')}${t.time}</span>`);
  if (t.duration) meta.push(`<span>${icon('timer')}${F.dur(t.duration)}</span>`);
  if (late) meta.push(`<span class="late-pill">${F.dayRel(t.date, ui.today)}</span>`);
  else if (showDate && !t.recurrence) meta.push(`<span>${icon('calendar')}${F.dayRel(t.date, ui.today)}</span>`);
  if ((t.postponed || []).length >= 2 && !done) meta.push(`<span class="late-pill soft">Reportée ${t.postponed.length}${NB}fois</span>`);
  if (next) meta.push('<span class="next-pill">Prochaine</span>');
  const canPostpone = postpone && !done && !t.recurrence;
  return `<div class="row task ${done ? 'is-done' : ''}" data-row="${t.id}">
    <button type="button" class="row-hit" data-act="toggle-task" data-id="${t.id}" data-k="${k}" aria-pressed="${done}">
      <span class="check sq" aria-hidden="true">${icon('check')}</span>
      <span class="tile task-tile prio-${esc(t.priority)}">${icon(t.recurrence ? 'repeat' : 'flag')}</span>
      <span class="row-text"><span class="row-title">${esc(t.title)}</span><span class="row-meta">${meta.join('')}</span></span>
    </button>
    ${canPostpone ? `<button type="button" class="icon-btn row-mini" data-act="task-postpone" data-id="${t.id}" aria-label="Reporter à demain : ${esc(t.title)}" data-tip="Reporter à demain">${icon('goto')}</button>` : ''}
    <button type="button" class="icon-btn row-more" data-act="task-edit" data-id="${t.id}" aria-label="Modifier : ${esc(t.title)}">${icon('more')}</button>
  </div>`;
}

function weekCard(k) {
  const ws = weekStartKey(k);
  let sumD = 0; let sumS = 0;
  const cells = [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const dk = D.add(ws, i);
    const s = dayStats(dk);
    const future = dk > k;
    if (!future) { sumD += s.credit; sumS += dk === k ? s.scheduled - s.pending : s.scheduled; }
    const label = `${F.cap(F.long(dk))} : ${future ? 'à venir' : s.scheduled ? `${P(Math.round(s.pct * 100))}, ${s.done} sur ${s.scheduled}${s.partial ? `, ${s.partial} en mini-version` : ''}` : s.paused ? 'en pause' : 'rien de prévu'}`;
    return `<button type="button" class="wd ${dk === k ? 'is-today' : ''} ${future ? 'is-future' : ''} ${!s.scheduled && s.paused ? 'is-paused' : ''}" data-act="day-open" data-k="${dk}" aria-label="${esc(label)}"><span class="wd-l">${WD_SHORT[D.dow(dk)]}</span>${miniRing(future ? 0 : s.pct)}<span class="wd-d">${D.parse(dk)[2]}</span></button>`;
  }).join('');
  return `<section class="card"><div class="card-head"><h2>${icon('calendar')}Cette semaine</h2><span class="sub">${sumS ? `Moyenne ${P(pct(sumD, sumS))}` : 'Pas encore de données'}</span></div><div class="week">${cells}</div></section>`;
}

const nextMilestone = (n) => MILESTONES.find((m) => m > n) || n + 10;
const WEEK_MILESTONES = [2, 4, 8, 12, 26, 52];
function streaksCard() {
  const list = activeHabits().map((h) => ({ h, st: habitStreak(h) }))
    .filter((x) => (x.st.unit === 'week' ? x.st.weeks.current : x.st.current) > 0)
    .sort((a, b) => (b.st.unit === 'week' ? b.st.weeks.current * 7 : b.st.current) - (a.st.unit === 'week' ? a.st.weeks.current * 7 : a.st.current)).slice(0, 4);
  const t = totals();
  const gr = goalRuns();
  const items = list.length ? list.map(({ h, st }) => {
    if (st.unit === 'week') {
      const n = st.weeks.current;
      const target = WEEK_MILESTONES.find((m) => m > n) || n + 4;
      const v = Math.min(100, Math.round((n / target) * 100));
      return `<div class="streak-item">${tile(h, 'sm')}<div style="min-width:0"><div class="name">${esc(h.name)}</div><div class="bar" role="img" aria-label="${v} %"><i style="--v:${v}"></i></div><div class="meta">${n} semaine${n > 1 ? 's' : ''} tenue${n > 1 ? 's' : ''} · prochain palier ${target}${NB}sem.</div></div><span class="streak-val">${icon('flame')}${n}<small>sem.</small></span></div>`;
    }
    const goal = configAt(h, ui.today).streakGoal;
    const target = goal && goal > st.current ? goal : nextMilestone(st.current);
    const v = Math.min(100, Math.round((st.current / target) * 100));
    const label = goal && st.current >= goal ? `Objectif de ${goal}${NB}j atteint · prochain palier ${target}${NB}j` : `${target - st.current}${NB}j avant ${goal && goal === target ? 'ton objectif' : 'le prochain palier'} (${target}${NB}j)`;
    return `<div class="streak-item">${tile(h, 'sm')}<div style="min-width:0"><div class="name">${esc(h.name)}</div><div class="bar" role="img" aria-label="${v} %"><i style="--v:${v}"></i></div><div class="meta">${label}</div></div><span class="streak-val">${icon('flame')}${st.current}</span></div>`;
  }).join('') : '<p class="muted small">Coche une habitude deux jours de suite pour lancer ta première série.</p>';
  const rec = t.bestStreak;
  const recentMs = state.settings.badges !== false && state.settings.modules.milestones !== false ? milestoneList(D.add(ui.today, -6), ui.today)[0] : null;
  return `<section class="card"><div class="card-head"><h2>${icon('flame')}Séries en cours</h2><button type="button" class="link-btn" data-act="nav" data-view="stats">Statistiques</button></div>
      <div class="streak-list">${items}</div>
      <div class="record">${icon('trophy')}<div><b>Record personnel : ${rec.value}${NB}j</b><br><span>${rec.value ? `${esc(rec.habit)}${rec.date ? ` · atteint le ${F.short(rec.date)}` : ''}` : 'Ton premier record t’attend.'}</span></div></div>
      ${recentMs ? `<p class="ms-line">${icon(recentMs.icon)}<span><b>${esc(recentMs.name)}</b>${recentMs.h ? ` · ${esc(recentMs.h.name)}` : ''} · ${esc(F.dayRel(recentMs.k, ui.today).toLowerCase())}</span></p>` : ''}
      ${gr.current > 1 ? `<p class="small muted" style="margin-top:12px">${gr.current} jours de suite à ton objectif quotidien.</p>` : ''}
    </section>`;
}

/* ===================== TÂCHES ===================== */
const quickTask = { priority: 'medium', when: 'today' };
function nextOccurrence(t, from) {
  for (let i = 0; i < 400; i++) { const k = D.add(from, i); if (taskOccursOn(t, k) && !(t.skipped && t.skipped[k])) return k; }
  return null;
}
function viewTasks() {
  const k = ui.today;
  const todays = tasksForDay(k);
  const overdue = sortTasks(overdueTasks(k));
  const upcoming = state.tasks.filter((t) => !t.recurrence && !t.done && t.date > k).sort((a, b) => a.date.localeCompare(b.date) || String(a.time || '99').localeCompare(String(b.time || '99')));
  const recurring = state.tasks.filter((t) => t.recurrence).sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  /* Terminées : tâches ponctuelles cochées, et occurrences récentes des tâches récurrentes. */
  const doneList = [];
  state.tasks.forEach((t) => {
    if (!t.recurrence) { if (t.done) doneList.push({ t, k: t.doneAt ? keyOfISO(t.doneAt) : t.date, at: t.doneAt || t.date }); return; }
    Object.keys(t.doneDates || {}).forEach((dk) => { if (dk >= D.add(k, -60)) doneList.push({ t, k: dk, at: t.doneDates[dk], occ: dk }); });
  });
  doneList.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  const remaining = todays.filter((t) => !taskDoneOn(t, k)).length + overdue.length;
  const doneToday = todays.filter((t) => taskDoneOn(t, k)).length;
  const L = dailyLoad(k);
  const hs = dayStats(k);
  const tab = ui.tasksTab;
  let body = '';
  if (tab === 'today') {
    if (overdue.length) body += `<div class="plan-group"><h3 class="late">${icon('alert')}En retard <button type="button" class="link-btn" style="margin-left:auto;text-transform:none;letter-spacing:0" data-act="tasks-postpone">Tout reporter à aujourd’hui</button></h3><div class="rows">${overdue.map((t) => taskRow(t, { postpone: true })).join('')}</div></div>`;
    if (todays.length) body += `<div class="plan-group"><h3>${icon('tasks')}Aujourd’hui</h3><div class="rows">${sortTasks(todays).map((t) => taskRow(t, { postpone: true })).join('')}</div></div>`;
    if (!body) body = emptyState('tasks', 'Aucune tâche pour aujourd’hui', 'Ajoute une tâche avec le champ ci-dessus.');
  } else if (tab === 'upcoming') {
    const byDate = {};
    upcoming.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
    body = Object.keys(byDate).sort().map((d) => `<div class="plan-group"><h3>${icon('calendar')}${esc(F.dayRel(d, k))}</h3><div class="rows">${sortTasks(byDate[d], d).map((t) => taskRow(t, { k: d })).join('')}</div></div>`).join('') || emptyState('calendar', 'Rien à venir', 'Les tâches planifiées pour les prochains jours apparaîtront ici.');
  } else if (tab === 'recurring') {
    body = recurring.length
      ? `<div class="rows">${recurring.map((t) => { const nx = nextOccurrence(t, k); return `<div class="row"><button type="button" class="row-hit" data-act="task-edit" data-id="${t.id}"><span class="tile task-tile prio-${esc(t.priority)}">${icon('repeat')}</span><span class="row-text"><span class="row-title">${esc(t.title)}</span><span class="row-meta"><span>${esc(recurrenceLabel(t.recurrence))}</span>${t.time ? `<span>${icon('clock')}${t.time}</span>` : ''}${t.duration ? `<span>${icon('timer')}${F.dur(t.duration)}</span>` : ''}<span>${nx ? `Prochaine : ${esc(F.dayRel(nx, k).toLowerCase())}` : 'Terminée'}</span><span>${Object.keys(t.doneDates || {}).length} fois faite</span></span></span></button></div>`; }).join('')}</div>`
      : emptyState('repeat', 'Aucune tâche récurrente', 'Une tâche qui revient (sortir les poubelles, faire le point sur les mails) se crée avec « Plus d’options », puis « Récurrente ».');
  } else {
    const byDay = {};
    doneList.slice(0, 80).forEach((x) => { (byDay[x.k] = byDay[x.k] || []).push(x); });
    body = Object.keys(byDay).sort().reverse().map((d) => `<div class="plan-group"><h3>${icon('check')}${esc(F.dayRel(d, k))}</h3><div class="rows">${byDay[d].map((x) => taskRow(x.t, { k: x.occ || x.k, showDate: !x.occ && x.t.date !== d })).join('')}</div></div>`).join('') || emptyState('check', 'Aucune tâche terminée', 'Coche une tâche pour la retrouver ici.');
    if (state.tasks.some((t) => !t.recurrence && t.done)) body += `<div class="btn-row" style="margin-top:12px"><button type="button" class="btn sm ghost" data-act="tasks-clear-done">${icon('trash')}Effacer les tâches ponctuelles terminées</button></div>`;
  }
  const prio = Object.entries(PRIORITIES).map(([id, p]) => `<button type="button" data-act="tq-opt" data-k="priority" data-v="${id}" aria-pressed="${quickTask.priority === id}"><span class="prio prio-${id}">${icon('flag')}</span>${p.name}</button>`).join('');
  const when = [['today', 'Aujourd’hui'], ['tomorrow', 'Demain']].map(([v, l]) => `<button type="button" data-act="tq-opt" data-k="when" data-v="${v}" aria-pressed="${quickTask.when === v}">${l}</button>`).join('');
  const loadTile = L.hasData && state.settings.modules.load !== false
    ? `<div class="tile-stat"><div class="k">${icon('timer')}Charge du jour</div><div class="v">${F.dur(L.planned)}</div><div class="d">${L.remaining ? `reste ${F.dur(L.remaining)}` : 'tout est fait'}</div></div>`
    : `<button type="button" class="tile-stat" data-act="nav" data-view="today"><div class="k">${icon('repeat')}Habitudes du jour</div><div class="v">${hs.done}<small>/${hs.scheduled}</small></div><div class="d">dans Aujourd’hui →</div></button>`;
  return `<section class="page-head"><p class="eyebrow">${esc(F.cap(F.long(k)))}</p><h1 class="page-title">Checklist du jour</h1></section>
    <div class="tiles">
      <div class="tile-stat"><div class="k">Restantes</div><div class="v">${remaining}</div><div class="d">${overdue.length ? `dont ${overdue.length} en retard` : 'aujourd’hui'}</div></div>
      <div class="tile-stat"><div class="k">Terminées</div><div class="v">${doneToday}</div><div class="d">aujourd’hui</div></div>
      <div class="tile-stat"><div class="k">À venir</div><div class="v">${upcoming.length}</div><div class="d">${recurring.length ? `+ ${plural(recurring.length, 'récurrente', 'récurrentes')}` : 'prochains jours'}</div></div>
      ${loadTile}
    </div>
    <section class="card">
      <form data-form="task-quick" autocomplete="off" class="stack" style="gap:10px">
        <div class="quick-add" style="margin:0"><input class="input" id="task-quick-input" name="title" placeholder="Nouvelle tâche…" maxlength="140" enterkeyhint="done" aria-label="Nouvelle tâche"><button type="submit" class="btn primary">${icon('plus')}<span class="hide-mobile">Ajouter</span></button></div>
        <div class="filter-row wrap"><div class="seg" role="group" aria-label="Priorité">${prio}</div><div class="seg" role="group" aria-label="Date">${when}</div><button type="button" class="btn sm ghost" data-act="task-new">Plus d’options</button></div>
      </form>
    </section>
    <section class="card">
      <div class="card-head">${seg([['today', 'Aujourd’hui', remaining], ['upcoming', 'À venir', upcoming.length], ['recurring', 'Récurrentes', recurring.length], ['done', 'Terminées', doneList.length]], tab, 'tasks-tab', 'aria-label="Afficher"')}</div>
      ${body}
    </section>`;
}

/* =====================================================================
   MATRICE — vue mois (jours), trimestre (semaines), année (mois),
   filtres enregistrables, légende complète, repères de changement
   ===================================================================== */

/* L’état d’une case vient de dayState() : la matrice ne recalcule rien elle-même. */
function cellState(h, k) { return dayState(h, k); }
const CELL_LABEL = {
  done: 'accomplie', part: 'mini-version', bonus: 'bonus (en plus du prévu)', pending: 'à faire aujourd’hui', miss: 'non réalisée',
  off: 'repos — touche pour un bonus', future: 'à venir', 'off-future': 'repos', flex: 'au choix cette semaine', 'flex-future': 'au choix cette semaine',
  pause: 'en pause', na: 'hors période',
};
const CELL_CLASS = { 'off-future': 'off', 'flex-future': 'flex is-future' };
const CLICKABLE = new Set(['done', 'part', 'bonus', 'pending', 'miss', 'off', 'flex', 'pause']);
function cellHtml(h, k, st, { label = true, text = '' } = {}) {
  const cls = CELL_CLASS[st] || st;
  const chg = changeDays(h).has(k) ? ' chg' : '';
  const ts = (state.completions[k] || {})[h.id] || (state.partials[k] || {})[h.id];
  const lab = `${h.name}, ${F.long(k)} : ${CELL_LABEL[st]}${ts && dayKeyOf(ts) === k ? `, à ${F.timeOfISO(ts)}` : ''}${chg ? ' · nouveau réglage ce jour-là' : ''}`;
  if (CLICKABLE.has(st)) return `<button type="button" class="c ${cls}${chg}" data-act="cell" data-id="${h.id}" data-k="${k}" aria-label="${esc(lab)}" aria-pressed="${st === 'done' || st === 'bonus' || st === 'part'}" ${label ? `data-tip="${esc(lab)}"` : ''}>${text}</button>`;
  return `<span class="c ${cls}${chg}" ${st === 'na' ? 'aria-hidden="true"' : `role="img" aria-label="${esc(lab)}"`}>${st === 'na' ? '' : text}</span>`;
}
/* Jours où un nouveau réglage prend effet (hors réglage de départ). */
function changeDays(h) {
  return Stats.memo('chg:' + h.id, () => new Set((h.history || []).slice(1).map((v) => v.from)));
}

function monthNav(y, m, prev, next, id, todayAct) {
  const [ty, tm] = D.parse(ui.today);
  const isCur = y === ty && m === tm;
  return `<div class="month-nav">
      <button type="button" class="icon-btn" data-act="${prev}" aria-label="Mois précédent">${icon('chevL')}</button>
      <label class="month-label">${esc(F.monthYear(y, m))}<input type="month" id="${id}" value="${y}-${D.pad(m)}" aria-label="Choisir le mois"></label>
      <button type="button" class="icon-btn" data-act="${next}" aria-label="Mois suivant">${icon('chevR')}</button>
      ${!isCur && todayAct ? `<button type="button" class="btn sm ghost" data-act="${todayAct}">Ce mois-ci</button>` : ''}
    </div>`;
}
function periodNav(label, prev, next, cur, todayAct, todayLabel) {
  return `<div class="month-nav">
      <button type="button" class="icon-btn" data-act="${prev}" aria-label="Période précédente">${icon('chevL')}</button>
      <span class="month-label" style="min-width:110px">${esc(label)}</span>
      <button type="button" class="icon-btn" data-act="${next}" aria-label="Période suivante">${icon('chevR')}</button>
      ${!cur ? `<button type="button" class="btn sm ghost" data-act="${todayAct}">${todayLabel}</button>` : ''}
    </div>`;
}

/* ---------- Barre de filtres (matrice et statistiques) ---------- */
const STATUS_FILTERS = [['all', 'Toutes'], ['active', 'Actives'], ['paused', 'En pause'], ['favorite', 'Favorites'], ['archived', 'Archivées']];
function filterBar(scope, f) {
  const cats = [...new Set(state.habits.map((h) => (catById(h.categoryId) ? h.categoryId : 'none')))];
  const saved = state.settings.savedFilters.filter((x) => x.scope === scope);
  const habits = [...state.habits].sort((a, b) => (Number(!!a.archivedAt) - Number(!!b.archivedAt)) || byOrder(a, b));
  const on = isFiltered(f);
  return `<div class="filter-bar" role="group" aria-label="Filtrer">
      <div class="filter-row">${STATUS_FILTERS.map(([v, l]) => `<button type="button" class="chip" data-act="flt" data-scope="${scope}" data-k="status" data-v="${v}" aria-pressed="${(f.status || 'all') === v}">${l}</button>`).join('')}</div>
      <div class="filter-selects">
        <select class="select" data-flt-scope="${scope}" data-flt-k="cat" aria-label="Catégorie"><option value="all">Toutes les catégories</option>${cats.map((id) => { const c = catById(id); return `<option value="${esc(id)}" ${f.cat === id ? 'selected' : ''}>${esc(c ? c.name : 'Sans catégorie')}</option>`; }).join('')}</select>
        <select class="select" data-flt-scope="${scope}" data-flt-k="habit" aria-label="Habitude"><option value="all">Toutes les habitudes</option>${habits.map((h) => `<option value="${h.id}" ${f.habit === h.id ? 'selected' : ''}>${esc(h.name)}${h.archivedAt ? ' (archivée)' : ''}</option>`).join('')}</select>
      </div>
      ${saved.length || on ? `<div class="filter-row saved">${saved.map((x) => `<span class="saved-chip ${filterKey(x.f) === filterKey(f) ? 'on' : ''}"><button type="button" data-act="flt-apply" data-scope="${scope}" data-id="${x.id}">${icon('filter')}${esc(x.name)}</button><button type="button" class="x" data-act="flt-del" data-id="${x.id}" aria-label="Supprimer le filtre ${esc(x.name)}">${icon('x')}</button></span>`).join('')}
        ${on ? `<button type="button" class="chip" data-act="flt-save" data-scope="${scope}">${icon('plus')}Enregistrer ce filtre</button><button type="button" class="chip" data-act="flt-clear" data-scope="${scope}">${icon('x')}Effacer</button>` : ''}</div>` : ''}
    </div>`;
}

const LEVEL = (rate) => (rate === null ? 'none' : rate === 0 ? 'lv0' : rate < 0.4 ? 'lv1' : rate < 0.7 ? 'lv2' : rate < 1 ? 'lv3' : 'lv4');

function viewMatrix() {
  const mx = ui.matrix;
  const mode = mx.mode || 'month';
  const head = `<section class="page-head row-head"><div><p class="eyebrow">Habit matrix</p><h1 class="page-title">Matrice</h1></div>
      ${seg([['month', 'Mois'], ['quarter', 'Trimestre'], ['year', 'Année']], mode, 'mx-mode', 'aria-label="Échelle de la matrice"')}</section>`;
  if (mode === 'quarter' || mode === 'year') return head + viewMatrixAgg(mode);
  return head + viewMatrixMonth();
}

function matrixRows(a, b) {
  const keep = habitFilter(ui.matrix.f);
  return state.habits
    .filter((h) => h.startDate <= b && (!h.archivedAt || h.archivedAt > a) && keep(h))
    .sort((p, q) => (Number(!!p.archivedAt) - Number(!!q.archivedAt)) || (Number(!!q.favorite) - Number(!!p.favorite)) || byOrder(p, q));
}
function nameCell(h) {
  return `<div class="mx-name ${h.archivedAt ? 'archived' : ''}"><button type="button" data-act="habit-open" data-id="${h.id}">${tile(h, 'sm')}<span class="t">${esc(h.name)}</span></button></div>`;
}

function viewMatrixMonth() {
  const { y, m } = ui.matrix;
  const [a, b] = monthBounds(y, m);
  const today = ui.today;
  const n = D.dim(y, m);
  const keys = Array.from({ length: n }, (_, i) => D.key(y, m, i + 1));
  const rows = matrixRows(a, b);
  let sch = 0; let done = 0; let bonus = 0; let parts = 0; let paused = 0;
  const perDay = keys.map(() => ({ s: 0, d: 0 }));
  const rowHtml = rows.map((h) => {
    let rs = 0; let rc = 0;
    const c = catColor(catById(h.categoryId));
    const cells = keys.map((k, i) => {
      const st = cellState(h, k);
      /* Le jour même, une habitude pas encore cochée n’est pas comptée comme manquée.
         Une mini-version vaut une demi-validation, comme partout ailleurs. */
      if (st === 'done' || st === 'miss' || st === 'part') { rs++; perDay[i].s++; }
      if (st === 'done') { rc += 1; perDay[i].d += 1; }
      if (st === 'part') { parts++; rc += PARTIAL_WEIGHT; perDay[i].d += PARTIAL_WEIGHT; }
      if (st === 'bonus') bonus++;
      if (st === 'pause') paused++;
      return cellHtml(h, k, st);
    }).join('');
    sch += rs; done += rc;
    return `${nameCell(h)}
      <div style="display:contents;--c:${c};--cbg:${rgba(c, 0.45)}">${cells}</div>
      <div class="mx-end"><b>${rs ? P(Math.round((rc / rs) * 100)) : '—'}</b><span>${Math.round(rc * 10) / 10}/${rs}</span></div>`;
  }).join('');
  const heads = keys.map((k) => { const dow = D.dow(k); return `<button type="button" class="mx-dh ${k === today ? 'is-today' : ''} ${dow === 0 || dow === 6 ? 'is-we' : ''}" data-act="day-open" data-k="${k}" aria-label="Détail du ${esc(F.long(k))}"><span>${WD_LETTER[dow]}</span><b>${D.parse(k)[2]}</b></button>`; }).join('');
  const foot = keys.map((k, i) => {
    const pd = perDay[i];
    if (k > today || !pd.s) return '<div class="mx-bar none" aria-hidden="true"><i></i></div>';
    const v = pct(pd.d, pd.s);
    return `<div class="mx-bar" style="--v:${v}" data-tip="${esc(`${F.cap(F.long(k))} : ${P(v)} (${pd.d}/${pd.s})`)}" aria-hidden="true"><i></i></div>`;
  }).join('');
  const f = ui.matrix.f;
  const ms = rangeStats(a, b, f);
  const rate = sch ? pct(done, sch) : null;
  const grid = rows.length
    ? `<div class="mx-scroll" id="mx-scroll" data-month="${y}-${m}"><div class="mx" style="--n:${n}" data-color="${state.settings.matrixColor === 'categorie' ? 'cat' : 'accent'}" aria-label="Matrice des habitudes">
        <div class="mx-corner">Habitude</div>${heads}<div class="mx-th-end">Mois</div>
        ${rowHtml}
        <div class="mx-sep"></div>
        <div class="mx-foot-l">Jour</div>${foot}<div class="mx-end"></div>
      </div></div>`
    : emptyState('grid', isFiltered(f) ? 'Aucune habitude ne correspond au filtre' : 'Aucune habitude sur ce mois', isFiltered(f) ? 'Change ou efface le filtre pour en voir d’autres.' : 'Les habitudes actives sur cette période apparaîtront ici.', state.habits.length ? '' : `<button type="button" class="btn primary" data-act="habit-new">${icon('plus')}Nouvelle habitude</button>`);
  return `<div class="page-sub row-head">${monthNav(y, m, 'mx-prev', 'mx-next', 'mx-month', 'mx-today')}${isFiltered(f) ? `<span class="chip accent">${icon('filter')}${esc(filterLabel(f))}</span>` : ''}</div>
    <div class="tiles four">
      <div class="tile-stat"><div class="k">Régularité du mois</div><div class="v">${rate === null ? '—' : P(rate)}</div><div class="d">${sch} attendues${parts ? ` · ${parts} en mini-version` : ''}</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${ms.validations}</div><div class="d">${bonus ? `dont ${bonus} bonus` : 'cases cochées'}</div></div>
      <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${ms.perfect}</div><div class="d">100 % accompli</div></div>
      <div class="tile-stat"><div class="k">Jours à l’objectif</div><div class="v">${ms.goalDays}<small>/${ms.days}</small></div><div class="d">${paused ? `${paused} case${paused > 1 ? 's' : ''} en pause` : `objectif ${P(state.goals.daily)}`}</div></div>
    </div>
    <section class="card">
      ${filterBar('mx', f)}
      ${grid}
      ${matrixLegend()}
      <p class="hint" style="margin-top:10px">Touche une case pour cocher ou décocher un jour passé (avec une mini-version : complète, puis mini-version, puis vide). Touche une date pour voir le détail de la journée.</p>
    </section>`;
}
function matrixLegend() {
  return `<div class="legend" style="margin-top:14px" aria-label="Légende">
      <span><i class="c done"></i>Accomplie</span><span><i class="c part"></i>Mini-version</span><span><i class="c miss"></i>Non réalisée</span><span><i class="c pending"></i>À faire</span>
      <span><i class="c future"></i>À venir</span><span><i class="c off"></i>Repos</span><span><i class="c flex"></i>Au choix (fréquence souple)</span><span><i class="c pause"></i>Pause</span><span><i class="c bonus"></i>Bonus</span><span><i class="c off chg"></i>Nouveau réglage</span>
    </div>`;
}

/* Vues agrégées : une case par semaine (trimestre) ou par mois (année), teintée selon
   le taux pondéré de la période. Une case pleine de pause n’est pas un zéro. */
function viewMatrixAgg(mode) {
  const mx = ui.matrix;
  const yy = mx.yy;
  const today = ui.today;
  const [ty, tm] = D.parse(today);
  let a; let b; let cols; let label; let cur;
  if (mode === 'quarter') {
    [a, b] = quarterBounds(yy, mx.q);
    cols = [];
    let lastM = 0;
    for (let ws = weekStartKey(a); ws <= b; ws = D.add(ws, 7)) {
      const ca = D.max(ws, a);
      const [, cm, cd] = D.parse(ca);
      cols.push({ a: ca, b: D.min(D.add(ws, 6), b), top: cm !== lastM ? F.monthShort(cm) : '', head: String(cd), long: `Semaine du ${F.short(ws)}`, ym: D.parse(ca) });
      lastM = cm;
    }
    label = `T${mx.q} ${yy}`;
    cur = yy === ty && mx.q === Math.ceil(tm / 3);
  } else {
    a = D.key(yy, 1, 1); b = D.key(yy, 12, 31);
    cols = Array.from({ length: 12 }, (_, i) => { const [ma, mb] = monthBounds(yy, i + 1); return { a: ma, b: mb, top: '', head: F.monthShort(i + 1).replace('.', ''), long: F.cap(F.monthYear(yy, i + 1)), ym: [yy, i + 1] }; });
    label = String(yy);
    cur = yy === ty;
  }
  const f = mx.f;
  const rows = matrixRows(a, b);
  const colTot = cols.map(() => ({ s: 0, c: 0 }));
  const rowHtml = rows.map((h) => {
    const cells = cols.map((col, i) => {
      if (col.a > today) return '<span class="c future" aria-hidden="true"></span>';
      const r = habitRange(h, col.a, col.b);
      colTot[i].s += r.scheduled; colTot[i].c += r.credit;
      let cls = 'none'; let txt;
      if (r.scheduled) { cls = LEVEL(r.rate); txt = `${P(Math.round(r.rate * 100))} (${r.done} complète${r.done > 1 ? 's' : ''}${r.partial ? `, ${r.partial} mini` : ''} sur ${r.scheduled})`; } else if (r.paused) { cls = 'pause'; txt = 'en pause'; } else if (D.max(col.a, h.startDate) > D.min(col.b, h.archivedAt || '9999-12-31')) { cls = 'na'; txt = 'hors période'; } else txt = 'rien de prévu';
      const lab = `${h.name}, ${col.long} : ${txt}`;
      return `<button type="button" class="c agg ${cls}" data-act="mx-goto-month" data-y="${col.ym[0]}" data-m="${col.ym[1]}" aria-label="${esc(lab)}" data-tip="${esc(lab)}"></button>`;
    }).join('');
    const tot = habitRange(h, a, b);
    return `${nameCell(h)}<div style="display:contents">${cells}</div>
      <div class="mx-end"><b>${tot.scheduled ? P(Math.round(tot.rate * 100)) : '—'}</b><span>${Math.round(tot.credit * 10) / 10}/${tot.scheduled}</span></div>`;
  }).join('');
  const heads = cols.map((c) => `<button type="button" class="mx-dh agg" data-act="mx-goto-month" data-y="${c.ym[0]}" data-m="${c.ym[1]}" aria-label="Ouvrir ${esc(c.long)}">${mode === 'quarter' ? `<span>${esc(c.top)}</span>` : ''}<b>${esc(c.head)}</b></button>`).join('');
  const foot = cols.map((c, i) => {
    const t = colTot[i];
    if (!t.s) return '<div class="mx-bar none" aria-hidden="true"><i></i></div>';
    const v = Math.round((t.c / t.s) * 100);
    return `<div class="mx-bar" style="--v:${v}" data-tip="${esc(`${c.long} : ${P(v)}`)}" aria-hidden="true"><i></i></div>`;
  }).join('');
  const ind = periodIndicators(a, D.min(b, today), f);
  const grid = rows.length
    ? `<div class="mx-scroll" id="mx-scroll" data-month="${mode}-${label}"><div class="mx agg-${mode}" style="--n:${cols.length}" aria-label="Matrice ${mode === 'quarter' ? 'trimestrielle' : 'annuelle'}">
        <div class="mx-corner">Habitude</div>${heads}<div class="mx-th-end">${mode === 'quarter' ? 'Trim.' : 'Année'}</div>
        ${rowHtml}
        <div class="mx-sep"></div>
        <div class="mx-foot-l">Total</div>${foot}<div class="mx-end"></div>
      </div></div>`
    : emptyState('grid', 'Aucune habitude sur cette période', isFiltered(f) ? 'Change ou efface le filtre.' : 'Les habitudes actives sur cette période apparaîtront ici.');
  return `<div class="page-sub row-head">${periodNav(label, 'mx-prev', 'mx-next', cur, 'mx-today', mode === 'quarter' ? 'Ce trimestre' : 'Cette année')}${isFiltered(f) ? `<span class="chip accent">${icon('filter')}${esc(filterLabel(f))}</span>` : ''}</div>
    <div class="tiles four">
      <div class="tile-stat"><div class="k">Taux pondéré</div><div class="v">${ind.weighted === null ? '—' : P(Math.round(ind.weighted * 100))}</div><div class="d">mini-version = ½</div></div>
      <div class="tile-stat"><div class="k">Complètes</div><div class="v">${ind.full}<small>/${ind.expected}</small></div><div class="d">${ind.fullRate === null ? 'jours attendus' : `${P(Math.round(ind.fullRate * 100))} des jours attendus`}</div></div>
      <div class="tile-stat"><div class="k">Mini-versions</div><div class="v">${ind.mini}</div><div class="d">${ind.missed} manquée${ind.missed > 1 ? 's' : ''}</div></div>
      <div class="tile-stat"><div class="k">Non applicables</div><div class="v">${ind.rest + ind.paused}</div><div class="d">${ind.rest} repos · ${ind.paused} pause</div></div>
    </div>
    <section class="card">
      ${filterBar('mx', f)}
      ${grid}
      <div class="legend" style="margin-top:14px"><span><i class="c agg lv0"></i>0 %</span><span><i class="c agg lv1"></i>&lt; 40 %</span><span><i class="c agg lv2"></i>40–69 %</span><span><i class="c agg lv3"></i>70–99 %</span><span><i class="c agg lv4"></i>100 %</span><span><i class="c agg pause"></i>Pause</span><span><i class="c agg none"></i>Rien de prévu</span></div>
      <p class="hint" style="margin-top:10px">Chaque case résume ${mode === 'quarter' ? 'une semaine' : 'un mois'} : touche-la pour ouvrir le mois en détail.</p>
    </section>`;
}

/* =====================================================================
   STATISTIQUES, BILAN DU MOIS, BILAN DE L’ANNÉE
   ===================================================================== */

const RANGES = [[7, '7 j'], [30, '30 j'], [90, '90 j'], [365, '365 j']];
const pctOrDash = (v) => (v === null || v === undefined ? '—' : P(Math.round(v * 100)));
/* Évolution sans jugement : flèche et mot, couleur neutre. */
function trendBadge(t, { short = false } = {}) {
  if (t.pts === null) return `<span class="trend t-0">${short ? '—' : 'pas de comparaison'}</span>`;
  const ic = t.dir > 0 ? 'arrowUp' : t.dir < 0 ? 'arrowDown' : 'goto';
  const pts = t.dir ? `${t.pts > 0 ? '+' : '−'}${Math.abs(t.pts)}${NB}pts` : `±${Math.abs(t.pts)}${NB}pt${Math.abs(t.pts) > 1 ? 's' : ''}`;
  return `<span class="trend t-${t.dir > 0 ? 'up' : t.dir < 0 ? 'down' : '0'}">${icon(ic)}${short ? pts : `${t.word} · ${pts}`}</span>`;
}

function viewStats() {
  const k = ui.today;
  const range = ui.stats.range;
  const f = ui.stats.f;
  const goal = state.goals.daily;
  /* A. Régularité du jour */
  const s = dayStats(k);
  const yd = dayStats(D.add(k, -1));
  const pToday = s.scheduled ? Math.round(s.pct * 100) : null;
  const pYest = yd.scheduled ? Math.round(yd.pct * 100) : null;
  const w7 = rangeStats(D.add(k, -7), D.add(k, -1));
  const delta = pToday !== null && pYest !== null ? pToday - pYest : null;
  const daily = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Daily consistency</h2><span class="sub">Aujourd’hui · ${esc(F.long(k))}</span></div></div>
    <div class="consistency"><div class="ring-wrap">${ring(s.pct || 0, { size: 112, stroke: 11, id: 'st-day', label: 'Régularité du jour', goal })}<div class="ring-center"><span class="hero-ring-v">${pToday === null ? '—' : pToday}<small>${pToday === null ? '' : '%'}</small></span></div></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Complétées</div><div class="v">${s.done}<small>/${s.scheduled}</small></div>${s.partial ? `<div class="d">+ ${s.partial} en mini-version</div>` : ''}</div>
        <div class="tile-stat"><div class="k">Vs hier</div><div class="v">${delta === null ? '—' : `${delta > 0 ? '+' : delta < 0 ? '−' : ''}${Math.abs(delta)}`}<small>${delta === null ? '' : 'pts'}</small></div><div class="d">la journée n’est pas finie</div></div>
        <div class="tile-stat" style="grid-column:1/-1"><div class="k">Moyenne des 7 derniers jours</div><div class="v">${pctOrDash(w7.rate)}</div><div class="d">jours terminés, hors aujourd’hui</div></div>
      </div></div></section>`;
  /* B. Régularité du mois */
  const { y, m } = ui.stats;
  const [ma, mb] = monthBounds(y, m);
  const ms = rangeStats(ma, mb);
  const monthly = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Monthly consistency</h2><span class="sub">Objectif mensuel ${P(state.goals.monthly)}</span></div>${monthNav(y, m, 'st-prev', 'st-next', 'st-month', 'st-today')}</div>
    <div class="consistency"><div class="ring-wrap">${ring(ms.rate || 0, { size: 112, stroke: 11, id: 'st-month', label: 'Réussite du mois', goal: state.goals.monthly })}<div class="ring-center"><span class="hero-ring-v">${ms.rate === null ? '—' : Math.round(ms.rate * 100)}<small>${ms.rate === null ? '' : '%'}</small></span></div></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Réussite globale</div><div class="v">${pctOrDash(ms.rate)}</div><div class="d">${ms.done}/${ms.scheduled} attendues</div></div>
        <div class="tile-stat"><div class="k">Jours à l’objectif</div><div class="v">${pctOrDash(ms.regularity)}</div><div class="d">${ms.goalDays}/${ms.days} jours actifs</div></div>
        <div class="tile-stat"><div class="k">Validations</div><div class="v">${ms.validations}</div><div class="d">${ms.bonus ? `dont ${ms.bonus} bonus` : 'sur le mois'}</div></div>
        <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${ms.perfect}</div><div class="d">100 % accompli</div></div>
      </div></div>
      <button type="button" class="link-btn" style="margin-top:12px" data-act="month-open" data-y="${y}" data-m="${m}">${icon('calendar')}Bilan détaillé de ${esc(F.monthYear(y, m))}</button></section>`;
  /* C. Indicateurs de la période (filtrables) */
  const indicators = indicatorsCard(range, f);
  /* D. Conseils de l’assistant */
  const advice = state.settings.assistant === false ? '' : adviceCard();
  /* E. Tendance */
  const pts = trendSeries(range, f);
  const vals = pts.filter((p) => p.v !== null);
  const rs = range === 365 ? rangeStats(pts[0].k, k, f) : rangeStats(D.add(k, -(range - 1)), k, f);
  const avg = rs.rate === null ? null : Math.round(rs.rate * 100);
  const best = vals.reduce((b, p) => (b === null || p.v > b.v ? p : b), null);
  const half = Math.floor(pts.length / 2);
  const sum = (list) => { const d = list.reduce((a, p) => a + p.credit, 0); const sc = list.reduce((a, p) => a + p.scheduled, 0); return sc ? (d / sc) * 100 : null; };
  const h1 = sum(pts.slice(0, half)); const h2 = sum(pts.slice(half));
  const evo = h1 === null || h2 === null ? null : Math.round(h2 - h1);
  const unit = range === 365 ? 'Hebdomadaire' : 'Quotidien';
  const trendTable = `<div class="table-wrap"><table class="data"><thead><tr><th>${range === 365 ? 'Semaine' : 'Jour'}</th><th class="r">Régularité</th><th class="r">Moyenne</th><th class="r">Faites</th></tr></thead><tbody>${pts.slice().reverse().map((p) => `<tr><td>${esc(p.label)}</td><td class="r">${p.v === null ? '—' : P(p.v)}</td><td class="r">${p.avg === null ? '—' : P(p.avg)}</td><td class="r">${p.done}/${p.scheduled}</td></tr>`).join('')}</tbody></table></div>`;
  const trend = `<section class="card span-2"><div class="card-head"><div class="card-title-group"><h2>Consistency trend</h2><span class="sub">Part des habitudes attendues réellement accomplies${isFiltered(f) ? ` · ${esc(filterLabel(f))}` : ''}</span></div><button type="button" class="btn sm ghost" data-act="table-toggle" data-t="trend">${ui.tables.trend ? `${icon('chart')}Graphique` : `${icon('list')}Tableau`}</button></div>
    <div class="summary-line"><div><b>${avg === null ? '—' : P(avg)}</b><span>Moyenne de la période</span></div><div><b>${best ? P(best.v) : '—'}</b><span>${best ? `Meilleur : ${esc(best.label)}` : 'Meilleur jour'}</span></div><div><b>${evo === null ? '—' : `${evo > 0 ? '+' : evo < 0 ? '−' : '±'}${Math.abs(evo)}${NB}pts`}</b><span>Évolution (2ᵉ moitié vs 1ʳᵉ)</span></div></div>
    ${ui.tables.trend ? trendTable : `<div class="chart-legend"><span><i class="key" style="--k:var(--accent)"></i>${unit}</span><span><i class="key" style="--k:var(--ink-2)"></i>Moyenne ${range === 365 ? '4 semaines' : '7 jours'}</span><span><i class="key dash" style="--k:var(--ink-3)"></i>Objectif ${P(goal)}</span></div><div class="chart" data-chart="trend" style="height:210px"></div>`}
    </section>`;
  /* Comparaison des jours */
  const wd = weekdayStats(range, f);
  const wdVals = wd.filter((d) => d.v !== null);
  const bestD = wdVals.reduce((b, d) => (!b || d.v > b.v ? d : b), null);
  const worstD = wdVals.reduce((b, d) => (!b || d.v < b.v ? d : b), null);
  const wdTable = `<table class="data"><thead><tr><th>Jour</th><th class="r">Régularité</th><th class="r">Faites</th></tr></thead><tbody>${wd.map((d) => `<tr><td>${F.cap(d.long)}</td><td class="r">${d.v === null ? '—' : P(d.v)}</td><td class="r">${d.done}/${d.scheduled}</td></tr>`).join('')}</tbody></table>`;
  const weekday = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Comparaison des jours</h2><span class="sub">Régularité moyenne par jour de la semaine</span></div><button type="button" class="btn sm ghost" data-act="table-toggle" data-t="weekday">${ui.tables.weekday ? `${icon('chart')}Graphique` : `${icon('list')}Tableau`}</button></div>
    ${ui.tables.weekday ? wdTable : '<div class="chart" data-chart="weekday" style="height:180px"></div>'}
    ${bestD && worstD && bestD !== worstD ? `<p class="small muted" style="margin-top:8px">Point fort : <b style="color:var(--ink-1)">${bestD.long}</b> · Plus difficile : <b style="color:var(--ink-1)">${worstD.long}</b></p>` : ''}
    </section>`;
  /* Top habitudes */
  const top = topHabits(range, f);
  const shown = ui.stats.allTop ? top : top.slice(0, 6);
  const topCard = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Top habits</h2><span class="sub">Classement par taux pondéré</span></div></div>
    ${top.length ? `<div class="rank">${shown.map((x, i) => `<div class="rank-item"><span class="rank-n">${i + 1}</span>${tile(x.h, 'sm')}<div style="min-width:0"><div class="name">${esc(x.h.name)}</div><div class="bar"><i style="--v:${Math.round(x.rate * 100)}"></i></div><div class="meta">${x.done} complète${x.done > 1 ? 's' : ''}${x.partial ? ` + ${x.partial} mini` : ''} sur ${x.scheduled}${(x.streak.unit === 'week' ? x.streak.weeks.current : x.streak.current) ? ` · série ${streakText(x.streak)}` : ''}</div></div><div class="rank-v"><b>${P(Math.round(x.rate * 100))}</b><span>${P(Math.round(x.fullRate * 100))} complet</span></div></div>`).join('')}</div>
      ${top.length > 6 ? `<button type="button" class="link-btn" style="margin-top:14px" data-act="top-all">${ui.stats.allTop ? 'Afficher moins' : `Afficher les ${top.length}`}</button>` : ''}` : '<p class="muted small">Pas encore de données sur cette période.</p>'}
    </section>`;
  /* Séries & records */
  const t = totals();
  const gr = goalRuns();
  const perHabit = activeHabits().map((h) => ({ h, st: habitStreak(h) }));

  /* Trophées */
  const unlocked = ACHIEVEMENTS.filter((a) => state.achievements[a.id]).length;

    <div class="stats-grid">${indicators}${advice}${trend}${weekday}${topCard}${streaks}${milestones}${reviews}${trophies}${history}</div>`;
}

/* ---------- Indicateurs détaillés + horizons 7/30/90/365 ---------- */
function indicatorsCard(range, f) {
  const { a, b, pa, pb } = horizonBounds(range);
  const cur = periodIndicators(a, b, f);
  const prev = periodIndicators(pa, pb, f);
  const rate = (label, key, sub) => `<div class="tile-stat"><div class="k">${label}</div><div class="v">${pctOrDash(cur[key])}</div><div class="d">${trendBadge(trendWord(cur[key], prev[key]))}</div>${sub ? `<div class="d">${sub}</div>` : ''}</div>`;
  const horizons = [7, 30, 90, 365].map((n) => { const hb = horizonBounds(n); return { n, ...periodIndicators(hb.a, hb.b, f) }; });
  return `<section class="card span-2" aria-label="Indicateurs de la période"><div class="card-head"><div class="card-title-group"><h2>${icon('target')}Indicateurs</h2><span class="sub">Du ${esc(F.short(a))} au ${esc(F.short(b))}, comparé aux ${range} jours d’avant (${esc(F.short(pa))} – ${esc(F.short(pb))}).</span></div>

      <div class="table-wrap"><table class="data horizons"><thead><tr><th></th>${horizons.map((x) => `<th class="r">${x.n}${NB}j</th>`).join('')}</tr></thead><tbody>

function heatmap(year) {
  const first = D.key(year, 1, 1);
  const last = D.key(year, 12, 31);
  const start = weekStartKey(first);
  const out = ['<span></span>'];
  weekOrder().forEach((d, i) => out.push(`<span class="hm-wl">${i % 2 === 0 ? WD_SHORT[d] : ''}</span>`));
  for (let w = start; w <= last; w = D.add(w, 7)) {
    let label = '';
    for (let i = 0; i < 7; i++) { const dk = D.add(w, i); if (dk.slice(8) === '01' && +dk.slice(0, 4) === year) { label = F.monthShort(+dk.slice(5, 7)); break; } }
    out.push(`<span class="hm-ml">${label}</span>`);
    for (let i = 0; i < 7; i++) {
      const dk = D.add(w, i);
      if (dk < first || dk > last) { out.push('<span class="hm-c blank"></span>'); continue; }
      if (dk > ui.today) { out.push('<span class="hm-c future"></span>'); continue; }
      const s = dayStats(dk);
      let cls = 'none';
      if (s.scheduled) { const p = s.pct; cls = p === 0 ? 'l0' : p < 0.4 ? 'l1' : p < 0.7 ? 'l2' : p < 1 ? 'l3' : 'l4'; } else if (s.paused) cls = 'pause';
      const tip = `${F.cap(F.dayShort(dk))} : ${s.scheduled ? `${P(Math.round(s.pct * 100))} (${s.done}/${s.scheduled}${s.partial ? `, ${s.partial} mini` : ''})` : s.paused ? 'en pause' : 'rien de prévu'}`;
      out.push(`<button type="button" class="hm-c ${cls} ${dk === ui.today ? 'is-today' : ''}" data-act="day-open" data-k="${dk}" data-tip="${esc(tip)}" aria-label="${esc(tip)}"></button>`);
    }
  }
  return `<div class="hm" style="grid-template-columns:20px">${out.join('')}</div>`;
}
