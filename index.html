/* =====================================================================
   MISES À JOUR — détection d’une nouvelle version, installation,
   préparation d’une demande de mise à jour
   ---------------------------------------------------------------------
   Le service worker (sw.js) garde l’app en cache pour le hors-ligne. À
   chaque ouverture, il compare index.html au fichier publié en ligne :
   s’il a changé, la nouvelle version est mise de côté et l’app propose
   de l’installer. Les données ne sont jamais touchées (stockage séparé).
   ===================================================================== */

const Updates = {
  supported: 'serviceWorker' in navigator && ENV.secure && !ENV.inFrame && !ENV.preview && !ENV.rescue,
  reg: null,
  ready: false,
  readyVersion: null,
  checking: false,
  lastError: null,
  lastAuto: 0,
  async init() {
    if (!this.supported) return;
    try {
      this.reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    } catch (e) {
      this.supported = false;
      this.lastError = e;
      return;
    }
    navigator.serviceWorker.addEventListener('message', (e) => {
      const msg = e.data || {};
      if (msg.type === 'UPDATE_READY') this.markReady(msg.version);
    });
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) this.status_check();
      hadController = true;
    });
    this.status_check();
  },
  ask(type, timeout = 12000) {
    return new Promise((resolve) => {
      const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (!ctrl) { resolve(null); return; }
      const ch = new MessageChannel();
      const timer = setTimeout(() => resolve(null), timeout);
      ch.port1.onmessage = (e) => { clearTimeout(timer); resolve(e.data || null); };
      try { ctrl.postMessage({ type }, [ch.port2]); } catch (e) { clearTimeout(timer); resolve(null); }
    });
  },
  /* Une version a-t-elle été mise en cache après l’ouverture de cette page ? */
  async status_check() {
    const st = await this.ask('STATUS', 5000);
    if (st && st.updatedAt && st.updatedAt > PAGE_START) this.markReady(st.version);
  },
  markReady(version) {
    if (this.ready && this.readyVersion === version) return;
    this.ready = true;
    this.readyVersion = version || null;
    renderBanners();
    renderNav();
    renderTop();
    if (ui.view === 'reglages') renderView();
  },
  async check({ silent = false } = {}) {
    if (!this.supported) {
      if (!silent) toast('Vérification indisponible ici', { msg: ENV.inFrame || ENV.preview ? 'Elle fonctionne dans l’app installée.' : 'Ouvre l’app depuis son adresse https.', ic: 'info' });
      return;
    }
    if (navigator.onLine === false) { if (!silent) toast('Hors connexion', { msg: 'Connecte-toi à Internet pour vérifier les mises à jour.', ic: 'alert', tone: 'bad' }); return; }
    if (this.checking) return;
    this.checking = true;
    if (ui.view === 'reglages') renderView();
    try {
      try { if (this.reg) await this.reg.update(); } catch (e) { /* ignore */ }
      const res = await this.ask('CHECK', 15000);
      state.updates.lastCheck = new Date().toISOString();
      commit();
      if (!res || res.type === 'CHECK_FAILED') {
        if (!silent) toast('Vérification impossible', { msg: 'Le serveur ne répond pas. Réessaie plus tard.', ic: 'alert', tone: 'bad' });
      } else if (res.type === 'UPDATE_READY' || (res.updatedAt && res.updatedAt > PAGE_START)) {
        this.markReady(res.version);
        if (!silent) toast('Nouvelle version disponible', { msg: 'Touche « Installer » pour en profiter.', ic: 'rocket', tone: 'celebrate' });
      } else if (!silent) {
        toast('Tu as la dernière version', { msg: `Cadence ${APP.version}`, ic: 'check', tone: 'good' });
      }
    } finally {
      this.checking = false;
      if (ui.view === 'reglages') renderView();
    }
  },
  async autoCheck() {
    if (!this.supported || !state.settings.autoUpdate) return;
    if (Date.now() - this.lastAuto < 20 * 60 * 1000) return;
    this.lastAuto = Date.now();
    await this.check({ silent: true });
  },
  async install() {
    try { await Backups.create('avant mise à jour'); } catch (e) { /* ignore */ }
    await flush();
    toast('Installation…', { msg: 'Cadence redémarre avec la nouvelle version.', ic: 'rocket', duration: 1500 });
    setTimeout(() => location.reload(), 500);
  },
  status() {
    if (!this.supported) {
      return {
        badge: `<span class="status-badge">${icon('info')}Aperçu</span>`,
        text: ENV.inFrame || ENV.preview
          ? 'Dans cet aperçu, les mises à jour ne s’appliquent pas. Une fois Cadence installée sur ton appareil, elle détectera seule les nouvelles versions publiées.'
          : 'Les mises à jour automatiques nécessitent une adresse sécurisée (https), comme celle fournie par GitHub Pages.',
      };
    }
    if (this.ready) return { badge: `<span class="status-badge new">${icon('rocket')}Nouvelle version prête</span>`, text: 'Elle est déjà téléchargée. L’installation prend une seconde et conserve toutes tes données (une sauvegarde est faite juste avant).' };
    if (this.checking) return { badge: `<span class="status-badge">${icon('refresh', 'spin')}Vérification…</span>`, text: 'Recherche d’une version plus récente sur le serveur.' };
    return { badge: `<span class="status-badge ok">${icon('check')}À jour</span>`, text: 'Quand tu publies une nouvelle version sur GitHub, elle est détectée ici automatiquement, puis installée en un geste.' };
  },
};

function nextVersion(v) {
  const [a, b] = String(v).split('.').map((n) => parseInt(n, 10) || 0);
  return `${a}.${b + 1}.0`;
}
function buildUpdateRequest() {
  const items = state.updates.backlog.filter((i) => !i.done);
  const lines = [
    'Bonjour Claude,',
    '',
    `Voici une demande de mise à jour pour mon application Cadence (PWA de suivi d’habitudes). Version actuelle : ${APP.version}. Nouvelle version souhaitée : ${nextVersion(APP.version)}.`,
    'Je te joins les fichiers de l’app : index.html, sw.js et manifest.webmanifest (les icônes .png ne changent pas).',
    '',
    'Changements souhaités :',
    ...(items.length ? items.map((it, i) => `${i + 1}. ${it.text}`) : ['1. (ajoute tes idées dans Réglages → Préparer une mise à jour)']),
    '',
    'Contraintes :',
    `- Conserver toutes mes données existantes (base IndexedDB « cadence », schéma ${APP.schema}). Si le format des données change, ajouter une migration dans MIGRATIONS, incrémenter APP.schema, et étendre Migration.dryRun pour vérifier la conversion sur une copie.`,
    '- Ne jamais réécrire le passé : tout changement de calcul passe par dayState() et par les réglages datés (h.history).',
    `- Passer APP.version à ${nextVersion(APP.version)} et ajouter une entrée en tête de CHANGELOG dans index.html.`,
    `- Mettre SW_VERSION à ${nextVersion(APP.version)} dans sw.js.`,
    '- Garder le style actuel (mode sombre, couleur principale personnalisable), l’interface en français, et le fonctionnement 100 % local.',
    '- Me renvoyer les fichiers complets à remplacer dans mon dépôt GitHub.',
  ];
  return lines.join('\n');
}

/* =====================================================================
   ACTIONS — validations, célébrations, navigation, démarrage
   ===================================================================== */

/* État du démarrage : conversion de données éventuelle, avertissement à afficher. */
const Boot = { migrated: null, warning: null };

/* Pose ou retire une marque dans completions/partials. */
function setMark(map, k, id, on) {
  if (on) { (state[map][k] || (state[map][k] = {}))[id] = new Date().toISOString(); return; }
  const day = state[map][k];
  if (!day) return;
  delete day[id];
  if (!Object.keys(day).length) delete state[map][k];
}
/* Un double appui (ou un appui qui rebondit) ne doit pas valider puis dévalider. */
const Guard = {
  last: new Map(),
  /* performance.now() : insensible aux changements d’heure de l’appareil. */
  ok(key, ms = 450) { const now = performance.now(); const t = this.last.has(key) ? this.last.get(key) : -Infinity; this.last.set(key, now); return now - t > ms; },
};
function dayGuard(h, k) {
  if (k > ui.today) { toast('Ce jour n’est pas encore arrivé', { ic: 'calendar' }); return false; }
  if (!inLife(h, k)) { toast('Jour hors de la période', { msg: 'Change la date de début de l’habitude pour remplir les jours précédents.', ic: 'info' }); return false; }
  return true;
}
function pauseNotice(h, k) {
  if (pauseAt(h, k) && !(state.completions[k] || {})[h.id]) toast('Jour en pause', { msg: 'Cette validation compte en bonus, sans rien changer à la pause.', ic: 'pause' });
}

function toggleHabit(id, k = ui.today) {
  const h = habitById(id);
  if (!h || !dayGuard(h, k)) return;
  const was = isDone(h, k);
  if (!was) pauseNotice(h, k);
  Undo.push(was ? `décochage de « ${h.name} »` : `validation de « ${h.name} »`);
  setMark('completions', k, id, !was);
  if (!was) setMark('partials', k, id, false); // une journée complète remplace la mini-version
  commit();
  if (!was) ui.pop = { id, k };
  refreshAll();
  if (!was) celebrate(h, k);
}

/* Mini-version : maintient la série les jours difficiles. */
function toggleMin(id, k = ui.today) {
  const h = habitById(id);
  if (!h || !dayGuard(h, k)) return;
  const label = configAt(h, k).minLabel;
  if (!label) { openMiniEditor(id); return; }
  const was = isPartial(h, k);
  Undo.push(`mini-version de « ${h.name} »`);
  setMark('partials', k, id, !was);
  if (!was) setMark('completions', k, id, false);
  commit();
  if (!was) ui.pop = { id, k };
  refreshAll();
  if (!was) {
    const st = habitStreak(h);
    toast('Mini-version validée', { msg: `${label}${st.unit === 'day' && st.current > 1 ? ` · série de ${st.current} jours maintenue` : ''}`, ic: 'half', action: { label: 'Annuler', fn: undoLast } });
    const fresh = [...evaluateAchievements(), ...evaluateMilestones()];
    fresh.forEach((a, i) => setTimeout(() => toast(a.def ? `Jalon : ${a.name}` : `Trophée : ${a.name}`, { msg: a.def ? (a.h ? a.h.name : a.desc) : a.desc, ic: a.icon, tone: 'celebrate' }), 700 + i * 600));
    commit();
  }
}

/* Dans la matrice, les appuis successifs font le tour des états possibles. */
function cycleCell(id, k) {
  const h = habitById(id);
  if (!h || !dayGuard(h, k)) return;
  if (!configAt(h, k).minLabel) { toggleHabit(id, k); return; }
  if (isDone(h, k)) toggleMin(id, k);
  else if (isPartial(h, k)) toggleMin(id, k);
  else toggleHabit(id, k);
}

/* ---------- Annuler ---------- */
function undoLast() {
  const label = Undo.pop();
  if (!label) { toast('Rien à annuler', { ic: 'info' }); return; }
  Stats.reset();
  state.habits.forEach((h) => syncMirror(h, ui.today));
  commit();
  refreshAll();
  toast('Annulé', { msg: F.cap(label), ic: 'undo' });
}

function toggleTask(id, k = ui.today) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  const was = taskDoneOn(t, k);
  if (t.recurrence) {
    if (k > ui.today) { toast('Cette occurrence n’est pas encore arrivée', { ic: 'calendar' }); return; }
    Undo.push(`${was ? 'décochage' : 'validation'} de « ${t.title} »`);
    t.doneDates = t.doneDates || {};
    if (was) delete t.doneDates[k]; else t.doneDates[k] = new Date().toISOString();
  } else {
    Undo.push(`${was ? 'décochage' : 'validation'} de « ${t.title} »`);
    t.done = !was;
    t.doneAt = t.done ? new Date().toISOString() : null;
  }
  t.updatedAt = new Date().toISOString();
  commit();
  if (!was) ui.pop = { id, k: null };
  refreshAll();
  if (was) return;
  const events = [];
  const today = tasksForDay(ui.today);
  if (k === ui.today && today.length >= 2 && today.every((x) => taskDoneOn(x, ui.today)) && !state.celebrated[`${ui.today}:tasks`]) {
    state.celebrated[`${ui.today}:tasks`] = 1;
    events.push({ title: 'Checklist terminée', msg: 'Toutes les tâches du jour sont faites.', ic: 'tasks' });
  }
  evaluateAchievements().forEach((a) => events.push({ title: `Trophée : ${a.name}`, msg: a.desc, ic: a.icon, big: true }));
  if (events.length) { commit(); showEvents(events); }
}

/* Récompenses visuelles : objectif du jour, journée parfaite, paliers de série, semaine
   tenue, records, trophées et jalons. Jamais de reproche. */
function celebrate(h, k) {
  const events = [];
  const mark = (key) => { if (state.celebrated[key]) return false; state.celebrated[key] = 1; return true; };
  if (k === ui.today) {
    const s = dayStats(k);
    if (s.scheduled && s.done === s.scheduled && mark(`${k}:perfect`)) events.push({ title: 'Journée parfaite !', msg: `${s.done} habitude${s.done > 1 ? 's' : ''} sur ${s.scheduled}. Bravo pour ta constance.`, ic: 'star', big: true });
    else if (s.scheduled && s.done < s.scheduled && metGoal(s) && mark(`${k}:goal`)) events.push({ title: 'Objectif du jour atteint', msg: `${P(Math.round(s.pct * 100))} de ta journée est déjà faite.`, ic: 'target' });
  }
  if (isWeekly(h, k)) {
    const ws = weekStartKey(k);
    const w = weekStates(h, ws);
    if (w.req && w.met && mark(`${h.id}:week:${ws}`)) events.push({ title: 'Semaine tenue', msg: `${h.name} · ${w.req} fois cette semaine`, ic: 'calendar', big: habitStreak(h).weeks.current >= 4 });
  } else if (isScheduled(h, k)) {
    const n = habitStreak(h).current;
    const goal = configAt(h, k).streakGoal;
    if (n >= 3 && n === goal && mark(`${h.id}:goal${n}:${k}`)) events.push({ title: `Objectif de série atteint : ${n} jours`, msg: h.name, ic: 'trophy', big: true });
    else if (MILESTONES.includes(n) && mark(`${h.id}:s${n}:${k}`)) events.push({ title: `${n} jours de suite`, msg: h.name, ic: 'flame', big: n >= 7 });
    const rec = state.records.bestStreak;
    if (n > (rec.value || 0)) {
      const prev = rec.value || 0;
      state.records.bestStreak = { value: n, habit: h.name, date: k };
      if (prev >= 3 && mark(`${k}:record`)) events.push({ title: 'Nouveau record personnel', msg: `${n} jours de suite sur « ${h.name} ».`, ic: 'trophy', big: true });
    }
  }
  evaluateAchievements().forEach((a) => events.push({ title: `Trophée : ${a.name}`, msg: a.desc, ic: a.icon, big: true }));
  evaluateMilestones().forEach((m) => events.push({ title: `Jalon : ${m.name}`, msg: m.h ? m.h.name : m.desc, ic: m.icon, big: m.def !== 'comeback' }));
  commit();
  if (events.length) showEvents(events);
}
function showEvents(events) {
  if (!state.settings.celebrations) return;
  const big = events.some((e) => e.big);
  events.slice(0, 2).forEach((e, i) => setTimeout(() => toast(e.title, { msg: e.msg, ic: e.ic, tone: 'celebrate', duration: 3400 }), i * 650));
  if (big) confetti(events.length > 1 ? 1.3 : 1);
  if (ui.view === 'stats') renderView();
}

/* ---------- Navigation ---------- */
function go(view) {
  if (!VIEWS[view]) view = 'today';
  if (view !== ui.view) { ui.prevView = ui.view; ui.view = view; }
  if (!SUBVIEWS.includes(view)) lsSet('cadence:ui:view', view);
  Sheet.closeAll();
  window.scrollTo(0, 0);
  Stats.reset();
  ui.today = todayKey();
  document.body.dataset.view = ui.view;
  renderNav(); renderTop(); renderBanners();
  renderView(true);
  if (view === 'recherche') setTimeout(() => { const i = $('#search-input'); if (i && ENV.hover) i.focus(); }, 120);
}
function shiftMonth(o, delta) {
  o.m += delta;
  if (o.m < 1) { o.m = 12; o.y -= 1; }
  if (o.m > 12) { o.m = 1; o.y += 1; }
  renderView();
}
function toCurrentMonth(o) { const [y, m] = D.parse(ui.today); o.y = y; o.m = m; renderView(); }
function shiftMatrix(delta) {
  const mx = ui.matrix;
  if (mx.mode === 'quarter') { mx.q += delta; if (mx.q < 1) { mx.q = 4; mx.yy -= 1; } if (mx.q > 4) { mx.q = 1; mx.yy += 1; } renderView(); return; }
  if (mx.mode === 'year') { mx.yy += delta; renderView(); return; }
  shiftMonth(mx, delta);
}
function matrixToday() { const [y, m] = D.parse(ui.today); Object.assign(ui.matrix, { y, m, yy: y, q: Math.ceil(m / 3) }); renderView(); }
function shiftReportMonth(delta) {
  const o = ui.month;
  const [ty, tm] = D.parse(ui.today);
  let { y, m } = o;
  m += delta; if (m < 1) { m = 12; y -= 1; } if (m > 12) { m = 1; y += 1; }
  if (y > ty || (y === ty && m > tm)) return;
  o.y = y; o.m = m;
  Recent.add({ type: 'month', y, m });
  renderView();
}
function openMonth(y, m) {
  const [ty, tm] = D.parse(ui.today);
  ui.month = { y: y || ty, m: m || tm };
  Recent.add({ type: 'month', y: ui.month.y, m: ui.month.m });
  go('mois');
}

function moveHabit(id, dir) {
  const list = activeHabits();
  const i = list.findIndex((h) => h.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((h, idx) => { h.order = idx; });
  commit();
  renderView();
  const again = $(`[data-act="${dir < 0 ? 'habit-up' : 'habit-down'}"][data-id="${id}"]`);
  if (again && !again.disabled) again.focus();
}

function addQuickTask(form, date, priority) {
  const input = form.querySelector('input[name="title"]');
  const title = input.value.trim();
  if (!title) { input.focus(); return; }
  Undo.push(`ajout de « ${title.slice(0, 40)} »`);
  state.tasks.push(newTask({ title: title.slice(0, 140), date, priority }));
  commit();
  const id = input.id;
  refreshAll();
  const again = document.getElementById(id);
  if (again) again.focus();
  if (date !== ui.today) toast('Tâche planifiée', { msg: `${F.dayRel(date, ui.today)} · ${title}`, ic: 'calendar' });
}

async function restoreBackup(id, confirmed = false) {
  const meta = (await Backups.list()).find((b) => b.id === id);
  if (!meta) return;
  if (!confirmed) {
    const ok = await ask({ title: 'Restaurer cette sauvegarde ?', message: `Sauvegarde du ${esc(F.rel(meta.at))} : ${meta.habits} habitudes, ${meta.checks} validations. Tes données actuelles seront remplacées (elles sont sauvegardées juste avant). Tu peux d’abord regarder son contenu avec « Aperçu ».`, buttons: [{ label: 'Restaurer', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
    if (!ok) return;
  }
  const snap = await Backups.read(id);
  if (!snap) { toast('Sauvegarde introuvable', { ic: 'alert', tone: 'bad' }); return; }
  let next;
  try { next = migrate(deepCopy(snap)); } catch (e) { toast('Sauvegarde illisible', { msg: e.message, ic: 'alert', tone: 'bad' }); return; }
  await Backups.create('avant restauration');
  adoptState(next);
  await flush();
  Sheet.closeAll();
  refreshAll();
  toast('Sauvegarde restaurée', { msg: 'Tes données d’avant sont dans les sauvegardes internes.', ic: 'restore', tone: 'good' });
}
async function resetAll() {
  const ok = await ask({ title: 'Effacer toutes les données ?', message: 'Habitudes, validations, tâches, journal, notes et réglages seront supprimés de cet appareil. Une sauvegarde automatique est créée juste avant.', buttons: [{ label: 'Tout effacer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;

  await flush();
  go('today');

}
async function clearDemo() {
  const ok = await ask({ title: 'Quitter le mode démo ?', message: 'Les données d’exemple seront effacées pour que tu partes sur tes propres habitudes.', buttons: [{ label: 'Effacer la démo', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });

/* Les actions qui cochent quelque chose sont protégées contre le double appui. */
const GUARDED = new Set(['toggle-habit', 'toggle-min', 'cell', 'toggle-task', 'task-postpone', 'ins-apply', 'step-accept']);

const FORMS = {
  'plan-task': (f) => addQuickTask(f, ui.today, 'medium'),
  'task-quick': (f) => addQuickTask(f, quickTask.when === 'tomorrow' ? D.add(ui.today, 1) : ui.today, quickTask.priority),
  backlog: (f) => {
    const input = f.querySelector('input[name="text"]');
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    state.updates.backlog.push({ id: uid(), text: v.slice(0, 400), done: false, createdAt: new Date().toISOString() });
    commit();
    renderView();
    const again = $('#backlog-input'); if (again) again.focus();
  },
  search: (f) => {
    const input = f.querySelector('input[name="q"]');
    ui.search = input.value;
    renderView();
    const again = $('#search-input');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  },
};

function bindEvents() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    const fn = ACTIONS[act];
    if (!fn) return;
    e.preventDefault();
    FloatTip.hide();
    if (GUARDED.has(act) && !Guard.ok(`${act}:${b.dataset.id || b.dataset.iid || ''}:${b.dataset.k || ''}`)) return;
    try { fn(b, e); } catch (err) { console.error(err); toast('Action impossible', { msg: err && err.message ? err.message : String(err), ic: 'alert', tone: 'bad' }); }
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const fn = FORMS[f.dataset.form];
    if (fn) fn(f);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if ((t.id === 'mx-month' || t.id === 'st-month' || t.id === 'mo-month') && /^\d{4}-\d{2}$/.test(t.value)) {
      const [y, m] = t.value.split('-').map(Number);
      if (t.id === 'mo-month') { const [ty, tm] = D.parse(ui.today); if (y > ty || (y === ty && m > tm)) return; ui.month = { y, m }; } else { const o = t.id === 'mx-month' ? ui.matrix : ui.stats; o.y = y; o.m = m; }
      renderView();
      return;
    }
    if (t.matches && t.matches('[data-flt-scope]')) { scopeFilter(t.dataset.fltScope)[t.dataset.fltK] = t.value; renderView(); return; }
    if (t.matches && t.matches('[data-search-opt]')) { ui.searchOpts[t.dataset.searchOpt] = t.value; renderView(); return; }
    if (t.id === 'goto-date') { ui.gotoDate = t.value; return; }
    if (t.matches && t.matches('[data-set]')) {
      const key = t.dataset.set;
      const before = todayKey();
      if (key === 'autoUpdate') state.settings.autoUpdate = t.checked;
      if (key === 'assistant') state.settings.assistant = t.checked;
      if (key === 'dayStartHour') state.settings.dayStartHour = clamp(+t.value || 0, 0, 5);
      if (key === 'timeZone') state.settings.timeZone = t.value || 'auto';
      const after = todayKey();
      /* Si « aujourd’hui » recule d’un jour, les habitudes créées aujourd’hui restent visibles. */
      if (after < before) state.habits.forEach((h) => { if (h.startDate === before) { h.startDate = after; ensureHistory(h); } });
      commit();
      render();
    }
  });
  /* Recherche au fil de la frappe : on ne redessine qu’une fois la frappe calmée. */
  const searchSoon = debounce(() => {
    const input = $('#search-input');
    if (!input || ui.view !== 'recherche') return;
    const caret = input.selectionStart;
    ui.search = input.value;
    renderView();
    const again = $('#search-input');
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (err) { /* ignore */ } }
  }, 260);
  document.addEventListener('input', (e) => { if (e.target && e.target.id === 'search-input') searchSoon(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && Sheet.top()) { e.preventDefault(); Sheet.close(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const el = document.activeElement;
    if (el && (/INPUT|TEXTAREA|SELECT/.test(el.tagName) || el.isContentEditable)) return;
    if (Sheet.top() && e.key !== '?') return;
    const key = e.key;
    const navKeys = { 1: 'today', 2: 'taches', 3: 'matrice', 4: 'stats', 5: 'habitudes' };
    if (navKeys[key]) { e.preventDefault(); go(navKeys[key]); return; }
    if (key === '/') { e.preventDefault(); go('recherche'); return; }
    if (key === '?') { e.preventDefault(); openShortcuts(); return; }
    const k = key.toLowerCase();
    if (k === 'n') { e.preventDefault(); if (ui.view === 'taches') openTaskEditor(); else if (ui.view === 'habitudes') openHabitEditor(); else openQuickAdd(); return; }
    if (k === 'j') { e.preventDefault(); openJournal(ui.today); return; }
    if (k === 'p') { e.preventDefault(); openCustomize(); return; }
    if (k === 'z') { e.preventDefault(); undoLast(); return; }
    if (k === 'b') { e.preventDefault(); openMonth(); return; }
    if (k === 'd') { e.preventDefault(); go('donnees'); return; }
    if (key === 'ArrowLeft' || key === 'ArrowRight') {
      const d = key === 'ArrowLeft' ? -1 : 1;
      if (ui.view === 'matrice') { e.preventDefault(); shiftMatrix(d); } else if (ui.view === 'stats') { e.preventDefault(); shiftMonth(ui.stats, d); } else if (ui.view === 'mois') { e.preventDefault(); shiftReportMonth(d); }
    }
  });
  if (ENV.hover) {
    document.addEventListener('pointerover', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el && e.pointerType === 'mouse') FloatTip.show(el, `<span style="color:var(--ink-1);font-weight:600">${esc(el.dataset.tip)}</span>`);
    });
    document.addEventListener('pointerout', (e) => { if (e.target.closest && e.target.closest('[data-tip]')) FloatTip.hide(); });
  }
  const topbar = $('#topbar');
  const onScroll = () => { topbar.classList.toggle('scrolled', window.scrollY > 24); FloatTip.hide(); };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  window.addEventListener('resize', debounce(() => { if (ui.view === 'stats') mountCharts($('#view')); }, 200));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flush(); return; }
    tick();
    Updates.autoCheck();
  });
  window.addEventListener('pagehide', () => { flush(); });
}

/* Au changement de jour : les réglages programmés entrent en vigueur, les invitations
   expirées disparaissent, une sauvegarde quotidienne est faite. */
function tick() {
  const k = todayKey();
  if (k !== ui.today) {
    state.habits.forEach((h) => syncMirror(h, k));
    pruneSnoozes();
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing) { render(); Sheet.stack.forEach((e) => { if (e.refresh) e.refresh(); }); }
    Backups.daily();
  }
}

function pruneCelebrated() {
  const limit = D.add(todayKey(), -90);
  for (const key of Object.keys(state.celebrated)) {
    const m = key.match(/\d{4}-\d{2}-\d{2}/);
    if (!m || m[0] < limit) delete state.celebrated[key];
  }
}
/* Les mises en pause d’alertes expirées ne servent plus à rien. */
function pruneSnoozes() {
  const today = todayKey();
  for (const key of Object.keys(state.snoozes)) if (String(state.snoozes[key]) <= today) delete state.snoozes[key];
  for (const id of Object.keys(state.insights)) { const x = state.insights[id]; if (x && x.until && x.until <= today && x.status !== 'useful') delete state.insights[id]; }
}

/* ---------- Écrans de secours ----------
   Ils fonctionnent sans le reste de l’interface : ni panneaux ni actions globales. */
function rescueCard(title, text, buttons) {
  const view = document.getElementById('view');
  if (!view) return null;
  view.innerHTML = `<section class="card rescue"><div class="alert-head">${icon('shield')}<div><b>${esc(title)}</b><span>${text}</span></div></div>
    <div class="btn-row" style="margin-top:14px">${buttons.map((b, i) => (b.href ? `<a class="btn ${b.primary ? 'primary' : ''}" href="${b.href}">${esc(b.label)}</a>` : `<button type="button" class="btn ${b.primary ? 'primary' : ''}" data-rescue="${i}">${esc(b.label)}</button>`)).join('')}</div>
    <p class="small muted" id="rescue-msg" style="margin-top:12px"></p></section>`;
  view.querySelectorAll('[data-rescue]').forEach((el) => el.addEventListener('click', () => buttons[+el.dataset.rescue].fn(el)));
  return view;
}
async function rescueExport(raw) {
  const text = JSON.stringify({ app: 'Cadence', format: 2, version: APP.version, schema: (raw && raw.schema) || null, exportedAt: new Date().toISOString(), rescue: true, state: raw }, null, 2);
  const res = await saveFile(text, stampName('cadence-secours', 'json'), 'application/json', { shareTitle: 'Cadence — données de secours' });
  const msg = document.getElementById('rescue-msg');
  if (msg) msg.textContent = res === 'shared' || res === 'downloaded' ? 'Fichier de secours enregistré : garde-le précieusement.' : 'Copie le texte ci-dessous et garde-le dans Notes.';
  if (!res || res === 'cancelled') { const ta = document.createElement('textarea'); ta.className = 'input code'; ta.readOnly = true; ta.value = text; ta.style.marginTop = '10px'; if (msg) msg.after(ta); }
}
function showMigrationRescue(raw, trial) {
  const rows = (trial.checks || []).map((c) => `${c.ok ? '✓' : '✗'} ${esc(c.label)} : ${c.a} → ${c.b}`).join('<br>');
  rescueCard('La conversion de tes données a été arrêtée',
    `Avant d’appliquer la version ${APP.version}, Cadence a testé la conversion sur une copie, et un compteur ne correspondait pas. <b>Rien n’a été modifié : tes données sont intactes.</b><br><br>${esc(trial.error || '')}${rows ? `<br><br>${rows}` : ''}`,
    [
      { label: 'Exporter mes données', primary: true, fn: () => rescueExport(raw) },
      ...(Updates.supported && !ENV.rescue ? [{ label: 'Ouvrir la version précédente', href: './precedente.html' }] : []),
      { label: 'Réessayer', fn: () => location.reload() },
    ]);
}
function showFatal(err) {
  console.error(err);
  rescueCard('Cadence n’a pas pu démarrer',
    `${esc(err && err.message ? err.message : String(err))}. Tes données enregistrées ne sont pas effacées. Tu peux les exporter, revenir à la version précédente, ou restaurer la dernière sauvegarde interne.`,
    [
      { label: 'Exporter mes données', primary: true, fn: async () => { let raw = state; try { if (!raw) raw = await loadRaw(); } catch (e) { /* ignore */ } rescueExport(raw); } },
      ...(Updates.supported && !ENV.rescue ? [{ label: 'Version précédente', href: './precedente.html' }] : []),
      {
        label: 'Restaurer la dernière sauvegarde',
        fn: async (btn) => {
          try {
            const list = await Backups.list();
            if (!list.length) { btn.textContent = 'Aucune sauvegarde'; return; }
            const snap = await Backups.read(list[0].id);
            if (!snap) { btn.textContent = 'Sauvegarde illisible'; return; }
            await Store.set('state', snap);
            lsDel('cadence:mirror');
            location.reload();
          } catch (e) { btn.textContent = 'Échec'; }
        },
      },
      { label: 'Recharger', fn: () => location.reload() },
    ]);
}

async function init() {
  await Store.init();
  let raw = null;
  try { raw = await loadRaw(); } catch (e) { raw = null; }
  if (raw) {
    const from = Number(raw.schema) || 1;
    if (from < APP.schema) {
      /* 1. conversion d’une copie et contrôle des compteurs ; 2. sauvegarde de l’original,
         relue ; 3. seulement alors, adoption des données converties. */
      const trial = Migration.dryRun(raw);
      if (!trial.ok) { showMigrationRescue(raw, trial); return; }
      let backupOk = false;
      try { const id = await Backups.create('avant migration', raw); backupOk = await Backups.verify(id, raw); } catch (e) { backupOk = false; }
      state = trial.state;
      state.meta.migrations = [...(Array.isArray(state.meta.migrations) ? state.meta.migrations : []), { from, to: APP.schema, at: new Date().toISOString(), version: APP.version, backup: backupOk }].slice(-10);
      Boot.migrated = { from, to: APP.schema, checks: trial.checks.filter((c) => ['Habitudes', 'Validations complètes', 'Mini-versions', 'Tâches'].includes(c.label)), backup: backupOk };
      if (!backupOk) Boot.warning = { title: 'Sauvegarde de sécurité non vérifiée', text: 'Tes données ont été converties et contrôlées, mais la sauvegarde d’avant la conversion n’a pas pu être relue. Exporte un fichier maintenant, par précaution.' };
    } else {
      state = migrate(raw) || defaultState();
    }
  } else {
    state = ENV.preview ? buildDemo() : defaultState();
  }
  ui.today = todayKey();
  const [y, m] = D.parse(ui.today);
  Object.assign(ui.matrix, { y, m, yy: y, q: Math.ceil(m / 3) });
  Object.assign(ui.stats, { y, m, year: y });
  ui.month = { y, m };
  ui.year = y;
  state.habits.forEach((h) => syncMirror(h, ui.today));
  const lastView = lsGet('cadence:ui:view');
  if (lastView && VIEWS[lastView] && !SUBVIEWS.includes(lastView)) ui.view = lastView;
  pruneCelebrated();
  pruneSnoozes();
  evaluateAchievements();
  evaluateMilestones(); // jalons déjà franchis : enregistrés sans notification
  applyTheme();
  watchSystemTheme();
  bindEvents();
  render();
  const lastSeen = state.meta.lastSeenVersion;
  if (!state.profile.onboarded && !ENV.preview) openOnboarding();
  else if (lastSeen && lastSeen !== APP.version && !ENV.rescue) openWhatsNew(lastSeen);
  /* En copie de secours : la version vue reste celle de l’app actuelle, et on ne cherche
     pas de mise à jour (la version actuelle est déjà en ligne). */
  if (!ENV.rescue) state.meta.lastSeenVersion = APP.version;
  commit();
  Backups.daily();
  if (ENV.standalone) Store.requestPersist();
  if (!ENV.rescue) Updates.init().then(() => setTimeout(() => Updates.autoCheck(), 2500));
  setInterval(tick, 30000);
}

/* Point d’accès pour les tests automatisés uniquement (jamais activé dans l’app). */
if (window.CADENCE_TEST) window.__ce = (src) => eval(src); // eslint-disable-line no-eval

init().catch((e) => { showFatal(e); });

})();
</script>
