function anyEarlyCheck() {
  for (const k in state.completions) {
    const day = state.completions[k];
    for (const id in day) { const h = zoned(new Date(day[id])).h; if (h >= 3 && h < 7) return true; }
  }
  return false;
}
function anyMonthGoal() {
  const first = earliestStart();
  if (!first) return false;
  let [y, m] = D.parse(first);
  const [ty, tm] = D.parse(ui.today);
  while (y < ty || (y === ty && m < tm)) {
    const [a, b] = monthBounds(y, m);
    const r = rangeStats(a, b);
    if (r.scheduled >= 20 && r.rate * 100 >= state.goals.monthly) return true;
    m += 1; if (m > 12) { m = 1; y += 1; }
  }
  return false;
}
/* Renvoie la liste des trophées débloqués à l’instant. */
function evaluateAchievements() {
  const c = totals();
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    if (state.achievements[a.id]) continue;
    let ok = false;
    try { ok = a.test(c); } catch (e) { ok = false; }
    if (ok) { state.achievements[a.id] = new Date().toISOString(); fresh.push(a); }
  }
  /* Trophées désactivés : ils restent enregistrés en silence, sans notification. */
  if (state.settings.badges === false) fresh.length = 0;
  const gr = goalRuns();
  if (gr.best > (state.records.bestGoalRun.value || 0)) state.records.bestGoalRun = { value: gr.best, date: gr.bestEnd };
  return fresh;
}

/* ---------- Messages ---------- */
function greeting() {
  const h = zoned().h;
  if (h >= 5 && h < 12) return 'Bonjour';
  if (h >= 12 && h < 18) return 'Bon après-midi';
  if (h >= 18 && h < 23) return 'Bonsoir';
  return 'Bonne nuit';
}
const MOTTOS = {
  none: ['Aucune habitude prévue aujourd’hui. Profite de cette journée pour souffler.'],
  zero: ['Une habitude à la fois. Commence par la plus simple.', 'La régularité compte plus que l’intensité.', 'Petit pas aujourd’hui, grand écart dans un mois.', 'Cocher la première case lance toute la journée.'],
  low: ['Bon départ. Garde le rythme.', 'Chaque case cochée compte.', 'Tu as lancé la machine, continue.'],
  mid: ['Plus de la moitié : tiens bon jusqu’au bout.', 'Tu y es presque, encore un effort.', 'Belle dynamique aujourd’hui.'],
  goal: ['Objectif du jour atteint. Le reste, c’est du bonus.', 'Objectif atteint. Termine en beauté ?'],
  full: ['Journée parfaite. Savoure-la.', 'Tout est coché. Bravo pour ta constance.', '100 % aujourd’hui. Ton futur toi te remercie.'],
};
function mottoFor(s) {
  let bucket = 'none';
  if (s.scheduled) {
    const p = (s.done / s.scheduled) * 100;
    if (s.done === 0) bucket = 'zero';
    else if (p >= 100) bucket = 'full';
    else if (p >= state.goals.daily) bucket = 'goal';
    else if (p >= 50) bucket = 'mid';
    else bucket = 'low';
  }
  const list = MOTTOS[bucket];
  return list[hashStr(s.k + bucket) % list.length];
}

/* =====================================================================
   ANALYSES — assistant local, meilleurs moments, avant/après, jalons,
   bilan du mois, chronologie, recherche, charge du jour
   ---------------------------------------------------------------------
   Tout est calculé sur l’appareil, par des règles fixes et vérifiables.
   Chaque constat garde les chiffres qui le justifient (période, nombre
   d’occurrences, évolution) pour pouvoir les afficher tels quels.
   ===================================================================== */

const median = (arr) => {
  if (!arr.length) return null;
  const s = [...arr].sort((x, y) => x - y);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
};
const minutesToHM = (mins) => { const m = ((Math.round(mins) % 1440) + 1440) % 1440; return `${D.pad(Math.floor(m / 60))}:${D.pad(m % 60)}`; };
const SMALL_SAMPLE = 8; // en dessous : « tendance indicative »

/* ---------- Meilleurs moments d’une habitude ----------
   Jours de la semaine : part des jours prévus réellement tenus.
   Heures : seules les validations saisies le jour même sont retenues (une case
   rattrapée le lendemain ne dit rien de l’heure réelle). */
const TIME_BUCKETS = [
  { id: 'matin', name: 'Matin', test: (m) => m >= 300 && m < 720 },
  { id: 'aprem', name: 'Après-midi', test: (m) => m >= 720 && m < 1080 },
  { id: 'soir', name: 'Soir', test: (m) => m >= 1080 && m < 1320 },
  { id: 'nuit', name: 'Nuit', test: () => true },
];
function bestMoments(h, span = 84) {
  return Stats.memo('bm:' + h.id + ':' + span, () => {
    const today = ui.today;
    const a = D.max(h.startDate, D.add(today, -(span - 1)));
    const end = h.archivedAt ? D.min(D.add(h.archivedAt, -1), today) : today;
    const wd = Array.from({ length: 7 }, () => ({ expected: 0, counted: 0, validations: 0 }));
    const times = []; const delays = []; let validations = 0; let later = 0;
    for (let k = a; k <= end; k = D.add(k, 1)) {
      const st = dayState(h, k);
      const d = D.dow(k);
      if (st === 'done' || st === 'part') { wd[d].expected++; wd[d].counted++; } else if (st === 'miss') wd[d].expected++;
      const ts = (state.completions[k] || {})[h.id] || (state.partials[k] || {})[h.id];
      if (!ts) continue;
      wd[d].validations++; validations++;
      if (dayKeyOf(ts) !== k) { later++; continue; }
      const z = zoned(new Date(ts));
      const mins = z.h * 60 + z.min;
      times.push(mins);
      const plan = configAt(h, k).time;
      if (plan) {
        const [ph, pm] = plan.split(':').map(Number);
        let dl = mins - (ph * 60 + pm);
        if (dl < -720) dl += 1440; else if (dl > 720) dl -= 1440;
        delays.push(dl);
      }
    }
    const days = weekOrder().map((d) => ({ dow: d, ...wd[d], rate: wd[d].expected ? wd[d].counted / wd[d].expected : null, share: validations ? wd[d].validations / validations : null, small: wd[d].expected < 4 }));
    const buckets = TIME_BUCKETS.map((b) => ({ ...b, n: 0 }));
    times.forEach((m) => { buckets.find((b) => b.test(m)).n++; });
    return {
      a, b: end, span: D.diff(a, end) + 1, weekly: isWeekly(h), days, validations, later,
      samples: times.length, medianTime: times.length ? minutesToHM(median(times)) : null,
      delays: delays.length, medianDelay: median(delays), buckets, indicative: times.length < SMALL_SAMPLE,
    };
  });
}

/* ---------- Historique des réglages : changements et comparaison avant/après ---------- */
function describeChange(a, b) {
  const parts = [];

function milestoneList(a = null, b = null) {
  const out = [];
  for (const id in state.milestones) {
    const [def, hid] = id.split(':');
    const d = MILESTONE_DEFS[def];
    if (!d) continue;
    const m = state.milestones[id];
    const k = (m && m.k) || (typeof m === 'string' ? keyOfISO(m) : null);
    if (!k || (a && k < a) || (b && k > b)) continue;
    out.push({ id, def, k, h: habitById(hid), ...d });
  }
  return out.sort((x, y) => y.k.localeCompare(x.k));
}

/* ---------- Chronologie des changements importants ---------- */
function timeline(a, b) {
  const ev = [];
  const inR = (k) => k && k >= a && k <= b;
  for (const h of state.habits) {
    if (inR(h.startDate)) ev.push({ k: h.startDate, type: 'start', icon: 'plus', habitId: h.id, text: `Début de « ${h.name} »` });
    if (inR(h.archivedAt)) ev.push({ k: h.archivedAt, type: 'archive', icon: 'archive', habitId: h.id, text: `« ${h.name} » archivée` });
    for (const ch of configChanges(h)) if (inR(ch.from)) ev.push({ k: ch.from, type: 'change', icon: 'history', habitId: h.id, text: `« ${h.name} » : ${ch.what}`, note: [ch.next.reason, ch.next.note].filter(Boolean).join(' — ') });
    const phases = [...(h.phaseLog || []), ...(h.phase ? [h.phase] : [])];
    for (const p of phases) if (inR(p.from)) ev.push({ k: p.from, type: 'phase', icon: PHASES[p.kind].icon, habitId: h.id, text: `${PHASES[p.kind].name} de « ${h.name} » (${D.diff(p.from, p.to) + 1}${NB}jours)${p.decision ? ` · ${p.decision}` : ''}` });
  }
  for (const p of state.pauses) {
    if (!inR(p.from)) continue;
    const who = p.all ? 'toutes les habitudes' : p.habits.map((id) => (habitById(id) || {}).name).filter(Boolean).map((n) => `« ${n} »`).join(', ');
    ev.push({ k: p.from, type: 'pause', icon: 'pause', text: `Pause (${PAUSE_REASON[p.reason].name.toLowerCase()}) : ${who}, ${p.to ? `jusqu’au ${F.short(p.to)}` : 'sans date de fin'}`, note: p.note });
  }
  for (const ws of Object.keys(state.reviews)) {
    const r = state.reviews[ws];
    if (inR(ws) && r.change) ev.push({ k: ws, type: 'review', icon: 'list', text: `Rétrospective : ${r.change}` });
  }
  for (const m of milestoneList(a, b)) ev.push({ k: m.k, type: 'milestone', icon: m.icon, habitId: m.h ? m.h.id : null, text: `${m.name}${m.h ? ` · ${m.h.name}` : ''}` });
  return ev.sort((x, y) => y.k.localeCompare(x.k) || x.type.localeCompare(y.type));
}

/* ---------- Bilan du mois ---------- */
function prevMonth(y, m) { return m === 1 ? [y - 1, 12] : [y, m - 1]; }
function monthReport(y, m) {
  return Stats.memo(`month:${y}-${m}`, () => {
    const [a, b0] = monthBounds(y, m);
    const b = D.min(b0, ui.today);
    const [py, pm] = prevMonth(y, m);
    const [pa, pb] = monthBounds(py, pm);
    const cur = periodIndicators(a, b);
    const prev = periodIndicators(pa, pb);
    const per = state.habits
      .filter((h) => h.startDate <= b && (!h.archivedAt || h.archivedAt > a))
      .map((h) => ({ h, ...habitRange(h, a, b), prev: habitRange(h, pa, pb) }))
      .filter((x) => x.scheduled > 0 || x.paused > 0);
    const regular = per.filter((x) => x.scheduled >= 4).sort((x, z) => (z.rate - x.rate) || byOrder(x.h, z.h)).slice(0, 3);
    const moves = per.filter((x) => x.scheduled >= 4 && x.prev.scheduled >= 4).map((x) => ({ ...x, delta: x.rate - x.prev.rate }));
    const progress = moves.filter((x) => x.delta >= 0.1).sort((x, z) => z.delta - x.delta);
    const slips = moves.filter((x) => x.delta <= -0.1).sort((x, z) => x.delta - z.delta);
    /* Interruptions : plus longue suite de jours prévus manqués dans le mois (3 et plus). */
    const interruptions = [];
    for (const x of per) {
      let run = 0; let best = 0; let bestFrom = null; let from = null;
      for (let k = a; k <= b; k = D.add(k, 1)) {
        const st = dayState(x.h, k);
        if (st === 'miss') { if (!run) from = k; run++; if (run > best) { best = run; bestFrom = from; } } else if (st === 'done' || st === 'part' || st === 'bonus') run = 0;
      }
      if (best >= 3) interruptions.push({ h: x.h, len: best, from: bestFrom });
    }
    interruptions.sort((x, z) => z.len - x.len);
    const pauses = state.pauses.filter((p) => p.from <= b && (!p.to || p.to >= a));
    const changes = [];
    for (const h of state.habits) for (const ch of configChanges(h)) if (ch.from >= a && ch.from <= b0) changes.push({ h, ...ch, ba: beforeAfter(h, ch) });
    const journal = Object.keys(state.journal).filter((k) => k >= a && k <= b && state.journal[k].text).sort().map((k) => ({ k, text: state.journal[k].text }));
    const notes = state.notes.filter((n) => n.from <= b && (n.to || n.from) >= a).sort((x, z) => x.from.localeCompare(z.from));
    const reviews = Object.keys(state.reviews).filter((ws) => ws >= D.add(a, -6) && ws <= b).sort().map((ws) => ({ ws, ...state.reviews[ws] }));
    return {
      y, m, a, b, b0, complete: b === b0, cur, prev, per, regular, progress, slips, interruptions, pauses, changes, journal, notes, reviews,
      tasksDone: tasksDoneBetween(a, b), milestones: milestoneList(a, b), compare: { full: trendWord(cur.fullRate, prev.fullRate), weighted: trendWord(cur.weighted, prev.weighted) },
    };
  });
}

/* ---------- Charge du jour ----------
   Somme des durées estimées des habitudes prévues et des tâches du jour (et des tâches
   en retard). Les éléments sans durée sont comptés à part, sans les estimer. */
function dailyLoad(k = ui.today) {
  let planned = 0; let remaining = 0; let unknown = 0; let items = 0;
  for (const h of activeHabits()) {
    const st = dayState(h, k);
    if (!['done', 'part', 'pending', 'future'].includes(st)) continue;
    items++;
    if (!h.duration) { if (st === 'pending' || st === 'future') unknown++; continue; }
    planned += h.duration;
    if (st === 'pending' || st === 'future') remaining += h.duration;
  }
  const tasks = [...tasksForDay(k), ...(k === ui.today ? overdueTasks(k) : [])];
  for (const t of tasks) {
    items++;
    const done = taskDoneOn(t, k);
    if (!t.duration) { if (!done) unknown++; continue; }
    planned += t.duration;
    if (!done) remaining += t.duration;
  }
  return { planned, remaining, done: planned - remaining, unknown, items, hasData: planned > 0 };
}

/* ---------- Recherche ----------
   Texte libre et filtres combinés : type de contenu, période, catégorie. Sans texte,
   des filtres posés suffisent à lister le contenu correspondant. */
const SEARCH_TYPES = [['all', 'Tout'], ['habits', 'Habitudes'], ['tasks', 'Tâches'], ['journal', 'Journal'], ['notes', 'Notes'], ['reviews', 'Bilans'], ['events', 'Événements']];
const SEARCH_PERIODS = [['all', 'Toute période'], ['7', '7 derniers jours'], ['30', '30 derniers jours'], ['90', '90 derniers jours'], ['year', 'Cette année'], ['custom', 'Dates choisies']];
function searchRange(o) {
  const today = ui.today;
  if (o.period === 'custom') return [o.from || '0000-01-01', o.to || today];
  if (o.period === 'year') return [`${today.slice(0, 4)}-01-01`, today];
  if (/^\d+$/.test(o.period || '')) return [D.add(today, -(Number(o.period) - 1)), today];
  return ['0000-01-01', '9999-12-31'];
}
function searchAll(q, o = {}) {
  const needle = String(q || '').trim().toLowerCase();
  const type = o.type || 'all';
  const filtered = type !== 'all' || (o.period && o.period !== 'all') || (o.cat && o.cat !== 'all');
  if (needle.length < 2 && !filtered) return null;
  const has = (...vals) => !needle || vals.some((s) => String(s || '').toLowerCase().includes(needle));
  const [a, b] = searchRange(o);
  const catOk = (h) => !o.cat || o.cat === 'all' || (h && (catById(h.categoryId) ? h.categoryId : 'none') === o.cat);
  const want = (t) => type === 'all' || type === t;
  const noCat = !o.cat || o.cat === 'all';
  const res = { q: needle, habits: [], tasks: [], notes: [], journal: [], reviews: [], events: [] };
  if (want('habits')) res.habits = state.habits.filter((h) => has(h.name, h.description, h.minLabel) && catOk(h) && h.startDate <= b && (!h.archivedAt || h.archivedAt >= a)).sort(byOrder);
  if (want('tasks') && noCat) res.tasks = state.tasks.filter((t) => has(t.title, t.notes) && t.date <= b && (t.recurrence || t.date >= a)).sort((x, z) => z.date.localeCompare(x.date)).slice(0, 60);
  if (want('journal') && noCat) res.journal = Object.keys(state.journal).filter((k) => k >= a && k <= b && state.journal[k].text && has(state.journal[k].text)).sort((x, z) => z.localeCompare(x)).slice(0, 60).map((k) => ({ k, text: state.journal[k].text }));
  if (want('notes')) res.notes = state.notes.filter((n) => has(n.text) && n.from <= b && (n.to || n.from) >= a && (noCat || catOk(n.habitId ? habitById(n.habitId) : null))).sort((x, z) => z.from.localeCompare(x.from)).slice(0, 60);
  if (want('reviews') && noCat) res.reviews = Object.keys(state.reviews).filter((ws) => ws >= D.add(a, -6) && ws <= b).map((ws) => ({ ws, ...state.reviews[ws] })).filter((r) => has(r.worked, r.blocked, r.change, r.note)).sort((x, z) => z.ws.localeCompare(x.ws));
  if (want('events')) {
    const first = earliestStart() || ui.today;
    res.events = timeline(D.max(a, first), D.min(b, ui.today)).filter((e) => has(e.text, e.note) && (noCat || catOk(e.habitId ? habitById(e.habitId) : null))).slice(0, 60);
  }
  res.total = res.habits.length + res.tasks.length + res.notes.length + res.journal.length + res.reviews.length + res.events.length;
  return res;
}

const ui = {

  prevView: 'today',
  today: null,

  /* mode : 'month' (jours), 'quarter' (semaines), 'year' (mois). f : filtre en cours. */

};
const RingMemo = new Map();

/* ---------- Thème (appliqué en direct par le panneau Personnaliser) ---------- */
/* Contraste WCAG entre deux couleurs : (L+0.05)/(l+0.05). */
function contrastRatio(a, b) {
  const la = luminance(a); const lb = luminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}
function shade(hex, factor) {
  return '#' + hexToRgb(hex).map((v) => clamp(Math.round(v * factor), 0, 255).toString(16).padStart(2, '0')).join('');
}
/* Assombrit une couleur jusqu’à ce qu’elle soit lisible sur le fond donné.
   Indispensable en thème clair : un jaune pur sur du blanc est illisible. */
function readableOn(color, bg, target) {
  let c = color;
  for (let i = 0; i < 28 && contrastRatio(c, bg) < target; i++) c = shade(c, 0.9);
  return c;
}
/* Thème effectif : « auto » suit l’apparence du système. */
function themeMode() {
  const t = state.settings.theme;
  if (t === 'light') return 'light';
  if (t === 'auto') {
    try { if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light'; } catch (e) { /* ignore */ }
    return 'dark';
  }
  return 'dark';
}
function currentBackground() {
  const s = state.settings;
  return themeMode() === 'light'
    ? (LIGHT_BACKGROUNDS[s.lightBg] || LIGHT_BACKGROUNDS.jour)
    : (BACKGROUNDS[s.background] || BACKGROUNDS.nuit);
}
function applyTheme() {
  const s = state.settings;
  const root = document.documentElement;
  const mode = themeMode();
  const bg = currentBackground();
  const [br, bgG, bb] = hexToRgb(bg.bg);
  const set = (k, v) => root.style.setProperty(k, v);
  set('--bg', bg.bg);
  set('--bar-bg', `rgba(${br},${bgG},${bb},0.78)`);
  set('--surface-1', bg.s1); set('--surface-2', bg.s2); set('--surface-3', bg.s3);
  set('--ink-1', bg.ink1); set('--ink-2', bg.ink2); set('--ink-3', bg.ink3);
  set('--grid', bg.grid); set('--axis', bg.axis);
  set('--line', `rgba(${bg.line},${mode === 'light' ? 0.1 : 0.07})`);
  set('--line-2', `rgba(${bg.line},${mode === 'light' ? 0.18 : 0.13})`);
  /* Contour des cases à cocher : il doit rester visible sur fond clair comme sombre. */
  set('--check-ring', `rgba(${bg.line},${mode === 'light' ? 0.5 : 0.22})`);
  set('--strike', `rgba(${bg.line},${mode === 'light' ? 0.45 : 0.3})`);
  const accent = /^#[0-9a-f]{6}$/i.test(s.accent) ? s.accent : DEFAULT_SETTINGS.accent;
  /* L’accent pur sert aux aplats (bouton, case cochée) ; ses variantes assombries
     servent au texte (4.5:1) et aux tracés (3:1), et portent les teintes rgba. */
  /* Le texte d’accent est vérifié sur la surface secondaire, la plus foncée des fonds
     clairs où il apparaît : il reste lisible partout. */
  const text = mode === 'light' ? readableOn(accent, bg.s2, 4.5) : accent;
  const line = mode === 'light' ? readableOn(accent, bg.s1, 3) : accent;
  set('--accent', accent);
  set('--accent-text', text);
  set('--accent-line', line);
  set('--accent-rgb', hexToRgb(line).join(', '));
  set('--accent-ink', luminance(accent) > 0.36 ? '#0B0B0A' : '#FFFFFF');
  const r = RADII[s.radius] || RADII.doux;
  set('--r-card', r.card + 'px'); set('--r-ctl', r.ctl + 'px');
  set('--r-cell', s.matrixShape === 'rond' ? '50%' : (s.radius === 'net' ? '3px' : '6px'));
  set('--font', (FONTS[s.font] || FONTS.system).stack);
  set('--text-scale', String(clamp(Number(s.textScale) || 1, 0.85, 1.4)));
  /* Contraste renforcé : le texte secondaire monte d’un cran et les filets s’épaississent. */
  if (s.contrast === 'high') {
    const mix = (x, y) => '#' + hexToRgb(x).map((v, i) => Math.round((v + hexToRgb(y)[i]) / 2).toString(16).padStart(2, '0')).join('');
    set('--ink-3', bg.ink2);
    set('--ink-2', mix(bg.ink2, bg.ink1));
    set('--line', `rgba(${bg.line},${mode === 'light' ? 0.2 : 0.16})`);
    set('--line-2', `rgba(${bg.line},${mode === 'light' ? 0.32 : 0.26})`);
    set('--check-ring', `rgba(${bg.line},${mode === 'light' ? 0.66 : 0.42})`);
  }
  root.dataset.contrast = s.contrast === 'high' ? 'high' : 'normal';
  root.dataset.density = s.density === 'compact' ? 'compact' : 'confort';
  root.dataset.mode = mode;
  root.dataset.glow = s.glow && mode === 'dark' ? 'on' : 'off';
  root.dataset.motion = s.reduceMotion ? 'reduced' : 'auto';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', bg.bg);
}
/* Si le thème suit le système, on réagit au basculement clair/sombre de l’appareil. */
function watchSystemTheme() {
  if (!window.matchMedia) return;
  try {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    const onChange = () => { if (state && state.settings.theme === 'auto') { applyTheme(); render(); } };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch (e) { /* ignore */ }
}
const reducedMotion = () => state.settings.reduceMotion || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- Composants ---------- */
function glyph(h) {
  const ic = h.icon || 'check';
  return ic.startsWith('emoji:') ? `<span class="emo">${esc(ic.slice(6))}</span>` : icon(ic);
}
function tile(h, size = '') {
  const c = catColor(catById(h.categoryId));
  return `<span class="tile ${size}" style="--c:${c};--cbg:${rgba(c, 0.17)}">${glyph(h)}</span>`;
}
function catDot(cat) { return `<i class="dot" style="--c:${catColor(cat)}"></i>`; }

function ring(value, { size = 120, stroke = 12, id = '', label = '', goal = null } = {}) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const v = clamp(value ?? 0, 0, 1);
  const from = id && RingMemo.has(id) ? RingMemo.get(id) : (id ? 0 : v);
  if (id) RingMemo.set(id, v);
  const cx = size / 2;
  let tick = '';
  if (goal !== null && goal > 0 && goal < 100) {
    const a = (goal / 100) * Math.PI * 2 - Math.PI / 2;
    const r1 = r - stroke / 2 - 1; const r2 = r + stroke / 2 + 1;
    tick = `<line x1="${cx + r1 * Math.cos(a)}" y1="${cx + r1 * Math.sin(a)}" x2="${cx + r2 * Math.cos(a)}" y2="${cx + r2 * Math.sin(a)}" stroke="var(--ink-1)" stroke-width="2" stroke-linecap="round" opacity=".55"/>`;
  }
  const hideArc = v === 0 && from === 0;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="${stroke}"/>
    <circle class="ring-arc" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--accent-line)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - from)).toFixed(2)}" data-to="${(c * (1 - v)).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cx})" ${hideArc ? 'opacity="0"' : ''}/>
    ${tick}
  </svg>`;
}
function animateRings(root = document) {
  const arcs = $$('.ring-arc[data-to]', root);
  if (!arcs.length) return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    arcs.forEach((el) => {
      const to = parseFloat(el.dataset.to);
      const c = parseFloat(el.getAttribute('stroke-dasharray'));
      el.style.strokeDashoffset = to;
      el.setAttribute('opacity', to >= c - 0.01 ? '0' : '1');
    });
  }));
}
function miniRing(p, size = 30) {
  const stroke = 3.5; const r = (size - stroke) / 2; const c = 2 * Math.PI * r; const v = clamp(p ?? 0, 0, 1);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="${stroke}"/>
    ${v > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent-line)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - v)).toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` : ''}
    ${v >= 1 ? `<path d="M${size / 2 - 4.5} ${size / 2 + 0.3}l3 3 6-6.2" fill="none" stroke="var(--accent-line)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
  </svg>`;
}
function switchCtl(id, checked, attrs = '') {
  return `<label class="switch"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}><span class="knob"></span></label>`;
}
function seg(items, current, act, extra = '') {
  return `<div class="seg" role="group" ${extra}>${items.map(([v, label, count]) => `<button type="button" data-act="${act}" data-v="${v}" aria-pressed="${String(v) === String(current)}">${label}${count !== undefined ? ` <span class="count">${count}</span>` : ''}</button>`).join('')}</div>`;
}
function emptyState(ic, title, text, cta = '') {
  return `<div class="empty">${icon(ic)}<b>${title}</b><span>${text}</span>${cta}</div>`;
}

/* ---------- Feuilles (panneaux du bas / fenêtres) ---------- */
const Sheet = {
  stack: [],
  open({ title, body, footer = '', variant = '', onMount = null, onClose = null, closable = true }) {
    const root = $('#sheet-root');
    const layer = document.createElement('div');
    layer.className = 'sheet-layer' + (variant.includes('side') ? ' side-layer' : '');
    layer.innerHTML = `<div class="sheet-backdrop" ${closable ? 'data-act="sheet-close"' : ''}></div>
      <section class="sheet ${variant}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="sheet-grab" aria-hidden="true"></div>
        <header class="sheet-head"><h2>${esc(title)}</h2>${closable ? `<button type="button" class="icon-btn" data-act="sheet-close" aria-label="Fermer">${icon('x')}</button>` : ''}</header>
        <div class="sheet-body">${body}</div>
        ${footer ? `<footer class="sheet-foot">${footer}</footer>` : ''}
      </section>`;
    root.appendChild(layer);
    document.body.classList.add('has-sheet');
    const entry = { layer, el: layer.querySelector('.sheet'), onClose, closable };
    this.stack.push(entry);
    requestAnimationFrame(() => layer.classList.add('open'));
    if (onMount) onMount(entry.el, entry);
    animateRings(entry.el);
    return entry;
  },
  top() { return this.stack[this.stack.length - 1] || null; },
  setBody(entry, html) {
    const body = $('.sheet-body', entry.el);
    const st = body.scrollTop;
    body.innerHTML = html;
    body.scrollTop = st;
    animateRings(body);
  },
  close(entry = this.top(), force = false) {
    if (!entry || (!entry.closable && !force)) return;
    this.stack = this.stack.filter((e) => e !== entry);
    entry.layer.classList.remove('open');
    entry.layer.classList.add('closing');
    setTimeout(() => entry.layer.remove(), 320);
    if (!this.stack.length) document.body.classList.remove('has-sheet');
    if (entry.onClose) entry.onClose();
  },
  closeAll() { [...this.stack].reverse().forEach((e) => this.close(e, true)); },
};

/* ---------- Dialogue de confirmation (remplace confirm()) ---------- */
function ask({ title, message = '', buttons }) {
  return new Promise((resolve) => {
    const root = $('#dialog-root');
    const layer = document.createElement('div');
    layer.className = 'dialog-layer';
    layer.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>${message ? `<p>${message}</p>` : ''}
      <div class="btn-row">${buttons.map((b, i) => `<button type="button" class="btn ${b.style || ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>
    </div>`;
    const done = (val) => { layer.classList.remove('open'); setTimeout(() => layer.remove(), 200); resolve(val); };
    layer.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (b) { e.stopPropagation(); done(buttons[+b.dataset.i].value); } else if (e.target === layer) done(null);
    });
    root.appendChild(layer);
    requestAnimationFrame(() => layer.classList.add('open'));
    const first = layer.querySelector('button');
    if (first && ENV.hover) first.focus();
  });
}

/* ---------- Toasts ---------- */
function toast(title, { msg = '', ic = 'check', tone = '', action = null, duration = 2800 } = {}) {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = `toast ${tone}`;
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="t-ic">${icon(ic)}</span><span class="t-tx"><b>${esc(title)}</b>${msg ? `<span>${esc(msg)}</span>` : ''}</span>${action ? `<button type="button" class="btn sm">${esc(action.label)}</button>` : ''}`;
  root.appendChild(el);
  while (root.children.length > 3) root.firstElementChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  const hide = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  if (action) el.querySelector('button').addEventListener('click', () => { action.fn(); hide(); });
  setTimeout(hide, duration);
}

/* ---------- Confettis ---------- */
function confetti(power = 1) {
  if (!state.settings.celebrations || reducedMotion()) return;
  const cv = $('#confetti');
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth; const H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = [state.settings.accent, state.settings.accent, '#FFFFFF', '#3987e5', '#e66767', '#3DDC97', '#9085e9'];
  const N = Math.round(110 * power);
  const parts = Array.from({ length: N }, (_, i) => {
    const fromLeft = i % 2 === 0;
    const angle = (fromLeft ? -60 : -120) * (Math.PI / 180) + (Math.random() - 0.5) * 0.9;
    const speed = 9 + Math.random() * 9;
    return { x: fromLeft ? W * 0.1 : W * 0.9, y: H * 0.72, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length], life: 0 };
  });
  const t0 = performance.now();
  const frame = (t) => {
    const dt = Math.min(32, t - (frame.last || t)) / 16.67; frame.last = t;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy += 0.32 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      const fade = Math.max(0, 1 - (t - t0) / 2200);
      if (p.y < H + 20 && fade > 0) alive++;
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (alive && t - t0 < 2400) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
  };
  requestAnimationFrame(frame);
}

const FloatTip = {

/* ---------- Graphiques (SVG dessinés à la taille réelle) ---------- */
function placeTip(tip, px, py, W) {
  const tw = tip.offsetWidth || 140; const th = tip.offsetHeight || 56;
  tip.style.left = clamp(px, tw / 2 + 2, W - tw / 2 - 2) + 'px';
  if (py - 12 - th < -8) { tip.style.top = (py + 14) + 'px'; tip.style.transform = 'translate(-50%, 0)'; } else { tip.style.top = (py - 12) + 'px'; tip.style.transform = ''; }
}
function lineChart(el, points, { goal = null, height = 210 } = {}) {
  const W = Math.max(260, el.clientWidth || 320);
  const H = height;
  const m = { t: 14, r: 46, b: 28, l: 38 };
  const iw = W - m.l - m.r; const ih = H - m.t - m.b;
  const n = points.length;
  const x = (i) => m.l + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => m.t + ih - (v / 100) * ih;
  const seg = (key) => {
    const runs = []; let cur = [];
    points.forEach((p, i) => { if (p[key] === null || p[key] === undefined) { if (cur.length) runs.push(cur); cur = []; } else cur.push([x(i), y(p[key])]); });
    if (cur.length) runs.push(cur);
    return runs;
  };
  const toPath = (run) => run.map((pt, i) => `${i ? 'L' : 'M'}${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`).join('');
  const daily = seg('v'); const avg = seg('avg');
  const area = daily.map((run) => `${toPath(run)}L${run[run.length - 1][0].toFixed(1)} ${y(0)}L${run[0][0].toFixed(1)} ${y(0)}Z`).join('');
  const grid = [0, 50, 100].map((v) => `<line class="${v === 0 ? 'baseline' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}${NB}%</text>`).join('');
  const tickIdx = n <= 8 ? points.map((_, i) => i) : [0, Math.round((n - 1) * 0.25), Math.round((n - 1) * 0.5), Math.round((n - 1) * 0.75), n - 1];
  const fmtTick = (p) => (n <= 8 ? WD_SHORT[D.dow(p.k)] : F.short(p.k));
  const ticks = [...new Set(tickIdx)].map((i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${fmtTick(points[i])}</text>`).join('');
  let lastI = -1; for (let i = n - 1; i >= 0; i--) if (points[i].v !== null) { lastI = i; break; }
  const goalLine = goal ? `<line class="goal" x1="${m.l}" x2="${W - m.r}" y1="${y(goal)}" y2="${y(goal)}"/><text x="${W - m.r + 6}" y="${y(goal) + 4}">Obj.</text>` : '';
  const end = lastI >= 0 ? `<circle class="endpt" cx="${x(lastI)}" cy="${y(points[lastI].v)}" r="4.5"/><text class="strong" x="${x(lastI) + 9}" y="${y(points[lastI].v) - 8}">${points[lastI].v}${NB}%</text>` : '';
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="Évolution de la régularité">
      ${grid}${goalLine}
      <path class="area" d="${area}"/>
      ${avg.map((r) => `<path class="ln avg" d="${toPath(r)}"/>`).join('')}
      ${daily.map((r) => `<path class="ln" d="${toPath(r)}"/>`).join('')}
      ${end}${ticks}
      <line class="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/>
      <circle class="hov avg" r="4" visibility="hidden"/><circle class="hov" r="4.5" visibility="hidden"/>
      <rect class="hit-area" x="${m.l - 6}" y="0" width="${iw + 12}" height="${H}" fill="transparent"/>
    </svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'); const tip = el.querySelector('.tip');
  const cross = svg.querySelector('.cross'); const hv = svg.querySelector('.hov:not(.avg)'); const ha = svg.querySelector('.hov.avg');
  let idx = lastI;
  const show = (i) => {
    idx = clamp(i, 0, n - 1);
    const p = points[idx]; const px = x(idx);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    if (p.v !== null) { hv.setAttribute('cx', px); hv.setAttribute('cy', y(p.v)); hv.setAttribute('visibility', 'visible'); } else hv.setAttribute('visibility', 'hidden');
    if (p.avg !== null) { ha.setAttribute('cx', px); ha.setAttribute('cy', y(p.avg)); ha.setAttribute('visibility', 'visible'); } else ha.setAttribute('visibility', 'hidden');
    tip.innerHTML = `<div>${esc(p.label)}</div><div class="tr"><span class="key" style="--k:var(--accent)"></span><span class="tv">${p.v === null ? '—' : P(p.v)}</span><span>${p.scheduled ? `${p.done}/${p.scheduled}` : 'rien de prévu'}</span></div><div class="tr"><span class="key" style="--k:var(--ink-2)"></span><span>Moyenne ${p.avg === null ? '—' : P(p.avg)}</span></div>`;
    tip.hidden = false;
    placeTip(tip, px, y(Math.max(p.v ?? 0, p.avg ?? 0)), W);
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); hv.setAttribute('visibility', 'hidden'); ha.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const fromEvent = (e) => { const r = svg.getBoundingClientRect(); return Math.round(((e.clientX - r.left - m.l) / iw) * (n - 1)); };
  svg.addEventListener('pointermove', (e) => show(fromEvent(e)));
  svg.addEventListener('pointerdown', (e) => show(fromEvent(e)));
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('blur', hide);
  svg.addEventListener('focus', () => show(idx < 0 ? n - 1 : idx));
  svg.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { show(idx - 1); e.preventDefault(); } if (e.key === 'ArrowRight') { show(idx + 1); e.preventDefault(); } });
}

function barChart(el, bars, { height = 180 } = {}) {
  const W = Math.max(240, el.clientWidth || 300);
  const H = height;
  const m = { t: 22, r: 6, b: 26, l: 38 };
  const iw = W - m.l - m.r; const ih = H - m.t - m.b;
  const n = bars.length; const band = iw / n; const bw = Math.min(24, band * 0.58);
  const y = (v) => m.t + ih - (v / 100) * ih;
  const vals = bars.filter((b) => b.v !== null).map((b) => b.v);
  const maxV = vals.length ? Math.max(...vals) : null; const minV = vals.length ? Math.min(...vals) : null;
  const grid = [0, 50, 100].map((v) => `<line class="${v === 0 ? 'baseline' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}${NB}%</text>`).join('');
  let labeledMax = false; let labeledMin = false;
  const marks = bars.map((b, i) => {
    const cx = m.l + band * i + band / 2; const x0 = cx - bw / 2;
    const hit = `<rect class="hit" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih + m.b}" data-i="${i}" tabindex="0" aria-label="${esc(b.long)} : ${b.v === null ? 'aucune donnée' : P(b.v)}"/>`;
    let shape = '';
    if (b.v !== null && b.v > 0) {
      const top = y(b.v); const base = y(0); const r = Math.min(4, base - top);
      shape = `<path class="bar-m" d="M${x0} ${base}V${top + r}Q${x0} ${top} ${x0 + r} ${top}H${x0 + bw - r}Q${x0 + bw} ${top} ${x0 + bw} ${top + r}V${base}Z"/>`;
    }
    let lab = '';
    if (b.v !== null && ((b.v === maxV && !labeledMax) || (b.v === minV && !labeledMin && maxV !== minV))) {
      if (b.v === maxV) labeledMax = true; else labeledMin = true;
      lab = `<text class="strong" x="${cx}" y="${y(b.v) - 7}" text-anchor="middle">${P(b.v)}</text>`;
    }
    return `${hit}${shape}${lab}<text x="${cx}" y="${H - 8}" text-anchor="middle">${b.label}</text>`;
  }).join('');
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Régularité par jour de la semaine">${grid}${marks}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip');
  const show = (i) => {
    const b = bars[i];
    tip.innerHTML = `<div>${F.cap(b.long)}</div><div class="tr"><span class="tv">${b.v === null ? '—' : P(b.v)}</span><span>${b.scheduled ? `${b.done}/${b.scheduled} validations` : 'rien de prévu'}</span></div>`;
    tip.hidden = false;
    placeTip(tip, m.l + band * i + band / 2, b.v === null ? y(50) : y(b.v), W);
  };
  el.querySelectorAll('.hit').forEach((h) => {
    const i = +h.dataset.i;
    h.addEventListener('pointerenter', () => show(i));
    h.addEventListener('pointerdown', () => show(i));
    h.addEventListener('focus', () => show(i));
    h.addEventListener('pointerleave', () => { tip.hidden = true; });
    h.addEventListener('blur', () => { tip.hidden = true; });
  });
}

function mountCharts(root = document) {
  $$('[data-chart]', root).forEach((el) => {
    const kind = el.dataset.chart;
    try {
      if (kind === 'trend') lineChart(el, trendSeries(ui.stats.range, ui.stats.f), { goal: state.goals.daily });

    } catch (e) { console.error(e); el.innerHTML = '<p class="muted small">Graphique indisponible.</p>'; }
  });
}
