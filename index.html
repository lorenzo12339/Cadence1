/* ---------- Copie, fichiers ---------- */
function copyText(text, fallbackEl = null) {
  const ok = () => toast('Copié', { msg: 'Tu peux le coller où tu veux.', ic: 'copy' });
  const fallback = () => {
    try {
      const ta = fallbackEl || Object.assign(document.createElement('textarea'), { value: text });
      if (!fallbackEl) { ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); }
      ta.focus(); ta.select();
      const done = document.execCommand && document.execCommand('copy');
      if (!fallbackEl) ta.remove();
      if (done) { ok(); return; }
    } catch (e) { /* ignore */ }
    toast('Copie impossible', { msg: 'Sélectionne le texte et copie-le à la main.', tone: 'bad', ic: 'alert' });
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok, fallback); return; }
  } catch (e) { /* ignore */ }
  fallback();
}
function showExportText(payload, title = 'Exporter mes données') {
  Sheet.open({
    title,
    body: `<p class="small muted">Copie ce texte et garde-le précieusement (Notes, Fichiers…). Tu pourras le coller dans « Importer une sauvegarde ».</p><textarea class="input code" id="export-text" readonly aria-label="Contenu exporté">${esc(payload)}</textarea>`,
    footer: `<span class="spacer"></span><button type="button" class="btn primary" data-sx="copy">${icon('copy')}Copier</button>`,
    onMount(el) { el.addEventListener('click', (e) => { if (e.target.closest('[data-sx="copy"]')) copyText(payload, $('#export-text', el)); }); },
  });
}
/* Enregistre un fichier : feuille de partage iOS (qui contient AirDrop et Fichiers),
   sinon téléchargement classique. Renvoie 'shared', 'downloaded', 'cancelled' ou null. */
async function saveFile(content, name, mime, { shareTitle = 'Cadence', preferShare = ENV.ios } = {}) {
  if (ENV.inFrame) return null;
  try {
    const file = new File([content], name, { type: mime });
    if (preferShare && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: shareTitle });
      return 'shared';
    }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  try {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'downloaded';
  } catch (e) { return null; }
}
function savedToast(res, name, ic = 'download', title = 'Fichier exporté') {
  if (res === 'shared') toast('Fichier prêt', { msg: 'Choisis « Enregistrer dans Fichiers » ou AirDrop.', ic });
  else if (res === 'downloaded') toast(title, { msg: name, ic });
}

/* ---------- Sauvegarde complète ---------- */
async function exportData(payloadState = null, prefix = 'cadence-sauvegarde') {
  const payload = JSON.stringify(payloadState ? { ...exportPayload(), state: payloadState } : exportPayload(), null, 2);
  const name = stampName(prefix, 'json');
  const res = await saveFile(payload, name, 'application/json', { shareTitle: 'Sauvegarde Cadence' });
  if (res === 'cancelled') return;
  if (res) savedToast(res, name, 'download', 'Sauvegarde exportée');
  else showExportText(payload);
}

/* ---------- Sauvegarde chiffrée ---------- */
function openLockedExport({ forTransfer = false } = {}) {
  if (!Vault.supported) { toast('Chiffrement indisponible ici', { msg: 'Il fonctionne dans l’app installée (adresse https).', ic: 'lock', tone: 'bad' }); return; }
  Sheet.open({
    title: forTransfer ? 'Transfert chiffré' : 'Sauvegarde chiffrée',
    body: `<p class="small muted">Le fichier sera verrouillé par ce mot de passe (AES-256). Cadence ne l’enregistre nulle part : <b style="color:var(--ink-1)">sans lui, personne ne pourra ouvrir le fichier, pas même toi.</b></p>
      <div class="field"><span>Mot de passe</span><input id="lk-pw" type="password" autocomplete="new-password" minlength="8" placeholder="8 caractères minimum" aria-describedby="lk-str"><span class="hint" id="lk-str">Une phrase de quatre mots est facile à retenir et solide.</span></div>
      <div class="field"><span>Confirme le mot de passe</span><input id="lk-pw2" type="password" autocomplete="new-password"></div>
      <div class="field"><span>Indice <span class="muted">(facultatif, lisible par tous)</span></span><input id="lk-hint" maxlength="120" placeholder="Ex. : la phrase du carnet bleu" autocomplete="off"></div>
      <div class="set-list"><div class="set-row"><div class="lbl"><b>Afficher le mot de passe</b></div><div class="ctl">${switchCtl('lk-show', false)}</div></div></div>
      <p class="hint">Conseil : garde aussi une sauvegarde récente non chiffrée en lieu sûr, ou note ton mot de passe dans un gestionnaire de mots de passe.</p>
      <p class="err" id="lk-err" role="alert" hidden></p>`,
    footer: `<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="go">${icon('key')}Chiffrer et exporter</button>`,
    onMount(el, en) {
      const err = (m) => { const e = $('#lk-err', el); e.textContent = m; e.hidden = !m; };
      el.addEventListener('input', (e) => { if (e.target.id === 'lk-pw') { const s = passwordStrength(e.target.value); $('#lk-str', el).textContent = `Force : ${s.label}`; } });
      el.addEventListener('change', (e) => { if (e.target.id === 'lk-show') ['#lk-pw', '#lk-pw2'].forEach((sel) => { $(sel, el).type = e.target.checked ? 'text' : 'password'; }); });
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-sx="go"]');
        if (!b) return;
        const pw = $('#lk-pw', el).value;
        if (!passwordStrength(pw).ok) { err('Le mot de passe doit faire au moins 8 caractères.'); return; }
        if (pw !== $('#lk-pw2', el).value) { err('Les deux mots de passe ne correspondent pas.'); return; }
        err('');
        b.disabled = true; b.innerHTML = `${icon('refresh', 'spin')}Chiffrement…`;
        try {
          const env = await Vault.encrypt(JSON.stringify(exportPayload()), pw, $('#lk-hint', el).value.trim());
          /* On relit tout de suite le fichier avec le mot de passe : un export
             qu’on n’a pas su rouvrir ne doit pas partir. */
          const back = JSON.parse(await Vault.decrypt(env, pw));
          if (!back || !back.state || back.state.habits.length !== state.habits.length) throw new Error('Vérification du fichier chiffré impossible.');
          const payload = JSON.stringify(env, null, 2);
          const name = stampName(forTransfer ? 'cadence-transfert-chiffre' : 'cadence-sauvegarde-chiffree', 'json');
          const res = await saveFile(payload, name, 'application/json', { shareTitle: 'Sauvegarde Cadence chiffrée', preferShare: forTransfer || ENV.ios });
          if (res === 'cancelled') { b.disabled = false; b.innerHTML = `${icon('key')}Chiffrer et exporter`; return; }
          Sheet.close(en);
          if (res) savedToast(res, name, 'key', 'Sauvegarde chiffrée exportée'); else showExportText(payload, 'Sauvegarde chiffrée');
        } catch (x) {
          err(x.message || 'Le chiffrement a échoué.');
          b.disabled = false; b.innerHTML = `${icon('key')}Chiffrer et exporter`;
        }
      });
      if (ENV.hover) setTimeout(() => { const i = $('#lk-pw', el); if (i) i.focus(); }, 60);
    },
  });
}

/* ---------- Exports séparés (tableur, réglages) ---------- */
function openExports(kind = 'validations') {
  if (kind === 'json') { exportData(); return; }
  const def = EXPORT_KINDS[kind];
  const o = { period: 'all', from: '', to: '', cats: [] };
  const cats = [...new Set(state.habits.map((h) => (catById(h.categoryId) ? h.categoryId : 'none')))];
  const usesPeriod = ['validations', 'tasks', 'journal'].includes(kind);
  const usesCats = ['validations', 'habits', 'journal'].includes(kind);
  const body = () => `<p class="small muted">${esc(def.desc)}</p>
    ${usesPeriod ? `<section><div class="section-title">Période</div><div class="seg" role="group">${[['all', 'Tout'], ['30', '30 j'], ['90', '90 j'], ['year', 'Cette année'], ['custom', 'Dates']].map(([v, l]) => `<button type="button" data-sx="period" data-v="${v}" aria-pressed="${o.period === v}">${l}</button>`).join('')}</div>
      ${o.period === 'custom' ? `<div class="field-row" style="margin-top:10px"><div class="field"><span>Du</span><input id="ex-from" type="date" value="${esc(o.from)}"></div><div class="field"><span>Au</span><input id="ex-to" type="date" value="${esc(o.to || ui.today)}"></div></div>` : ''}</section>` : ''}
    ${usesCats && cats.length > 1 ? `<section><div class="section-title">Catégories <span class="muted">(aucune cochée = toutes)</span></div><div class="chips">${cats.map((id) => { const c = catById(id); return `<button type="button" class="chip" data-sx="cat" data-v="${esc(id)}" aria-pressed="${o.cats.includes(id)}">${c ? `${catDot(c)}${esc(c.name)}` : 'Sans catégorie'}</button>`; }).join('')}</div></section>` : ''}
    <p class="hint">Format CSV, séparateur point-virgule : il s’ouvre directement dans Numbers et Excel en français. Cadence ne sait pas relire ce format.</p>`;
  Sheet.open({
    title: `Exporter : ${def.name}`,
    body: body(),
    footer: `<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="go">${icon('download')}Exporter</button>`,
    onMount(el, en) {
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'period') { o.period = b.dataset.v; Sheet.setBody(en, body()); return; }
        if (b.dataset.sx === 'cat') { const v = b.dataset.v; o.cats = o.cats.includes(v) ? o.cats.filter((x) => x !== v) : [...o.cats, v]; b.setAttribute('aria-pressed', String(o.cats.includes(v))); return; }
        if (b.dataset.sx !== 'go') return;
        if (o.period === 'custom') { o.from = $('#ex-from', el).value; o.to = $('#ex-to', el).value; }
        const opts = { cats: o.cats };
        if (o.period !== 'all') {
          const [a, z] = o.period === 'custom' ? [o.from || null, o.to || null] : searchRange({ period: o.period });
          opts.from = a; opts.to = z;
        }
        let content; let mime = 'text/csv'; let ext = 'csv';
        if (kind === 'validations') content = habitsCSV(opts);
        else if (kind === 'habits') content = habitsListCSV(opts);
        else if (kind === 'tasks') content = tasksCSV(opts);
        else if (kind === 'journal') content = journalCSV(opts);
        else { content = settingsJSON(); mime = 'application/json'; ext = 'json'; }
        const name = stampName(`cadence-${kind === 'validations' ? 'validations' : kind === 'habits' ? 'habitudes' : kind === 'tasks' ? 'taches' : kind === 'journal' ? 'journal' : 'reglages'}`, ext);
        const res = await saveFile(content, name, mime);
        if (res === 'cancelled') return;
        Sheet.close(en);
        if (res) savedToast(res, name, ext === 'csv' ? 'table' : 'sliders', 'Export terminé');
        else showExportText(content, def.name);
      });
    },
  });
}
/* Compatibilité : l’ancien bouton « Tableur (CSV) ». */

/* ---------- Rapports imprimables ----------
   Fenêtre séparée : on garde l’app intacte et on laisse iOS proposer
   « Imprimer » ou « Enregistrer en PDF » depuis la feuille de partage de Safari. */
function reportScope(o) {
  if (o.kind === 'month') { const [a, b] = monthBounds(o.y, o.m); return { a, b: D.min(b, ui.today), title: `Bilan de ${F.monthYear(o.y, o.m)}` }; }
  if (o.kind === 'year') return { a: D.key(o.y, 1, 1), b: D.min(D.key(o.y, 12, 31), ui.today), title: `Bilan ${o.y}` };
  return { a: o.from || earliestStart() || ui.today, b: D.min(o.to || ui.today, ui.today), title: `Bilan du ${F.short(o.from || earliestStart() || ui.today)} au ${F.short(D.min(o.to || ui.today, ui.today))}` };
}
function reportHTML(o = { kind: 'year', y: ui.year || +D.parse(ui.today)[0], cats: [], journal: true }) {
  const { a, b, title } = reportScope(o);
  const cats = o.cats && o.cats.length ? new Set(o.cats) : null;
  const keepCat = (h) => !cats || cats.has(catById(h.categoryId) ? h.categoryId : 'none');
  const f = cats && cats.size === 1 ? { cat: [...cats][0] } : null;
  const ind = periodIndicators(a, b, f);
  const len = D.diff(a, b) + 1;
  const pind = periodIndicators(D.add(a, -len), D.add(a, -1), f);
  const per = state.habits.filter((h) => keepCat(h) && h.startDate <= b && (!h.archivedAt || h.archivedAt > a))
    .map((h) => ({ h, ...habitRange(h, a, b), streak: habitStreak(h) })).filter((x) => x.scheduled || x.paused).sort((x, z) => ((z.rate || 0) - (x.rate || 0)) || byOrder(x.h, z.h));
  /* Découpage : par mois si la période dépasse 45 jours, sinon par semaine. */
  const parts = [];
  if (len > 45) {
    let [y, m] = D.parse(a);
    for (let guard = 0; guard < 40; guard++) {
      const [ma, mb] = monthBounds(y, m);
      if (ma > b) break;
      const r = rangeStats(D.max(ma, a), D.min(mb, b), f);
      parts.push({ label: F.cap(F.monthYear(y, m)), ...r });
      m += 1; if (m > 12) { m = 1; y += 1; }
    }
  } else {
    for (let ws = weekStartKey(a); ws <= b; ws = D.add(ws, 7)) { const r = rangeStats(D.max(ws, a), D.min(D.add(ws, 6), b), f); parts.push({ label: `Semaine du ${F.short(ws)}`, ...r }); }
  }
  const pc = (v) => (v === null || v === undefined ? '—' : P(Math.round(v * 100)));
  const tl = timeline(a, b).filter((e) => !e.habitId || keepCat(habitById(e.habitId) || {}));
  const notes = o.journal === false ? [] : [
    ...Object.keys(state.journal).filter((k) => k >= a && k <= b && state.journal[k].text).map((k) => ({ k, text: state.journal[k].text, kind: 'Journal' })),
    ...state.notes.filter((n) => n.from <= b && (n.to || n.from) >= a && (!n.habitId || keepCat(habitById(n.habitId) || {}))).map((n) => ({ k: n.from, text: `${n.habitId && habitById(n.habitId) ? `« ${habitById(n.habitId).name} » · ` : ''}${n.text}`, kind: 'Note' })),
  ].sort((x, z) => x.k.localeCompare(z.k));
  const reviews = reviewHistory().filter((x) => x.ws >= D.add(a, -6) && x.ws <= b);
  const catNames = cats ? [...cats].map((id) => (catById(id) || { name: 'Sans catégorie' }).name).join(', ') : 'toutes';
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Cadence — ${esc(title)}</title>
<style>
  @page { margin: 16mm; }
  body { font: 11pt/1.5 -apple-system, system-ui, "Helvetica Neue", Arial, sans-serif; color: #111; margin: 0; }
  h1 { font-size: 22pt; margin: 0 0 2mm; }
  h2 { font-size: 13pt; margin: 8mm 0 2mm; border-bottom: 1px solid #ccc; padding-bottom: 1mm; }
  p.lede { color: #555; margin: 0 0 6mm; }

  th, td { text-align: left; padding: 1.6mm 2mm; border-bottom: 1px solid #e4e4e4; font-size: 10pt; vertical-align: top; }
  th { color: #555; font-weight: 600; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  .kpi { display: flex; flex-wrap: wrap; gap: 4mm; margin-bottom: 4mm; }
  .kpi div { border: 1px solid #ddd; border-radius: 3mm; padding: 3mm 4mm; min-width: 30mm; }
  .kpi b { display: block; font-size: 16pt; }
  .kpi span { color: #555; font-size: 9pt; }
  ul { margin: 0 0 4mm; padding-left: 5mm; }
  .defs td:first-child { width: 34mm; font-weight: 600; }
  footer { margin-top: 8mm; color: #777; font-size: 8.5pt; border-top: 1px solid #ddd; padding-top: 2mm; }
  @media print { a { text-decoration: none; color: inherit; } h2 { break-after: avoid; } tr { break-inside: avoid; } }
</style></head><body>
<h1>${esc(title)}</h1>
<p class="lede">${esc(state.profile.name ? `${state.profile.name} · ` : '')}Cadence ${APP.version} · du ${esc(F.full(a))} au ${esc(F.full(b))} · catégories : ${esc(catNames)} · édité le ${esc(F.full(ui.today))}</p>
<div class="kpi">
  <div><b>${pc(ind.weighted)}</b><span>Taux pondéré</span></div>
  <div><b>${pc(ind.fullRate)}</b><span>Taux complet</span></div>
  <div><b>${pc(ind.miniRate)}</b><span>Taux de mini-version</span></div>
  <div><b>${ind.expected}</b><span>Jours attendus</span></div>
  <div><b>${ind.missed}</b><span>Manqués</span></div>

</div>

function printReport(o) {
  const html = reportHTML(o);
  let w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (!w) {
    toast('Fenêtre bloquée', { msg: 'Autorise les fenêtres, ou exporte en CSV.', tone: 'bad', ic: 'alert' });
    return;
  }
  w.document.open();
  w.document.write(html);
  w.document.close();
  /* Laisser la mise en page se faire avant d’ouvrir la boîte d’impression. */
  setTimeout(() => { try { w.focus(); w.print(); } catch (e) { /* l’utilisateur imprimera depuis le menu */ } }, 500);
  toast('Rapport ouvert', { msg: ENV.ios ? 'Utilise Partager puis Imprimer.' : 'La boîte d’impression s’ouvre.', ic: 'print' });
}

/* ---------- Transfert vers un autre appareil ----------
   Pas de synchronisation : un fichier passe d’un appareil à l’autre par AirDrop,
   la voie native entre appareils Apple, puis on l’importe de l’autre côté. */
function openTransfer() {
  const send = `<ol class="steps">
      <li><span><b>Sur cet appareil</b>Touche « Préparer le fichier » ci-dessous. La feuille de partage s’ouvre.</span></li>
      <li><span><b>Choisis AirDrop</b>Puis touche le nom de l’autre appareil. Garde les deux appareils déverrouillés et proches.</span></li>
      <li><span><b>Sur l’autre appareil</b>Accepte le fichier, puis ouvre Cadence, va dans le centre de données, « Importer une sauvegarde », et choisis le fichier reçu.</span></li>
    </ol>
    <p class="hint">Si AirDrop n’apparaît pas : enregistre le fichier dans iCloud Drive, puis récupère-le depuis l’app Fichiers de l’autre appareil. Pour un transfert par iCloud ou par e-mail, préfère la version chiffrée.</p>`;
  const receive = `<ol class="steps">
      <li><span><b>Sur l’appareil de départ</b>Ouvre Cadence, Réglages, puis « Transférer vers un autre appareil », et envoie le fichier par AirDrop.</span></li>
      <li><span><b>Sur cet appareil</b>Accepte le fichier : il arrive dans l’app Fichiers, dossier Téléchargements.</span></li>
      <li><span><b>Importe-le</b>Touche « Importer une sauvegarde » ci-dessous et choisis le fichier. Tu verras son contenu avant de remplacer quoi que ce soit.</span></li>
    </ol>
    <p class="hint">L’import remplace les données de cet appareil. Une sauvegarde est créée juste avant, au cas où.</p>`;
  let tab = 'send';
  const body = () => `<div class="seg" role="group" aria-label="Sens du transfert" style="margin-bottom:14px">
      <button type="button" data-sx="tab" data-v="send" aria-pressed="${tab === 'send'}">${icon('upload')}Envoyer</button>
      <button type="button" data-sx="tab" data-v="receive" aria-pressed="${tab === 'receive'}">${icon('download')}Recevoir</button>
    </div>
    <p class="small muted">Cadence n’a pas de compte ni de synchronisation : chaque appareil garde ses données. Pour les déplacer, on passe par un fichier.</p>
    ${tab === 'send' ? send : receive}
    <div class="btn-row" style="margin-top:4px">${tab === 'send'
    ? `<button type="button" class="btn primary" data-sx="prepare">${icon('share')}Préparer le fichier</button>${Vault.supported ? `<button type="button" class="btn" data-sx="locked">${icon('key')}Version chiffrée</button>` : ''}`
    : `<button type="button" class="btn primary" data-sx="import">${icon('upload')}Importer une sauvegarde</button>`}</div>
    <div class="set-list" style="margin-top:14px">
      <div class="set-row"><div class="lbl"><b>Contenu du transfert</b><span>${plural(state.habits.length, 'habitude', 'habitudes')} · ${plural(countChecks(state), 'validation', 'validations')} · ${plural(state.tasks.length, 'tâche', 'tâches')} · ${plural(Object.keys(state.journal).length, 'ligne de journal', 'lignes de journal')} · ${plural(state.notes.length, 'note', 'notes')}</span></div></div>
    </div>`;
  const entry = Sheet.open({
    title: 'Transférer vers un autre appareil',
    body: body(),
    onMount(el, en) {
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'tab') { tab = b.dataset.v; Sheet.setBody(en, body()); return; }
        if (b.dataset.sx === 'import') { Sheet.close(en); openImport(); return; }
        if (b.dataset.sx === 'locked') { openLockedExport({ forTransfer: true }); return; }
        if (b.dataset.sx === 'prepare') {
          const payload = JSON.stringify(exportPayload(), null, 2);
          const name = stampName('cadence-transfert', 'json');
          const res = await saveFile(payload, name, 'application/json', { shareTitle: 'Cadence — transfert', preferShare: true });
          if (res === 'cancelled') return;
          if (res === 'shared') toast('Fichier envoyé', { msg: 'Importe-le sur l’autre appareil.', ic: 'devices' });
          else if (res === 'downloaded') toast('Fichier enregistré', { msg: name, ic: 'devices' });
          else showExportText(payload);
        }
      });
    },
  });
  entry.refresh = () => Sheet.setBody(entry, body());
}

/* ---------- Aperçu d’un jeu de données, sans rien écraser ----------
   Les calculs lisent l’état global : on le remplace le temps d’un calcul synchrone,
   puis on le remet en place, quoi qu’il arrive. */
function withState(tmp, fn) {
  const keep = state; const keepToday = ui.today;
  state = tmp; Stats.reset();
  try { return fn(); } finally { state = keep; ui.today = keepToday; Stats.reset(); }
}
function datasetSummary(s) {
  return withState(s, () => {
    let first = null; let last = null;
    for (const k in s.completions) { if (!first || k < first) first = k; if (!last || k > last) last = k; }
    for (const k in s.partials) { if (!first || k < first) first = k; if (!last || k > last) last = k; }
    const start = earliestStart();
    const r = start ? rangeStats(start, ui.today) : null;
    const r30 = rangeStats(D.add(ui.today, -29), ui.today);
    return {
      habits: s.habits.length, active: s.habits.filter((h) => !h.archivedAt).length, checks: countChecks(s), tasks: s.tasks.length,
      journal: Object.keys(s.journal).length, notes: (s.notes || []).length, pauses: (s.pauses || []).length, reviews: Object.keys(s.reviews || {}).length,
      first, last, rate: r ? r.rate : null, rate30: r30.rate, names: new Set(s.habits.map((h) => h.id)), byId: new Map(s.habits.map((h) => [h.id, h.name])),
      updatedAt: (s.meta || {}).updatedAt || null, integrity: checkIntegrity(s),
    };
  });
}
function compareTable(a, b) {
  const row = (label, x, y) => `<tr><td>${label}</td><td class="r">${x}</td><td class="r">${y}</td><td class="r">${typeof x === 'number' && typeof y === 'number' ? (y - x === 0 ? '=' : `${y - x > 0 ? '+' : '−'}${Math.abs(y - x)}`) : ''}</td></tr>`;
  const onlyA = [...a.names].filter((id) => !b.names.has(id)).map((id) => a.byId.get(id));
  const onlyB = [...b.names].filter((id) => !a.names.has(id)).map((id) => b.byId.get(id));
  return `<div class="table-wrap"><table class="data"><thead><tr><th></th><th class="r">Actuel</th><th class="r">Sauvegarde</th><th class="r">Écart</th></tr></thead><tbody>
      ${row('Habitudes', a.habits, b.habits)}${row('Validations', a.checks, b.checks)}${row('Tâches', a.tasks, b.tasks)}${row('Lignes de journal', a.journal, b.journal)}${row('Notes', a.notes, b.notes)}${row('Pauses', a.pauses, b.pauses)}${row('Rétrospectives', a.reviews, b.reviews)}
      ${row('Dernière validation', a.last ? F.short(a.last) : '—', b.last ? F.short(b.last) : '—')}
      ${row('Taux pondéré, 30 jours', pctOrDash(a.rate30), pctOrDash(b.rate30))}
    </tbody></table></div>
    ${onlyA.length ? `<p class="small muted">Seulement dans tes données actuelles : ${esc(onlyA.join(', '))}.</p>` : ''}
    ${onlyB.length ? `<p class="small muted">Seulement dans la sauvegarde : ${esc(onlyB.join(', '))}.</p>` : ''}`;
}
/* Fenêtre d’aperçu commune aux sauvegardes internes et aux fichiers importés. */
function openDatasetPreview(s, { title, origin, onRestore, restoreLabel = 'Restaurer' }) {
  const cur = datasetSummary(state);
  const sum = datasetSummary(s);
  const ig = sum.integrity;
  Sheet.open({
    title,
    body: `<p class="small muted">${esc(origin)} Rien n’est modifié tant que tu ne touches pas « ${esc(restoreLabel)} ».</p>
      <div class="tiles">
        <div class="tile-stat"><div class="k">Habitudes</div><div class="v">${sum.habits}</div><div class="d">${sum.active} active${sum.active > 1 ? 's' : ''}</div></div>
        <div class="tile-stat"><div class="k">Validations</div><div class="v">${sum.checks}</div><div class="d">${sum.first ? `du ${F.short(sum.first)} au ${F.short(sum.last)}` : 'aucune'}</div></div>
        <div class="tile-stat"><div class="k">Taux pondéré</div><div class="v">${pctOrDash(sum.rate)}</div><div class="d">depuis le début</div></div>
        <div class="tile-stat"><div class="k">Intégrité</div><div class="v">${ig.errors ? icon('alert') : icon('check')}</div><div class="d">${ig.errors ? `${ig.errors} erreur${ig.errors > 1 ? 's' : ''}` : ig.warnings ? `${ig.warnings} point${ig.warnings > 1 ? 's' : ''} à corriger` : 'aucun problème'}</div></div>
      </div>
      <section><div class="section-title">Comparaison avec tes données actuelles</div>${compareTable(cur, sum)}</section>
      ${ig.issues.length ? `<details class="fold"><summary>Détail de la vérification ${icon('chevD')}</summary><ul class="plain integ-list">${ig.issues.map((x) => `<li class="lv-${x.level}">${icon(x.level === 'info' ? 'info' : 'alert')}<span>${esc(x.text)}</span></li>`).join('')}</ul></details>` : ''}`,
    footer: `<button type="button" class="btn ghost" data-sx="export">${icon('download')}<span class="hide-mobile">Exporter ce contenu</span></button><span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Fermer</button><button type="button" class="btn primary" data-sx="restore">${icon('restore')}${esc(restoreLabel)}</button>`,
    onMount(el, en) {
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'export') { exportData(s, 'cadence-extrait'); return; }
        if (b.dataset.sx === 'restore') { Sheet.close(en); await onRestore(); }
      });
    },
  });
}
async function previewBackup(id) {
  const meta = (await Backups.list()).find((b) => b.id === id);
  const snap = meta ? await Backups.read(id) : null;
  if (!snap) { toast('Sauvegarde introuvable', { ic: 'alert', tone: 'bad' }); return; }
  let s;
  try { s = migrate(deepCopy(snap)); } catch (e) { toast('Sauvegarde illisible', { msg: e.message, ic: 'alert', tone: 'bad' }); return; }
  openDatasetPreview(s, {
    title: 'Aperçu de la sauvegarde',
    origin: `${BACKUP_REASONS[meta.reason] || meta.reason}, ${F.rel(meta.at)}, version ${meta.version}.`,
    onRestore: () => restoreBackup(id, true),
  });
}

/* ---------- Import ----------
   Fichier en clair ou chiffré. Dans les deux cas : aperçu et comparaison d’abord,
   remplacement ensuite, après une sauvegarde automatique. */
function openImport() {
  Sheet.open({
    title: 'Importer une sauvegarde',
    body: `<p class="small muted">Choisis un fichier exporté depuis Cadence (chiffré ou non), ou colle son contenu. Tu verras ce qu’il contient avant de remplacer quoi que ce soit.</p>
      <label class="btn" style="position:relative;overflow:hidden;align-self:flex-start">${icon('upload')}Choisir un fichier<input type="file" id="import-file" accept="application/json,.json,text/plain" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Fichier de sauvegarde"></label>
      <div class="field"><span>Ou colle le contenu de la sauvegarde</span><textarea class="code" id="import-text" placeholder='{"app": "Cadence", …}'></textarea></div>
      <div class="field" id="import-pw-wrap" hidden><span>Mot de passe de la sauvegarde chiffrée</span><input id="import-pw" type="password" autocomplete="current-password"><span class="hint" id="import-hint"></span></div>
      <p class="err" id="import-err" role="alert" hidden></p>`,
    footer: `<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="import">${icon('eye')}Voir le contenu</button>`,
    onMount(el, entry) {
      const showErr = (m) => { const e = $('#import-err', el); e.textContent = m; e.hidden = !m; };
      let pending = null;
      const run = async (text) => {
        showErr('');
        let obj;
        try { obj = JSON.parse(text); } catch (e) { showErr('Ce fichier n’est pas une sauvegarde lisible (JSON invalide).'); return; }
        if (Vault.isEncrypted(obj)) {
          const wrap = $('#import-pw-wrap', el);
          if (wrap.hidden) {
            wrap.hidden = false;
            $('#import-hint', el).textContent = obj.hint ? `Indice : ${obj.hint}` : 'Ce fichier est chiffré. Saisis le mot de passe choisi à l’export.';
            pending = text;
            setTimeout(() => $('#import-pw', el).focus(), 50);
            return;
          }
          const pw = $('#import-pw', el).value;
          if (!pw) { showErr('Saisis le mot de passe.'); return; }
          if (!Vault.supported) { showErr('Le déchiffrement demande l’app installée (adresse https).'); return; }
          const btn = $('[data-sx="import"]', entry.el);
          btn.disabled = true; btn.innerHTML = `${icon('refresh', 'spin')}Déchiffrement…`;
          try { text = await Vault.decrypt(obj, pw); } catch (e) { showErr(e.message); btn.disabled = false; btn.innerHTML = `${icon('eye')}Voir le contenu`; return; }
          btn.disabled = false; btn.innerHTML = `${icon('eye')}Voir le contenu`;
        }
        let s;
        try { s = parseImport(text); } catch (e) { showErr(e.message); return; }
        Sheet.close(entry);
        openDatasetPreview(s, {
          title: 'Contenu de la sauvegarde',
          origin: 'Fichier importé.',
          restoreLabel: 'Remplacer mes données',
          onRestore: async () => {
            try { await Backups.create('avant import'); } catch (e) { /* ignore */ }
            s.profile.onboarded = true;
            adoptState(s);
            await flush();
            Sheet.closeAll();
            refreshAll();
            toast('Données importées', { msg: `${state.habits.length} habitudes restaurées. Ta version précédente est dans les sauvegardes internes.`, ic: 'upload', tone: 'good', duration: 4500 });
          },
        });
      };
      $('#import-file', el).addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { const txt = String(r.result || ''); $('#import-text', el).value = txt.length < 200000 ? txt : ''; pending = txt; run(txt); };
        r.onerror = () => showErr('Lecture du fichier impossible.');
        r.readAsText(f);
      });
      el.addEventListener('click', (e) => {
        if (!e.target.closest('[data-sx="import"]')) return;
        const txt = pending || $('#import-text', el).value.trim();
        if (!txt) { showErr('Choisis un fichier ou colle le contenu d’une sauvegarde.'); return; }
        run(txt);
      });
      el.addEventListener('input', (e) => { if (e.target.id === 'import-text') pending = null; });
      el.addEventListener('keydown', (e) => { if (e.target.id === 'import-pw' && e.key === 'Enter') { e.preventDefault(); run(pending || $('#import-text', el).value.trim()); } });
    },
  });
}

/* ---------- Vérification et réparation ---------- */
async function runIntegrity() {
  ui.integrityRunning = true;
  if (ui.view === 'donnees') renderView();
  try {
    await flush();
    const result = checkIntegrity(state);
    const storage = await checkStorage();
    ui.integrity = { result, storage, at: new Date().toISOString() };
  } finally {
    ui.integrityRunning = false;
    if (ui.view === 'donnees') { renderView(); renderBackupList(); }
  }
  const r = ui.integrity.result;
  toast(r.errors || r.warnings ? 'Vérification terminée' : 'Tout est en ordre', { msg: r.errors || r.warnings ? `${r.errors + r.warnings} point${r.errors + r.warnings > 1 ? 's' : ''} à regarder.` : `${r.counts.habits} habitudes et ${r.counts.checks} validations vérifiées.`, ic: r.errors || r.warnings ? 'alert' : 'shield', tone: r.errors || r.warnings ? '' : 'good' });
}
async function repairData() {
  const { state: fixed, done } = repairState(state);
  const storage = (ui.integrity && ui.integrity.storage) || [];
  const broken = storage.flatMap((x) => x.broken || []);
  if (!done.length && !broken.length) { toast('Rien à réparer', { ic: 'shield', tone: 'good' }); return; }
  const ok = await ask({ title: 'Réparer les données ?', message: `${done.length ? esc(done.slice(0, 6).join(' · ')) + (done.length > 6 ? '…' : '') : ''}${broken.length ? `${done.length ? '<br>' : ''}${broken.length} sauvegarde(s) illisible(s) retirée(s) de la liste.` : ''}<br><br>Une sauvegarde est créée juste avant.`, buttons: [{ label: 'Réparer', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  if (done.length) {
    try { await Backups.create('avant réparation'); } catch (e) { /* ignore */ }
    Undo.push('réparation des données');
    adoptState(normalize(fixed));
  }
  if (broken.length) {
    const list = await Backups.list();
    const ids = new Set(broken.map((b) => b.id));
    await Store.set('backups', list.filter((b) => !ids.has(b.id)));
  }
  await flush();
  refreshAll();
  await runIntegrity();
}

/* ---------- Journal ---------- */
const JOURNAL_PROMPTS = ['Ce qui a fonctionné :', 'Ce qui a bloqué :', 'Ce que je change :', 'Humeur :', 'Énergie :'];
function openJournal(k) {
  Recent.add({ type: 'journal', k });
  const entry = state.journal[k] || { text: '', at: null };
  const prev = [];
  for (let i = 1; i <= 14 && prev.length < 5; i++) { const dk = D.add(k, -i); if (state.journal[dk] && state.journal[dk].text) prev.push({ k: dk, text: state.journal[dk].text }); }
  Sheet.open({
    title: `Journal · ${F.cap(F.long(k))}`,
    body: `<div class="field"><span>Ta ligne du jour</span>
        <textarea id="jo-text" maxlength="500" rows="4" placeholder="Ce qui a marché, ce qui a coincé, ton humeur…">${esc(entry.text || '')}</textarea>
        <span class="hint">Une phrase suffit. Tu la reverras dans la rétrospective, le bilan du mois et celui de l’année.</span></div>
      <div class="chips" aria-label="Modèles">${JOURNAL_PROMPTS.map((t) => `<button type="button" class="chip" data-sx="tpl" data-v="${esc(t)}">${icon('plus')}${esc(t.replace(/ :$/, ''))}</button>`).join('')}</div>
      ${prev.length ? `<section><div class="section-title">Jours précédents</div><ul class="plain journal-year">${prev.map((p) => `<li><button type="button" data-sx="goto" data-k="${p.k}"><b>${esc(F.short(p.k))}</b><span>${esc(p.text)}</span></button></li>`).join('')}</ul></section>` : ''}`,
    footer: `${entry.text ? '<button type="button" class="btn ghost" data-sx="clear" aria-label="Effacer">' + icon('trash') + '<span class="hide-mobile">Effacer</span></button>' : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}Enregistrer</button>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'goto') { Sheet.close(en); openJournal(b.dataset.k); return; }
        if (b.dataset.sx === 'tpl') {
          const ta = $('#jo-text', el);
          const cur = ta.value.replace(/\s+$/, '');
          ta.value = `${cur}${cur ? (/[.!?]$/.test(cur) ? ' ' : '. ') : ''}${b.dataset.v} `;
          ta.focus();
          try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (x) { /* ignore */ }
          return;
        }
        if (b.dataset.sx === 'clear') {
          Undo.push('effacement d’une ligne de journal');
          delete state.journal[k];
          commit(); Sheet.close(en); refreshAll();
          toast('Ligne effacée', { ic: 'trash', action: { label: 'Annuler', fn: undoLast } });
          return;
        }
        if (b.dataset.sx === 'save') {
          const text = $('#jo-text', el).value.trim().slice(0, 500);
          Undo.push('écriture d’une ligne de journal');
          if (text) state.journal[k] = { text, at: new Date().toISOString() }; else delete state.journal[k];
          commit();
          evaluateAchievements();
          Sheet.close(en);
          refreshAll();
          toast(text ? 'Journal enregistré' : 'Ligne effacée', { ic: 'pen', action: { label: 'Annuler', fn: undoLast } });
        }
      });
      if (ENV.hover) setTimeout(() => { const t = $('#jo-text', el); if (t) t.focus(); }, 60);
    },
  });
}

/* ---------- Rétrospective hebdomadaire ---------- */
function openReview(ws) {
  Recent.add({ type: 'review', k: ws });
  const draft = { worked: '', blocked: '', change: '', note: '', loaded: false };
  const build = () => {
    const r = weekReview(ws);
    const saved = r.saved;
    if (saved && !draft.loaded) { draft.loaded = true; draft.worked = saved.worked || ''; draft.blocked = saved.blocked || ''; draft.change = saved.change || ''; draft.note = saved.note || ''; }
    const diff = r.week.rate !== null && r.prev.rate !== null ? Math.round((r.week.rate - r.prev.rate) * 100) : null;
    const list = (title, items, ic, empty) => `<section><div class="section-title">${icon(ic)}${title}</div>
      ${items.length ? `<div class="rows">${items.map((x) => `<div class="row"><button type="button" class="row-hit" data-sx="habit" data-id="${x.h.id}">${tile(x.h, 'sm')}<span class="row-text"><span class="row-title">${esc(x.h.name)}</span><span class="row-meta"><span>${x.done}/${x.scheduled} jour${x.scheduled > 1 ? 's' : ''}</span>${x.partial ? `<span class="part-pill">${icon('half')}${x.partial} mini</span>` : ''}<span>${P(Math.round(x.rate * 100))}</span></span></span></button></div>`).join('')}</div>` : `<p class="small muted">${empty}</p>`}</section>`;
    return `<div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Régularité</div><div class="v">${r.week.rate === null ? '—' : P(Math.round(r.week.rate * 100))}</div><div class="d">${r.week.done}/${r.week.scheduled} prévues</div></div>
        <div class="tile-stat"><div class="k">Vs semaine d’avant</div><div class="v ${diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : ''}">${diff === null ? '—' : `${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${Math.abs(diff)}`}<small>${diff === null ? '' : 'pts'}</small></div></div>
        <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${r.week.perfect}</div><div class="d">sur ${r.week.days}</div></div>
        <div class="tile-stat"><div class="k">Jours à zéro</div><div class="v">${r.week.zeroDays}</div><div class="d">${r.week.partial ? `${r.week.partial} sauvés en mini` : 'rien de validé'}</div></div>
      </div>
      ${list('Ce qui a tenu', r.kept, 'check', 'Aucune habitude au-dessus de 80 % cette semaine. Ça arrive.')}
      ${list('Ce qui a lâché', r.slipped, 'alert', 'Rien n’est passé sous 50 %. Belle semaine.')}
      ${r.notes.length ? `<section><div class="section-title">${icon('pen')}Ton journal de la semaine</div><ul class="plain journal-year">${r.notes.map((n) => `<li><button type="button" data-sx="note" data-k="${n.k}"><b>${esc(F.short(n.k))}</b><span>${esc(n.text)}</span></button></li>`).join('')}</ul></section>` : ''}
      <section><div class="section-title">${icon('thumbUp')}Ce qui a fonctionné</div>
        <div class="field"><input id="rv-worked" maxlength="200" value="${esc(draft.worked)}" placeholder="${esc(r.kept[0] ? `Ex. : « ${r.kept[0].h.name} » le matin, avant le travail` : 'Ex. : préparer mes affaires la veille')}" autocomplete="off"></div></section>
      <section><div class="section-title">${icon('alert')}Ce qui a bloqué</div>
        <div class="field"><input id="rv-blocked" maxlength="200" value="${esc(draft.blocked)}" placeholder="${esc(r.slipped[0] ? `Ex. : « ${r.slipped[0].h.name} » tombait les soirs chargés` : 'Ex. : les soirs où je rentre tard')}" autocomplete="off"></div></section>
      <section><div class="section-title">Un seul changement pour la semaine qui vient</div>
        <div class="field"><input id="rv-change" maxlength="160" value="${esc(draft.change)}" placeholder="Ex. : passer le sport à 3 jours au lieu de 5" autocomplete="off">
          <span class="hint">Un changement par semaine se tient. Cinq, non.</span></div>
        ${r.slipped.length ? `<div class="chips" style="margin-top:10px">${r.slipped.slice(0, 3).map((x) => `<button type="button" class="chip" data-sx="suggest" data-v="${esc(`Réduire les jours de « ${x.h.name} »`)}">Réduire « ${esc(x.h.name)} »</button><button type="button" class="chip" data-sx="suggest" data-v="${esc(`Ajouter une mini-version à « ${x.h.name} »`)}">Mini-version « ${esc(x.h.name)} »</button>`).join('')}</div>` : ''}
        <div class="field" style="margin-top:14px"><span>Remarques <span class="muted">(facultatif)</span></span><textarea id="rv-note" maxlength="500" rows="3" placeholder="Ce que tu veux retenir de cette semaine.">${esc(draft.note)}</textarea></div>
      </section>
      ${saved ? `<p class="small muted">Rétrospective déjà enregistrée ${esc(F.rel(saved.at))}. Tu peux la modifier.</p>` : ''}`;
  };
  const entry = Sheet.open({
    title: `Semaine du ${F.short(ws)} au ${F.short(D.add(ws, 6))}`,
    body: build(),
    footer: `<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Fermer</button><button type="button" class="btn primary" data-sx="save">${icon('check')}Enregistrer</button>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'suggest') { $('#rv-change', el).value = b.dataset.v; return; }
        if (b.dataset.sx === 'habit') { openHabitDetail(b.dataset.id); return; }
        if (b.dataset.sx === 'note') { openJournal(b.dataset.k); return; }
        if (b.dataset.sx === 'save') {
          const r = weekReview(ws);
          Undo.push('rétrospective de la semaine');
          state.reviews[ws] = {
            at: new Date().toISOString(),
            worked: $('#rv-worked', el).value.trim().slice(0, 200),
            blocked: $('#rv-blocked', el).value.trim().slice(0, 200),
            change: $('#rv-change', el).value.trim().slice(0, 160),
            note: $('#rv-note', el).value.trim().slice(0, 500),
            kept: r.kept.map((x) => x.h.id),
            slipped: r.slipped.map((x) => x.h.id),
            rate: r.week.rate,
          };
          delete state.snoozes['review:' + ws];
          commit();
          evaluateAchievements();
          Sheet.close(en);
          refreshAll();
          toast('Rétrospective enregistrée', { msg: 'À la semaine prochaine.', ic: 'check', tone: 'good' });
        }
      });
    },
  });
  entry.refresh = () => {
    draft.worked = $('#rv-worked', entry.el) ? $('#rv-worked', entry.el).value : draft.worked;
    draft.blocked = $('#rv-blocked', entry.el) ? $('#rv-blocked', entry.el).value : draft.blocked;
    draft.change = $('#rv-change', entry.el) ? $('#rv-change', entry.el).value : draft.change;
    draft.note = $('#rv-note', entry.el) ? $('#rv-note', entry.el).value : draft.note;
    Sheet.setBody(entry, build());
  };
}

/* ---------- Ajuster une habitude qui décroche ----------
   Chaque ajustement crée un réglage daté d’aujourd’hui : le passé n’est pas réécrit,
   et la fiche de l’habitude montrera l’effet du changement. */
function openFixHabit(id) {
  const h = habitById(id);
  if (!h) return;
  const today = ui.today;
  const c = configAt(h, today);
  const recent = habitRange(h, D.add(today, -13), today);
  const weekly = c.freq.type === 'weekly';
  const bm = bestMoments(h, 56);
  const worst = weekly ? [] : bm.days.filter((x) => c.days.includes(x.dow) && x.expected >= 3 && x.rate !== null && x.rate < 0.5).sort((a, b) => a.rate - b.rate).slice(0, 2);
  const real = Math.max(1, Math.round((habitRange(h, D.add(today, -27), today).done + habitRange(h, D.add(today, -27), today).partial) / 4));
  const perWeek = weekly ? c.freq.count : c.days.length;
  const target = clamp(real, 1, Math.max(1, perWeek - 1));
  const opt = (sx, ic, title, text, extra = '') => `<button type="button" class="card hcard" data-sx="${sx}" ${extra} style="text-align:left;width:100%"><span class="tile" style="--c:var(--accent-line);--cbg:var(--accent-soft)">${icon(ic)}</span><span style="min-width:0"><b style="display:block;font-size:15.5px">${title}</b><span class="small muted">${text}</span></span></button>`;
  Sheet.open({
    title: `Ajuster « ${h.name} »`,
    body: `<p class="small muted">${recent.rate === null ? 'Pas assez de jours attendus récemment.' : `${P(Math.round(recent.rate * 100))} sur les 14 derniers jours.`} Réduire l’exigence maintenant vaut mieux que d’abandonner dans trois semaines. Le changement part d’aujourd’hui : ton historique reste tel quel.</p>
      <div class="stack" style="gap:10px;margin-top:4px">
        ${c.minLabel
    ? opt('min', 'half', 'Modifier la mini-version', `Aujourd’hui : « ${esc(c.minLabel)} ». Les jours difficiles, elle sauve ta série.`)
    : opt('min', 'half', 'Ajouter une mini-version', 'Une version minimale (« 5 minutes ») qui compte quand tu ne peux pas tout faire.')}
        ${worst.length ? opt('drop', 'calendar', `Retirer ${worst.map((x) => WD_LONG[x.dow]).join(' et ')}`, `Tu tiens rarement cette habitude ${worst.length > 1 ? 'ces jours-là' : `le ${WD_LONG[worst[0].dow]}`} (${worst.map((x) => `${x.counted}/${x.expected}`).join(', ')}). Mieux vaut moins de jours tenus.`) : ''}
        ${perWeek > 1 ? opt('weekly', 'repeat', `Passer à ${target}${NB}fois par semaine`, `C’est à peu près ce que tu fais en ce moment. Les jours deviennent libres : tu choisis chaque semaine.`) : ''}
        ${opt('reprise', 'play', 'Reprise guidée sur deux semaines', 'Un objectif réduit pendant 14 jours, puis Cadence te proposera de revenir au rythme habituel.')}
        ${opt('pause', 'pause', 'Mettre en pause', 'Vacances, maladie, période chargée : les jours en pause ne comptent pas comme manqués.')}
        ${opt('edit', 'edit', 'Modifier l’habitude', 'Changer les jours, la fréquence, l’heure, l’objectif de série ou le nom.')}
        ${opt('archive', 'archive', 'Archiver l’habitude', 'Elle quitte tes journées, son historique reste. Tu pourras la restaurer.')}
      </div>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        const done = (msg) => { delete state.snoozes[h.id]; insightFeedback(`decline:${h.id}`, 'applied'); commit(); Sheet.close(en); refreshAll(); toast('Habitude ajustée', { msg, ic: 'history', action: { label: 'Annuler', fn: undoLast } }); };
        if (sx === 'edit') { Sheet.close(en); openHabitEditor(h.id); return; }
        if (sx === 'archive') { Sheet.close(en); removeHabitFlow(h); return; }
        if (sx === 'pause') { Sheet.close(en); openPauseEditor(null, { habits: [h.id] }); return; }
        if (sx === 'reprise') { Sheet.close(en); openPhaseEditor(h.id, 'reprise'); return; }
        if (sx === 'min') { Sheet.close(en); openMiniEditor(h.id); return; }
        if (sx === 'drop') {
          const left = c.days.filter((dw) => !worst.some((x) => x.dow === dw));
          if (!left.length) { toast('Impossible', { msg: 'Il faut garder au moins un jour.', tone: 'bad', ic: 'alert' }); return; }
          Undo.push(`jours de « ${h.name} »`);
          setConfig(h, { days: left }, { from: today, reason: 'Jour peu favorable', note: `Retiré : ${worst.map((x) => WD_LONG[x.dow]).join(', ')}.` });
          done(scheduleLabel(left));
          return;
        }
        if (sx === 'weekly') {
          Undo.push(`fréquence de « ${h.name} »`);
          setConfig(h, { freq: { type: 'weekly', count: target } }, { from: today, reason: 'Objectif trop élevé' });
          done(`${target} fois par semaine`);
        }
      });
    },
  });
}
function openMiniEditor(id) {
  const h = habitById(id);
  if (!h) return;
  const c = configAt(h, ui.today);
  Sheet.open({
    title: 'Mini-version',
    body: `<p class="small muted">Qu’est-ce qui compte, les jours où tu ne peux pas faire « ${esc(h.name)} » en entier ?</p>
      <div class="field"><span>Version minimale</span><input id="mn-text" maxlength="80" value="${esc(c.minLabel || '')}" placeholder="Ex. : 5 minutes" autocomplete="off">
        <span class="hint">Un bouton ${icon('half')} apparaîtra sur la ligne de l’habitude. La journée est marquée à part, ta série continue, et elle compte pour une demi-validation.</span></div>
      <div class="chips" style="margin-top:8px">${['2 minutes', '5 minutes', '10 minutes', 'La moitié', 'Juste commencer'].map((v) => `<button type="button" class="chip" data-sx="preset" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`,
    footer: `${c.minLabel ? `<button type="button" class="btn ghost" data-sx="remove">${icon('trash')}<span class="hide-mobile">Retirer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}Enregistrer</button>`,
    onMount(el, en) {

        if (b.dataset.sx === 'preset') { $('#mn-text', el).value = b.dataset.v; return; }

          Undo.push(`mini-version de « ${h.name} »`);

          insightFeedback(`mini:${h.id}`, 'applied');
          commit(); Sheet.close(en); refreshAll();
          toast(val ? 'Mini-version enregistrée' : 'Mini-version retirée', { msg: val || h.name, ic: 'half', action: { label: 'Annuler', fn: undoLast } });
        }
      });
      if (ENV.hover) setTimeout(() => { const t = $('#mn-text', el); if (t) t.focus(); }, 60);
    },
  });
}
/* Revenir à une version antérieure des réglages, à partir d’aujourd’hui. */
function revertConfig(id, i) {
  const h = habitById(id);
  const v = h && h.history[i];
  if (!v) return;
  Undo.push(`retour à un ancien réglage de « ${h.name} »`);
  setConfig(h, { days: v.days, freq: v.freq, time: v.time, streakGoal: v.streakGoal, minLabel: v.minLabel }, { from: ui.today, reason: 'Retour à un réglage antérieur', note: `Réglage du ${F.short(v.from)}.` });
  commit();
  refreshAll();
  toast('Réglage rétabli', { msg: `${h.name} · ${freqLabel(v)}`, ic: 'restore', action: { label: 'Annuler', fn: undoLast } });
}

/* ---------- Pauses ---------- */
function openPausesList() {
  const today = ui.today;
  const build = () => {
    const list = state.pauses.slice().sort((a, b) => b.from.localeCompare(a.from));
    const cur = list.filter((p) => p.from <= today && (!p.to || p.to >= today));
    const next = list.filter((p) => p.from > today);
    const past = list.filter((p) => p.to && p.to < today);
    const item = (p) => {
      const r = PAUSE_REASON[p.reason];
      const who = p.all ? 'Toutes les habitudes' : p.habits.map((id) => (habitById(id) || {}).name).filter(Boolean).join(', ');
      const days = p.to ? D.diff(p.from, p.to) + 1 : null;
      return `<li><div>${icon(r.icon)}<span><b>${esc(r.name)} · ${esc(who)}</b><span>Du ${esc(F.short(p.from))} ${p.to ? `au ${esc(F.short(p.to))} (${days} jour${days > 1 ? 's' : ''})` : '— sans date de fin'}${p.note ? ` · ${esc(p.note)}` : ''}</span></span></div>
        <div class="btn-row">${p.from <= today && (!p.to || p.to >= today) ? `<button type="button" class="btn sm" data-sx="end" data-id="${p.id}">${icon('play')}Reprendre</button>` : ''}<button type="button" class="btn sm ghost" data-sx="edit" data-id="${p.id}">Modifier</button></div></li>`;
    };
    return `<p class="small muted">Un jour en pause n’est ni prévu ni manqué : il sort des calculs et gèle les séries. Tu peux poser une pause à l’avance, ou après coup pour une période passée.</p>
      <button type="button" class="btn primary" data-sx="new">${icon('plus')}Nouvelle pause</button>
      ${cur.length ? `<section><div class="section-title">En cours</div><ul class="plain pause-list">${cur.map(item).join('')}</ul></section>` : ''}
      ${next.length ? `<section><div class="section-title">À venir</div><ul class="plain pause-list">${next.map(item).join('')}</ul></section>` : ''}
      ${past.length ? `<section><div class="section-title">Passées</div><ul class="plain pause-list">${past.slice(0, 20).map(item).join('')}</ul></section>` : ''}
      ${!list.length ? '<p class="small muted">Aucune pause pour l’instant.</p>' : ''}`;
  };

    title: 'Pauses',

      el.addEventListener('click', (e) => {

  entry.refresh = () => Sheet.setBody(entry, build());
}
function openPauseEditor(id = null, preset = {}) {
  const existing = id ? state.pauses.find((p) => p.id === id) : null;
  const d = existing ? deepCopy(existing) : { all: !(preset.habits && preset.habits.length), habits: preset.habits || [], from: ui.today, to: D.add(ui.today, 6), reason: 'vacances', note: '', ...preset };
  if (preset.habits && preset.habits.length) d.all = false;
  let openEnded = existing ? !existing.to : false;
  const habits = activeHabits();
  const body = () => `<section><div class="section-title">Raison</div><div class="chips">${PAUSE_REASONS.map((r) => `<button type="button" class="chip" data-sx="reason" data-v="${r.id}" aria-pressed="${d.reason === r.id}">${icon(r.icon)}${esc(r.name)}</button>`).join('')}</div></section>
    <section><div class="section-title">Habitudes concernées</div><div class="seg" role="group"><button type="button" data-sx="scope" data-v="all" aria-pressed="${d.all}">Toutes</button><button type="button" data-sx="scope" data-v="some" aria-pressed="${!d.all}">Certaines</button></div>
      ${!d.all ? `<div class="chips" style="margin-top:10px">${habits.map((h) => `<button type="button" class="chip" data-sx="habit" data-v="${h.id}" aria-pressed="${d.habits.includes(h.id)}">${esc(h.name)}</button>`).join('')}</div>` : ''}</section>

      <div class="field"><span>Du</span><input id="pz-from" type="date" value="${esc(d.from)}"></div>
      <div class="field"><span>Au (inclus)</span><input id="pz-to" type="date" value="${esc(d.to || '')}" ${openEnded ? 'disabled' : ''}></div>
    </div>
    <div class="set-list"><div class="set-row"><div class="lbl"><b>Sans date de fin</b><span>Jusqu’à ce que tu touches « Reprendre ».</span></div><div class="ctl">${switchCtl('pz-open', openEnded)}</div></div></div>
    <div class="field"><span>Note <span class="muted">(facultatif)</span></span><input id="pz-note" maxlength="300" value="${esc(d.note || '')}" placeholder="Ex. : semaine à la montagne" autocomplete="off"></div>
    <p class="hint">Les validations faites pendant une pause comptent en bonus. Une pause posée sur des jours passés retire ces jours des manques.</p>
    <p class="err" id="pz-err" role="alert" hidden></p>`;
  Sheet.open({
    title: existing ? 'Modifier la pause' : 'Nouvelle pause',
    body: body(),
    footer: `${existing ? `<button type="button" class="btn ghost" data-sx="delete">${icon('trash')}<span class="hide-mobile">Supprimer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}${existing ? 'Enregistrer' : 'Mettre en pause'}</button>`,
    onMount(el, en) {
      const read = () => { d.from = $('#pz-from', el).value || d.from; d.to = $('#pz-to', el).value || d.to; d.note = $('#pz-note', el).value; };
      el.addEventListener('change', (e) => { if (e.target.id === 'pz-open') { read(); openEnded = e.target.checked; Sheet.setBody(en, body()); } });
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        if (sx === 'reason') { d.reason = b.dataset.v; pressIn(el, '[data-sx="reason"]', (x) => x.dataset.v === d.reason); return; }
        if (sx === 'scope') { read(); d.all = b.dataset.v === 'all'; Sheet.setBody(en, body()); return; }
        if (sx === 'habit') { const v = b.dataset.v; d.habits = d.habits.includes(v) ? d.habits.filter((x) => x !== v) : [...d.habits, v]; b.setAttribute('aria-pressed', String(d.habits.includes(v))); return; }
        if (sx === 'delete' && existing) {
          Undo.push('suppression d’une pause');
          state.pauses = state.pauses.filter((p) => p.id !== existing.id);
          commit(); Sheet.close(en); refreshAll();
          toast('Pause supprimée', { msg: 'Les jours concernés comptent de nouveau normalement.', ic: 'trash', action: { label: 'Annuler', fn: undoLast } });
          return;
        }
        if (sx !== 'save') return;
        read();
        const err = (m) => { const x = $('#pz-err', el); x.textContent = m; x.hidden = false; };
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d.from)) { err('Choisis une date de début.'); return; }
        const to = openEnded ? null : d.to;
        if (!openEnded && (!/^\d{4}-\d{2}-\d{2}$/.test(to || '') || to < d.from)) { err('La date de fin doit suivre la date de début.'); return; }
        if (!d.all && !d.habits.length) { err('Choisis au moins une habitude, ou « Toutes ».'); return; }
        Undo.push(existing ? 'modification d’une pause' : 'nouvelle pause');
        const rec = { id: existing ? existing.id : uid(), all: d.all, habits: d.all ? [] : d.habits.slice(), from: d.from, to, reason: d.reason, note: String(d.note || '').trim().slice(0, 300), createdAt: existing ? existing.createdAt : new Date().toISOString() };
        state.pauses = existing ? state.pauses.map((p) => (p.id === existing.id ? rec : p)) : [...state.pauses, rec];
        commit(); Sheet.close(en); refreshAll();
        toast(existing ? 'Pause modifiée' : 'Pause enregistrée', { msg: `${PAUSE_REASON[rec.reason].name} · du ${F.short(rec.from)}${rec.to ? ` au ${F.short(rec.to)}` : ', sans fin'}`, ic: 'pause', action: { label: 'Annuler', fn: undoLast } });
      });
    },
  });
}
/* Reprendre : la pause s’arrête la veille ; une pause qui commence aujourd’hui disparaît. */
function endPause(id) {
  const p = state.pauses.find((x) => x.id === id);
  if (!p) return;
  Undo.push('reprise après une pause');
  const y = D.add(ui.today, -1);
  if (p.from > y) state.pauses = state.pauses.filter((x) => x.id !== id);
  else p.to = y;
  commit();
  refreshAll();
  toast('C’est reparti', { msg: 'Tes habitudes reprennent aujourd’hui. Rien n’a été perdu pendant la pause.', ic: 'play', tone: 'good', action: { label: 'Annuler', fn: undoLast } });
}

/* ---------- Cycles : essai, reprise, consolidation ---------- */
function openPhaseEditor(id, kind = 'essai') {
  const h = habitById(id);
  if (!h) return;
  const c = configAt(h, ui.today);
  const perWeek = c.freq.type === 'weekly' ? c.freq.count : c.days.length;
  const d = { kind, len: kind === 'consolidation' ? 28 : 14, target: Math.max(1, Math.min(perWeek - 1, Math.ceil(perWeek / 2))), note: '' };
  const body = () => `<div class="stack" style="gap:8px">${Object.entries(PHASES).map(([k, p]) => `<button type="button" class="opt-row" data-sx="kind" data-v="${k}" aria-pressed="${d.kind === k}">${icon(p.icon)}<b>${p.name}</b><span>${esc(p.desc)}</span></button>`).join('')}</div>
    <section><div class="section-title">Durée</div><div class="seg" role="group">${[7, 14, 21, 28].map((n) => `<button type="button" data-sx="len" data-v="${n}" aria-pressed="${d.len === n}">${n}${NB}j</button>`).join('')}</div>
      <p class="hint" style="margin-top:8px">Du ${esc(F.short(ui.today))} au ${esc(F.short(D.add(ui.today, d.len - 1)))}. À la fin, Cadence te demandera ta décision.</p></section>
    ${d.kind === 'reprise' && perWeek > 1 ? `<section><div class="section-title">Objectif réduit pendant la reprise</div><div class="count-pick">${Array.from({ length: perWeek - 1 }, (_, i) => i + 1).map((n) => `<button type="button" data-sx="target" data-v="${n}" aria-pressed="${d.target === n}">${n}</button>`).join('')}<span class="small muted">fois par semaine au lieu de ${perWeek}</span></div>
      <p class="hint" style="margin-top:8px">À la fin, tu pourras revenir à « ${esc(freqLabel(c))} » en un geste.</p></section>` : ''}
    <div class="field"><span>Note <span class="muted">(facultatif)</span></span><input id="ph-note" maxlength="300" value="${esc(d.note)}" placeholder="Ce que tu veux vérifier" autocomplete="off"></div>`;
  Sheet.open({
    title: `Cycle pour « ${h.name} »`,
    body: body(),
    footer: `<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('compass')}Démarrer</button>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        if (sx === 'kind' || sx === 'len' || sx === 'target') {
          d.note = $('#ph-note', el).value;
          if (sx === 'kind') { d.kind = b.dataset.v; d.len = d.kind === 'consolidation' ? 28 : 14; }
          if (sx === 'len') d.len = +b.dataset.v;
          if (sx === 'target') d.target = +b.dataset.v;
          Sheet.setBody(en, body());
          return;
        }
        if (sx !== 'save') return;
        Undo.push(`cycle « ${PHASES[d.kind].name} » pour « ${h.name} »`);
        const base = { days: c.days.slice(), freq: { ...c.freq }, time: c.time, streakGoal: c.streakGoal, minLabel: c.minLabel };
        h.phase = { kind: d.kind, from: ui.today, to: D.add(ui.today, d.len - 1), note: $('#ph-note', el).value.trim().slice(0, 300), base };
        if (d.kind === 'reprise' && perWeek > 1) setConfig(h, { freq: { type: 'weekly', count: d.target } }, { from: ui.today, reason: 'Reprise après une pause', note: `Reprise guidée sur ${d.len} jours.` });
        insightFeedback(`interrupt:${h.id}`, 'applied');
        insightFeedback(`abandon:${h.id}`, 'applied');
        commit(); Sheet.close(en); refreshAll();
        toast(`${PHASES[d.kind].name} démarré${d.kind === 'essai' ? '' : 'e'}`, { msg: `${h.name} · jusqu’au ${F.short(h.phase.to)}`, ic: PHASES[d.kind].icon, action: { label: 'Annuler', fn: undoLast } });
      });
    },
  });
}
/* Décision de fin de cycle. 'stop' arrête un cycle en cours avant son terme. */
function endPhase(id, decision) {
  const h = habitById(id);
  if (!h || !h.phase) return;
  const p = h.phase;
  const labels = { garder: 'gardée', ajuster: 'ajustée', arreter: 'arrêtée', revenir: 'retour au rythme habituel', augmenter: 'augmentée', stop: 'interrompu' };
  Undo.push(`fin du cycle de « ${h.name} »`);
  h.phaseLog.push({ kind: p.kind, from: p.from, to: decision === 'stop' ? D.min(p.to, ui.today) : p.to, decision: labels[decision] || decision, at: new Date().toISOString() });
  h.phase = null;
  if (decision === 'revenir' && p.base) setConfig(h, p.base, { from: ui.today, reason: 'Fin de la reprise', note: 'Retour au rythme d’avant la reprise.' });
  commit();
  refreshAll();
  if (decision === 'arreter') { archiveHabit(h); return; }
  if (decision === 'ajuster' || decision === 'augmenter') { openHabitEditor(h.id); return; }
  toast('Décision enregistrée', { msg: `${h.name} · ${labels[decision] || decision}`, ic: 'check', action: { label: 'Annuler', fn: undoLast } });
}
function acceptStep(id) {
  const h = habitById(id);
  const step = h && progressionReady(h);
  if (!step) return;
  Undo.push(`palier de « ${h.name} »`);
  const cfg = step.to >= 7 ? { freq: { type: 'days' }, days: ALL_DAYS.slice() } : { freq: { type: 'weekly', count: step.to } };
  setConfig(h, cfg, { from: step.effective, reason: 'Palier progressif', note: `${step.weeks} semaine${step.weeks > 1 ? 's' : ''} tenue${step.weeks > 1 ? 's' : ''} à ${step.from} fois par semaine.` });
  if (step.to >= h.progress.max) h.progress = null;
  commit();
  refreshAll();
  toast('Palier programmé', { msg: `${h.name} · ${step.to >= 7 ? 'tous les jours' : `${step.to} fois par semaine`} ${step.effective === ui.today ? 'dès aujourd’hui' : `dès le ${F.short(step.effective)}`}`, ic: 'stairs', tone: 'good', action: { label: 'Annuler', fn: undoLast } });
}

      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;

        if (b.dataset.sx === 'delete' && existing) { Undo.push('suppression d’une note'); state.notes = state.notes.filter((n) => n.id !== existing.id); commit(); Sheet.close(en); refreshAll(); toast('Note supprimée', { ic: 'trash', action: { label: 'Annuler', fn: undoLast } }); return; }
        if (b.dataset.sx !== 'save') return;
        read();
        const text = String(d.text || '').trim().slice(0, 1000);
        const err = (m) => { const x = $('#nt-err', el); x.textContent = m; x.hidden = false; };

      });
      if (ENV.hover) setTimeout(() => { const t = $('#nt-text', el); if (t) t.focus(); }, 60);
    },
  });
}
