  ];
  return list.map(([name, ic, categoryId, time, days, description, streakGoal, minLabel], i) => newHabit({ name, icon: ic, categoryId, time, days, description, streakGoal, minLabel, startDate, order: i }));
}

function localISO(k, hm) {
  const [y, m, d] = D.parse(k);
  const [hh, mm] = (hm || '12:00').split(':').map(Number);
  return new Date(y, m - 1, d, hh, mm).toISOString();
}

/* Jeu de données d’exemple (aperçu et option « Explorer la démo »).
   Il montre aussi les fonctions de la 1.2.0 : un changement de réglage daté, une pause
   passée, une habitude « 2 fois par semaine » en période d’essai, des tâches récurrentes,
   une tâche souvent reportée, des durées et des notes. */
function buildDemo() {
  const s = defaultState();
  const prev = state;
  state = s; // pour que todayKey() et newHabit() utilisent ces réglages
  const today = todayKey();
  const start = D.add(today, -62);
  s.meta.demo = true;
  s.profile.onboarded = true;
  s.habits = sampleHabits(start);
  const durations = [null, 10, 45, 60, null, 30, 20, null];
  s.habits.forEach((h, j) => { h.duration = durations[j]; });
  s.habits[1].favorite = true;
  s.habits[6].favorite = true;
  /* Le sport passe de 5 à 3 séances il y a trois semaines : un changement daté et commenté. */
  const change = D.add(today, -21);
  setConfig(s.habits[2], { days: [1, 3, 5] }, { from: change, reason: 'Objectif trop élevé', note: 'Cinq séances par semaine, c’était trop avec le travail.' });
  /* Une habitude à fréquence souple, en période d’essai. */
  const call = newHabit({ name: 'Appeler un proche', icon: 'users', categoryId: 'cat-esprit', time: null, freq: { type: 'weekly', count: 2 }, days: ALL_DAYS.slice(), description: 'Un appel, pas un message.', streakGoal: 0, minLabel: 'Un message vocal', startDate: start, order: 8, duration: 20 });
  call.phase = { kind: 'essai', from: D.add(today, -10), to: D.add(today, 3), note: 'Voir si deux appels par semaine tiennent.', base: null };
  s.habits.push(call);
  /* Une semaine de vacances, il y a un mois : ces jours ne comptent pas comme manqués. */
  const pFrom = D.add(today, -34); const pTo = D.add(today, -30);
  s.pauses = [{ id: uid(), all: true, habits: [], from: pFrom, to: pTo, reason: 'vacances', note: 'Quelques jours à la mer.', createdAt: localISO(pFrom, '09:00') }];
  const paused = (k) => k >= pFrom && k <= pTo;
  const rand = mulberry32(20261105);
  const base = [0.8, 0.76, 0.72, 0.84, 0.9, 0.64, 0.86, 0.66, 0.85];
  const n = D.diff(start, today);
  const doneToday = new Set([0, 1, 4]);
  const partialToday = new Set([6]);
  const mark = (map, k, h, hm) => { if (!s[map][k]) s[map][k] = {}; s[map][k][h.id] = localISO(k, hm); };
  /* Heure réelle de validation : autour de l’heure prévue, le sport souvent plus tard. */
  const when = (h, j, r) => {
    if (!h.time) return '13:00';
    const [hh, mm] = h.time.split(':').map(Number);
    const shift = j === 2 ? 95 + Math.round(r * 40) : Math.round((r - 0.5) * 30);
    const t = clamp(hh * 60 + mm + shift, 5 * 60, 23 * 60 + 50);
    return `${D.pad(Math.floor(t / 60))}:${D.pad(t % 60)}`;
  };
  for (let i = 0; i <= n; i++) {
    const k = D.add(start, i);
    if (paused(k)) continue;
    const trend = -0.16 + 0.22 * (i / n);
    s.habits.forEach((h, j) => {
      const cfg = configAt(h, k);
      if (cfg.freq.type === 'weekly') {
        /* Deux appels par semaine, plutôt en fin de semaine. */
        const dw = D.dow(k);
        const p = dw === 0 || dw === 6 ? 0.55 : dw === 3 ? 0.35 : 0.08;
        if (k !== today && rand() < p) mark('completions', k, h, '19:30');
        return;
      }
      if (!cfg.days.includes(D.dow(k))) return;
      let p = base[j] + trend;
      if (j === 6 && i > n - 16) p = 1; // une belle série sur « Lire 20 minutes »
      if (j === 4 && i > n - 9) p = 1;
      if (j === 5 && i > n - 12) p = 0.2; // « Apprendre » décroche : déclenche l’alerte
      if (j === 0 && D.dow(k) === 6) p = 0.25; // le samedi, le réveil à 6 h tient rarement
      if (k === today) p = doneToday.has(j) ? 1 : 0;
      const r = rand();
      if (r < p) mark('completions', k, h, k === today ? (h.time || '08:00') : when(h, j, rand()));
      else if (h.minLabel && r < p + 0.14) mark('partials', k, h, h.time || '13:00');
    });
    if (k === today) {
      s.habits.forEach((h, j) => {
        if (!partialToday.has(j) || !configAt(h, k).days.includes(D.dow(k))) return;
        mark('partials', k, h, h.time || '21:30');
      });
    }
  }
  const notes = [
    [-1, 'Journée dense au travail, j’ai quand même tenu l’essentiel.'],
    [-3, 'Mauvaise nuit. La mini-version m’a sauvé la série.'],
    [-6, 'Longue marche en forêt, le meilleur moment de la semaine.'],
    [-9, 'Beaucoup d’écrans ce soir, à corriger demain.'],
    [-14, 'Premier mois tenu. Je commence à ne plus y penser.'],
  ];
  notes.forEach(([off, text]) => { const k = D.add(today, off); s.journal[k] = { text, at: localISO(k, '21:45') }; });
  s.notes = [
    { id: uid(), habitId: s.habits[2].id, from: change, to: null, text: 'Trois séances le lundi, le mercredi et le vendredi. Le reste du temps, de la marche.', at: localISO(change, '20:00'), updatedAt: localISO(change, '20:00') },
    { id: uid(), habitId: null, from: pFrom, to: pTo, text: 'Vacances : pause assumée, reprise en douceur au retour.', at: localISO(pFrom, '09:05'), updatedAt: localISO(pFrom, '09:05') },
  ];
  const t = (title, dayOffset, time, priority, done, extra = {}) => newTask({ title, date: D.add(today, dayOffset), time, priority, done, doneAt: done ? new Date().toISOString() : null, ...extra });
  s.tasks = [
    t('Appeler le dentiste', 0, '10:00', 'high', false, { notes: 'Prendre rendez-vous pour le contrôle annuel.', duration: 10 }),
    t('Préparer la réunion de lundi', 0, '14:30', 'medium', false, { duration: 45 }),
    t('Courses : fruits et légumes', 0, '18:00', 'low', true, { duration: 30 }),
    t('Envoyer le dossier à la banque', -1, null, 'high', false, {
      duration: 25,
      originDate: D.add(today, -9),
      postponed: [[-9, -6], [-6, -4], [-4, -1]].map(([a, b]) => ({ from: D.add(today, a), to: D.add(today, b), at: localISO(D.add(today, a), '21:00') })),
      createdAt: localISO(D.add(today, -10), '09:00'),
    }),
    t('Réserver le restaurant de samedi', 1, '12:00', 'medium', false),
    t('Planifier les objectifs du mois', 3, null, 'low', false, { duration: 30 }),
    t('Faire le point sur les mails', -40, '09:15', 'medium', false, { recurrence: { type: 'weekdays' }, duration: 15 }),
    t('Sortir les poubelles', -40, '20:00', 'low', false, { recurrence: { type: 'weekly', dow: [2] }, duration: 5 }),
  ];
  /* Quelques occurrences passées des tâches récurrentes, pour l’historique. */
  const mails = s.tasks[6];
  for (let i = 1; i <= 20; i++) { const k = D.add(today, -i); if (taskOccursOn(mails, k) && i % 4 !== 0) mails.doneDates[k] = localISO(k, '09:30'); }
  s.habits.forEach((h) => { ensureHistory(h); syncMirror(h, today); });
  state = prev;
  return s;
}

/* ---------- Migrations & normalisation ---------- */
/* Ajoute ici une fonction par version de schéma : MIGRATIONS[n] transforme un état n en n+1.
   Les champs simplement ajoutés sont déjà comblés par normalize() ; on ne met ici que ce qui
   demande une vraie transformation. */
const MIGRATIONS = {
  /* 1 → 2 (version 1.1.0) : mini-versions, journal, rétrospectives, alertes, thème clair. */
  1: (s) => {
    s.partials = s.partials && typeof s.partials === 'object' ? s.partials : {};
    s.journal = s.journal && typeof s.journal === 'object' ? s.journal : {};
    s.reviews = s.reviews && typeof s.reviews === 'object' ? s.reviews : {};
    s.snoozes = s.snoozes && typeof s.snoozes === 'object' ? s.snoozes : {};
    if (Array.isArray(s.habits)) s.habits.forEach((h) => { if (typeof h.minLabel !== 'string') h.minLabel = ''; });
    if (s.settings && typeof s.settings === 'object') {
      if (!s.settings.theme) s.settings.theme = 'dark'; // on reste en sombre pour ne rien changer à l’existant
      if (!s.settings.lightBg) s.settings.lightBg = 'jour';
      if (!Number.isFinite(s.settings.textScale)) s.settings.textScale = 1;
    }
    return s;
  },
  /* 2 → 3 (version 1.2.0) : réglages datés, pauses, fréquences souples, cycles, notes,
     tâches récurrentes. Rien n’est supprimé : chaque habitude reçoit une première version
     de réglages identique à ses réglages actuels, valable depuis sa date de début, ce qui
     laisse toutes les statistiques passées inchangées. */
  2: (s) => {
    if (Array.isArray(s.habits)) {
      s.habits.forEach((h) => {
        if (!h || typeof h !== 'object') return;
        h.freq = { type: 'days' };
        if (!Array.isArray(h.history) || !h.history.length) {
          h.history = [{ from: h.startDate, days: Array.isArray(h.days) ? h.days.slice() : [0, 1, 2, 3, 4, 5, 6], freq: { type: 'days' }, time: h.time || null, streakGoal: Number(h.streakGoal) || 0, minLabel: String(h.minLabel || ''), reason: '', note: '', at: h.createdAt || new Date().toISOString() }];
        }
        if (h.favorite === undefined) h.favorite = false;
        if (h.duration === undefined) h.duration = null;
        if (!Array.isArray(h.phaseLog)) h.phaseLog = [];
      });
    }
    if (Array.isArray(s.tasks)) {
      s.tasks.forEach((t) => {
        if (!t || typeof t !== 'object') return;
        if (!t.doneDates || typeof t.doneDates !== 'object') t.doneDates = {};
        if (!Array.isArray(t.postponed)) t.postponed = [];
        if (t.recurrence === undefined) t.recurrence = null;
        if (t.duration === undefined) t.duration = null;
      });
    }
    if (!Array.isArray(s.pauses)) s.pauses = [];
    if (!Array.isArray(s.notes)) s.notes = [];
    if (!s.insights || typeof s.insights !== 'object') s.insights = {};
    if (!s.milestones || typeof s.milestones !== 'object') s.milestones = {};
    return s;
  },
};

function migrate(raw) {
  if (!raw || typeof raw !== 'object') return null;
  let s = raw;
  let v = Number(s.schema) || 1;
  while (v < APP.schema) {
    const step = MIGRATIONS[v];
    if (step) s = step(s) || s;
    v += 1;
  }
  s.schema = Math.max(v, APP.schema);
  return normalize(s);
}

function normalize(s) {
  const d = defaultState();
  const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
  const arr = (v) => (Array.isArray(v) ? v : []);
  const out = { ...d, ...s };
  out.meta = { ...d.meta, ...obj(s.meta) };
  out.profile = { ...d.profile, ...obj(s.profile) };
  out.goals = { ...d.goals, ...obj(s.goals) };
  out.settings = { ...d.settings, ...obj(s.settings) };
  out.settings.modules = { ...d.settings.modules, ...obj(obj(s.settings).modules) };
  out.records = { ...d.records, ...obj(s.records) };
  out.records.bestStreak = { ...d.records.bestStreak, ...obj(out.records.bestStreak) };
  out.records.bestGoalRun = { ...d.records.bestGoalRun, ...obj(out.records.bestGoalRun) };
  out.updates = { ...d.updates, ...obj(s.updates) };
  out.updates.backlog = arr(out.updates.backlog);
  out.completions = obj(s.completions);
  out.partials = obj(s.partials);
  out.journal = obj(s.journal);
  out.reviews = obj(s.reviews);
  out.snoozes = obj(s.snoozes);
  out.achievements = obj(s.achievements);
  out.celebrated = obj(s.celebrated);
  out.insights = obj(s.insights);
  out.milestones = obj(s.milestones);
  const isKey = (k) => /^\d{4}-\d{2}-\d{2}$/.test(k || '');
  out.pauses = arr(s.pauses).filter((pz) => pz && isKey(pz.from)).map((pz) => ({
    ...pz,
    id: pz.id || uid(),
    all: pz.all !== false,
    habits: arr(pz.habits).map(String),
    from: pz.from,
    /* null = jusqu’à reprise ; une date invalide est ramenée à la date de début, jamais à « sans fin ». */
    to: pz.to === null || pz.to === undefined ? null : (isKey(pz.to) ? D.max(pz.to, pz.from) : pz.from),
    reason: PAUSE_REASON[pz.reason] ? pz.reason : 'autre',
    note: String(pz.note || '').slice(0, 300),
    createdAt: pz.createdAt || new Date().toISOString(),
  })).filter((pz) => pz.all || pz.habits.length);
  out.notes = arr(s.notes).filter((n) => n && String(n.text || '').trim() && isKey(n.from)).map((n) => ({
    ...n,
    id: n.id || uid(),
    habitId: n.habitId || null,
    from: n.from,
    to: isKey(n.to) && n.to >= n.from ? n.to : null,
    text: String(n.text).slice(0, 1000),
    at: n.at || new Date().toISOString(),
    updatedAt: n.updatedAt || n.at || new Date().toISOString(),
  }));
  out.categories = Array.isArray(s.categories) ? s.categories.filter((c) => c && c.id) : d.categories;
  /* Une journée ne peut pas être à la fois complète et minimale : la validation complète gagne. */
  for (const k in out.partials) {
    const full = out.completions[k];
    if (!full) continue;
    for (const id in out.partials[k]) if (full[id]) delete out.partials[k][id];
  }
  out.habits = arr(s.habits).filter((h) => h && h.id).map((h, i) => {
    const x = {
      description: '', icon: 'check', categoryId: null, time: null, streakGoal: 21, archivedAt: null, minLabel: '',
      favorite: false, duration: null, progress: null, phase: null,
      ...h,
      name: String(h.name || 'Habitude'),
      minLabel: String(h.minLabel || '').slice(0, 80),
      days: cleanDays(h.days),
      freq: cleanFreq(h.freq),
      favorite: !!h.favorite,
      duration: Number(h.duration) > 0 ? clamp(Math.round(Number(h.duration)), 1, 600) : null,
      startDate: isKey(h.startDate) ? h.startDate : (h.createdAt ? keyOfISO(h.createdAt) : todayKey()),
      order: Number.isFinite(h.order) ? h.order : i,
      phaseLog: arr(h.phaseLog).filter((l) => l && PHASES[l.kind]),
    };
    if (!isKey(x.archivedAt)) x.archivedAt = null;
    x.progress = x.progress && typeof x.progress === 'object'
      ? { step: 1, every: clamp(Math.round(Number(x.progress.every) || 2), 1, 8), max: clamp(Math.round(Number(x.progress.max) || 5), 2, 7) }
      : null;
    x.phase = x.phase && PHASES[x.phase.kind] && isKey(x.phase.from) && isKey(x.phase.to)
      ? { kind: x.phase.kind, from: x.phase.from, to: x.phase.to >= x.phase.from ? x.phase.to : x.phase.from, note: String(x.phase.note || '').slice(0, 300), base: x.phase.base && typeof x.phase.base === 'object' ? x.phase.base : null }
      : null;
    ensureHistory(x);
    /* Réglages modifiés par une version de l’app qui ne connaît pas l’historique (la
       version de secours, par exemple) : on les date d’aujourd’hui au lieu de les perdre. */
    const curCfg = configAt(x, todayKey());
    if (!sameConfig(curCfg, configOf(x)) && String(x.updatedAt || '') > String(curCfg.at || '') && !(x.history || []).some((v) => v.from > todayKey())) {
      setConfig(x, configOf(x), { from: D.max(todayKey(), x.startDate), reason: 'Modifié dans une autre version de l’app' });
    }
    return x;
  });
  const recur = (r) => {
    if (!r || typeof r !== 'object' || !RECURRENCES.some((x) => x.id === r.type)) return null;
    if (r.type === 'weekly') return { type: 'weekly', dow: cleanDays(r.dow && r.dow.length ? r.dow : [1]) };
    if (r.type === 'monthly') return { type: 'monthly', dom: clamp(Math.round(Number(r.dom) || 1), 1, 31) };
    return { type: r.type };
  };
  out.tasks = arr(s.tasks).filter((t) => t && t.id).map((t) => ({
    notes: '', priority: 'medium', time: null, done: false, doneAt: null,
    ...t,
    title: String(t.title || 'Tâche'),
    date: isKey(t.date) ? t.date : todayKey(),
    duration: Number(t.duration) > 0 ? clamp(Math.round(Number(t.duration)), 1, 1440) : null,
    recurrence: recur(t.recurrence),
    doneDates: obj(t.doneDates),
    skipped: obj(t.skipped),
    originDate: isKey(t.originDate) ? t.originDate : null,
    postponed: arr(t.postponed).filter((x) => x && isKey(x.from) && isKey(x.to)),
  }));
  if (!ACCENTS.some((a) => a.hex.toLowerCase() === String(out.settings.accent).toLowerCase()) && !/^#[0-9a-f]{6}$/i.test(out.settings.accent)) out.settings.accent = DEFAULT_SETTINGS.accent;
  if (!BACKGROUNDS[out.settings.background]) out.settings.background = 'nuit';
  if (!LIGHT_BACKGROUNDS[out.settings.lightBg]) out.settings.lightBg = 'jour';
  if (!THEMES.some(([v]) => v === out.settings.theme)) out.settings.theme = 'dark';
  out.settings.textScale = clamp(Number(out.settings.textScale) || 1, 0.85, 1.4);
  if (!RADII[out.settings.radius]) out.settings.radius = 'doux';
  if (!FONTS[out.settings.font]) out.settings.font = 'system';
  const st = out.settings;
  if (!['detail', 'compact'].includes(st.todayView)) st.todayView = 'detail';
  if (!['normal', 'high'].includes(st.contrast)) st.contrast = 'normal';
  st.badges = st.badges !== false;
  st.assistant = st.assistant !== false;
  const known = TODAY_SECTIONS.map((x) => x.id);
  const order = arr(st.todaySections).filter((id, i, a) => known.includes(id) && a.indexOf(id) === i);
  st.todaySections = [...order, ...known.filter((id) => !order.includes(id))];
  const al = obj(st.alert);
  st.alert = {
    window: [14, 21, 28].includes(Number(al.window)) ? Number(al.window) : DEFAULT_ALERT.window,
    threshold: clamp(Math.round(Number(al.threshold) || DEFAULT_ALERT.threshold), 30, 90),
    drop: clamp(Math.round(Number(al.drop) || DEFAULT_ALERT.drop), 5, 60),
  };
  st.savedFilters = arr(st.savedFilters).filter((f) => f && f.id && f.name && f.f).slice(0, 20);
  return out;
}

/* ---------- Stockage (IndexedDB → localStorage → mémoire) ---------- */
const Store = {
  engine: 'memory',
  db: null,
  mem: new Map(),
  persisted: null,
  lastSavedAt: null,
  error: null,
  async init() {
    if (window.indexedDB) {
      try {
        this.db = await Promise.race([idbOpen('cadence', 1), sleep(3000).then(() => { throw new Error('timeout'); })]);
        this.engine = 'indexeddb';
      } catch (e) { this.db = null; }
    }
    if (!this.db) {
      const probe = '__cadence_probe__';
      if (lsSet(probe, '1')) { lsDel(probe); this.engine = 'localstorage'; }
    }
    try { if (navigator.storage && navigator.storage.persisted) this.persisted = await navigator.storage.persisted(); } catch (e) { /* ignore */ }
  },
  async get(key) {
    if (this.engine === 'indexeddb') return idbReq(this.db.transaction('kv', 'readonly').objectStore('kv').get(key));
    if (this.engine === 'localstorage') { const v = lsGet('cadence:' + key); return v ? JSON.parse(v) : undefined; }
    return this.mem.has(key) ? deepCopy(this.mem.get(key)) : undefined;
  },
  async set(key, val) {
    if (this.engine === 'indexeddb') return idbReq(this.db.transaction('kv', 'readwrite').objectStore('kv').put(val, key));
    if (this.engine === 'localstorage') { if (!lsSet('cadence:' + key, JSON.stringify(val))) throw new Error('Espace de stockage plein'); return undefined; }
    this.mem.set(key, deepCopy(val));
    return undefined;
  },
  async del(key) {
    if (this.engine === 'indexeddb') return idbReq(this.db.transaction('kv', 'readwrite').objectStore('kv').delete(key));
    if (this.engine === 'localstorage') { lsDel('cadence:' + key); return undefined; }
    this.mem.delete(key);
    return undefined;
  },
  async requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist && !this.persisted) this.persisted = await navigator.storage.persist();
    } catch (e) { /* ignore */ }
  },
  label() {
    return { indexeddb: 'Base de données de l’appareil (IndexedDB)', localstorage: 'Stockage local du navigateur', memory: 'Mémoire temporaire (non conservée)' }[this.engine];
  },
};
function idbOpen(name, version) {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(name, version);
    r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error('blocked'));
  });
}
function idbReq(req) {
  return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
}

/* Lit l’état brut (avant migration) : base principale, ou copie miroir si elle est plus récente. */
async function loadRaw() {
  let s = null;
  try { s = await Store.get('state'); } catch (e) { s = null; }
  let mirror = null;
  try { const raw = lsGet('cadence:mirror'); mirror = raw ? JSON.parse(raw) : null; } catch (e) { mirror = null; }
  if (mirror && (!s || String((mirror.meta || {}).updatedAt || '') > String((s.meta || {}).updatedAt || ''))) s = mirror;
  return s && typeof s === 'object' ? s : null;
}

let saveTimer = 0;
let dirty = false;
function commit() {
  state.meta.updatedAt = new Date().toISOString();
  dirty = true;
  Stats.reset();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 180);
}
async function flush() {
  if (!dirty) return;
  dirty = false;
  try {
    await Store.set('state', state);
    if (Store.engine === 'indexeddb') {
      const json = JSON.stringify(state);
      if (json.length < 2500000) lsSet('cadence:mirror', json);
    }
    Store.lastSavedAt = Date.now();
    if (Store.error) { Store.error = null; renderBanners(); }
  } catch (e) {
    console.error('Enregistrement impossible', e);
    Store.error = e;
    dirty = true;
    renderBanners();
  }
}

/* ---------- Annulation de la dernière action ----------
   On photographie les seules parties de l’état qui changent lors d’une action
   (quelques dizaines de kilo-octets), ce qui évite d’écrire une opération
   inverse par action et donc toute une classe de bugs. La pile vit en mémoire :
   elle est volontairement perdue à la fermeture de l’app. */
const UNDO_SLICES = ['habits', 'completions', 'partials', 'tasks', 'journal', 'reviews', 'snoozes', 'categories', 'records', 'achievements', 'celebrated', 'goals', 'pauses', 'notes', 'insights', 'milestones'];
const Undo = {
  stack: [],
  max: 15,
  snapshot() {
    const out = {};
    for (const key of UNDO_SLICES) out[key] = deepCopy(state[key]);
    return out;
  },
  push(label) {
    this.stack.push({ label, at: Date.now(), data: this.snapshot() });
    if (this.stack.length > this.max) this.stack.shift();
  },
  can() { return this.stack.length > 0; },
  last() { return this.stack[this.stack.length - 1] || null; },
  clear() { this.stack = []; },
  /* Restaure la dernière photo et renvoie son libellé, ou null s’il n’y a rien à annuler. */
  pop() {
    const entry = this.stack.pop();
    if (!entry) return null;
    for (const key of UNDO_SLICES) if (entry.data[key] !== undefined) state[key] = entry.data[key];
    return entry.label;
  },
};

/* ---------- Sauvegardes automatiques ---------- */
const Backups = {
  async list() { try { return (await Store.get('backups')) || []; } catch (e) { return []; } },
  async create(reason = 'manuelle', from = null) {
    const list = await this.list();
    const id = uid();
    const snapshot = deepCopy(from || state);
    snapshot.habits = Array.isArray(snapshot.habits) ? snapshot.habits : [];
    snapshot.completions = snapshot.completions && typeof snapshot.completions === 'object' ? snapshot.completions : {};
    await Store.set('backup:' + id, snapshot);
    list.unshift({ id, at: new Date().toISOString(), reason, version: APP.version, habits: snapshot.habits.length, checks: countChecks(snapshot) });
    const keepAuto = Store.engine === 'localstorage' ? 2 : 7;
    const keepOther = Store.engine === 'localstorage' ? 2 : 6;
    let a = 0; let o = 0;
    const kept = [];
    for (const b of list) {
      const isAuto = b.reason === 'auto';
      if ((isAuto && a < keepAuto) || (!isAuto && o < keepOther)) { kept.push(b); if (isAuto) a++; else o++; } else { try { await Store.del('backup:' + b.id); } catch (e) { /* ignore */ } }
    }
    await Store.set('backups', kept);
    return id;
  },
  /* Relit une sauvegarde et compare son contenu à l’original : une sauvegarde
     qu’on n’a pas relue n’est qu’un espoir. */
  async verify(id, from) {
    try {
      const snap = await this.read(id);
      if (!snap || !Array.isArray(snap.habits)) return false;
      return snap.habits.length === (from.habits || []).length && countChecks(snap) === countChecks(from)
        && (snap.tasks || []).length === (from.tasks || []).length;
    } catch (e) { return false; }
  },
  async daily() {
    try {
      const list = await this.list();
      const today = todayKey();
      if (!list.some((b) => b.reason === 'auto' && keyOfISO(b.at) === today) && (state.habits.length || state.tasks.length)) await this.create('auto');
    } catch (e) { /* ignore */ }
  },
  async read(id) { return Store.get('backup:' + id); },
};
function countChecks(s) {
  let n = 0;
  for (const k in s.completions) n += Object.keys(s.completions[k]).length;
  const p = s.partials || {};
  for (const k in p) n += Object.keys(p[k]).length;
  return n;
}
const BACKUP_REASONS = { auto: 'Automatique (quotidienne)', manuelle: 'Manuelle', 'avant mise à jour': 'Avant une mise à jour', 'avant migration': 'Avant la conversion des données', 'avant import': 'Avant un import', 'avant restauration': 'Avant une restauration', 'avant réinitialisation': 'Avant une réinitialisation', 'avant réparation': 'Avant une réparation' };

/* ---------- Export / import ---------- */
function exportPayload() {
  return { app: 'Cadence', format: 2, version: APP.version, schema: APP.schema, exportedAt: new Date().toISOString(), device: (state.meta || {}).deviceId || null, state };
}
function parseImport(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error('Ce fichier n’est pas un JSON valide.'); }
  const s = data && data.state ? data.state : data;
  if (!s || typeof s !== 'object' || !Array.isArray(s.habits) || typeof s.completions !== 'object') throw new Error('Ce fichier ne ressemble pas à une sauvegarde Cadence.');
  return migrate(deepCopy(s));
}

/* Nom de fichier lisible et trié chronologiquement. */
function stampName(prefix, ext) {
  const z = zoned();
  return `${prefix}-${z.y}-${D.pad(z.m)}-${D.pad(z.d)}-${D.pad(z.h)}h${D.pad(z.min)}.${ext}`;
}

/* ---------- Export tableur (CSV) ----------
   Séparateur point-virgule et BOM : c’est ce qu’attend Excel en français.
   Une ligne par jour et par habitude, plus un onglet de tâches en second fichier. */
function csvCell(v) {
  const s = String(v ?? '');
  return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function csvRows(rows) { return '﻿' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n') + '\r\n'; }

/* Options communes : période { from, to } et catégories retenues (null = toutes). */
function exportScope(opts = {}) {
  const first = earliestStart() || ui.today;
  const from = opts.from && opts.from > first ? opts.from : first;
  const to = opts.to && opts.to < ui.today ? opts.to : ui.today;
  const cats = Array.isArray(opts.cats) && opts.cats.length ? new Set(opts.cats) : null;
  const keep = (h) => !cats || cats.has(h.categoryId || 'none');
  return { from, to, keep };
}
const STATE_LABEL = { done: 'complète', part: 'mini-version', miss: 'manquée', pending: 'en cours', bonus: 'bonus', off: 'repos', pause: 'pause', flex: 'au choix', na: 'hors période', future: 'à venir', 'off-future': 'repos', 'flex-future': 'au choix' };

/* Validations : une ligne par jour et par habitude, avec l’état calculé par les mêmes
   règles que les statistiques de l’app. */
function habitsCSV(opts = {}) {
  const rows = [['Date', 'Jour', 'Habitude', 'Catégorie', 'État', 'Compte dans le taux', 'Crédit', 'Heure de validation', 'Rythme en vigueur', 'Journal du jour']];
  if (!earliestStart()) return csvRows(rows);
  const { from, to, keep } = exportScope(opts);
  const habits = [...state.habits].filter(keep).sort(byOrder);
  for (let k = from; k <= to; k = D.add(k, 1)) {
    const note = (state.journal[k] || {}).text || '';
    for (const h of habits) {
      const st = dayState(h, k);
      if (st === 'na') continue;
      const ts = (state.completions[k] || {})[h.id] || (state.partials[k] || {})[h.id];
      if ((st === 'off' || st === 'flex') && !ts) continue;
      const counted = ['done', 'part', 'miss'].includes(st);
      const credit = st === 'done' ? 1 : st === 'part' ? PARTIAL_WEIGHT : st === 'miss' ? 0 : '';
      const cat = catById(h.categoryId);
      rows.push([k, WD_LONG[D.dow(k)], h.name, cat ? cat.name : '', STATE_LABEL[st] || st, counted ? 'oui' : 'non', String(credit).replace('.', ','), ts ? F.timeOfISO(ts) : '', freqLabel(configAt(h, k)), note]);
    }
  }
  return csvRows(rows);
}
/* Liste des habitudes et de leurs réglages actuels. */
function habitsListCSV(opts = {}) {
  const { keep } = exportScope(opts);
  const rows = [['Habitude', 'Catégorie', 'Statut', 'Rythme', 'Heure', 'Durée (min)', 'Mini-version', 'Objectif de série', 'Début', 'Archivée le', 'Favori', 'Changements de réglage', 'Description']];
  [...state.habits].filter(keep).sort(byOrder).forEach((h) => {
    const cat = catById(h.categoryId);
    const c = configAt(h, ui.today);
    rows.push([h.name, cat ? cat.name : '', h.archivedAt ? 'archivée' : (isPausedToday(h) ? 'en pause' : 'active'), freqLabel(c), c.time || '', h.duration || '', c.minLabel || '', c.streakGoal || '', h.startDate, h.archivedAt || '', h.favorite ? 'oui' : 'non', Math.max(0, (h.history || []).length - 1), h.description || '']);
  });
  return csvRows(rows);
}
function tasksCSV(opts = {}) {
  const { from, to } = exportScope(opts);
  const rows = [['Date', 'Tâche', 'Type', 'Priorité', 'Heure', 'Durée (min)', 'Terminée', 'Terminée le', 'Date initiale', 'Reports', 'Notes']];
  const pr = (t) => (PRIORITIES[t.priority] || {}).name || t.priority;
  const list = [];
  state.tasks.forEach((t) => {
    if (!t.recurrence) { if (!opts.from || (t.date >= from && t.date <= to)) list.push([t.date, t, taskDoneOn(t, t.date), t.doneAt]); return; }
    for (let k = D.max(t.date, from); k <= to; k = D.add(k, 1)) if (taskOccursOn(t, k)) list.push([k, t, taskDoneOn(t, k), taskDoneAtOn(t, k)]);
  });
  list.sort((a, b) => a[0].localeCompare(b[0])).forEach(([k, t, done, at]) => {
    rows.push([k, t.title, t.recurrence ? `récurrente (${recurrenceLabel(t.recurrence).toLowerCase()})` : 'ponctuelle', pr(t), t.time || '', t.duration || '', done ? 'oui' : 'non', at ? F.full(keyOfISO(at)) : '', t.originDate || '', (t.postponed || []).length || '', t.notes || '']);
  });
  return csvRows(rows);
}
/* Journal, notes et rétrospectives dans un même fichier, triés par date. */
function journalCSV(opts = {}) {
  const { from, to, keep } = exportScope(opts);
  const rows = [['Date', 'Fin', 'Type', 'Habitude', 'Texte']];
  const out = [];
  for (const k in state.journal) if (k >= from && k <= to && state.journal[k].text) out.push([k, '', 'journal', '', state.journal[k].text]);
  state.notes.forEach((n) => {
    const h = n.habitId ? habitById(n.habitId) : null;
    if (h && !keep(h)) return;
    if ((n.to || n.from) < from || n.from > to) return;
    out.push([n.from, n.to || '', 'note', h ? h.name : '', n.text]);
  });
  Object.keys(state.reviews).forEach((ws) => {
    if (ws < from || ws > to) return;
    const r = state.reviews[ws];
    const text = [r.worked && `Ce qui a fonctionné : ${r.worked}`, r.blocked && `Ce qui a bloqué : ${r.blocked}`, r.change && `Changement : ${r.change}`, r.note].filter(Boolean).join(' · ');
    out.push([ws, D.add(ws, 6), 'rétrospective', '', text]);
  });
  out.sort((a, b) => a[0].localeCompare(b[0])).forEach((r) => rows.push(r));
  return csvRows(rows);
}
/* Réglages seuls (JSON) : apparence, objectifs, catégories. Ne contient aucune validation. */
function settingsJSON() {
  return JSON.stringify({ app: 'Cadence', kind: 'réglages', version: APP.version, exportedAt: new Date().toISOString(), settings: state.settings, goals: state.goals, categories: state.categories, profile: { name: state.profile.name } }, null, 2);
}

/* =====================================================================
   INTÉGRITÉ — vérification des données, réparation, migration à blanc
   ---------------------------------------------------------------------
   La vérification ne modifie rien. La réparation ne touche qu’aux points
   sans ambiguïté (validations orphelines, doublons, dates impossibles…),
   et toujours après une sauvegarde. La migration est d’abord jouée sur
   une copie : si un seul compteur ne correspond pas, rien n’est écrit.
   ===================================================================== */

const isDayKey = (k) => /^\d{4}-\d{2}-\d{2}$/.test(k || '') && !Number.isNaN(D.utc(k)) && D.fromUTC(D.utc(k)) === k;
const mapCount = (m) => { let n = 0; for (const k in m || {}) { const d = m[k]; if (d && typeof d === 'object') n += Object.keys(d).length; } return n; };

/* Renvoie la liste des constats : level 'error' (calcul faussé), 'warn' (à corriger),
   'info' (à savoir, sans gravité). `fix` décrit la réparation proposée, si elle existe. */
function checkIntegrity(s) {
  const issues = [];
  const add = (level, code, text, n = 1, fix = null) => { if (n > 0) issues.push({ level, code, text, n, fix }); };
  const today = todayKey();
  const habits = Array.isArray(s.habits) ? s.habits : [];
  if (!Array.isArray(s.habits)) add('error', 'habits', 'La liste des habitudes est absente.');
  const ids = new Map();
  let dupIds = 0;
  habits.forEach((h) => { if (ids.has(h.id)) dupIds++; ids.set(h.id, h); });
  add('error', 'dup-habit', `${plural(dupIds, 'habitude porte', 'habitudes portent')} le même identifiant qu’une autre.`, dupIds);

  /* Validations */
  let badKeys = 0; let orphans = 0; let future = 0; let outOfLife = 0; let dup = 0; let badTs = 0; let empty = 0;
  for (const map of ['completions', 'partials']) {
    const m = s[map] || {};
    for (const k in m) {
      const day = m[k];
      if (!isDayKey(k) || !day || typeof day !== 'object') { badKeys++; continue; }
      if (!Object.keys(day).length) { empty++; continue; }
      for (const id in day) {
        const h = ids.get(id);
        if (!h) orphans++;
        else if (k < h.startDate || (h.archivedAt && k >= h.archivedAt)) outOfLife++;
        if (k > today) future++;
        if (Number.isNaN(Date.parse(day[id]))) badTs++;
        if (map === 'partials' && s.completions && s.completions[k] && s.completions[k][id]) dup++;
      }
    }
  }
  add('error', 'bad-day', `${plural(badKeys, 'jour enregistré a', 'jours enregistrés ont')} une date illisible.`, badKeys, 'Retirer ces entrées.');
  add('warn', 'orphan', `${plural(orphans, 'validation appartient', 'validations appartiennent')} à une habitude supprimée. Elles n’apparaissent nulle part.`, orphans, 'Retirer ces validations.');
  add('warn', 'future', `${plural(future, 'validation est datée', 'validations sont datées')} dans le futur (souvent après un changement de fuseau horaire).`, future, 'Retirer ces validations.');
  add('warn', 'dup', `${plural(dup, 'journée est', 'journées sont')} à la fois complète et en mini-version.`, dup, 'Garder la validation complète.');
  add('warn', 'bad-ts', `${plural(badTs, 'validation a', 'validations ont')} une heure illisible.`, badTs, 'Remplacer par midi ce jour-là.');
  add('info', 'empty-day', `${plural(empty, 'jour vide est resté', 'jours vides sont restés')} dans la base.`, empty, 'Les retirer.');
  add('info', 'out-of-life', `${plural(outOfLife, 'validation tombe', 'validations tombent')} avant le début ou après l’archivage de leur habitude : elles sont ignorées dans les calculs.`, outOfLife);

  /* Habitudes et réglages datés */
  let badCat = 0; let badHist = 0; let badArch = 0; let badPhase = 0;
  const cats = new Set((s.categories || []).map((c) => c.id));
  habits.forEach((h) => {
    if (h.categoryId && !cats.has(h.categoryId)) badCat++;
    if (h.archivedAt && h.archivedAt < h.startDate) badArch++;
    const hist = h.history || [];
    if (!hist.length || hist[0].from !== h.startDate || hist.some((v, i) => i && v.from <= hist[i - 1].from)) badHist++;
    if (h.phase && (!PHASES[h.phase.kind] || h.phase.to < h.phase.from)) badPhase++;
  });
  add('warn', 'cat', `${plural(badCat, 'habitude pointe', 'habitudes pointent')} vers une catégorie supprimée.`, badCat, 'Les passer « Sans catégorie ».');
  add('error', 'history', `${plural(badHist, 'habitude a', 'habitudes ont')} un historique de réglages incohérent.`, badHist, 'Remettre l’historique en ordre.');
  add('warn', 'archive', `${plural(badArch, 'habitude est archivée', 'habitudes sont archivées')} avant sa date de début.`, badArch, 'Ramener la date d’archivage au début.');
  add('warn', 'phase', `${plural(badPhase, 'cycle est', 'cycles sont')} mal daté${badPhase > 1 ? 's' : ''}.`, badPhase, 'Les clore.');

  /* Pauses */
  let badPause = 0; let pauseOrphan = 0;
  (s.pauses || []).forEach((p) => {
    if (!isDayKey(p.from) || (p.to && (!isDayKey(p.to) || p.to < p.from))) badPause++;
    if (!p.all) pauseOrphan += (p.habits || []).filter((id) => !ids.has(id)).length;
  });
  add('error', 'pause', `${plural(badPause, 'pause est mal datée', 'pauses sont mal datées')}.`, badPause, 'Les retirer.');
  add('info', 'pause-orphan', `${plural(pauseOrphan, 'pause vise', 'pauses visent')} une habitude supprimée.`, pauseOrphan, 'Retirer ces habitudes de la pause.');

  /* Tâches */
  let taskDate = 0; let taskDoneAt = 0; let taskDates = 0;
  (s.tasks || []).forEach((t) => {
    if (!isDayKey(t.date)) taskDate++;
    if (!t.recurrence && t.done && !t.doneAt) taskDoneAt++;
    for (const k in t.doneDates || {}) if (!isDayKey(k)) taskDates++;
  });
  add('error', 'task-date', `${plural(taskDate, 'tâche a', 'tâches ont')} une date illisible.`, taskDate, 'Les dater d’aujourd’hui.');
  add('info', 'task-doneat', `${plural(taskDoneAt, 'tâche terminée n’a', 'tâches terminées n’ont')} pas de date de fin.`, taskDoneAt, 'Utiliser leur date prévue.');
  add('warn', 'task-dates', `${plural(taskDates, 'occurrence de tâche récurrente a', 'occurrences de tâches récurrentes ont')} une date illisible.`, taskDates, 'Les retirer.');

  /* Journal, notes, bilans */
  let jEmpty = 0; let jBad = 0;
  for (const k in s.journal || {}) { if (!isDayKey(k)) jBad++; else if (!String((s.journal[k] || {}).text || '').trim()) jEmpty++; }
  add('warn', 'journal-bad', `${plural(jBad, 'ligne de journal a', 'lignes de journal ont')} une date illisible.`, jBad, 'Les retirer.');
  add('info', 'journal-empty', `${plural(jEmpty, 'ligne de journal est vide', 'lignes de journal sont vides')}.`, jEmpty, 'Les retirer.');
  const noteOrphan = (s.notes || []).filter((n) => n.habitId && !ids.has(n.habitId)).length;
  add('info', 'note-orphan', `${plural(noteOrphan, 'note était liée', 'notes étaient liées')} à une habitude supprimée.`, noteOrphan, 'Les garder comme notes générales.');
  const badReview = Object.keys(s.reviews || {}).filter((k) => !isDayKey(k)).length;
  add('warn', 'review', `${plural(badReview, 'rétrospective a', 'rétrospectives ont')} une date illisible.`, badReview, 'Les retirer.');

  const errors = issues.filter((x) => x.level === 'error').length;
  const warnings = issues.filter((x) => x.level === 'warn').length;
  return {
    issues, errors, warnings, infos: issues.length - errors - warnings, fixable: issues.filter((x) => x.fix).length, ok: errors === 0 && warnings === 0,
    counts: { habits: habits.length, checks: mapCount(s.completions) + mapCount(s.partials), tasks: (s.tasks || []).length, journal: Object.keys(s.journal || {}).length, notes: (s.notes || []).length, pauses: (s.pauses || []).length },
  };
}

/* Applique les réparations sans ambiguïté sur une copie et la renvoie avec la liste
   de ce qui a été fait. Les validations hors période ne sont jamais supprimées. */
function repairState(src) {
  const s = deepCopy(src);
  const done = [];
  const today = todayKey();
  const ids = new Set();
  const seen = new Set();
  s.habits = (s.habits || []).filter((h) => { if (seen.has(h.id)) { done.push(`Doublon d’habitude retiré : ${h.name}`); return false; } seen.add(h.id); ids.add(h.id); return true; });
  const counts = { orphan: 0, future: 0, dup: 0, ts: 0, keys: 0, empty: 0 };
  for (const map of ['completions', 'partials']) {
    const m = s[map] || (s[map] = {});
    for (const k of Object.keys(m)) {
      const day = m[k];
      if (!isDayKey(k) || !day || typeof day !== 'object') { delete m[k]; counts.keys++; continue; }
      for (const id of Object.keys(day)) {
        if (!ids.has(id)) { delete day[id]; counts.orphan++; continue; }
        if (k > today) { delete day[id]; counts.future++; continue; }
        if (map === 'partials' && s.completions[k] && s.completions[k][id]) { delete day[id]; counts.dup++; continue; }
        if (Number.isNaN(Date.parse(day[id]))) { day[id] = localISO(k, '12:00'); counts.ts++; }
      }
      if (!Object.keys(day).length) { delete m[k]; counts.empty++; }
    }
  }
  if (counts.keys) done.push(`${counts.keys} jour(s) à la date illisible retiré(s)`);
  if (counts.orphan) done.push(`${counts.orphan} validation(s) d’habitudes supprimées retirée(s)`);
  if (counts.future) done.push(`${counts.future} validation(s) datée(s) dans le futur retirée(s)`);
  if (counts.dup) done.push(`${counts.dup} doublon(s) complète / mini-version résolu(s)`);
  if (counts.ts) done.push(`${counts.ts} heure(s) illisible(s) remplacée(s)`);
  const cats = new Set((s.categories || []).map((c) => c.id));
  s.habits.forEach((h) => {
    if (h.categoryId && !cats.has(h.categoryId)) { h.categoryId = null; done.push(`« ${h.name} » passe sans catégorie`); }
    if (h.archivedAt && h.archivedAt < h.startDate) { h.archivedAt = h.startDate; done.push(`Date d’archivage de « ${h.name} » corrigée`); }
    const before = JSON.stringify(h.history || []);
    ensureHistory(h);
    if (JSON.stringify(h.history) !== before) done.push(`Historique des réglages de « ${h.name} » remis en ordre`);
    if (h.phase && (!PHASES[h.phase.kind] || h.phase.to < h.phase.from)) { h.phase = null; done.push(`Cycle mal daté de « ${h.name} » clos`); }
  });
  const pausesBefore = (s.pauses || []).length;
  s.pauses = (s.pauses || []).filter((p) => isDayKey(p.from) && (!p.to || (isDayKey(p.to) && p.to >= p.from))).map((p) => (p.all ? p : { ...p, habits: (p.habits || []).filter((id) => ids.has(id)) })).filter((p) => p.all || p.habits.length);
  if (s.pauses.length !== pausesBefore) done.push(`${pausesBefore - s.pauses.length} pause(s) invalide(s) retirée(s)`);
  (s.tasks || []).forEach((t) => {
    if (!isDayKey(t.date)) { t.date = today; done.push(`Tâche « ${t.title} » datée d’aujourd’hui`); }
    if (!t.recurrence && t.done && !t.doneAt) t.doneAt = localISO(t.date, '12:00');
    for (const k of Object.keys(t.doneDates || {})) if (!isDayKey(k)) delete t.doneDates[k];
  });
  for (const k of Object.keys(s.journal || {})) if (!isDayKey(k) || !String((s.journal[k] || {}).text || '').trim()) delete s.journal[k];
  (s.notes || []).forEach((n) => { if (n.habitId && !ids.has(n.habitId)) n.habitId = null; });
  for (const k of Object.keys(s.reviews || {})) if (!isDayKey(k)) delete s.reviews[k];
  return { state: s, done };
}

/* Vérifie le stockage lui-même : base principale relisible, copie miroir, sauvegardes. */
async function checkStorage() {
  const out = [];
  try {
    const main = await Store.get('state');
    if (!main) out.push({ level: 'warn', text: 'La base principale est vide : les données ne vivent que dans la copie de secours.' });
    else if (String((main.meta || {}).updatedAt || '') < String(state.meta.updatedAt || '')) out.push({ level: 'info', text: 'Un enregistrement est en attente : il sera écrit dans quelques secondes.' });
    else out.push({ level: 'ok', text: `Base principale relue sans erreur (${Store.label()}).` });
  } catch (e) { out.push({ level: 'error', text: 'La base principale ne peut pas être relue.' }); }
  if (Store.engine === 'indexeddb') {
    const raw = lsGet('cadence:mirror');
    if (!raw) out.push({ level: 'info', text: 'Pas de copie de secours locale (données volumineuses ou stockage plein).' });
    else { try { JSON.parse(raw); out.push({ level: 'ok', text: 'Copie de secours locale lisible.' }); } catch (e) { out.push({ level: 'warn', text: 'La copie de secours locale est illisible.' }); } }
  }
  const list = await Backups.list();
  let okN = 0; const broken = [];
  for (const b of list) {
    try { const snap = await Backups.read(b.id); if (snap && Array.isArray(snap.habits) && snap.completions) okN++; else broken.push(b); } catch (e) { broken.push(b); }
  }
  if (list.length) out.push({ level: broken.length ? 'warn' : 'ok', text: `${okN} sauvegarde${okN > 1 ? 's' : ''} interne${okN > 1 ? 's' : ''} relue${okN > 1 ? 's' : ''} sans erreur${broken.length ? `, ${broken.length} illisible${broken.length > 1 ? 's' : ''}` : ''}.`, broken });
  else out.push({ level: 'info', text: 'Aucune sauvegarde interne pour l’instant : la première est créée aujourd’hui.' });
  if (Store.persisted === false) out.push({ level: 'info', text: 'Le navigateur n’a pas garanti la conservation des données : installe Cadence sur l’écran d’accueil et exporte régulièrement.' });
  return out;
}

/* ---------- Migration testée sur une copie ----------
   On convertit une copie, puis on compare ce qui doit l’être : nombre d’habitudes, de
   validations, de mini-versions, de tâches, de lignes de journal, de rétrospectives, et
   pour chaque habitude ses dates et ses jours prévus. Les calculs ne dépendent que de
   ces éléments : s’ils sont identiques, les statistiques le sont aussi. */
const Migration = {
  dryRun(raw) {
    let after;
    try { after = migrate(deepCopy(raw)); } catch (e) { return { ok: false, error: `La conversion a échoué : ${e.message}`, checks: [] }; }
    if (!after) return { ok: false, error: 'Les données enregistrées sont illisibles.', checks: [] };
    const validHabits = (raw.habits || []).filter((h) => h && h.id);
    const rawPartials = (() => {
      let n = 0; const p = raw.partials || {}; const c = raw.completions || {};
      for (const k in p) for (const id in p[k] || {}) if (!(c[k] && c[k][id])) n++;
      return n;
    })();
    const checks = [];
    const cmp = (label, a, b) => checks.push({ label, a, b, ok: a === b });
    cmp('Habitudes', validHabits.length, after.habits.length);
    cmp('Validations complètes', mapCount(raw.completions), mapCount(after.completions));
    cmp('Mini-versions', rawPartials, mapCount(after.partials));
    cmp('Tâches', (raw.tasks || []).filter((t) => t && t.id).length, after.tasks.length);
    cmp('Lignes de journal', Object.keys(raw.journal || {}).length, Object.keys(after.journal).length);
    cmp('Rétrospectives', Object.keys(raw.reviews || {}).length, Object.keys(after.reviews).length);
    cmp('Catégories', (raw.categories || []).filter((c) => c && c.id).length || after.categories.length, after.categories.length);
    let schedOk = 0;
    for (const rh of validHabits) {
      const h = after.habits.find((x) => x.id === rh.id);
      if (!h) continue;
      const days = cleanDays(rh.days).join();
      const sameDates = (!isDayKey(rh.startDate) || h.startDate === rh.startDate) && (rh.archivedAt || null) === (h.archivedAt || null);
      const sameDays = (h.history || []).every((v) => v.freq.type === 'days' && v.days.join() === days);
      if (sameDates && sameDays) schedOk++;
    }
    cmp('Habitudes au calendrier identique', validHabits.length, schedOk);
    const ok = checks.every((c) => c.ok);
    return { ok, state: after, checks, integrity: checkIntegrity(after), error: ok ? null : 'Un compteur ne correspond pas après conversion.' };
  },
};

/* =====================================================================
   CHIFFREMENT DES SAUVEGARDES EXPORTÉES
   ---------------------------------------------------------------------
   AES-GCM 256 bits, clé dérivée du mot de passe par PBKDF2-SHA-256
   (600 000 itérations, sel aléatoire). Tout se passe dans le navigateur,
   avec l’API Web Crypto : le mot de passe n’est ni enregistré ni envoyé.
   Sans le mot de passe, le fichier est illisible, y compris pour Cadence :
   il n’existe aucune porte de secours. Seul l’indice facultatif est en clair.
   ===================================================================== */

const Vault = {
  ITERATIONS: 600000,
  get supported() { return !!(window.crypto && crypto.subtle && window.TextEncoder && ENV.secure); },
  isEncrypted(obj) { return !!obj && obj.format === 'cadence-chiffre' && typeof obj.data === 'string' && !!obj.kdf && !!obj.cipher; },
  async derive(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(password).normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(text, password, hint = '') {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await this.derive(password, salt, this.ITERATIONS);
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text));
    return {
      app: 'Cadence', format: 'cadence-chiffre', v: 1, version: APP.version, exportedAt: new Date().toISOString(),
      note: 'Sauvegarde Cadence chiffrée. Importe-la dans Cadence avec ton mot de passe.',
      hint: String(hint || '').slice(0, 120),
      kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: this.ITERATIONS, salt: b64(salt) },
      cipher: { name: 'AES-GCM', iv: b64(iv) },
      data: b64(new Uint8Array(data)),
    };
  },
  async decrypt(env, password) {
    let key;
    try { key = await this.derive(password, unb64(env.kdf.salt), Number(env.kdf.iterations) || this.ITERATIONS); } catch (e) { throw new Error('Ce fichier chiffré est illisible.'); }
    try {
      const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.cipher.iv) }, key, unb64(env.data));
      return new TextDecoder().decode(buf);
    } catch (e) { throw new Error('Mot de passe incorrect, ou fichier abîmé.'); }
  },
};
function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function unb64(str) {
  const bin = atob(String(str || ''));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
/* Force indicative d’un mot de passe : longueur et variété, sans dictionnaire. */
function passwordStrength(pw) {
  const s = String(pw || '');
  let score = 0;
  if (s.length >= 8) score++;
  if (s.length >= 12) score++;
  if (s.length >= 16) score++;
  if (/[a-z]/.test(s) && /[A-Z]/.test(s)) score++;
  if (/\d/.test(s) && /[^A-Za-z0-9]/.test(s)) score++;
  if (s.length < 8) return { score: 0, label: 'Trop court (8 caractères minimum)', ok: false };
  return { score, label: score <= 1 ? 'Faible' : score <= 3 ? 'Correct' : 'Solide', ok: true };
}

/* =====================================================================
   CALCULS — régularité, séries, tendances, classements, trophées
   Tout est recalculé à partir des données réelles à chaque changement.
   ===================================================================== */

const habitById = (id) => state.habits.find((h) => h.id === id);
const catById = (id) => state.categories.find((c) => c.id === id);
const catColor = (cat) => (cat && PAL[cat.color] ? PAL[cat.color].hex : '#8A8880');
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || a.name.localeCompare(b.name, 'fr');
const activeHabits = () => state.habits.filter((h) => !h.archivedAt).sort(byOrder);
const archivedHabits = () => state.habits.filter((h) => h.archivedAt).sort(byOrder);
const inLife = (h, k) => k >= h.startDate && (!h.archivedAt || k < h.archivedAt);
const isDone = (h, k) => { const d = state.completions[k]; return !!(d && d[h.id]); };
const isPartial = (h, k) => { const d = state.partials[k]; return !!(d && d[h.id]); };
/* Une mini-version maintient la série et compte pour une demi-validation dans les
   pourcentages. Ce choix est expliqué à l’utilisateur dans la page Aide : il évite
   à la fois de punir une journée difficile et de faire passer un minimum pour un
   jour complet. */
const PARTIAL_WEIGHT = 0.5;
const isCounted = (h, k) => isDone(h, k) || isPartial(h, k);
const isWeekly = (h, k = ui.today) => configAt(h, k).freq.type === 'weekly';

const Stats = {
  cache: new Map(),
  reset() { this.cache.clear(); },
  memo(key, fn) { if (!this.cache.has(key)) this.cache.set(key, fn()); return this.cache.get(key); },
};

/* ---------- Pauses ----------
   Une pause couvre toutes les habitudes ou une sélection, d’une date à une autre
   (ou jusqu’à reprise). Un jour en pause n’est ni prévu ni manqué : il sort des
   dénominateurs et gèle les séries. */
function pauseAt(h, k) {
  for (const p of state.pauses) {
    if (k < p.from || (p.to && k > p.to)) continue;
    if (p.all || p.habits.includes(h.id)) return p;
  }
  return null;
}
const isPausedToday = (h) => !!pauseAt(h, ui.today);
function activePauses(k = ui.today) { return state.pauses.filter((p) => k >= p.from && (!p.to || k <= p.to)); }

/* ---------- État d’une habitude pour un jour ----------
   C’est la seule source de vérité des calculs : statistiques, matrice, séries,
   exports et assistant lisent tous cet état.
     done / part  prévue et validée (complète ou mini-version)
     miss         prévue, non validée, journée terminée
     pending      prévue aujourd’hui, pas encore validée (jamais comptée comme manquée)
     future       prévue un jour à venir
     bonus        validée un jour non prévu, en pause, ou au-delà du quota de la semaine
     off          jour de repos (non prévu)
     pause        jour couvert par une pause
     flex         fréquence souple : jour possible, semaine en cours, quota pas encore atteint
     na           hors de la vie de l’habitude (avant le début, après l’archivage) */
function dayState(h, k) {
  return Stats.memo('x:' + h.id + ':' + k, () => {
    if (!inLife(h, k)) return 'na';
    const full = isDone(h, k);
    const part = !full && isPartial(h, k);
    if (pauseAt(h, k)) return full || part ? 'bonus' : 'pause';
    const c = configAt(h, k);
    if (c.freq.type === 'weekly') {
      const ws = weekStartKey(k);
      return weekStates(h, ws).out[D.diff(ws, k)] || 'off';
    }
    const sch = c.days.includes(D.dow(k));
    const today = ui.today;
    if (k > today) return sch ? 'future' : 'off-future';
    if (full) return sch ? 'done' : 'bonus';
    if (part) return sch ? 'part' : 'bonus';
    if (!sch) return 'off';
    return k === today ? 'pending' : 'miss';
  });
}
const EXPECTED = new Set(['done', 'part', 'miss', 'pending', 'future']);
const isScheduled = (h, k) => EXPECTED.has(dayState(h, k));

/* ---------- Fréquence souple : « N fois par semaine » ----------
   L’unité est la semaine (selon le premier jour choisi). Le quota est réduit au prorata
   des jours disponibles quand la semaine est entamée par un début, un archivage ou une
   pause. Les validations comptent dans l’ordre (complètes d’abord) jusqu’au quota ; au-delà,
   c’est du bonus. Les manques ne sont posés qu’à la fin de la semaine, sur ses derniers
   jours disponibles : tant que la semaine court, rien n’est en retard. */
function weekStates(h, ws) {
  return Stats.memo('w:' + h.id + ':' + ws, () => {
    const today = ui.today;
    const keys = [0, 1, 2, 3, 4, 5, 6].map((i) => D.add(ws, i));
    const out = new Array(7).fill(null);
    const slots = [];
    let count = null;
    keys.forEach((k, i) => {
      if (!inLife(h, k) || pauseAt(h, k)) return;
      const c = configAt(h, k);
      if (c.freq.type !== 'weekly') return;
      if (count === null) count = c.freq.count;
      slots.push(i);
    });
    const closed = keys[6] < today;
    if (!slots.length) return { out, req: 0, counted: 0, credit: 0, closed, met: false, slots: 0, count: 0, done: 0 };
    const avail = slots.length;
    const req = avail >= 7 ? count : Math.min(avail, Math.ceil((count * avail) / 7 - 1e-9));
    const marks = slots.map((i) => { const k = keys[i]; const full = isDone(h, k); return { i, k, full, part: !full && isPartial(h, k) }; });
    const doneList = marks.filter((m) => m.full || m.part).sort((a, b) => (Number(b.full) - Number(a.full)) || (a.i - b.i));
    const counted = doneList.slice(0, req);
    const countedSet = new Set(counted.map((m) => m.i));
    const met = counted.length >= req;
    const missSet = new Set();
    if (closed && !met) {
      marks.filter((m) => !m.full && !m.part).map((m) => m.i).sort((a, b) => b - a)
        .slice(0, req - counted.length).forEach((i) => missSet.add(i));
    }
    for (const m of marks) {
      if (m.full || m.part) out[m.i] = countedSet.has(m.i) ? (m.full ? 'done' : 'part') : 'bonus';
      else if (closed) out[m.i] = missSet.has(m.i) ? 'miss' : 'off';
      else if (m.k > today) out[m.i] = met ? 'off-future' : 'flex-future';
      else out[m.i] = met ? 'off' : 'flex';
    }
    const credit = counted.reduce((a, m) => a + (m.full ? 1 : PARTIAL_WEIGHT), 0);
    return { out, req, counted: counted.length, credit, closed, met, slots: avail, count, done: doneList.length };
  });
}
/* Avancement de la semaine en cours pour une habitude à fréquence souple. */
function weekProgress(h, k = ui.today) { return weekStates(h, weekStartKey(k)); }

/* ---------- Filtres (matrice, statistiques, habitudes) ---------- */
const EMPTY_FILTER = { cat: 'all', habit: 'all', status: 'all' };
function isFiltered(f) { return !!f && ((f.cat || 'all') !== 'all' || (f.habit || 'all') !== 'all' || (f.status || 'all') !== 'all'); }
function filterKey(f) { return isFiltered(f) ? [f.cat || 'all', f.habit || 'all', f.status || 'all'].join('|') : ''; }
function habitFilter(f) {
  if (!isFiltered(f)) return () => true;
  const cat = f.cat || 'all'; const hid = f.habit || 'all'; const status = f.status || 'all';
  return (h) => (cat === 'all' || (catById(h.categoryId) ? h.categoryId : 'none') === cat)
    && (hid === 'all' || h.id === hid)
    && (status === 'all'
      || (status === 'active' && !h.archivedAt)
      || (status === 'archived' && !!h.archivedAt)
      || (status === 'paused' && !h.archivedAt && !!pauseAt(h, ui.today))
      || (status === 'favorite' && !!h.favorite));
}
function filterLabel(f) {
  if (!isFiltered(f)) return 'Toutes les habitudes';
  const parts = [];
  if ((f.habit || 'all') !== 'all') { const h = habitById(f.habit); parts.push(h ? h.name : 'Habitude supprimée'); }
  if ((f.cat || 'all') !== 'all') { const c = catById(f.cat); parts.push(c ? c.name : 'Sans catégorie'); }
  const st = { active: 'actives', archived: 'archivées', paused: 'en pause', favorite: 'favorites' }[f.status];
  if (st) parts.push(st);
  return parts.join(' · ');
}

function dayStats(k, f = null) {
  const fk = filterKey(f);
  return Stats.memo('d:' + k + ':' + fk, () => {
    const keep = habitFilter(f);
    let scheduled = 0; let done = 0; let partial = 0; let bonus = 0; let pending = 0; let missed = 0;
    let paused = 0; let rest = 0; let flex = 0;
    for (const h of state.habits) {
      if (!keep(h)) continue;
      switch (dayState(h, k)) {
        case 'done': scheduled++; done++; break;
        case 'part': scheduled++; partial++; break;
        case 'miss': scheduled++; missed++; break;
        case 'pending': scheduled++; pending++; break;
        case 'future': scheduled++; break;
        case 'bonus': bonus++; break;
        case 'pause': paused++; break;
        case 'off': rest++; break;
        case 'flex': case 'flex-future': flex++; break;
        default: break;
      }
    }
    const credit = done + partial * PARTIAL_WEIGHT;
    return { k, scheduled, done, partial, bonus, pending, missed, paused, rest, flex, credit, pct: scheduled ? credit / scheduled : null };
  });
}
const metGoal = (s) => s.scheduled > 0 && (s.credit / s.scheduled) * 100 >= state.goals.daily - 1e-9;

function earliestStart() {
  let min = null;
  for (const h of state.habits) if (!min || h.startDate < min) min = h.startDate;
  return min;
}

/* Statistiques d’une période. Règle de la journée en cours : elle compte ce qui est déjà
   fait, jamais ce qui reste à faire ; elle n’entre dans les jours actifs (et donc dans la
   régularité) que si l’objectif du jour est déjà atteint. */
function rangeStats(a, b, f = null) {
  const today = ui.today;
  const end = D.min(b, today);
  const r = { scheduled: 0, done: 0, partial: 0, credit: 0, bonus: 0, missed: 0, paused: 0, rest: 0, days: 0, goalDays: 0, perfect: 0, zeroDays: 0, pausedDays: 0, calendarDays: 0 };
  if (a > end) return { ...r, rate: null, fullRate: null, partialRate: null, regularity: null, validations: 0 };
  for (let k = a; k <= end; k = D.add(k, 1)) {
    const s = dayStats(k, f);
    const isToday = k === today;
    r.calendarDays++;
    r.bonus += s.bonus; r.paused += s.paused; r.rest += s.rest;
    if (s.paused && !s.scheduled && !s.done) r.pausedDays++;
    const sched = isToday ? s.scheduled - s.pending : s.scheduled;
    if (!sched) continue;
    r.scheduled += sched; r.done += s.done; r.partial += s.partial; r.credit += s.credit;
    const goal = metGoal(s);
    if (isToday && !goal) continue;
    r.days++;
    if (!isToday) r.missed += s.missed;
    if (s.done === s.scheduled) r.perfect++;
    if (!s.done && !s.partial) r.zeroDays++;
    if (goal) r.goalDays++;
  }
  r.validations = r.done + r.partial + r.bonus;
  r.rate = r.scheduled ? r.credit / r.scheduled : null;
  r.fullRate = r.scheduled ? r.done / r.scheduled : null;
  r.partialRate = r.scheduled ? r.partial / r.scheduled : null;
  r.regularity = r.days ? r.goalDays / r.days : null;
  return r;
}

function monthBounds(y, m) { return [D.key(y, m, 1), D.key(y, m, D.dim(y, m))]; }
function quarterBounds(y, q) { return [D.key(y, q * 3 - 2, 1), D.key(y, q * 3, D.dim(y, q * 3))]; }

/* Série d’une habitude : jours prévus consécutifs réalisés. Une mini-version maintient
   la série ; aujourd’hui non coché ne la casse pas ; une pause la gèle. Pour une
   fréquence souple, la série se compte aussi en semaines où le quota est tenu. */
function habitStreak(h) {
  return Stats.memo('s:' + h.id, () => {
    const today = ui.today;
    const end = h.archivedAt ? D.min(D.add(h.archivedAt, -1), today) : today;
    let cur = 0; let best = 0; let bestEnd = null; let total = 0; let partials = 0; let curMin = 0;
    for (let k = h.startDate; k <= end; k = D.add(k, 1)) {
      if (isDone(h, k)) total++; else if (isPartial(h, k)) partials++;
      const st = dayState(h, k);
      if (st === 'done' || st === 'part') {
        cur++;
        if (st === 'part') curMin++;
        if (cur > best) { best = cur; bestEnd = k; }
      } else if (st === 'miss') { cur = 0; curMin = 0; }
    }
    const weekly = isWeekly(h, D.min(end, today));
    return {
      current: h.archivedAt ? 0 : cur, best, bestEnd, total, partials, currentPartials: h.archivedAt ? 0 : curMin,
      unit: weekly ? 'week' : 'day', weeks: weekly ? weekStreak(h) : null,
    };
  });
}
function weekStreak(h) {
  const today = ui.today;
  const lastWs = weekStartKey(h.archivedAt ? D.min(D.add(h.archivedAt, -1), today) : today);
  let cur = 0; let best = 0; let bestEnd = null;
  for (let ws = weekStartKey(h.startDate); ws <= lastWs; ws = D.add(ws, 7)) {
    const w = weekStates(h, ws);
    if (!w.req) continue;
    if (w.met) { cur++; if (cur > best) { best = cur; bestEnd = ws; } } else if (w.closed) cur = 0;
  }
  return { current: h.archivedAt ? 0 : cur, best, bestEnd };
}
/* Valeur affichée de la série, dans l’unité de l’habitude. */
function streakText(st) {
  if (st.unit === 'week') return `${st.weeks.current}${NB}sem.`;
  return `${st.current}${NB}j`;
}

function habitRange(h, a, b) {
  const end = D.min(b, ui.today);
  let scheduled = 0; let done = 0; let partial = 0; let missed = 0; let paused = 0; let rest = 0; let bonus = 0; let flex = 0;
  for (let k = D.max(a, h.startDate); k <= end; k = D.add(k, 1)) {
    switch (dayState(h, k)) {
      case 'done': scheduled++; done++; break;
      case 'part': scheduled++; partial++; break;
      case 'miss': scheduled++; missed++; break;
      case 'pause': paused++; break;
      case 'off': rest++; break;
      case 'bonus': bonus++; break;
      case 'flex': flex++; break;
      default: break;
    }
  }
  const credit = done + partial * PARTIAL_WEIGHT;
  return { scheduled, done, partial, missed, paused, rest, bonus, flex, credit, rate: scheduled ? credit / scheduled : null, fullRate: scheduled ? done / scheduled : null, partialRate: scheduled ? partial / scheduled : null };
}

/* Série globale : jours consécutifs où l’objectif quotidien est atteint. */
function goalRuns() {
  return Stats.memo('goalruns', () => {
    const first = earliestStart();
    const today = ui.today;
    let cur = 0; let best = 0; let bestEnd = null;
    if (!first) return { current: 0, best: 0, bestEnd: null };
    for (let k = first; k <= today; k = D.add(k, 1)) {
      const s = dayStats(k);
      if (!s.scheduled) continue;
      if (metGoal(s)) { cur++; if (cur > best) { best = cur; bestEnd = k; } } else if (k !== today) cur = 0;
    }
    return { current: cur, best, bestEnd };
  });
}

function totals() {
  return Stats.memo('totals', () => {
    let full = 0; let partial = 0;
    for (const k in state.completions) full += Object.keys(state.completions[k]).length;
    for (const k in state.partials) partial += Object.keys(state.partials[k]).length;
    let perfect = 0; let noZero = 0; let bestNoZero = 0;
    const first = earliestStart();
    if (first) {
      for (let k = first; k <= ui.today; k = D.add(k, 1)) {
        const s = dayStats(k);
        if (!s.scheduled) continue;
        if (s.done === s.scheduled) perfect++;
        if (s.done || s.partial) { noZero++; if (noZero > bestNoZero) bestNoZero = noZero; } else if (k !== ui.today) noZero = 0;
      }
    }
    let bestStreak = { value: 0, habit: '', date: null };
    for (const h of state.habits) {
      const st = habitStreak(h);
      if (st.unit === 'week') continue; // une série en semaines ne se compare pas à une série en jours
      if (st.best > bestStreak.value) bestStreak = { value: st.best, habit: h.name, date: st.bestEnd };
    }
    const rec = state.records.bestStreak;
    if (rec && rec.value > bestStreak.value) bestStreak = rec;
    return {
      checks: full + partial, full, partial, perfect, bestStreak, bestNoZero,
      journal: Object.keys(state.journal).length,
      reviews: Object.keys(state.reviews).length,
      tasksDone: state.tasks.reduce((a, t) => a + (t.recurrence ? Object.keys(t.doneDates || {}).length : (t.done ? 1 : 0)), 0),
    };
  });
}

function tasksDoneBetween(a, b) {
  let n = 0;
  for (const t of state.tasks) {
    if (t.recurrence) { for (const k in t.doneDates || {}) if (k >= a && k <= b) n++; } else if (t.done && t.date >= a && t.date <= b) n++;
  }
  return n;
}

/* Série de points pour le graphique de tendance. */
function trendSeries(range, f = null) {
  const today = ui.today;
  if (range === 365) {
    const out = [];
    const ws = weekStartKey(today);
    for (let w = 51; w >= 0; w--) {
      const a = D.add(ws, -7 * w);
      const r = rangeStats(a, D.add(a, 6), f);
      out.push({ k: a, v: r.rate === null ? null : Math.round(r.rate * 100), done: r.done, partial: r.partial, credit: r.credit, scheduled: r.scheduled, label: `Semaine du ${F.short(a)}` });
    }
    return withAverage(out, 4);
  }
  const start = D.add(today, -(range - 1));
  const out = [];
  for (let k = D.add(start, -6); k <= today; k = D.add(k, 1)) {
    const s = dayStats(k, f);
    out.push({ k, v: s.pct === null ? null : Math.round(s.pct * 100), done: s.done, partial: s.partial, credit: s.credit, scheduled: s.scheduled, label: F.cap(F.dayShort(k)) });
  }
  return withAverage(out, 7).slice(6);
}
function withAverage(points, win) {
  return points.map((p, i) => {
    const slice = points.slice(Math.max(0, i - win + 1), i + 1).filter((q) => q.v !== null);
    const credit = slice.reduce((a, q) => a + q.credit, 0);
    const sch = slice.reduce((a, q) => a + q.scheduled, 0);
    return { ...p, avg: sch ? Math.round((credit / sch) * 100) : null };
  });
}

function weekdayStats(range, f = null) {
  const today = ui.today;
  const start = D.add(today, -(range - 1));
  const acc = Array.from({ length: 7 }, () => ({ done: 0, partial: 0, credit: 0, scheduled: 0 }));
  for (let k = start; k <= today; k = D.add(k, 1)) {
    const s = dayStats(k, f);
    const a = acc[D.dow(k)];
    a.done += s.done; a.partial += s.partial; a.credit += s.credit; a.scheduled += k === today ? s.scheduled - s.pending : s.scheduled;
  }
  return weekOrder().map((d) => ({ dow: d, label: WD_SHORT[d], long: WD_LONG[d], done: acc[d].done, partial: acc[d].partial, scheduled: acc[d].scheduled, v: acc[d].scheduled ? Math.round((acc[d].credit / acc[d].scheduled) * 100) : null }));
}

function topHabits(range, f = null) {
  const today = ui.today;
  const start = D.add(today, -(range - 1));
  const keep = habitFilter(f);
  return state.habits
    .filter(keep)
    .map((h) => ({ h, ...habitRange(h, start, today), streak: habitStreak(h) }))
    .filter((x) => x.scheduled > 0)
    .sort((a, b) => (b.rate - a.rate) || (b.done - a.done) || byOrder(a.h, b.h));
}

/* ---------- Indicateurs détaillés d’une période et comparaison ----------
   « Attendus » = jours où l’habitude était prévue selon la configuration en vigueur ce
   jour-là, hors repos et hors pauses. Les taux portent tous sur ce même dénominateur. */
function periodIndicators(a, b, f = null) {
  const r = rangeStats(a, b, f);
  return {
    a, b, expected: r.scheduled, full: r.done, mini: r.partial, missed: r.missed, bonus: r.bonus,
    rest: r.rest, paused: r.paused, days: r.calendarDays,
    fullRate: r.fullRate, weighted: r.rate, miniRate: r.partialRate, regularity: r.regularity, goalDays: r.goalDays, activeDays: r.days,
  };
}
function horizonBounds(range, endK = ui.today) {
  const a = D.add(endK, -(range - 1));
  return { a, b: endK, pa: D.add(a, -range), pb: D.add(a, -1) };
}
/* Compare deux valeurs de taux en points, sans jugement : « en hausse », « en baisse », « stable ». */
function trendWord(now, before, tol = 2) {
  if (now === null || before === null || now === undefined || before === undefined) return { pts: null, word: 'pas de comparaison', dir: 0 };
  const pts = Math.round((now - before) * 100);
  if (Math.abs(pts) <= tol) return { pts, word: 'stable', dir: 0 };
  return { pts, word: pts > 0 ? 'en hausse' : 'en baisse', dir: pts > 0 ? 1 : -1 };
}

/* ---------- Alerte décrochage ----------
   On compare les 14 derniers jours prévus aux 14 précédents. Une habitude est
   signalée quand sa régularité récente est faible ET qu’elle a nettement baissé :
   l’idée est de prévenir avant la casse de série, pas de commenter chaque trou.
   Les mini-versions comptent, donc quelqu’un qui tient le minimum n’est pas alerté. */
/* La règle est réglable dans Réglages → Assistant : fenêtre, seuil et baisse minimale. */
const DECLINE_MIN_SCHEDULED = 3;
function alertRule() { return state.settings.alert || DEFAULT_ALERT; }
function declining() {
  return Stats.memo('declining', () => {
    const today = ui.today;
    const A = alertRule();
    const win = A.window;
    const out = [];
    for (const h of activeHabits()) {
      const until = state.snoozes[h.id];
      if (until && until > today) continue;
      if (pauseAt(h, today)) continue;
      const recent = habitRange(h, D.add(today, -(win - 1)), today);
      const before = habitRange(h, D.add(today, -(win * 2 - 1)), D.add(today, -win));
      if (recent.scheduled < DECLINE_MIN_SCHEDULED || before.scheduled < DECLINE_MIN_SCHEDULED) continue;
      if (recent.rate === null || before.rate === null) continue;
      const drop = before.rate - recent.rate;
      if (recent.rate > A.threshold / 100 + 1e-9 || drop < A.drop / 100 - 1e-9) continue;
      out.push({ h, recent, before, drop, streak: habitStreak(h), window: win });
    }
    return out.sort((a, b) => b.drop - a.drop);
  });
}

/* ---------- Rétrospective hebdomadaire ---------- */
/* La rétrospective porte sur la dernière semaine terminée (selon le premier jour choisi). */
function reviewTarget() { return D.add(weekStartKey(ui.today), -7); }
function reviewDue() {
  const t = reviewTarget();
  if (state.reviews[t]) return null;
  const until = state.snoozes['review:' + t];
  if (until && until > ui.today) return null;
  return rangeStats(t, D.add(t, 6)).days ? t : null;
}
function weekReview(ws) {
  const we = D.add(ws, 6);
  const per = state.habits
    .filter((h) => inLife(h, ws) || inLife(h, we))
    .map((h) => ({ h, ...habitRange(h, ws, we) }))
    .filter((x) => x.scheduled > 0)
    .sort((a, b) => (b.rate - a.rate) || byOrder(a.h, b.h));
  const notes = [];
  for (let k = ws; k <= we; k = D.add(k, 1)) { const j = state.journal[k]; if (j && j.text) notes.push({ k, text: j.text }); }
  return {
    ws,
    we,
    week: rangeStats(ws, we),
    prev: rangeStats(D.add(ws, -7), D.add(ws, -1)),
    per,
    kept: per.filter((x) => x.rate >= 0.8),
    slipped: per.filter((x) => x.rate < 0.5),
    notes,
    tasks: state.tasks.filter((t) => t.date >= ws && t.date <= we),
    saved: state.reviews[ws] || null,
  };
}
function reviewHistory() {
  return Object.keys(state.reviews).sort((a, b) => b.localeCompare(a)).map((ws) => ({ ws, ...state.reviews[ws] }));
}

/* ---------- Bilan de l’année ---------- */
function yearsWithData() {
  const years = new Set();
  const first = earliestStart();
  if (first) { const a = +D.parse(first)[0]; const b = +D.parse(ui.today)[0]; for (let y = a; y <= b; y++) years.add(y); }
  years.add(+D.parse(ui.today)[0]);
  return [...years].sort((a, b) => b - a);
}
function yearReport(y) {
  return Stats.memo('year:' + y, () => {
    const a = D.key(y, 1, 1);
    const b = D.min(D.key(y, 12, 31), ui.today);
    const year = rangeStats(a, b);
    const months = [];
    for (let m = 1; m <= 12; m++) {
      const [ma, mb] = monthBounds(y, m);
      if (ma > ui.today) break;
      const r = rangeStats(ma, mb);
      months.push({ m, label: F.monthShort(m), long: F.monthYear(y, m), ...r, v: r.rate === null ? null : Math.round(r.rate * 100) });
    }
    const quarters = [];
    for (let q = 1; q <= 4; q++) {
      const [qa, qb] = quarterBounds(y, q);
      if (qa > ui.today) break;
      const r = rangeStats(qa, qb);
      quarters.push({ q, label: `T${q}`, long: `${q === 1 ? '1er' : `${q}e`} trimestre`, a: qa, b: qb, ...r, v: r.rate === null ? null : Math.round(r.rate * 100) });
    }
    const active = months.filter((m) => m.days > 0);
    const best = active.length ? active.reduce((x, m) => (m.rate > x.rate ? m : x)) : null;
    const worst = active.length ? active.reduce((x, m) => (m.rate < x.rate ? m : x)) : null;
    const per = state.habits
      .map((h) => ({ h, ...habitRange(h, a, b), streak: habitStreak(h) }))
      .filter((x) => x.scheduled > 0)
      .sort((x, z) => (z.rate - x.rate) || byOrder(x.h, z.h));
    const added = state.habits.filter((h) => h.startDate >= a && h.startDate <= D.key(y, 12, 31)).sort(byOrder);
    const dropped = state.habits.filter((h) => h.archivedAt && h.archivedAt >= a && h.archivedAt <= D.key(y, 12, 31)).sort(byOrder);
    const notes = [];
    for (const k in state.journal) if (k >= a && k <= b && state.journal[k].text) notes.push({ k, text: state.journal[k].text });
    notes.sort((x, z) => x.k.localeCompare(z.k));
    let bestStreak = { value: 0, name: '', date: null };
    for (const x of per) if (x.streak.unit !== 'week' && x.streak.best > bestStreak.value) bestStreak = { value: x.streak.best, name: x.h.name, date: x.streak.bestEnd };
    return {
      y, a, b, year, months, quarters, best, worst, per, added, dropped, notes, bestStreak,
      tasksDone: tasksDoneBetween(a, b),
      reviews: Object.keys(state.reviews).filter((k) => k >= a && k <= b).length,
      complete: b === D.key(y, 12, 31),
    };
  });
}
