  const r = yearReport(y);
  const bars = r.months.map((mo) => ({ label: mo.label, long: mo.long, v: mo.v, m: mo.m }));
  const maxV = bars.reduce((a, b) => (b.v !== null && b.v > a ? b.v : a), 0);
  const chart = bars.length
    ? `<div class="year-bars">${bars.map((b) => `<button type="button" class="year-bar ${b.v === null ? 'none' : ''} ${r.best && b.label === r.best.label ? 'best' : ''}" data-act="month-open" data-y="${y}" data-m="${b.m}" data-tip="${esc(`${F.cap(b.long)} : ${b.v === null ? 'rien de prévu' : P(b.v)}`)}" aria-label="${esc(`${F.cap(b.long)} : ${b.v === null ? 'rien de prévu' : P(b.v)}. Ouvrir le bilan du mois.`)}">
        <i style="--v:${b.v === null ? 0 : Math.round((b.v / Math.max(maxV, 1)) * 100)}"></i><span>${esc(b.label)}</span><b>${b.v === null ? '—' : b.v}</b></button>`).join('')}</div>`
    : '<p class="muted small">Aucune donnée sur cette année.</p>';
  const nav = `<div class="month-nav">
      <button type="button" class="icon-btn" data-act="year-prev" aria-label="Année précédente" ${years.indexOf(y) === years.length - 1 ? 'disabled' : ''}>${icon('chevL')}</button>
      <span class="month-label" style="min-width:76px">${y}</span>
      <button type="button" class="icon-btn" data-act="year-next" aria-label="Année suivante" ${years.indexOf(y) === 0 ? 'disabled' : ''}>${icon('chevR')}</button>
    </div>`;
  const podium = r.per.slice(0, 3);
  const weakest = r.per.length > 3 ? r.per[r.per.length - 1] : null;
  const qs = r.quarters.filter((q) => q.scheduled > 0);
  const quarters = qs.map((q, i) => {
    const prevQ = i ? qs[i - 1] : null;
    return `<div class="tile-stat"><div class="k">${esc(q.label)} · ${esc(q.long)}</div><div class="v">${pctOrDash(q.rate)}</div><div class="d">${q.done} complètes · ${q.partial} mini · ${q.scheduled} attendues</div><div class="d">${prevQ ? trendBadge(trendWord(q.rate, prevQ.rate), { short: true }) : 'premier trimestre'}</div></div>`;
  }).join('');
  const tl = timeline(r.a, r.b).filter((e) => e.type !== 'milestone' || state.settings.badges !== false);
  return `<section class="page-head row-head"><div><p class="eyebrow">${r.complete ? 'Année complète' : 'Année en cours'}</p><h1 class="page-title">Bilan ${y}</h1></div>${nav}</section>
    <div class="tiles four">
      <div class="tile-stat"><div class="k">Taux pondéré</div><div class="v">${pctOrDash(r.year.rate)}</div><div class="d">${r.year.scheduled} jours attendus</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${r.year.validations}</div><div class="d">${r.year.partial ? `dont ${r.year.partial} mini-versions` : 'cases cochées'}</div></div>
      <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${r.year.perfect}</div><div class="d">sur ${r.year.days} jours actifs</div></div>
      <div class="tile-stat"><div class="k">Plus longue série</div><div class="v">${r.bestStreak.value}<small>j</small></div><div class="d" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.bestStreak.value ? esc(r.bestStreak.name) : '—'}</div></div>
    </div>
    <section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('chart')}Mois par mois</h2><span class="sub">${r.best ? `Meilleur mois : ${F.cap(r.best.long)} (${P(r.best.v)})` : 'Régularité par mois'}${r.worst && r.best && r.worst.m !== r.best.m ? ` · Plus difficile : ${F.cap(r.worst.long)} (${P(r.worst.v)})` : ''}. Touche un mois pour son bilan.</span></div></div>
      ${chart}</section>
    ${qs.length ? `<section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('grid')}Trimestre par trimestre</h2><span class="sub">Taux pondéré, et évolution par rapport au trimestre précédent.</span></div></div><div class="tiles">${quarters}</div></section>` : ''}
    <div class="stats-grid">
      <section class="card"><div class="card-head"><h2>${icon('trophy')}Ce qui a le mieux tenu</h2></div>
        ${podium.length ? `<div class="rank">${podium.map((x, i) => `<div class="rank-item"><span class="rank-n">${i + 1}</span>${tile(x.h, 'sm')}<div style="min-width:0"><div class="name">${esc(x.h.name)}</div><div class="bar"><i style="--v:${Math.round(x.rate * 100)}"></i></div><div class="meta">${x.done} jour${x.done > 1 ? 's' : ''} sur ${x.scheduled}${x.partial ? ` · ${x.partial} en mini-version` : ''}</div></div><div class="rank-v"><b>${P(Math.round(x.rate * 100))}</b></div></div>`).join('')}</div>` : '<p class="muted small">Pas encore de données.</p>'}
        ${weakest ? `<p class="small muted" style="margin-top:12px">La plus difficile : <b style="color:var(--ink-1)">${esc(weakest.h.name)}</b> à ${P(Math.round(weakest.rate * 100))}. Une mini-version ou moins de jours l’aideraient peut-être à tenir.</p>` : ''}
      </section>
      <section class="card"><div class="card-head"><h2>${icon('repeat')}Ce qui a changé</h2></div>
        <div class="set-list">
          <div class="set-row"><div class="lbl"><b>Habitudes commencées</b><span>${r.added.length ? r.added.map((h) => esc(h.name)).join(', ') : 'aucune cette année'}</span></div><div class="ctl"><b>${r.added.length}</b></div></div>
          <div class="set-row"><div class="lbl"><b>Habitudes abandonnées</b><span>${r.dropped.length ? r.dropped.map((h) => esc(h.name)).join(', ') : 'aucune — tu as tout gardé'}</span></div><div class="ctl"><b>${r.dropped.length}</b></div></div>
          <div class="set-row"><div class="lbl"><b>Tâches terminées</b><span>sur l’année</span></div><div class="ctl"><b>${r.tasksDone}</b></div></div>
          <div class="set-row"><div class="lbl"><b>Rétrospectives</b><span>semaines passées en revue</span></div><div class="ctl"><b>${r.reviews}</b></div></div>
        </div>
      </section>
    </div>
    <section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('history')}Chronologie</h2><span class="sub">Débuts, réglages modifiés, pauses, cycles, décisions et jalons.</span></div></div>
      ${tl.length ? `<ol class="plain timeline">${tl.slice(0, ui.tlAll ? 400 : 14).map((e) => `<li class="tl-${e.type}">${icon(e.icon)}<div><b>${esc(F.short(e.k))}</b><span>${esc(e.text)}</span>${e.note ? `<i>${esc(e.note)}</i>` : ''}</div></li>`).join('')}</ol>${tl.length > 14 ? `<button type="button" class="link-btn" style="margin-top:10px" data-act="tl-all">${ui.tlAll ? 'Afficher moins' : `Afficher les ${tl.length} événements`}</button>` : ''}` : '<p class="small muted">Rien de marquant cette année pour l’instant.</p>'}
    </section>
    ${r.notes.length ? `<section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('pen')}Ton journal de l’année</h2><span class="sub">${plural(r.notes.length, 'ligne écrite', 'lignes écrites')}</span></div></div>
      <ul class="plain journal-year">${r.notes.slice(-40).reverse().map((n) => `<li><button type="button" data-act="journal-edit" data-k="${n.k}"><b>${esc(F.short(n.k))}</b><span>${esc(n.text)}</span></button></li>`).join('')}</ul></section>` : ''}
    <section class="card"><div class="btn-row"><button type="button" class="btn" data-act="report-open" data-kind="year" data-y="${y}">${icon('print')}Rapport imprimable</button><button type="button" class="btn ghost" data-act="nav" data-view="stats">${icon('chart')}Retour aux statistiques</button></div></section>`;
}

/* =====================================================================
   HABITUDES — liste, favorites, pauses, réorganisation, archives
   ===================================================================== */

function habitFacts(h) {
  const k = ui.today;
  const c = configAt(h, k);
  const st = habitStreak(h);
  const r30 = habitRange(h, D.add(k, -29), k);
  const facts = [`<span>${icon('repeat')}${esc(freqLabel(c))}</span>`];
  if (c.time) facts.push(`<span>${icon('clock')}${c.time}</span>`);
  if (h.duration) facts.push(`<span>${icon('timer')}${F.dur(h.duration)}</span>`);
  facts.push(`<span class="flame">${icon('flame')}${streakText(st)}</span>`);
  facts.push(`<span>${icon('chart')}${r30.rate === null ? '—' : P(Math.round(r30.rate * 100))} sur 30${NB}j</span>`);
  if (c.minLabel) facts.push(`<span>${icon('half')}${esc(c.minLabel)}</span>`);
  const pz = pauseAt(h, k);
  if (pz) facts.push(`<span class="pause-pill">${icon('pause')}En pause${pz.to ? ` jusqu’au ${esc(F.short(pz.to))}` : ''}</span>`);
  if (h.phase && k <= h.phase.to) facts.push(`<span class="phase-pill">${icon(PHASES[h.phase.kind].icon)}${PHASES[h.phase.kind].name} jusqu’au ${esc(F.short(h.phase.to))}</span>`);
  const future = (h.history || []).find((v) => v.from > k);
  if (future) facts.push(`<span class="phase-pill">${icon('history')}${esc(freqShort(future))} dès le ${esc(F.short(future.from))}</span>`);
  return facts.join('');
}

function viewHabits() {
  const active = activeHabits();
  const archived = archivedHabits();
  const status = ui.habitsStatus;
  const pausedN = active.filter((h) => isPausedToday(h)).length;
  const favN = active.filter((h) => h.favorite).length;
  if ((status === 'paused' && !pausedN) || (status === 'favorite' && !favN)) ui.habitsStatus = 'active';
  const pool = active.filter((h) => (ui.habitsStatus === 'paused' ? isPausedToday(h) : ui.habitsStatus === 'favorite' ? h.favorite : true));
  const cats = state.categories;
  const counts = {};
  pool.forEach((h) => { const id = catById(h.categoryId) ? h.categoryId : 'none'; counts[id] = (counts[id] || 0) + 1; });
  if (ui.habitsCat !== 'all' && !counts[ui.habitsCat]) ui.habitsCat = 'all';
  const chips = [['all', 'Toutes', pool.length]].concat(cats.filter((c) => counts[c.id]).map((c) => [c.id, `${catDot(c)}${esc(c.name)}`, counts[c.id]])).concat(counts.none ? [['none', 'Sans catégorie', counts.none]] : []);
  const groups = cats.map((c) => ({ c, list: pool.filter((h) => h.categoryId === c.id) })).concat([{ c: null, list: pool.filter((h) => !catById(h.categoryId)) }])
    .filter((g) => g.list.length && (ui.habitsCat === 'all' || (g.c ? g.c.id : 'none') === ui.habitsCat));
  const card = (h) => {
    const idx = active.indexOf(h);
    return `<article class="card hcard ${h.archivedAt ? 'archived' : ''} ${isPausedToday(h) ? 'paused' : ''}">
        <button type="button" class="hcard-hit" data-act="habit-open" data-id="${h.id}">${tile(h, 'lg')}
          <span style="min-width:0;flex:1"><span class="name" style="display:block">${esc(h.name)}${h.favorite ? `<span class="fav" aria-label="Favorite">${icon('star')}</span>` : ''}</span>${h.description ? `<span class="desc" style="display:block">${esc(h.description)}</span>` : ''}
          <span class="facts">${habitFacts(h)}</span></span>
        </button>
        <div class="hcard-actions">${ui.reorder
    ? `<button type="button" class="icon-btn" data-act="habit-up" data-id="${h.id}" aria-label="Monter ${esc(h.name)}" ${idx === 0 ? 'disabled' : ''}>${icon('arrowUp')}</button><button type="button" class="icon-btn" data-act="habit-down" data-id="${h.id}" aria-label="Descendre ${esc(h.name)}" ${idx === active.length - 1 ? 'disabled' : ''}>${icon('arrowDown')}</button>`
    : `<button type="button" class="icon-btn ${h.favorite ? 'is-fav' : ''}" data-act="habit-fav" data-id="${h.id}" aria-pressed="${!!h.favorite}" aria-label="${h.favorite ? 'Retirer des favorites' : 'Mettre en favorite'} : ${esc(h.name)}">${icon('star')}</button><button type="button" class="icon-btn" data-act="habit-edit" data-id="${h.id}" aria-label="Modifier ${esc(h.name)}">${icon('edit')}</button>`}</div>
      </article>`;
  };
  const body = groups.length
    ? groups.map((g) => `<div><div class="cat-head">${g.c ? catDot(g.c) : ''}${g.c ? esc(g.c.name) : 'Sans catégorie'} <span class="n">${g.list.length}</span></div><div class="habit-cards">${g.list.map(card).join('')}</div></div>`).join('')
    : `<section class="card">${emptyState('repeat', 'Aucune habitude pour l’instant', 'Crée tes habitudes récurrentes : jours fixes ou « 3 fois par semaine », heure, catégorie et icône.', `<div class="btn-row" style="justify-content:center"><button type="button" class="btn primary" data-act="habit-new">${icon('plus')}Nouvelle habitude</button><button type="button" class="btn" data-act="add-samples">${icon('sparkles')}Ajouter les 8 suggestions</button></div>`)}</section>`;
  const arch = archived.length ? `<section class="card"><button type="button" class="btn ghost block" style="justify-content:space-between" data-act="archived-toggle" aria-expanded="${ui.showArchived}">${icon('archive')}<span style="flex:1;text-align:left">Habitudes archivées (${archived.length})</span>${icon(ui.showArchived ? 'chevD' : 'chevR')}</button>
      ${ui.showArchived ? `<div class="rows" style="margin-top:8px">${archived.map((h) => `<div class="row"><button type="button" class="row-hit" data-act="habit-open" data-id="${h.id}">${tile(h, 'sm')}<span class="row-text"><span class="row-title">${esc(h.name)}</span><span class="row-meta"><span>Archivée le ${F.short(h.archivedAt)} · historique conservé</span></span></span></button><button type="button" class="btn sm" data-act="habit-restore" data-id="${h.id}">${icon('restore')}Restaurer</button><button type="button" class="icon-btn" data-act="habit-purge" data-id="${h.id}" aria-label="Supprimer définitivement ${esc(h.name)}">${icon('trash')}</button></div>`).join('')}</div>` : ''}
    </section>` : '';
  const pauses = state.pauses.filter((p) => !p.to || p.to >= ui.today);
  return `<section class="page-head row-head"><div><p class="eyebrow">${plural(active.length, 'habitude active', 'habitudes actives')}</p><h1 class="page-title">Mes habitudes</h1></div>
      <div class="btn-row">${active.length > 1 ? `<button type="button" class="btn sm ${ui.reorder ? 'primary' : ''}" data-act="habits-reorder">${icon(ui.reorder ? 'check' : 'list')}${ui.reorder ? 'Terminé' : 'Réorganiser'}</button>` : ''}<button type="button" class="btn sm" data-act="pauses-open">${icon('pause')}Pauses${pauses.length ? ` <span class="count">${pauses.length}</span>` : ''}</button><button type="button" class="btn sm" data-act="customize-cats">${icon('palette')}Catégories</button></div></section>
    ${active.length ? seg([['active', 'Actives', active.length], ...(pausedN ? [['paused', 'En pause', pausedN]] : []), ...(favN ? [['favorite', `${icon('star')}Favorites`, favN]] : [])], ui.habitsStatus, 'habits-status', 'aria-label="Afficher"') : ''}
    ${chips.length > 2 ? `<div class="filter-row" style="margin-top:12px">${chips.map(([id, l, n]) => `<button type="button" class="chip" data-act="habits-cat" data-v="${id}" aria-pressed="${ui.habitsCat === id}">${l} <span class="muted">${n}</span></button>`).join('')}</div>` : ''}
    ${ui.reorder ? '<p class="hint" style="margin:10px 0 0">L’ordre choisi sert dans le plan du jour, la matrice et les listes.</p>' : ''}
    ${body}${arch}`;
}

async function renderBackupList() {
  const host = $('#backup-list');
  if (!host) return;
  const list = await Backups.list();
  host.innerHTML = list.length
    ? `<ul class="plain activity backups">${list.map((b) => `<li><span>${esc(BACKUP_REASONS[b.reason] || b.reason)}<br><span class="small muted">${esc(F.rel(b.at))} · ${b.habits} habitudes · ${b.checks} validations · v${esc(b.version)}</span></span><span class="btn-row" style="margin-left:auto"><button type="button" class="btn sm ghost" data-act="backup-preview" data-id="${b.id}">${icon('eye')}Aperçu</button><button type="button" class="btn sm" data-act="backup-restore" data-id="${b.id}">Restaurer</button></span></li>`).join('')}</ul>`
    : '<p class="small muted">Une sauvegarde est créée chaque jour, et avant chaque mise à jour ou import.</p>';
  if (navigator.storage && navigator.storage.estimate) {
    try {
      const est = await navigator.storage.estimate();
      const el = $('#storage-est');
      if (el && est && est.usage) el.textContent += ` · ${Math.max(1, Math.round(est.usage / 1024))}${NB}Ko utilisés au total par l’app`;
    } catch (e) { /* ignore */ }
  }
}

function recentItem(x) {
  const b = (act, attrs, ic, title, sub) => `<li><button type="button" data-act="${act}" ${attrs}>${icon(ic)}<span><b>${esc(title)}</b>${esc(sub)}</span>${icon('chevR')}</button></li>`;
  if (x.type === 'habit') { const h = habitById(x.id); return h ? b('habit-open', `data-id="${h.id}"`, 'repeat', h.name, 'Habitude') : ''; }
  if (x.type === 'day') return b('day-open', `data-k="${x.k}"`, 'calendar', F.cap(F.full(x.k)), 'Journée');
  if (x.type === 'review') return b('review-open', `data-k="${x.k}"`, 'list', `Semaine du ${F.short(x.k)}`, 'Rétrospective');
  if (x.type === 'month') return b('month-open', `data-y="${x.y}" data-m="${x.m}"`, 'calendar', F.cap(F.monthYear(x.y, x.m)), 'Bilan du mois');
  if (x.type === 'journal') return b('journal-edit', `data-k="${x.k}"`, 'pen', F.cap(F.long(x.k)), 'Journal');
  if (x.type === 'note') { const n = state.notes.find((z) => z.id === x.id); return n ? b('note-edit', `data-id="${n.id}"`, 'note', n.text.slice(0, 60), 'Note') : ''; }
  return '';
}

function viewSearch() {
  const q = ui.search;
  const o = ui.searchOpts;
  const res = searchAll(q, o);
  const cats = [...new Set(state.habits.map((h) => (catById(h.categoryId) ? h.categoryId : 'none')))];
  const filters = `<div class="filter-row" style="margin-top:12px">${SEARCH_TYPES.map(([v, l]) => `<button type="button" class="chip" data-act="search-opt" data-k="type" data-v="${v}" aria-pressed="${o.type === v}">${l}</button>`).join('')}</div>
    <div class="filter-selects" style="margin-top:10px">
      <select class="select" data-search-opt="period" aria-label="Période">${SEARCH_PERIODS.map(([v, l]) => `<option value="${v}" ${o.period === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select class="select" data-search-opt="cat" aria-label="Catégorie"><option value="all">Toutes les catégories</option>${cats.map((id) => { const c = catById(id); return `<option value="${esc(id)}" ${o.cat === id ? 'selected' : ''}>${esc(c ? c.name : 'Sans catégorie')}</option>`; }).join('')}</select>
      ${o.period === 'custom' ? `<input class="input" type="date" data-search-opt="from" value="${esc(o.from)}" aria-label="Du"><input class="input" type="date" data-search-opt="to" value="${esc(o.to)}" aria-label="Au">` : ''}
    </div>`;
  const recents = Recent.list().map(recentItem).filter(Boolean);
  const favs = activeHabits().filter((h) => h.favorite);
  const sec = (ic, title, n, inner) => `<section class="card"><div class="card-head"><h2>${icon(ic)}${title}</h2><span class="sub">${n}</span></div>${inner}</section>`;
  const list = (items, fn) => `<ul class="plain journal-year">${items.map(fn).join('')}</ul>`;
  let body;
  if (!res) {
    body = `${favs.length ? sec('star', 'Favorites', favs.length, `<div class="rows">${favs.map((h) => `<div class="row"><button type="button" class="row-hit" data-act="habit-open" data-id="${h.id}">${tile(h)}<span class="row-text"><span class="row-title">${esc(h.name)}</span><span class="row-meta"><span>${esc(freqLabel(configAt(h, ui.today)))}</span></span></span></button></div>`).join('')}</div>`) : ''}
      ${recents.length ? sec('history', 'Consultés récemment', recents.length, `<ul class="plain link-list">${recents.join('')}</ul>`) : ''}
      ${!favs.length && !recents.length ? `<section class="card">${emptyState('search', 'Cherche dans tes données', 'Tape au moins deux lettres, ou choisis un type et une période pour tout lister.')}</section>` : ''}`;
  } else if (!res.total) {
    body = `<section class="card">${emptyState('search', 'Aucun résultat', q ? `Rien ne correspond à « ${esc(q)} » avec ces filtres.` : 'Rien ne correspond à ces filtres.')}</section>`;
  } else {

      ${res.tasks.length ? sec('tasks', 'Tâches', res.tasks.length, `<div class="rows">${res.tasks.map((t) => taskRow(t, { showDate: true, k: t.recurrence ? ui.today : t.date })).join('')}</div>`) : ''}

      ${res.reviews.length ? sec('list', 'Rétrospectives', res.reviews.length, list(res.reviews, (r) => `<li><button type="button" data-act="review-open" data-k="${r.ws}"><b>${esc(F.short(r.ws))}</b><span>${esc([r.worked, r.blocked, r.change, r.note].filter(Boolean).join(' · ') || 'Sans commentaire')}</span></button></li>`)) : ''}
      ${res.events.length ? sec('history', 'Événements', res.events.length, `<ol class="plain timeline">${res.events.map((e) => `<li class="tl-${e.type}">${icon(e.icon)}<div><b>${esc(F.short(e.k))}</b><span>${esc(e.text)}</span>${e.note ? `<i>${esc(e.note)}</i>` : ''}</div></li>`).join('')}</ol>`) : ''}`;

/* ===================== AIDE ===================== */
function viewHelp() {
  const A = alertRule();
  return `<section class="page-head"><p class="eyebrow">Cadence ${APP.version}</p><h1 class="page-title">Aide</h1></section>
    <section class="card doc">
      <h2>Les bases</h2>
      <p>Une <b>habitude</b> revient selon un rythme : des jours fixes (lundi, mercredi, vendredi) ou un nombre de fois par semaine, les jours que tu veux. Une <b>tâche</b> se fait une fois, à une date, ou revient selon une règle (tâche récurrente). Tu coches tes habitudes dans <b>Aujourd’hui</b>, tu rattrapes les jours passés dans <b>Matrice</b>.</p>
      <h2>« N fois par semaine »</h2>
      <p>L’habitude apparaît chaque jour dans « Cette semaine, au choix » jusqu’à ce que le compte soit atteint. Tant que la semaine n’est pas finie, rien n’est en retard. Si elle se termine sous l’objectif, les jours manquants sont comptés sur ses derniers jours.</p>
      <h2>Changer une habitude sans réécrire le passé</h2>
      <p>Quand tu modifies les jours, la fréquence ou l’heure, Cadence te demande à partir de quand. Par défaut : à partir d’aujourd’hui. Les statistiques passées gardent l’ancien réglage, et la fiche de l’habitude montre l’historique des réglages, avec une comparaison avant/après et la possibilité de revenir à une configuration antérieure.</p>
      <h2>Les pauses</h2>
      <p>Vacances, maladie, déplacement, pause volontaire : mets en pause toutes tes habitudes ou seulement certaines, avec ou sans date de fin. Les jours en pause ne sont <b>ni prévus ni manqués</b>, et tes séries sont gelées, pas cassées. Tu peux aussi poser une pause après coup, pour une semaine de maladie passée.</p>
      <h2>La mini-version</h2>
      <p>Pour chaque habitude, définis une version minimale : « 5 minutes » au lieu de « lire 20 minutes ». Les jours difficiles, touche le bouton ${icon('half')} : la journée est marquée à part et <b>ta série continue</b>. Dans les pourcentages, elle compte pour <b>une demi-validation</b> ; les indicateurs montrent aussi le taux complet seul.</p>
      <h2>Cycles et paliers</h2>
      <ul>
        <li><b>Essai</b> : tester une habitude deux semaines, puis décider de la garder, de l’ajuster ou de l’arrêter.</li>
        <li><b>Reprise</b> : repartir avec un objectif réduit après une interruption, puis revenir au rythme habituel.</li>
        <li><b>Consolidation</b> : garder le même rythme le temps qu’il s’installe.</li>
        <li><b>Palier progressif</b> : pour une habitude « N fois par semaine », Cadence propose d’ajouter une fois après le nombre de semaines tenues que tu as choisi. Rien ne change sans ton accord.</li>
      </ul>
      <h2>L’assistant</h2>
      <p>Il observe tes huit dernières semaines et signale ce que les chiffres montrent nettement : un jour de la semaine qui ne marche pas, une heure réelle loin de l’heure prévue, un objectif trop haut, une interruption, une tâche souvent reportée. Chaque constat dit sur quoi il repose. Tu peux le marquer utile, non pertinent (masqué 90 jours) ou le masquer 14 jours. Tout se calcule sur l’appareil.</p>
      <h2>L’alerte décrochage</h2>
      <p>Cadence compare tes ${A.window} derniers jours aux ${A.window} précédents. Quand une habitude passe sous ${A.threshold}${NB}% <i>et</i> a baissé d’au moins ${A.drop} points, elle le signale avant que la série casse. Ces trois valeurs se règlent dans Réglages, « Assistant et alertes ».</p>
      <h2>Rétrospective et bilans</h2>
      <p>Chaque semaine : ce qui a fonctionné, ce qui a bloqué, et <b>un seul</b> changement à décider. Chaque mois, un bilan se construit tout seul (régularité, progrès, interruptions, ajustements, notes). Chaque année, un bilan par trimestre avec la chronologie de tes changements.</p>
      <h2>Tâches</h2>
      <p>Ajoute une durée estimée pour voir la <b>charge du jour</b>. Le bouton ${icon('goto')} reporte une tâche au lendemain en gardant sa date initiale ; une tâche reportée trois fois est signalée par l’assistant.</p>
      <h2>Tes données</h2>
      <p>Tout est enregistré sur cet appareil, à chaque modification, avec une sauvegarde interne chaque jour et avant chaque mise à jour. Le <b>centre de données</b> permet de vérifier la base, de regarder une sauvegarde avant de la restaurer, d’exporter (complet, chiffré, ou en tableur) et d’imprimer un rapport.</p>
      <h2>Ce qu’une web app ne peut pas faire sur iPhone et iPad</h2>
      <ul>
        <li><b>Notifications et rappels</b> : impossibles app fermée sans serveur. Cadence n’en envoie donc aucun.</li>
        <li><b>Widgets, Face ID, intégration à Santé</b> : réservés aux apps de l’App Store.</li>
        <li><b>Raccourcis iOS</b> : Safari et l’app installée n’ont pas les mêmes données ; un raccourci qui ouvre une adresse agirait sur la mauvaise copie.</li>
      </ul>
      <h2>Questions fréquentes</h2>
      <p><b>J’ai oublié de cocher hier.</b> Va dans Matrice et touche la case du jour concerné, ou touche un jour dans « Cette semaine ».</p>
      <p><b>Je me suis trompé.</b> Touche <i>Annuler</i> dans la notification qui apparaît, ou annule la dernière action depuis Réglages.</p>
      <p><b>Mes données sont-elles sur iCloud ?</b> Non. Elles restent dans cette app, sur cet appareil. Pour les déplacer, utilise « Transférer vers un autre appareil ».</p>
      <p><b>Puis-je retirer une habitude sans perdre son historique ?</b> Oui : archive-la. Elle quitte ta liste du jour mais reste dans la matrice et les statistiques.</p>
      <p><b>Une mise à jour s’est mal passée.</b> Ouvre Réglages, « Version précédente de secours ». Une sauvegarde est créée avant chaque mise à jour, et la conversion des données est testée sur une copie avant d’être appliquée.</p>
    </section>
    <section class="card"><div class="btn-row"><button type="button" class="btn" data-act="nav" data-view="calculs">${icon('info')}Comment c’est calculé</button><button type="button" class="btn" data-act="install-guide">${icon('phone')}Guide d’installation</button><button type="button" class="btn" data-act="nav" data-view="confidentialite">${icon('lock')}Confidentialité</button></div></section>`;
}

/* ===================== COMMENT C’EST CALCULÉ ===================== */
function viewCalc() {
  const A = alertRule();
  const row = (name, def, care) => `<tr><td><b>${name}</b></td><td>${def}</td><td>${care}</td></tr>`;
  return `<section class="page-head"><p class="eyebrow">Mesures transparentes</p><h1 class="page-title">Comment c’est calculé</h1></section>
    <section class="card doc">
      <h2>La règle centrale</h2>
      <p>Un jour où l’habitude n’était pas prévue n’est <b>jamais</b> un échec. Chaque jour, chaque habitude est dans un seul état : complète, mini-version, manquée, en cours (aujourd’hui), repos, pause, au choix (fréquence souple), bonus ou hors période. Tous les écrans, exports et rapports lisent ce même état.</p>
      <h2>Définitions</h2>
      <div class="table-wrap free"><table class="data defs"><thead><tr><th>Indicateur</th><th>Définition</th><th>Précision</th></tr></thead><tbody>
        ${row('Jours attendus', 'Jours où l’habitude devait être faite selon le réglage <i>en vigueur ce jour-là</i>.', 'Sans les jours de repos, les pauses, ni les jours d’avant le début ou d’après l’archivage.')}
        ${row('Taux complet', 'Validations complètes ÷ jours attendus.', 'Les mini-versions n’y comptent pas.')}
        ${row('Taux pondéré', `(Complètes + ${String(PARTIAL_WEIGHT).replace('.', ',')} × mini-versions) ÷ jours attendus.`, 'C’est le taux affiché par défaut. Le poids ne change jamais en silence.')}
        ${row('Taux de mini-version', 'Mini-versions ÷ jours attendus.', 'À lire à côté du taux complet.')}
        ${row('Jours à l’objectif', `Jours actifs où le taux du jour atteint ton objectif quotidien (${P(state.goals.daily)}), ÷ jours actifs.`, 'Mesure la constance dans le temps, pas la quantité.')}
        ${row('Série (jours)', 'Jours attendus consécutifs validés (complète ou mini-version).', 'Les jours de repos et les pauses ne la cassent pas. Aujourd’hui pas encore coché non plus.')}
        ${row('Série (semaines)', 'Pour « N fois par semaine » : semaines consécutives où le compte est atteint.', 'La semaine en cours ne casse jamais la série.')}
        ${row('Bonus', 'Validation un jour non prévu, en pause, ou au-delà du compte de la semaine.', 'Compté dans les validations, jamais dans les taux.')}
        ${row('Tendance', 'Écart en points entre une période et la période de même durée juste avant.', '« Stable » à 2 points près. Jamais deux périodes de durées différentes.')}
      </tbody></table></div>
      <h2>La journée en cours</h2>
      <p>Elle compte ce qui est déjà fait, jamais ce qui reste. Elle n’entre dans les jours actifs (et donc dans « Jours à l’objectif ») qu’une fois ton objectif du jour atteint. Le soir venu, ce qui n’a pas été fait devient « manqué ».</p>
      <h2>Fréquence souple (« N fois par semaine »)</h2>
      <ul>
        <li>L’unité est la semaine, à partir du premier jour choisi dans Réglages.</li>
        <li>Une semaine entamée (début, archivage, pause) réduit le compte au prorata des jours disponibles, arrondi au supérieur.</li>
        <li>Les validations comptent jusqu’au compte, complètes d’abord ; au-delà, c’est du bonus.</li>
        <li>Les manques ne sont posés qu’à la fin de la semaine, sur ses derniers jours disponibles.</li>
      </ul>
      <h2>Changements de réglages</h2>
      <p>Chaque modification des jours, de la fréquence, de l’heure, de l’objectif de série ou de la mini-version crée une version datée. Un jour donné est toujours calculé avec la version en vigueur ce jour-là. La comparaison avant/après prend deux fenêtres de même longueur (au plus 28 jours) de part et d’autre du changement ; en dessous de 14 jours ou de 6 jours attendus, elle est marquée « tendance indicative ».</p>
      <h2>Alerte décrochage</h2>
      <p>${A.window} derniers jours comparés aux ${A.window} précédents, avec au moins 3 jours attendus de chaque côté. Alerte si le taux récent est sous ${A.threshold}${NB}% et a baissé d’au moins ${A.drop} points. Les mini-versions comptent : tenir le minimum ne déclenche pas d’alerte.</p>
      <h2>Assistant</h2>
      <ul>
        <li><b>Jour peu favorable</b> : 8 dernières semaines, au moins 4 occurrences par jour comparé ; un jour à 35${NB}% ou moins, un autre à 70${NB}% ou plus.</li>
        <li><b>Horaire réel</b> : au moins ${SMALL_SAMPLE} validations saisies le jour même ; écart médian d’au moins 1 h 15.</li>
        <li><b>Objectif ambitieux</b> : 5 jours par semaine ou plus, réglage en place depuis 3 semaines, moins de 50${NB}% sur 4 semaines.</li>
        <li><b>Interruption</b> : 10 jours attendus consécutifs sans validation.</li>
        <li><b>Tâche reportée</b> : trois reports ou plus.</li>
        <li>Moins de ${SMALL_SAMPLE} observations : « tendance indicative », sans suggestion d’horaire.</li>
      </ul>
      <h2>Jalons</h2>
      <p>Première semaine et premier mois (au moins la moitié tenue), 50, 100 et 250 validations, quatre semaines de suite à 70${NB}% ou plus, 10 points de mieux sur 30 jours, et la reprise après une pause d’au moins 3 jours ou 7 jours manqués. Une interruption ne fait jamais perdre un jalon ni le total des validations.</p>
    </section>`;
}

/* ===================== CONFIDENTIALITÉ ===================== */
function viewPrivacy() {
  return `<section class="page-head"><p class="eyebrow">Cadence ${APP.version}</p><h1 class="page-title">Confidentialité</h1></section>
    <section class="card doc">
      <h2>En une phrase</h2>
      <p>Cadence n’envoie aucune de tes données nulle part. Tout ce que tu saisis reste dans cette app, sur cet appareil.</p>
      <h2>Ce qui est enregistré</h2>
      <ul>
        <li>Tes habitudes et l’historique de leurs réglages, catégories, validations, mini-versions, pauses, cycles, tâches, lignes de journal, notes et rétrospectives.</li>
        <li>Tes réglages d’affichage, tes objectifs, tes filtres enregistrés, et tes retours sur les constats de l’assistant.</li>
        <li>Un identifiant d’appareil tiré au hasard, utilisé uniquement pour nommer tes sauvegardes.</li>
        <li>Sur cet appareil seulement : la liste des éléments consultés récemment, pour la recherche.</li>
      </ul>
      <h2>Où</h2>
      <p>Dans la base de données de ton navigateur, réservée à cette app : <b>${esc(Store.label())}</b>. Les sauvegardes internes y sont aussi. Rien n’est partagé avec d’autres sites ni avec d’autres apps.</p>
      <h2>L’assistant</h2>
      <p>Ses constats sont calculés sur l’appareil par des règles fixes, sans intelligence artificielle distante. Ni ton journal ni tes habitudes ne sont envoyés à un service pour être analysés.</p>
      <h2>Ce qui sort de l’appareil</h2>
      <ul>
        <li><b>Quand tu exportes</b> : tu obtiens un fichier, et tu décides où il va. Rien n’est jamais envoyé automatiquement.</li>
        <li><b>Quand tu copies une demande de mise à jour</b> : le texte contient tes idées d’amélioration et les numéros de version, jamais tes validations ni ton journal.</li>
        <li><b>Rien d’autre.</b> Pas de compte, pas de mesure d’audience, pas de publicité, aucun serveur qui reçoive quoi que ce soit.</li>
      </ul>
      <h2>Sauvegardes chiffrées</h2>
      <p>Une sauvegarde exportée peut être protégée par un mot de passe (AES-256, clé dérivée par PBKDF2 avec 600 000 itérations). Le mot de passe n’est enregistré nulle part : <b>s’il est perdu, le fichier ne peut plus être ouvert</b>, par personne. Seul l’indice que tu choisis reste lisible. Garde une sauvegarde récente non chiffrée en lieu sûr si tu crains d’oublier ton mot de passe.</p>
      <h2>Ce que Cadence ne protège pas</h2>
      <ul>
        <li>Les données <b>dans l’app</b> ne sont pas chiffrées par Cadence : elles sont protégées par le chiffrement de ton iPhone ou iPad, actif quand il est verrouillé par un code.</li>
        <li>Il n’y a pas de verrou à l’ouverture : quelqu’un qui utilise ton appareil déverrouillé peut ouvrir l’app.</li>
        <li>Les exports en tableur (CSV) et les rapports ne sont jamais chiffrés.</li>
      </ul>
      <h2>Ce que le réseau fait quand même</h2>
      <p>Au premier chargement, ton navigateur télécharge les fichiers de l’app depuis l’adresse où tu l’as publiée (GitHub Pages, par exemple). Ensuite, l’app fonctionne hors ligne et ne contacte cette adresse que pour vérifier s’il existe une nouvelle version. Cette requête ne contient rien de personnel, mais l’hébergeur voit, comme tout hébergeur, ton adresse IP.</p>
      <h2>Effacer tes données</h2>
      <p>Centre de données, puis Zone sensible, puis « Effacer toutes les données ». Attention : supprimer l’icône de Cadence de ton écran d’accueil efface aussi ses données, sans confirmation. Exporte avant.</p>
      <h2>Dépôt public</h2>
      <p>Si tu as publié Cadence depuis un dépôt GitHub public, seul le <i>code</i> de l’app y est visible. Tes habitudes et ton journal n’y sont jamais envoyés.</p>
    </section>`;
}

/* Remplace toutes les données (démo, import, restauration…) : trophées et jalons déjà
   mérités sont débloqués sans fanfare. */
function adoptState(s) {
  state = s;
  Stats.reset();
  Undo.clear(); // les photos d’annulation portaient sur l’ancien jeu de données
  ui.today = todayKey();
  ui.year = +D.parse(ui.today)[0];
  ui.integrity = null;
  state.habits.forEach((h) => { ensureHistory(h); syncMirror(h, ui.today); });
  evaluateAchievements();
  evaluateMilestones();
  commit();
  applyTheme();
}
function pressIn(root, selector, isOn) {
  $$(selector, root).forEach((b) => b.setAttribute('aria-pressed', String(!!isOn(b))));
}
const DURATIONS = [5, 10, 15, 20, 30, 45, 60, 90];

/* ---------- Éditeur d’habitude ---------- */
function openHabitEditor(id = null, preset = {}) {
  const existing = id ? habitById(id) : null;
  const today = ui.today;
  const cur = existing ? configAt(existing, today) : null;
  const d = existing
    ? { ...deepCopy(existing), days: cur.days.slice(), freq: { ...cur.freq }, time: cur.time, streakGoal: cur.streakGoal, minLabel: cur.minLabel, progress: existing.progress ? { ...existing.progress } : null }
    : { name: '', description: '', icon: 'check', categoryId: (state.categories[0] || {}).id || null, time: null, days: ALL_DAYS.slice(), freq: { type: 'days' }, streakGoal: 21, minLabel: '', startDate: today, duration: null, favorite: false, progress: null, ...preset };
  if (d.freq.type === 'weekly' && !d.freq.count) d.freq.count = 3;
  const when = { mode: 'from', from: today, reason: '', note: '' };
  const colorOf = () => { const c = catColor(catById(d.categoryId)); return `--c:${c};--cbg:${rgba(c, 0.17)}`; };
  const catButtons = () => state.categories.map((c) => `<button type="button" data-sx="cat" data-v="${c.id}" aria-pressed="${d.categoryId === c.id}" style="--c:${catColor(c)};--cbg:${rgba(catColor(c), 0.16)}">${catDot(c)}${esc(c.name)}</button>`).join('')
    + `<button type="button" data-sx="cat" data-v="" aria-pressed="${!d.categoryId}" style="--c:var(--ink-3);--cbg:var(--surface-3)">Aucune</button>`;
  const isEmoji = String(d.icon).startsWith('emoji:');
  const rhythm = () => `<div class="seg" role="group" aria-label="Rythme"><button type="button" data-sx="ftype" data-v="days" aria-pressed="${d.freq.type === 'days'}">Jours fixes</button><button type="button" data-sx="ftype" data-v="weekly" aria-pressed="${d.freq.type === 'weekly'}">Fois par semaine</button></div>
    ${d.freq.type === 'days'
    ? `<div class="days-pick" id="he-days" style="margin-top:12px">${weekOrder().map((dw) => `<button type="button" data-sx="day" data-v="${dw}" aria-pressed="${d.days.includes(dw)}" aria-label="${WD_LONG[dw]}">${WD_SHORT[dw]}</button>`).join('')}</div>
      <div class="chips" style="margin-top:10px"><button type="button" class="chip" data-sx="days" data-v="all">Tous les jours</button><button type="button" class="chip" data-sx="days" data-v="week">En semaine</button><button type="button" class="chip" data-sx="days" data-v="we">Le week-end</button></div>`
    : `<div class="count-pick" style="margin-top:12px" role="group" aria-label="Nombre de fois par semaine">${[1, 2, 3, 4, 5, 6].map((n) => `<button type="button" data-sx="count" data-v="${n}" aria-pressed="${d.freq.count === n}">${n}</button>`).join('')}<span class="small muted">fois par semaine, les jours que tu veux</span></div>
      <div class="set-list" style="margin-top:10px"><div class="set-row"><div class="lbl"><b>${icon('stairs')}Augmenter progressivement</b><span>Cadence te proposera une fois de plus après des semaines tenues. Rien ne change sans ton accord.</span></div><div class="ctl">${switchCtl('he-prog', !!d.progress)}</div></div>
      ${d.progress ? `<div class="set-row"><div class="lbl"><b>Après</b></div><div class="ctl"><div class="seg" role="group" aria-label="Semaines tenues">${[1, 2, 3, 4].map((n) => `<button type="button" data-sx="prog-every" data-v="${n}" aria-pressed="${d.progress.every === n}">${n}${NB}sem.</button>`).join('')}</div></div></div>
      <div class="set-row"><div class="lbl"><b>Jusqu’à</b></div><div class="ctl"><div class="seg" role="group" aria-label="Objectif maximal">${[2, 3, 4, 5, 6, 7].filter((n) => n > d.freq.count).map((n) => `<button type="button" data-sx="prog-max" data-v="${n}" aria-pressed="${d.progress.max === n}">${n === 7 ? 'Tous les jours' : `${n}×`}</button>`).join('')}</div></div></div>` : ''}</div>`}`;
  const durationCtl = () => `<div class="chips" id="he-dur">${[['', 'Aucune'], ...DURATIONS.map((n) => [n, F.dur(n)])].map(([v, l]) => `<button type="button" class="chip" data-sx="dur" data-v="${v}" aria-pressed="${String(d.duration || '') === String(v)}">${l}</button>`).join('')}</div>`;
  const body = `
    <div class="field"><span>Nom de l’habitude</span><input id="he-name" maxlength="80" value="${esc(d.name)}" placeholder="Ex. : Lire 20 minutes" autocomplete="off" enterkeyhint="next"></div>
    <div class="field"><span>Description <span class="muted">(facultatif)</span></span><textarea id="he-desc" maxlength="300" rows="2" placeholder="Pourquoi, comment, où…">${esc(d.description || '')}</textarea></div>
    <section><div class="section-title">Icône</div>
      <div class="icon-grid" id="he-icons" style="${colorOf()}">${HABIT_ICONS.map(([n, label]) => `<button type="button" data-sx="icon" data-v="${n}" aria-pressed="${d.icon === n}" aria-label="${label}" title="${label}">${icon(n)}</button>`).join('')}</div>
      <div class="field" style="margin-top:12px"><span>Ou un emoji</span><input id="he-emoji" maxlength="8" value="${isEmoji ? esc(d.icon.slice(6)) : ''}" placeholder="Ex. : 🏃" autocomplete="off"></div>
    </section>
    <section><div class="section-title">Catégorie</div><div class="cat-pick" id="he-cats">${catButtons()}</div>
      <form class="quick-add" data-sform="newcat" autocomplete="off"><input class="input" id="he-newcat" maxlength="30" placeholder="Nouvelle catégorie" aria-label="Nom de la nouvelle catégorie"><button type="submit" class="btn" aria-label="Créer la catégorie">${icon('plus')}</button></form>
    </section>
    <section><div class="section-title">Rythme</div><div id="he-rhythm">${rhythm()}</div></section>
    <div class="field-row">
      <div class="field"><span>Heure de réalisation</span><input id="he-time" type="time" value="${d.time || ''}"><span class="hint">Vide : à tout moment</span></div>
      <div class="field"><span>Date de début</span><input id="he-start" type="date" value="${esc(d.startDate)}"><span class="hint">Les jours avant ne comptent pas</span></div>
    </div>
    <section><div class="section-title">${icon('timer')}Durée estimée <span class="muted">(facultatif)</span></div>${durationCtl()}<p class="hint" style="margin-top:8px">Sert à calculer la charge du jour.</p></section>
    <section><div class="section-title">Objectif de série</div><div class="chips" id="he-goals">${STREAK_GOALS.map((g) => `<button type="button" class="chip" data-sx="goal" data-v="${g}" aria-pressed="${(d.streakGoal || 0) === g}">${g ? `${g} jours` : 'Aucun'}</button>`).join('')}</div>
      <p class="hint" style="margin-top:8px">Atteindre l’objectif déclenche une petite célébration.</p></section>
    <section><div class="section-title">${icon('half')}Mini-version <span class="muted">(facultatif)</span></div>
      <div class="field"><input id="he-min" maxlength="80" value="${esc(d.minLabel || '')}" placeholder="Ex. : 5 minutes, ou 2 pages" autocomplete="off">
        <span class="hint">Ce qui compte les jours difficiles : la journée est marquée à part, ta série continue, et le jour compte pour une demi-validation.</span></div>
      <div class="chips" style="margin-top:8px">${['2 minutes', '5 minutes', '10 minutes', 'La moitié'].map((v) => `<button type="button" class="chip" data-sx="minpreset" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>
    </section>
    <div class="set-list"><div class="set-row"><div class="lbl"><b>${icon('star')}Favorite</b><span>En tête des listes et de la recherche.</span></div><div class="ctl">${switchCtl('he-fav', !!d.favorite)}</div></div></div>
    <section id="he-when" hidden></section>
    <p class="err" id="he-err" role="alert" hidden></p>`;
  const footer = `${existing ? `<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}${existing ? 'Enregistrer' : 'Créer'}</button>`;
  Sheet.open({
    title: existing ? 'Modifier l’habitude' : 'Nouvelle habitude',
    body,
    footer,
    onMount(el, entry) {
      const err = (msg) => { const e = $('#he-err', el); e.textContent = msg; e.hidden = !msg; };
      const nextConfig = () => ({ days: d.days.slice().sort(), freq: d.freq.type === 'weekly' ? { type: 'weekly', count: d.freq.count } : { type: 'days' }, time: $('#he-time', el).value || null, streakGoal: d.streakGoal || 0, minLabel: $('#he-min', el).value.trim().slice(0, 80) });
      /* « À partir de quand ? » n’apparaît que si un réglage daté change vraiment. */
      const refreshWhen = () => {
        const host = $('#he-when', el);
        if (!existing) { host.hidden = true; return; }
        const next = nextConfig();
        if (sameConfig(cur, next)) { host.hidden = true; return; }
        const sched = !sameSchedule(cur, next);
        host.hidden = false;
        host.innerHTML = `<div class="section-title">${icon('history')}À partir de quand ?</div>
          ${sched ? `<div class="stack" style="gap:8px">${[['from', 'À partir d’aujourd’hui', 'Recommandé. Le passé garde l’ancien rythme : tes statistiques ne bougent pas.'], ['date', 'À partir d’une date', 'Utile si tu avais déjà changé de rythme sans le noter.'], ['all', 'Depuis le début', 'Toutes les statistiques de cette habitude sont recalculées avec le nouveau rythme.']].map(([v, l, t]) => `<button type="button" class="opt-row" data-sx="when" data-v="${v}" aria-pressed="${when.mode === v}"><b>${l}</b><span>${t}</span></button>`).join('')}</div>
            ${when.mode === 'date' ? `<div class="field" style="margin-top:10px"><span>Date d’effet</span><input id="he-from" type="date" value="${esc(when.from)}" min="${esc(D.max(d.startDate, existing.startDate))}" max="${today}"></div>` : ''}`
    : '<p class="small muted">Ces changements s’appliquent à partir d’aujourd’hui. Ils ne modifient pas les statistiques passées.</p>'}
          <div class="field" style="margin-top:12px"><span>Pourquoi ce changement ? <span class="muted">(facultatif)</span></span><div class="chips">${CHANGE_REASONS.map((r) => `<button type="button" class="chip" data-sx="reason" data-v="${esc(r)}" aria-pressed="${when.reason === r}">${esc(r)}</button>`).join('')}</div>
          <input id="he-note" maxlength="300" value="${esc(when.note)}" placeholder="Une note pour plus tard" autocomplete="off" style="margin-top:8px"></div>`;
      };
      const syncRhythm = () => { $('#he-rhythm', el).innerHTML = rhythm(); refreshWhen(); };
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        if (sx === 'icon') { d.icon = b.dataset.v; $('#he-emoji', el).value = ''; pressIn(el, '#he-icons [data-sx="icon"]', (x) => x.dataset.v === d.icon); }
        if (sx === 'cat') { d.categoryId = b.dataset.v || null; pressIn(el, '#he-cats [data-sx="cat"]', (x) => (x.dataset.v || null) === d.categoryId); $('#he-icons', el).setAttribute('style', colorOf()); }
        if (sx === 'ftype') { d.freq = b.dataset.v === 'weekly' ? { type: 'weekly', count: d.freq.count || Math.min(6, Math.max(1, d.days.length === 7 ? 3 : d.days.length)) } : { type: 'days' }; if (d.freq.type === 'days') d.progress = null; syncRhythm(); }
        if (sx === 'day') { const v = +b.dataset.v; d.days = d.days.includes(v) ? d.days.filter((x) => x !== v) : [...d.days, v].sort(); pressIn(el, '#he-days [data-sx="day"]', (x) => d.days.includes(+x.dataset.v)); refreshWhen(); }
        if (sx === 'days') { d.days = { all: ALL_DAYS.slice(), week: [1, 2, 3, 4, 5], we: [0, 6] }[b.dataset.v]; pressIn(el, '#he-days [data-sx="day"]', (x) => d.days.includes(+x.dataset.v)); refreshWhen(); }
        if (sx === 'count') { d.freq.count = +b.dataset.v; if (d.progress && d.progress.max <= d.freq.count) d.progress.max = Math.min(7, d.freq.count + 2); syncRhythm(); }
        if (sx === 'prog-every') { d.progress.every = +b.dataset.v; pressIn(el, '[data-sx="prog-every"]', (x) => +x.dataset.v === d.progress.every); }
        if (sx === 'prog-max') { d.progress.max = +b.dataset.v; pressIn(el, '[data-sx="prog-max"]', (x) => +x.dataset.v === d.progress.max); }
        if (sx === 'dur') { d.duration = b.dataset.v ? +b.dataset.v : null; pressIn(el, '#he-dur [data-sx="dur"]', (x) => String(d.duration || '') === x.dataset.v); }
        if (sx === 'goal') { d.streakGoal = +b.dataset.v; pressIn(el, '#he-goals [data-sx="goal"]', (x) => +x.dataset.v === d.streakGoal); refreshWhen(); }
        if (sx === 'minpreset') { $('#he-min', el).value = b.dataset.v; refreshWhen(); }
        if (sx === 'when') { when.mode = b.dataset.v; if (when.note === '' && $('#he-note', el)) when.note = $('#he-note', el).value; refreshWhen(); }
        if (sx === 'reason') { when.reason = when.reason === b.dataset.v ? '' : b.dataset.v; pressIn(el, '[data-sx="reason"]', (x) => x.dataset.v === when.reason); }
        if (sx === 'delete' && existing) { removeHabitFlow(existing, entry); }
        if (sx === 'save') {
          const name = $('#he-name', el).value.trim();
          if (!name) { err('Donne un nom à ton habitude.'); $('#he-name', el).focus(); return; }
          if (d.freq.type === 'days' && !d.days.length) { err('Choisis au moins un jour de répétition.'); return; }
          const emoji = $('#he-emoji', el).value.trim();
          let ic = emoji ? `emoji:${emoji}` : d.icon;
          if (!emoji && String(ic).startsWith('emoji:')) ic = 'check';
          const startRaw = $('#he-start', el).value;
          const fields = {
            name,
            description: $('#he-desc', el).value.trim(),
            icon: ic,
            categoryId: d.categoryId,
            startDate: /^\d{4}-\d{2}-\d{2}$/.test(startRaw) ? startRaw : (existing ? existing.startDate : today),
            duration: d.duration,
            favorite: $('#he-fav', el).checked,
            progress: d.freq.type === 'weekly' && d.progress ? { step: 1, every: d.progress.every, max: d.progress.max } : null,
            updatedAt: new Date().toISOString(),
          };
          const cfg = nextConfig();
          if (cfg.freq.type === 'weekly') cfg.days = ALL_DAYS.slice();
          Undo.push(existing ? `modification de « ${name} »` : `création de « ${name} »`);
          if (existing) {
            const fromRaw = $('#he-from', el) ? $('#he-from', el).value : '';
            const note = $('#he-note', el) ? $('#he-note', el).value.trim() : '';
            Object.assign(existing, fields);
            ensureHistory(existing);
            if (!sameConfig(configAt(existing, today), cfg)) {
              const sched = !sameSchedule(cur, cfg);
              const mode = sched ? when.mode : 'from';
              setConfig(existing, cfg, { from: mode === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(fromRaw) ? fromRaw : today, mode: mode === 'all' ? 'all' : 'from', reason: when.reason, note });
            } else syncMirror(existing);
          } else {
            state.habits.push(newHabit({ ...fields, ...cfg, order: Math.max(-1, ...state.habits.map((h) => h.order ?? 0)) + 1 }));
          }
          commit();
          Sheet.close(entry);
          refreshAll();
          toast(existing ? 'Habitude mise à jour' : 'Habitude créée', { msg: existing && !sameConfig(cur, cfg) ? `${name} · ${freqLabel(cfg)}` : name, action: { label: 'Annuler', fn: undoLast } });
        }
      });
      el.addEventListener('input', (e) => {
        if (e.target.id === 'he-min' || e.target.id === 'he-time') refreshWhen();
        if (e.target.id === 'he-note') when.note = e.target.value;
        if (e.target.id === 'he-from') when.from = e.target.value;
      });
      el.addEventListener('change', (e) => {
        if (e.target.id === 'he-prog') { d.progress = e.target.checked ? { step: 1, every: 2, max: Math.min(7, d.freq.count + 2) } : null; syncRhythm(); }
        if (e.target.id === 'he-time') refreshWhen();
      });
      el.addEventListener('submit', (e) => {
        const f = e.target.closest('[data-sform="newcat"]');
        if (!f) return;
        e.preventDefault();
        const input = $('#he-newcat', el);
        const c = addCategory(input.value);
        if (!c) return;
        d.categoryId = c.id;
        input.value = '';
        $('#he-cats', el).innerHTML = catButtons();
        $('#he-icons', el).setAttribute('style', colorOf());
      });
      if (!existing && ENV.hover) setTimeout(() => { const n = $('#he-name', el); if (n) n.focus(); }, 60);
    },
  });
}

function addCategory(rawName) {
  const name = String(rawName || '').trim().slice(0, 30);
  if (!name) return null;
  const found = state.categories.find((c) => c.name.toLowerCase() === name.toLowerCase());
  if (found) return found;
  const used = new Set(state.categories.map((c) => c.color));
  const color = (PALETTE.find((p) => !used.has(p.id)) || PALETTE[state.categories.length % PALETTE.length]).id;
  const c = { id: uid(), name, color };
  state.categories.push(c);
  commit();
  return c;
}

async function removeHabitFlow(h, entry = null) {
  const choice = await ask({
    title: `Supprimer « ${h.name} » ?`,
    message: 'Archiver la retire de tes journées mais garde son historique et ses statistiques. Une pause la suspend sans la retirer. La suppression définitive efface aussi toutes ses validations.',
    buttons: [
      { label: 'Archiver (garder l’historique)', value: 'archive', style: 'primary' },
      { label: 'Mettre en pause plutôt', value: 'pause' },
      { label: 'Supprimer définitivement', value: 'delete', style: 'danger' },
      { label: 'Annuler', value: null, style: 'ghost' },
    ],
  });
  if (!choice) return;
  if (entry) Sheet.close(entry);
  Sheet.stack.filter((e) => e.habitId === h.id).forEach((e) => Sheet.close(e));
  if (choice === 'archive') archiveHabit(h);
  else if (choice === 'pause') openPauseEditor(null, { habits: [h.id] });
  else purgeHabit(h);
}
function archiveHabit(h) {
  Undo.push(`archivage de « ${h.name} »`);
  h.archivedAt = D.max(ui.today, h.startDate);
  h.updatedAt = new Date().toISOString();
  if (h.phase) { h.phaseLog.push({ ...h.phase, decision: 'archivée', at: new Date().toISOString() }); h.phase = null; }
  commit();
  refreshAll();
  toast('Habitude archivée', { msg: 'Son historique est conservé.', ic: 'archive', action: { label: 'Annuler', fn: undoLast } });
}
function purgeHabit(h) {
  Undo.push(`suppression de « ${h.name} »`);
  state.habits = state.habits.filter((x) => x.id !== h.id);
  for (const map of [state.completions, state.partials]) {
    for (const k of Object.keys(map)) { delete map[k][h.id]; if (!Object.keys(map[k]).length) delete map[k]; }
  }
  delete state.snoozes[h.id];
  state.pauses = state.pauses.map((p) => (p.all ? p : { ...p, habits: p.habits.filter((id) => id !== h.id) })).filter((p) => p.all || p.habits.length);
  state.notes.forEach((n) => { if (n.habitId === h.id) n.habitId = null; });
  for (const id of Object.keys(state.insights)) if (id.includes(h.id)) delete state.insights[id];
  for (const id of Object.keys(state.milestones)) if (id.includes(h.id)) delete state.milestones[id];
  commit();
  refreshAll();
  toast('Habitude supprimée', { msg: h.name, ic: 'trash', action: { label: 'Annuler', fn: undoLast }, duration: 5000 });
}

/* ---------- Fiche d’une habitude ---------- */
function habitDetailBody(h) {
  const k = ui.today;
  const c = configAt(h, k);
  const st = habitStreak(h);
  const r30 = habitRange(h, D.add(k, -29), k);
  const cat = catById(h.categoryId);
  const start = D.add(weekStartKey(k), -28);
  const cells = [];
  for (let i = 0; i < 35; i++) { const dk = D.add(start, i); cells.push(cellHtml(h, dk, cellState(h, dk), { label: false, text: D.parse(dk)[2] })); }
  const goal = c.streakGoal || 0;
  const pz = pauseAt(h, k);
  const weekly = c.freq.type === 'weekly';
  const w = weekly ? weekStates(h, weekStartKey(k)) : null;
  /* Indicateurs par horizon */
  const hz = [[30, '30 j'], [90, '90 j'], [365, '365 j']].map(([n, l]) => ({ l, ...habitRange(h, D.add(k, -(n - 1)), k) }));
  hz.push({ l: 'Total', ...habitRange(h, h.startDate, k) });
  /* Meilleurs moments */
  const bm = bestMoments(h);
  const wdBars = bm.days.filter((x) => (weekly ? x.validations : x.expected) > 0 || (!weekly && c.days.includes(x.dow)));
  const moments = `<div class="wd-bars">${wdBars.map((x) => { const v = weekly ? (x.share || 0) : (x.rate || 0); return `<div class="wd-bar ${x.small && !weekly ? 'small' : ''}" data-tip="${esc(`${F.cap(WD_LONG[x.dow])} : ${weekly ? `${x.validations} validation${x.validations > 1 ? 's' : ''}` : `${x.counted}/${x.expected}`}`)}"><i style="--v:${Math.round(v * 100)}"></i><b>${weekly ? x.validations : (x.rate === null ? '—' : Math.round(x.rate * 100))}</b><span>${WD_SHORT[x.dow]}</span></div>`; }).join('')}</div>
    <p class="small muted" style="margin-top:8px">${weekly ? 'Nombre de validations par jour de la semaine' : 'Part des jours prévus tenus, par jour de la semaine'}, sur ${bm.span} jours.${!weekly && wdBars.some((x) => x.small) ? ' Les jours grisés ont moins de 4 occurrences : tendance indicative.' : ''}</p>
    ${bm.samples ? `<div class="time-buckets">${bm.buckets.map((b) => `<div><b>${b.n}</b><span>${b.name}</span></div>`).join('')}</div>
      <p class="small muted" style="margin-top:8px">Heure médiane de validation : <b style="color:var(--ink-1)">${F.hm(bm.medianTime)}</b>${c.time && bm.delays ? ` · prévue à ${F.hm(c.time)}, écart médian ${bm.medianDelay >= 0 ? '+' : '−'}${F.dur(Math.abs(bm.medianDelay))}` : ''} · ${bm.samples} validation${bm.samples > 1 ? 's' : ''} saisie${bm.samples > 1 ? 's' : ''} le jour même${bm.indicative ? ' · <i>tendance indicative</i>' : ''}.</p>` : '<p class="small muted">Pas encore assez de validations saisies le jour même pour parler d’horaire.</p>'}`;
  /* Historique des réglages */
  const hist = (h.history || []).slice().reverse();
  const changes = configChanges(h);
  const history = `<ol class="plain versions">${hist.map((v, ri) => {
    const i = h.history.length - 1 - ri;
    const ch = changes.find((x) => x.i === i);
    const ba = ch ? beforeAfter(h, ch) : null;
    const isCur = v === configAt(h, k);
    return `<li class="${isCur ? 'cur' : ''} ${v.from > k ? 'future' : ''}"><div class="v-top"><b>${v.from > k ? 'À partir du' : i === 0 ? 'Depuis le' : 'Depuis le'} ${esc(F.short(v.from))}${v.from.slice(0, 4) !== k.slice(0, 4) ? ` ${v.from.slice(0, 4)}` : ''}</b>${isCur ? '<span class="status-badge ok">En vigueur</span>' : v.from > k ? '<span class="status-badge new">Programmé</span>' : ''}</div>
      <span>${esc(freqLabel(v))}${v.time ? ` · ${esc(F.hm(v.time))}` : ''}${v.minLabel ? ` · mini : ${esc(v.minLabel)}` : ''}${v.streakGoal ? ` · objectif ${v.streakGoal}${NB}j` : ''}</span>
      ${v.reason || v.note ? `<i>${esc([v.reason, v.note].filter(Boolean).join(' — '))}</i>` : ''}
      ${ba && ba.n ? `<span class="ba">Avant : ${pctOrDash(ba.before.rate)} (${String(ba.perWeekBefore).replace('.', ',')}/sem.) → après : ${pctOrDash(ba.after.rate)} (${String(ba.perWeekAfter).replace('.', ',')}/sem.), sur ${ba.n}${NB}j de chaque côté ${trendBadge(ba.delta, { short: true })}${ba.indicative ? ' <i>tendance indicative</i>' : ''}</span>` : ''}
      ${!isCur && v.from <= k && !h.archivedAt ? `<button type="button" class="link-btn" data-act="cfg-revert" data-id="${h.id}" data-i="${i}">${icon('restore')}Revenir à ce réglage à partir d’aujourd’hui</button>` : ''}</li>`;
  }).join('')}</ol>`;
  /* Notes */
  const notes = state.notes.filter((n) => n.habitId === h.id).sort((a, b) => b.from.localeCompare(a.from));

    <button type="button" class="btn sm" style="margin-top:10px" data-act="pause-new" data-id="${h.id}">${icon('pause')}Mettre en pause</button>`;
  const fold = (id, ic, title, inner, open = false) => `<details class="fold" ${open ? 'open' : ''} data-fold="${id}"><summary>${icon(ic)}${title} ${icon('chevD')}</summary>${inner}</details>`;

function openHabitDetail(id) {
  const h = habitById(id);
  if (!h) return;
  Recent.add({ type: 'habit', id });
  const footer = `${h.archivedAt
    ? `<button type="button" class="btn ghost" data-sx="restore" aria-label="Restaurer">${icon('restore')}<span class="hide-mobile">Restaurer</span></button>`
    : `<button type="button" class="btn ghost" data-sx="archive" aria-label="Archiver">${icon('archive')}<span class="hide-mobile">Archiver</span></button><button type="button" class="btn ghost" data-sx="pause" aria-label="Mettre en pause">${icon('pause')}<span class="hide-mobile">Pause</span></button>`}<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button><span class="spacer"></span><button type="button" class="btn primary" data-sx="edit">${icon('edit')}Modifier</button>`;
  const openFolds = new Set();
  const entry = Sheet.open({
    title: h.name,
    body: habitDetailBody(h),
    footer,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'edit') { Sheet.close(en); openHabitEditor(h.id); }
        if (b.dataset.sx === 'archive') { Sheet.close(en); archiveHabit(h); }
        if (b.dataset.sx === 'pause') { openPauseEditor(null, { habits: [h.id] }); }
        if (b.dataset.sx === 'restore') { Undo.push(`restauration de « ${h.name} »`); h.archivedAt = null; commit(); Sheet.close(en); refreshAll(); toast('Habitude restaurée', { msg: h.name, action: { label: 'Annuler', fn: undoLast } }); }
        if (b.dataset.sx === 'delete') removeHabitFlow(h, en);
      });
      el.addEventListener('toggle', (e) => { const d = e.target.closest && e.target.closest('details[data-fold]'); if (d) { if (d.open) openFolds.add(d.dataset.fold); else openFolds.delete(d.dataset.fold); } }, true);
    },
  });
  entry.habitId = h.id;
  entry.refresh = () => {
    const cur = habitById(id);
    if (!cur) return;
    Sheet.setBody(entry, habitDetailBody(cur));
    openFolds.forEach((f) => { const d = $(`details[data-fold="${f}"]`, entry.el); if (d) d.open = true; });
  };
}

    <div class="field-row">

    ${existing && !existing.recurrence ? `<div class="set-row" style="border-top:1px solid var(--line)"><div class="lbl"><b>Terminée</b><span>${existing.doneAt ? `Cochée ${esc(F.rel(existing.doneAt))}` : 'Pas encore'}</span></div><div class="ctl">${switchCtl('te-done', existing.done)}</div></div>` : ''}
    ${existing && (existing.postponed || []).length ? `<section><div class="section-title">${icon('history')}Reports</div><ul class="plain change-list">${existing.postponed.slice().reverse().map((x) => `<li><b>${esc(F.short(x.from))} → ${esc(F.short(x.to))}</b><span>${esc(F.rel(x.at))}</span></li>`).join('')}</ul><p class="hint">Date initiale : ${esc(F.short(existing.originDate || existing.postponed[0].from))}.</p></section>` : ''}
    ${existing && existing.recurrence ? `<p class="small muted">Faite ${plural(done, 'fois', 'fois')} depuis le ${esc(F.short(existing.date))}.</p>` : ''}

          } else state.tasks.push(newTask(fields));
          commit();
          Sheet.close(entry);

        }
      });
      if (!existing && ENV.hover) setTimeout(() => { const n = $('#te-title', el); if (n) n.focus(); }, 60);

function deleteTask(t) {
  Undo.push(`suppression de « ${t.title} »`);
  state.tasks = state.tasks.filter((x) => x !== t);
  commit();
  refreshAll();
  toast('Tâche supprimée', { msg: t.title, ic: 'trash', action: { label: 'Annuler', fn: undoLast }, duration: 5000 });
}
/* Report au lendemain : la date initiale et chaque report sont conservés. */
function postponeTask(id, to = null) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t || t.recurrence || t.done) return;
  const target = to || D.add(D.max(t.date, ui.today), 1);
  Undo.push(`report de « ${t.title} »`);
  t.originDate = t.originDate || t.date;
  t.postponed = [...(t.postponed || []), { from: t.date, to: target, at: new Date().toISOString() }];
  t.date = target;
  t.updatedAt = new Date().toISOString();
  commit();
  refreshAll();
  const n = t.postponed.length;
  toast('Tâche reportée', { msg: `${F.dayRel(target, ui.today)} · ${n > 1 ? `${n}e report` : t.title}`, ic: 'goto', action: { label: 'Annuler', fn: undoLast } });
}

/* ---------- Détail d’une journée ---------- */
function dayBody(k) {
  const s = dayStats(k);
  const future = k > ui.today;
  const life = activeHabitsAt(k);
  const planned = []; const flex = []; const paused = []; const others = [];
  life.forEach((h) => {
    const st = dayState(h, k);
    if (st === 'pause') paused.push(h);
    else if (isWeekly(h, k)) flex.push(h);
    else if (EXPECTED.has(st)) planned.push(h);
    else others.push(h);
  });
  const tasks = sortTasks(tasksForDay(k), k);
  const p = s.scheduled ? Math.round(s.pct * 100) : null;
  const note = state.journal[k];
  const notes = state.notes.filter((n) => n.from <= k && (n.to || n.from) >= k);
  const pauses = state.pauses.filter((x) => x.from <= k && (!x.to || x.to >= k));
  const row = (h) => {
    if (future) return `<div class="row">${tile(h, 'sm')}<span class="row-text" style="padding:10px 4px"><span class="row-title">${esc(h.name)}</span></span></div>`;
    const ts = (state.completions[k] || {})[h.id] || (state.partials[k] || {})[h.id];
    return habitRow(h, k).replace('<span class="row-meta">', `<span class="row-meta">${ts ? `<span class="done-at">${icon('check')}${dayKeyOf(ts) === k ? F.timeOfISO(ts) : `saisie ${esc(F.rel(ts))}`}</span>` : ''}`);
  };
  const tasksDone = tasks.filter((t) => taskDoneOn(t, k)).length;
  return `<div class="consistency"><div class="ring-wrap">${ring(s.pct || 0, { size: 96, stroke: 10, label: 'Régularité de la journée' })}<div class="ring-center"><span class="hero-ring-v" style="font-size:22px">${p === null ? '—' : p}<small>${p === null ? '' : '%'}</small></span></div></div>
      <div><p class="label">${future ? 'Journée à venir' : 'Bilan de la journée'}</p><p style="font-size:20px;font-weight:700">${s.done} sur ${s.scheduled} habitude${s.scheduled > 1 ? 's' : ''}</p><p class="small muted">${s.partial ? `${s.partial} en mini-version · ` : ''}${s.bonus ? `+ ${s.bonus} bonus · ` : ''}${s.paused ? `${s.paused} en pause · ` : ''}${tasks.length ? `${tasksDone}/${tasks.length} tâche${tasks.length > 1 ? 's' : ''} terminée${tasksDone > 1 ? 's' : ''}` : 'Aucune tâche ce jour-là'}</p></div></div>

    ${tasks.length ? `<section><div class="section-title">Tâches</div><div class="rows">${tasks.map((t) => taskRow(t, { k })).join('')}</div></section>` : ''}`;

function activeHabitsAt(k) { return state.habits.filter((h) => inLife(h, k)).sort(byOrder); }
function openDay(k) {

/* ---------- Bouton « + » ---------- */
function openQuickAdd() {
  if (ui.view === 'habitudes') return openHabitEditor();
  if (ui.view === 'taches') return openTaskEditor();
  const opt = (sx, ic, title, text) => `<button type="button" class="card hcard" data-sx="${sx}" style="text-align:left;width:100%"><span class="tile lg" style="--c:var(--accent);--cbg:var(--accent-soft)">${icon(ic)}</span><span style="min-width:0"><b style="display:block;font-size:16px">${title}</b><span class="small muted">${text}</span></span></button>`;
  return Sheet.open({
    title: 'Ajouter',
    body: `<div class="stack" style="gap:10px">${opt('habit', 'repeat', 'Nouvelle habitude', 'Récurrente : des jours fixes ou un nombre de fois par semaine.')}${opt('task', 'tasks', 'Nouvelle tâche', 'Ponctuelle ou récurrente, avec une priorité, une échéance et une durée.')}${opt('pause', 'pause', 'Une pause', 'Vacances, maladie, déplacement : ces jours ne compteront pas comme manqués.')}${opt('note', 'note', 'Une note', 'Sur un jour, une période ou une habitude.')}</div>`,
    onMount(el, entry) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        Sheet.close(entry);
        const v = b.dataset.sx;
        if (v === 'habit') openHabitEditor();
        else if (v === 'task') openTaskEditor();
        else if (v === 'pause') openPauseEditor();
        else openNoteEditor();
      });
    },
  });
}

function sectionOrder() {

    const def = TODAY_SECTIONS.find((x) => x.id === id);
    return `<li><span class="n">${i + 1}</span><span class="t">${esc(def.name)}</span>
      <button type="button" class="icon-btn" data-cz="sec-move" data-id="${id}" data-v="-1" aria-label="Monter ${esc(def.name)}" ${i === 0 ? 'disabled' : ''}>${icon('arrowUp')}</button>
      <button type="button" class="icon-btn" data-cz="sec-move" data-id="${id}" data-v="1" aria-label="Descendre ${esc(def.name)}" ${i === list.length - 1 ? 'disabled' : ''}>${icon('arrowDown')}</button></li>`;
  }).join('');
}
function categoriesEditor(openId = null) {
  if (!state.categories.length) return '<p class="small muted">Aucune catégorie.</p>';
  return state.categories.map((c) => {
    const used = state.habits.filter((h) => h.categoryId === c.id).length;
    return `<div class="cat-edit"><button type="button" class="cat-swatch" style="--c:${catColor(c)}" data-cz="cat-pal" data-id="${c.id}" aria-label="Couleur de ${esc(c.name)}"></button>
      <input class="input" value="${esc(c.name)}" maxlength="30" data-cat-name="${c.id}" aria-label="Nom de la catégorie">
      <button type="button" class="icon-btn plain" data-cz="cat-del" data-id="${c.id}" aria-label="Supprimer ${esc(c.name)}" title="${used ? `${used} habitude(s)` : ''}">${icon('trash')}</button>
      ${openId === c.id ? `<div class="mini-pal">${PALETTE.map((p) => `<button type="button" data-cz="cat-color" data-id="${c.id}" data-v="${p.id}" style="--sw:${p.hex}" aria-pressed="${c.color === p.id}" aria-label="${p.name}"></button>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
function openCustomize(focus = null) {
  const after = () => { applyTheme(); commit(); render(); };
  Sheet.open({
    title: 'Personnaliser',
    variant: 'side',
    body: customizeBody(),
    onMount(el) {
      let openPal = null;
      const catsHost = () => $('#cz-cats-list', el);
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-cz]');
        if (!b) return;
        const cz = b.dataset.cz;
        const s = state.settings;
        if (['accent', 'background', 'lightBg', 'radius', 'density', 'font', 'matrixShape', 'matrixColor'].includes(cz)) {
          s[cz] = b.dataset.v;
          pressIn(el, `[data-cz="${cz}"]`, (x) => x.dataset.v.toLowerCase() === String(s[cz]).toLowerCase());
          if (cz === 'accent') { const cu = $('.swatch.custom', el); if (cu) cu.setAttribute('aria-pressed', 'false'); $('#cz-custom', el).value = s.accent; }
          after();
        }
        if (cz === 'contrast' || cz === 'todayView') {
          s[cz] = b.dataset.v;
          pressIn(el, `[data-cz="${cz}"]`, (x) => x.dataset.v === s[cz]);
          after();
        }
        if (cz === 'sec-move') {
          const list = s.todaySections;
          const i = list.indexOf(b.dataset.id);
          const j = i + Number(b.dataset.v);
          if (i < 0 || j < 0 || j >= list.length) return;
          [list[i], list[j]] = [list[j], list[i]];
          after();
          $('#cz-order', el).innerHTML = sectionOrder();
          const again = $(`[data-cz="sec-move"][data-id="${b.dataset.id}"][data-v="${b.dataset.v}"]`, el);
          if (again && !again.disabled) again.focus();
        }
        if (cz === 'textScale') {
          s.textScale = Number(b.dataset.v) || 1;
          pressIn(el, '[data-cz="textScale"]', (x) => Number(x.dataset.v) === s.textScale);
          after();
        }
        /* Changer de thème change aussi la liste des fonds proposés : on redessine le panneau. */
        if (cz === 'theme') {
          s.theme = b.dataset.v;
          after();
          Sheet.setBody(Sheet.top(), customizeBody());
        }
        if (cz === 'reset-look') {
          ['accent', 'theme', 'background', 'lightBg', 'textScale', 'contrast', 'radius', 'density', 'font', 'glow', 'matrixShape', 'matrixColor', 'reduceMotion', 'todayView'].forEach((key) => { s[key] = DEFAULT_SETTINGS[key]; });
          s.todaySections = DEFAULT_SETTINGS.todaySections.slice();
          after();
          Sheet.setBody(Sheet.top(), customizeBody());
          toast('Apparence réinitialisée', { ic: 'restore' });
        }
        if (cz === 'cat-pal') { openPal = openPal === b.dataset.id ? null : b.dataset.id; catsHost().innerHTML = categoriesEditor(openPal); }
        if (cz === 'cat-color') { const c = catById(b.dataset.id); if (c) { c.color = b.dataset.v; commit(); render(); catsHost().innerHTML = categoriesEditor(openPal); } }
        if (cz === 'cat-del') {
          const c = catById(b.dataset.id);
          if (!c) return;
          const used = state.habits.filter((h) => h.categoryId === c.id).length;
          const ok = await ask({ title: `Supprimer « ${c.name} » ?`, message: used ? `${used} habitude${used > 1 ? 's' : ''} passeront « Sans catégorie ». Leur historique est conservé.` : 'Aucune habitude n’utilise cette catégorie.', buttons: [{ label: 'Supprimer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
          if (!ok) return;
          state.categories = state.categories.filter((x) => x.id !== c.id);
          state.habits.forEach((h) => { if (h.categoryId === c.id) h.categoryId = null; });
          commit(); render();
          catsHost().innerHTML = categoriesEditor(openPal);
        }
      });
      el.addEventListener('change', (e) => {
        const t = e.target;
        if (t.matches('[data-czs]')) {
          const key = t.dataset.czs;
          const s = state.settings;
          if (key === 'mod-week') s.modules.week = t.checked;
          else if (key === 'mod-streaks') s.modules.streaks = t.checked;
          else if (key === 'mod-tasks') s.modules.tasksInPlan = t.checked;
          else if (key === 'mod-journal') s.modules.journal = t.checked;
          else if (key === 'mod-alerts') s.modules.alerts = t.checked;
          else if (key === 'mod-review') s.modules.review = t.checked;
          else if (key === 'mod-load') s.modules.load = t.checked;
          else if (key === 'mod-milestones') s.modules.milestones = t.checked;
          else s[key] = t.checked;
          after();
        }
        if (t.matches('[data-cat-name]')) {
          const c = catById(t.dataset.catName);
          const v = t.value.trim().slice(0, 30);
          if (c && v) { c.name = v; commit(); render(); } else if (c) t.value = c.name;
        }
      });
      el.addEventListener('input', (e) => {
        const t = e.target;
        if (t.id === 'cz-custom') {
          state.settings.accent = t.value;
          pressIn(el, '[data-cz="accent"]', () => false);
          const cu = $('.swatch.custom', el); if (cu) cu.setAttribute('aria-pressed', 'true');
          applyTheme();
          commitSoon();
        }
        if (t.id === 'cz-name') { state.profile.name = t.value.slice(0, 40); commitSoon(); }
        if (t.id === 'cz-daily' || t.id === 'cz-monthly') {
          const v = +t.value;
          if (t.id === 'cz-daily') state.goals.daily = v; else state.goals.monthly = v;
          $(`#${t.id}-out`, el).textContent = P(v);
          commitSoon();
        }
      });
      el.addEventListener('submit', (e) => {
        if (!e.target.closest('[data-czf="newcat"]')) return;
        e.preventDefault();
        const input = $('#cz-newcat', el);
        if (addCategory(input.value)) { input.value = ''; catsHost().innerHTML = categoriesEditor(openPal); render(); }
      });
      if (focus === 'cats') setTimeout(() => { const sec = $('#cz-cats', el); if (sec) sec.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 350);
    },
  });
}
const commitSoon = debounce(() => { commit(); render(); }, 250);

/* ---------- Nouveautés ---------- */
function cmpVersion(a, b) {
  const pa = String(a).split('.').map(Number); const pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; }
  return 0;
}
function openWhatsNew(since = null) {
  const list = since ? CHANGELOG.filter((c) => cmpVersion(c.version, since) > 0) : CHANGELOG;
  const items = (list.length ? list : CHANGELOG).map((c) => `<div><div class="v-head"><b>Version ${esc(c.version)}</b><span class="small muted">${F.short(c.date)} ${c.date.slice(0, 4)} · ${esc(c.title)}</span></div><ul>${c.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>`).join('');
  Sheet.open({
    title: since ? `Cadence ${APP.version} est installée` : 'Historique des versions',
    body: `${since ? `<p class="lede">Ta mise à jour est terminée. Tes habitudes, validations et réglages sont intacts, et une sauvegarde a été créée juste avant.</p>${migrationSummary()}` : ''}<div class="version-list">${items}</div>`,
  });
}
