/* Remplace toutes les données (démo, import, restauration…) : trophées déjà mérités débloqués sans fanfare. */
function adoptState(s) {
  state = s;
  Stats.reset();
  Undo.clear(); // les photos d’annulation portaient sur l’ancien jeu de données
  ui.today = todayKey();
  ui.year = +D.parse(ui.today)[0];
  evaluateAchievements();
  commit();
  applyTheme();
}
function pressIn(root, selector, isOn) {
  $$(selector, root).forEach((b) => b.setAttribute('aria-pressed', String(!!isOn(b))));
}

/* ---------- Éditeur d’habitude ---------- */
function openHabitEditor(id = null, preset = {}) {
  const existing = id ? habitById(id) : null;
  const d = existing ? deepCopy(existing) : {
    name: '', description: '', icon: 'check', categoryId: (state.categories[0] || {}).id || null,
    time: null, days: [0, 1, 2, 3, 4, 5, 6], streakGoal: 21, minLabel: '', startDate: ui.today, ...preset,
  };
  const colorOf = () => { const c = catColor(catById(d.categoryId)); return `--c:${c};--cbg:${rgba(c, 0.17)}`; };
  const catButtons = () => state.categories.map((c) => `<button type="button" data-sx="cat" data-v="${c.id}" aria-pressed="${d.categoryId === c.id}" style="--c:${catColor(c)};--cbg:${rgba(catColor(c), 0.16)}">${catDot(c)}${esc(c.name)}</button>`).join('')
    + `<button type="button" data-sx="cat" data-v="" aria-pressed="${!d.categoryId}" style="--c:var(--ink-3);--cbg:var(--surface-3)">Aucune</button>`;
  const isEmoji = String(d.icon).startsWith('emoji:');
  const body = `
    <div class="field"><span>Nom de l’habitude</span><input id="he-name" maxlength="80" value="${esc(d.name)}" placeholder="Ex. : Lire 20 minutes" autocomplete="off" enterkeyhint="next"></div>
    <div class="field"><span>Description <span class="muted">(facultatif)</span></span><textarea id="he-desc" maxlength="300" rows="2" placeholder="Pourquoi, comment, où…">${esc(d.description || '')}</textarea></div>
    <section><div class="section-title">Icône</div>
      <div class="icon-grid" id="he-icons" style="${colorOf()}">${HABIT_ICONS.map(([n, label]) => `<button type="button" data-sx="icon" data-v="${n}" aria-pressed="${d.icon === n}" aria-label="${label}" title="${label}">${icon(n)}</button>`).join('')}</div>
      <div class="field" style="margin-top:12px"><span>Ou un emoji</span><input id="he-emoji" maxlength="8" value="${isEmoji ? esc(d.icon.slice(6)) : ''}" placeholder="Ex. : 🏃" autocomplete="off"></div>
    </section>
    <section><div class="section-title">Catégorie</div><div class="cat-pick" id="he-cats">${catButtons()}</div>
      <form class="quick-add" data-sform="newcat" autocomplete="off"><input class="input" id="he-newcat" maxlength="30" placeholder="Nouvelle catégorie" aria-label="Nom de la nouvelle catégorie"><button type="submit" class="btn" aria-label="Créer la catégorie">${icon('plus')}</button></form>
    </section>
    <section><div class="section-title">Jours de répétition</div>
      <div class="days-pick" id="he-days">${weekOrder().map((dw) => `<button type="button" data-sx="day" data-v="${dw}" aria-pressed="${d.days.includes(dw)}" aria-label="${WD_LONG[dw]}">${WD_SHORT[dw]}</button>`).join('')}</div>
      <div class="chips" style="margin-top:10px"><button type="button" class="chip" data-sx="days" data-v="all">Tous les jours</button><button type="button" class="chip" data-sx="days" data-v="week">En semaine</button><button type="button" class="chip" data-sx="days" data-v="we">Le week-end</button></div>
    </section>
    <div class="field-row">
      <div class="field"><span>Heure de réalisation</span><input id="he-time" type="time" value="${d.time || ''}"><span class="hint">Vide : à tout moment</span></div>
      <div class="field"><span>Date de début</span><input id="he-start" type="date" value="${esc(d.startDate)}"><span class="hint">Les jours avant ne comptent pas</span></div>
    </div>
    <section><div class="section-title">Objectif de série</div><div class="chips" id="he-goals">${STREAK_GOALS.map((g) => `<button type="button" class="chip" data-sx="goal" data-v="${g}" aria-pressed="${(d.streakGoal || 0) === g}">${g ? `${g} jours` : 'Aucun'}</button>`).join('')}</div>
      <p class="hint" style="margin-top:8px">Atteindre l’objectif déclenche une petite célébration.</p></section>
    <section><div class="section-title">${icon('half')}Mini-version <span class="muted">(facultatif)</span></div>
      <div class="field"><input id="he-min" maxlength="80" value="${esc(d.minLabel || '')}" placeholder="Ex. : 5 minutes, ou 2 pages" autocomplete="off">
        <span class="hint">Ce qui compte les jours difficiles. Un bouton apparaîtra sur la ligne de l’habitude : la journée est marquée à part, ta série continue, et le jour compte pour une demi-validation.</span></div>
      <div class="chips" style="margin-top:8px">${['2 minutes', '5 minutes', '10 minutes', 'La moitié'].map((v) => `<button type="button" class="chip" data-sx="minpreset" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>
    </section>
    <p class="err" id="he-err" role="alert" hidden></p>`;
  const footer = `${existing ? `<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}${existing ? 'Enregistrer' : 'Créer'}</button>`;
  Sheet.open({
    title: existing ? 'Modifier l’habitude' : 'Nouvelle habitude',
    body,
    footer,
    onMount(el, entry) {
      const err = (msg) => { const e = $('#he-err', el); e.textContent = msg; e.hidden = !msg; };
      const syncDays = () => pressIn(el, '#he-days [data-sx="day"]', (b) => d.days.includes(+b.dataset.v));
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        if (sx === 'icon') { d.icon = b.dataset.v; $('#he-emoji', el).value = ''; pressIn(el, '#he-icons [data-sx="icon"]', (x) => x.dataset.v === d.icon); }
        if (sx === 'cat') { d.categoryId = b.dataset.v || null; pressIn(el, '#he-cats [data-sx="cat"]', (x) => (x.dataset.v || null) === d.categoryId); $('#he-icons', el).setAttribute('style', colorOf()); }
        if (sx === 'day') { const v = +b.dataset.v; d.days = d.days.includes(v) ? d.days.filter((x) => x !== v) : [...d.days, v].sort(); syncDays(); }
        if (sx === 'days') { d.days = { all: [0, 1, 2, 3, 4, 5, 6], week: [1, 2, 3, 4, 5], we: [0, 6] }[b.dataset.v]; syncDays(); }
        if (sx === 'goal') { d.streakGoal = +b.dataset.v; pressIn(el, '#he-goals [data-sx="goal"]', (x) => +x.dataset.v === d.streakGoal); }
        if (sx === 'minpreset') { $('#he-min', el).value = b.dataset.v; }
        if (sx === 'delete' && existing) { removeHabitFlow(existing, entry); }
        if (sx === 'save') {
          const name = $('#he-name', el).value.trim();
          if (!name) { err('Donne un nom à ton habitude.'); $('#he-name', el).focus(); return; }
          if (!d.days.length) { err('Choisis au moins un jour de répétition.'); return; }
          const emoji = $('#he-emoji', el).value.trim();
          let ic = emoji ? `emoji:${emoji}` : d.icon;
          if (!emoji && String(ic).startsWith('emoji:')) ic = 'check';
          const startRaw = $('#he-start', el).value;
          const fields = {
            name,
            description: $('#he-desc', el).value.trim(),
            icon: ic,
            categoryId: d.categoryId,
            time: $('#he-time', el).value || null,
            days: d.days.slice().sort(),
            streakGoal: d.streakGoal || 0,
            minLabel: $('#he-min', el).value.trim().slice(0, 80),
            startDate: /^\d{4}-\d{2}-\d{2}$/.test(startRaw) ? startRaw : (existing ? existing.startDate : ui.today),
            updatedAt: new Date().toISOString(),
          };
          Undo.push(existing ? `modification de « ${name} »` : `création de « ${name} »`);
          if (existing) Object.assign(existing, fields);
          else state.habits.push(newHabit({ ...fields, order: Math.max(-1, ...state.habits.map((h) => h.order ?? 0)) + 1 }));
          commit();
          Sheet.close(entry);
          refreshAll();
          toast(existing ? 'Habitude mise à jour' : 'Habitude créée', { msg: name });
        }
      });
      el.addEventListener('submit', (e) => {
        const f = e.target.closest('[data-sform="newcat"]');
        if (!f) return;
        e.preventDefault();
        const input = $('#he-newcat', el);
        const c = addCategory(input.value);
        if (!c) return;
        d.categoryId = c.id;
        input.value = '';
        $('#he-cats', el).innerHTML = catButtons();
        $('#he-icons', el).setAttribute('style', colorOf());
      });
      if (!existing && ENV.hover) setTimeout(() => { const n = $('#he-name', el); if (n) n.focus(); }, 60);
    },
  });
}

function addCategory(rawName) {
  const name = String(rawName || '').trim().slice(0, 30);
  if (!name) return null;
  const found = state.categories.find((c) => c.name.toLowerCase() === name.toLowerCase());
  if (found) return found;
  const used = new Set(state.categories.map((c) => c.color));
  const color = (PALETTE.find((p) => !used.has(p.id)) || PALETTE[state.categories.length % PALETTE.length]).id;
  const c = { id: uid(), name, color };
  state.categories.push(c);
  commit();
  return c;
}

async function removeHabitFlow(h, entry = null) {
  const choice = await ask({
    title: `Supprimer « ${h.name} » ?`,
    message: 'Archiver la retire de tes journées mais garde son historique et ses statistiques. La suppression définitive efface aussi toutes ses validations.',
    buttons: [
      { label: 'Archiver (garder l’historique)', value: 'archive', style: 'primary' },
      { label: 'Supprimer définitivement', value: 'delete', style: 'danger' },
      { label: 'Annuler', value: null, style: 'ghost' },
    ],
  });
  if (!choice) return;
  if (entry) Sheet.close(entry);
  Sheet.stack.filter((e) => e.habitId === h.id).forEach((e) => Sheet.close(e));
  if (choice === 'archive') archiveHabit(h);
  else purgeHabit(h);
}
function archiveHabit(h) {
  Undo.push(`archivage de « ${h.name} »`);
  h.archivedAt = ui.today;
  h.updatedAt = new Date().toISOString();
  commit();
  refreshAll();
  toast('Habitude archivée', { msg: 'Son historique est conservé.', ic: 'archive', action: { label: 'Annuler', fn: undoLast } });
}
function purgeHabit(h) {
  Undo.push(`suppression de « ${h.name} »`);
  state.habits = state.habits.filter((x) => x.id !== h.id);
  for (const map of [state.completions, state.partials]) {
    for (const k of Object.keys(map)) { delete map[k][h.id]; if (!Object.keys(map[k]).length) delete map[k]; }
  }
  delete state.snoozes[h.id];
  commit();
  refreshAll();
  toast('Habitude supprimée', { msg: h.name, ic: 'trash', action: { label: 'Annuler', fn: undoLast }, duration: 5000 });
}

/* ---------- Détail d’une habitude ---------- */
function habitDetailBody(h) {
  const k = ui.today;
  const st = habitStreak(h);
  const r30 = habitRange(h, D.add(k, -29), k);
  const all = habitRange(h, h.startDate, k);
  const cat = catById(h.categoryId);
  const start = D.add(weekStartKey(k), -28);
  const cells = [];
  for (let i = 0; i < 35; i++) {
    const dk = D.add(start, i);
    const s = cellState(h, dk, k);
    const day = D.parse(dk)[2];
    const label = `${F.long(dk)} : ${CELL_LABEL[s]}`;
    if (['done', 'part', 'bonus', 'pending', 'miss', 'off'].includes(s)) cells.push(`<button type="button" class="c ${s}" data-act="cell" data-id="${h.id}" data-k="${dk}" aria-label="${esc(label)}" aria-pressed="${s === 'done' || s === 'bonus'}">${day}</button>`);
    else cells.push(`<span class="c ${s === 'off-future' ? 'off' : s}" aria-hidden="true">${s === 'na' ? '' : day}</span>`);
  }
  const goal = h.streakGoal || 0;
  return `<div style="display:flex;gap:14px;align-items:center">${tile(h, 'lg')}<div style="min-width:0">
      <div class="row-meta" style="margin:0 0 4px">${cat ? `<span>${catDot(cat)}${esc(cat.name)}</span>` : ''}<span>${icon('repeat')}${scheduleLabel(h.days)}</span>${h.time ? `<span>${icon('clock')}${h.time}</span>` : ''}${h.archivedAt ? `<span>${icon('archive')}Archivée</span>` : ''}</div>
      ${h.description ? `<p class="small" style="color:var(--ink-2)">${esc(h.description)}</p>` : ''}</div></div>
    <div class="tiles">
      <div class="tile-stat"><div class="k">Série actuelle</div><div class="v">${st.current}<small>j</small></div></div>
      <div class="tile-stat"><div class="k">Meilleure série</div><div class="v">${st.best}<small>j</small></div></div>
      <div class="tile-stat"><div class="k">Réussite 30 jours</div><div class="v">${r30.rate === null ? '—' : P(Math.round(r30.rate * 100))}</div><div class="d">${r30.done}/${r30.scheduled}${r30.partial ? ` · ${r30.partial} mini` : ''}</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${st.total}</div><div class="d">depuis le ${F.short(h.startDate)}</div></div>
    </div>
    ${h.minLabel ? `<p class="part-note">${icon('half')}<span><b>Mini-version :</b> ${esc(h.minLabel)}${st.partials ? ` · utilisée ${plural(st.partials, 'fois', 'fois')}` : ''}</span></p>` : ''}
    ${goal ? `<div><div class="small" style="display:flex;justify-content:space-between;gap:10px"><span>Objectif de série : ${goal} jours</span><b>${Math.min(st.current, goal)}/${goal}</b></div><div class="bar"><i style="--v:${Math.min(100, Math.round((st.current / goal) * 100))}"></i></div></div>` : ''}
    <section><div class="section-title">Cinq dernières semaines</div>
      <div class="mini-cal">${weekOrder().map((dw) => `<span class="h">${WD_LETTER[dw]}</span>`).join('')}${cells.join('')}</div>
      <p class="hint" style="margin-top:10px">Touche un jour passé pour le cocher ou le décocher. Réussite globale : ${all.rate === null ? '—' : P(Math.round(all.rate * 100))}.</p>
    </section>`;
}
function openHabitDetail(id) {
  const h = habitById(id);
  if (!h) return;
  const footer = `${h.archivedAt
    ? `<button type="button" class="btn ghost" data-sx="restore" aria-label="Restaurer">${icon('restore')}<span class="hide-mobile">Restaurer</span></button>`
    : `<button type="button" class="btn ghost" data-sx="archive" aria-label="Archiver">${icon('archive')}<span class="hide-mobile">Archiver</span></button>`}<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button><span class="spacer"></span><button type="button" class="btn primary" data-sx="edit">${icon('edit')}Modifier</button>`;
  const entry = Sheet.open({
    title: h.name,
    body: habitDetailBody(h),
    footer,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'edit') { Sheet.close(en); openHabitEditor(h.id); }
        if (b.dataset.sx === 'archive') { Sheet.close(en); archiveHabit(h); }
        if (b.dataset.sx === 'restore') { h.archivedAt = null; commit(); Sheet.close(en); refreshAll(); toast('Habitude restaurée', { msg: h.name }); }
        if (b.dataset.sx === 'delete') removeHabitFlow(h, en);
      });
    },
  });
  entry.habitId = h.id;
  entry.refresh = () => { const cur = habitById(id); if (cur) Sheet.setBody(entry, habitDetailBody(cur)); };
}

/* ---------- Éditeur de tâche ---------- */
function openTaskEditor(id = null, preset = {}) {
  const existing = id ? state.tasks.find((t) => t.id === id) : null;
  const d = existing ? deepCopy(existing) : { title: '', notes: '', priority: quickTask.priority || 'medium', date: ui.today, time: null, ...preset };
  const body = `
    <div class="field"><span>Tâche</span><input id="te-title" maxlength="140" value="${esc(d.title)}" placeholder="Ex. : Appeler le plombier" autocomplete="off"></div>
    <div class="field"><span>Notes <span class="muted">(facultatif)</span></span><textarea id="te-notes" maxlength="500" rows="2">${esc(d.notes || '')}</textarea></div>
    <section><div class="section-title">Priorité</div><div class="seg" id="te-prio">${Object.entries(PRIORITIES).map(([pid, p]) => `<button type="button" data-sx="prio" data-v="${pid}" aria-pressed="${d.priority === pid}"><span class="prio prio-${pid}">${icon('flag')}</span>${p.name}</button>`).join('')}</div></section>
    <div class="field-row">
      <div class="field"><span>Date</span><input id="te-date" type="date" value="${esc(d.date)}"></div>
      <div class="field"><span>Heure ou échéance</span><input id="te-time" type="time" value="${d.time || ''}"></div>
    </div>
    ${existing ? `<div class="set-row" style="border-top:1px solid var(--line)"><div class="lbl"><b>Terminée</b><span>${existing.doneAt ? `Cochée ${esc(F.rel(existing.doneAt))}` : 'Pas encore'}</span></div><div class="ctl">${switchCtl('te-done', existing.done)}</div></div>` : ''}
    <p class="err" id="te-err" role="alert" hidden></p>`;
  const footer = `${existing ? `<button type="button" class="btn ghost" data-sx="delete" aria-label="Supprimer">${icon('trash')}<span class="hide-mobile">Supprimer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}${existing ? 'Enregistrer' : 'Ajouter'}</button>`;
  Sheet.open({
    title: existing ? 'Modifier la tâche' : 'Nouvelle tâche',
    body,
    footer,
    onMount(el, entry) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'prio') { d.priority = b.dataset.v; pressIn(el, '#te-prio [data-sx="prio"]', (x) => x.dataset.v === d.priority); }
        if (b.dataset.sx === 'delete' && existing) { Sheet.close(entry); deleteTask(existing); }
        if (b.dataset.sx === 'save') {
          const title = $('#te-title', el).value.trim();
          if (!title) { const er = $('#te-err', el); er.textContent = 'Écris l’intitulé de la tâche.'; er.hidden = false; return; }
          const date = /^\d{4}-\d{2}-\d{2}$/.test($('#te-date', el).value) ? $('#te-date', el).value : ui.today;
          const fields = { title, notes: $('#te-notes', el).value.trim(), priority: d.priority, date, time: $('#te-time', el).value || null, updatedAt: new Date().toISOString() };
          Undo.push(existing ? `modification de « ${title} »` : `ajout de « ${title} »`);
          if (existing) {
            const doneNow = $('#te-done', el) ? $('#te-done', el).checked : existing.done;
            Object.assign(existing, fields, { done: doneNow, doneAt: doneNow ? (existing.doneAt || new Date().toISOString()) : null });
          } else state.tasks.push(newTask(fields));
          commit();
          Sheet.close(entry);
          refreshAll();
          toast(existing ? 'Tâche mise à jour' : 'Tâche ajoutée', { msg: title, ic: 'tasks' });
        }
      });
      if (!existing && ENV.hover) setTimeout(() => { const n = $('#te-title', el); if (n) n.focus(); }, 60);
    },
  });
}
function deleteTask(t) {
  Undo.push(`suppression de « ${t.title} »`);
  state.tasks = state.tasks.filter((x) => x !== t);
  commit();
  refreshAll();
  toast('Tâche supprimée', { msg: t.title, ic: 'trash', action: { label: 'Annuler', fn: undoLast }, duration: 5000 });
}

/* ---------- Détail d’une journée ---------- */
function dayBody(k) {
  const s = dayStats(k);
  const future = k > ui.today;
  const life = activeHabitsAt(k);
  const planned = life.filter((h) => h.days.includes(D.dow(k)));
  const others = life.filter((h) => !h.days.includes(D.dow(k)));
  const tasks = sortTasks(state.tasks.filter((t) => t.date === k));
  const p = s.scheduled ? Math.round(s.pct * 100) : null;
  const note = state.journal[k];
  return `<div class="consistency"><div class="ring-wrap">${ring(s.pct || 0, { size: 96, stroke: 10, label: 'Régularité de la journée' })}<div class="ring-center"><span class="hero-ring-v" style="font-size:22px">${p === null ? '—' : p}<small>${p === null ? '' : '%'}</small></span></div></div>
      <div><p class="label">${future ? 'Journée à venir' : 'Bilan de la journée'}</p><p style="font-size:20px;font-weight:700">${s.done} sur ${s.scheduled} habitude${s.scheduled > 1 ? 's' : ''}</p><p class="small muted">${s.partial ? `${s.partial} en mini-version · ` : ''}${s.bonus ? `+ ${s.bonus} bonus · ` : ''}${tasks.length ? `${tasks.filter((t) => t.done).length}/${tasks.length} tâche${tasks.length > 1 ? 's' : ''} terminée${tasks.filter((t) => t.done).length > 1 ? 's' : ''}` : 'Aucune tâche ce jour-là'}</p></div></div>
    ${future ? '<p class="small muted">Ce jour n’est pas encore arrivé : tu pourras le cocher le moment venu.</p>' : `<section><div class="section-title">${icon('pen')}Journal</div>
      ${note && note.text
    ? `<button type="button" class="journal-note" data-act="journal-edit" data-k="${k}"><span>${esc(note.text)}</span><i>${icon('edit')}</i></button>`
    : `<button type="button" class="btn ghost block" data-act="journal-edit" data-k="${k}">${icon('plus')}Écrire une ligne sur cette journée</button>`}</section>`}
    <section><div class="section-title">Habitudes prévues</div>${planned.length ? `<div class="rows">${planned.map((h) => (future ? `<div class="row">${tile(h, 'sm')}<span class="row-text" style="padding:10px 4px"><span class="row-title">${esc(h.name)}</span></span></div>` : habitRow(h, k))).join('')}</div>` : '<p class="small muted">Aucune habitude prévue ce jour-là.</p>'}</section>
    ${!future && others.length ? `<section><div class="section-title">Non prévues (bonus possible)</div><div class="rows">${others.map((h) => habitRow(h, k)).join('')}</div></section>` : ''}
    ${tasks.length ? `<section><div class="section-title">Tâches</div><div class="rows">${tasks.map((t) => taskRow(t, {})).join('')}</div></section>` : ''}`;
}
function activeHabitsAt(k) { return state.habits.filter((h) => inLife(h, k)).sort(byOrder); }
function openDay(k) {
  const entry = Sheet.open({ title: F.cap(F.full(k)), body: dayBody(k) });
  entry.refresh = () => Sheet.setBody(entry, dayBody(k));
}

/* ---------- Bouton « + » ---------- */
function openQuickAdd() {
  if (ui.view === 'habitudes') return openHabitEditor();
  if (ui.view === 'taches') return openTaskEditor();

function openCustomize(focus = null) {
  const after = () => { applyTheme(); commit(); render(); };
  Sheet.open({
    title: 'Personnaliser',
    variant: 'side',
    body: customizeBody(),
    onMount(el) {
      let openPal = null;
      const catsHost = () => $('#cz-cats-list', el);
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-cz]');
        if (!b) return;
        const cz = b.dataset.cz;
        const s = state.settings;
        if (['accent', 'background', 'lightBg', 'radius', 'density', 'font', 'matrixShape', 'matrixColor'].includes(cz)) {
          s[cz] = b.dataset.v;
          pressIn(el, `[data-cz="${cz}"]`, (x) => x.dataset.v.toLowerCase() === String(s[cz]).toLowerCase());
          if (cz === 'accent') { const cu = $('.swatch.custom', el); if (cu) cu.setAttribute('aria-pressed', 'false'); $('#cz-custom', el).value = s.accent; }
          after();
        }
        if (cz === 'textScale') {
          s.textScale = Number(b.dataset.v) || 1;
          pressIn(el, '[data-cz="textScale"]', (x) => Number(x.dataset.v) === s.textScale);
          after();
        }
        /* Changer de thème change aussi la liste des fonds proposés : on redessine le panneau. */
        if (cz === 'theme') {
          s.theme = b.dataset.v;
          after();
          Sheet.setBody(Sheet.top(), customizeBody());
        }
        if (cz === 'reset-look') {
          ['accent', 'theme', 'background', 'lightBg', 'textScale', 'radius', 'density', 'font', 'glow', 'matrixShape', 'matrixColor', 'reduceMotion'].forEach((key) => { s[key] = DEFAULT_SETTINGS[key]; });
          after();
          Sheet.setBody(Sheet.top(), customizeBody());
          toast('Apparence réinitialisée', { ic: 'restore' });
        }
        if (cz === 'cat-pal') { openPal = openPal === b.dataset.id ? null : b.dataset.id; catsHost().innerHTML = categoriesEditor(openPal); }
        if (cz === 'cat-color') { const c = catById(b.dataset.id); if (c) { c.color = b.dataset.v; commit(); render(); catsHost().innerHTML = categoriesEditor(openPal); } }
        if (cz === 'cat-del') {
          const c = catById(b.dataset.id);
          if (!c) return;
          const used = state.habits.filter((h) => h.categoryId === c.id).length;
          const ok = await ask({ title: `Supprimer « ${c.name} » ?`, message: used ? `${used} habitude${used > 1 ? 's' : ''} passeront « Sans catégorie ». Leur historique est conservé.` : 'Aucune habitude n’utilise cette catégorie.', buttons: [{ label: 'Supprimer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
          if (!ok) return;
          state.categories = state.categories.filter((x) => x.id !== c.id);
          state.habits.forEach((h) => { if (h.categoryId === c.id) h.categoryId = null; });
          commit(); render();
          catsHost().innerHTML = categoriesEditor(openPal);
        }
      });
      el.addEventListener('change', (e) => {
        const t = e.target;
        if (t.matches('[data-czs]')) {
          const key = t.dataset.czs;
          const s = state.settings;
          if (key === 'mod-week') s.modules.week = t.checked;
          else if (key === 'mod-streaks') s.modules.streaks = t.checked;
          else if (key === 'mod-tasks') s.modules.tasksInPlan = t.checked;
          else if (key === 'mod-journal') s.modules.journal = t.checked;
          else if (key === 'mod-alerts') s.modules.alerts = t.checked;
          else if (key === 'mod-review') s.modules.review = t.checked;
          else s[key] = t.checked;
          after();
        }
        if (t.matches('[data-cat-name]')) {
          const c = catById(t.dataset.catName);
          const v = t.value.trim().slice(0, 30);
          if (c && v) { c.name = v; commit(); render(); } else if (c) t.value = c.name;
        }
      });
      el.addEventListener('input', (e) => {
        const t = e.target;
        if (t.id === 'cz-custom') {
          state.settings.accent = t.value;
          pressIn(el, '[data-cz="accent"]', () => false);
          const cu = $('.swatch.custom', el); if (cu) cu.setAttribute('aria-pressed', 'true');
          applyTheme();
          commitSoon();
        }
        if (t.id === 'cz-name') { state.profile.name = t.value.slice(0, 40); commitSoon(); }
        if (t.id === 'cz-daily' || t.id === 'cz-monthly') {
          const v = +t.value;
          if (t.id === 'cz-daily') state.goals.daily = v; else state.goals.monthly = v;
          $(`#${t.id}-out`, el).textContent = P(v);
          commitSoon();
        }
      });
      el.addEventListener('submit', (e) => {
        if (!e.target.closest('[data-czf="newcat"]')) return;
        e.preventDefault();
        const input = $('#cz-newcat', el);
        if (addCategory(input.value)) { input.value = ''; catsHost().innerHTML = categoriesEditor(openPal); render(); }
      });
      if (focus === 'cats') setTimeout(() => { const sec = $('#cz-cats', el); if (sec) sec.scrollIntoView({ block: 'start', behavior: 'smooth' }); }, 350);
    },
  });
}

/* ---------- Copie, export, import ---------- */
function copyText(text, fallbackEl = null) {
  const ok = () => toast('Copié', { msg: 'Tu peux le coller où tu veux.', ic: 'copy' });
  const fallback = () => {
    try {
      const ta = fallbackEl || Object.assign(document.createElement('textarea'), { value: text });
      if (!fallbackEl) { ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); }
      ta.focus(); ta.select();
      const done = document.execCommand && document.execCommand('copy');
      if (!fallbackEl) ta.remove();
      if (done) { ok(); return; }
    } catch (e) { /* ignore */ }
    toast('Copie impossible', { msg: 'Sélectionne le texte et copie-le à la main.', tone: 'bad', ic: 'alert' });
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(ok, fallback); return; }
  } catch (e) { /* ignore */ }
  fallback();
}
function showExportText(payload) {
  Sheet.open({
    title: 'Exporter mes données',
    body: `<p class="small muted">Copie ce texte et garde-le précieusement (Notes, Fichiers…). Tu pourras le coller dans « Importer une sauvegarde ».</p><textarea class="input code" id="export-text" readonly aria-label="Sauvegarde au format JSON">${esc(payload)}</textarea>`,
    footer: `<span class="spacer"></span><button type="button" class="btn primary" data-sx="copy">${icon('copy')}Copier</button>`,
    onMount(el) { el.addEventListener('click', (e) => { if (e.target.closest('[data-sx="copy"]')) copyText(payload, $('#export-text', el)); }); },
  });
}
/* Enregistre un fichier : feuille de partage iOS (qui contient AirDrop et Fichiers),
   sinon téléchargement classique. Renvoie 'shared', 'downloaded', 'cancelled' ou null. */
async function saveFile(content, name, mime, { shareTitle = 'Cadence', preferShare = ENV.ios } = {}) {
  if (ENV.inFrame) return null;
  try {
    const file = new File([content], name, { type: mime });
    if (preferShare && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: shareTitle });
      return 'shared';
    }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; }
  try {
    const url = URL.createObjectURL(new Blob([content], { type: mime }));
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return 'downloaded';
  } catch (e) { return null; }
}
async function exportData() {

}

/* ---------- Journal ---------- */
function openJournal(k) {
  const entry = state.journal[k] || { text: '', at: null };
  const prev = [];
  for (let i = 1; i <= 14 && prev.length < 5; i++) { const dk = D.add(k, -i); if (state.journal[dk] && state.journal[dk].text) prev.push({ k: dk, text: state.journal[dk].text }); }
  Sheet.open({
    title: `Journal · ${F.cap(F.long(k))}`,
    body: `<div class="field"><span>Ta ligne du jour</span>
        <textarea id="jo-text" maxlength="500" rows="4" placeholder="Ce qui a marché, ce qui a coincé, ton humeur…">${esc(entry.text || '')}</textarea>
        <span class="hint">Une phrase suffit. Tu la reverras dans la rétrospective et le bilan de l’année.</span></div>
      ${prev.length ? `<section><div class="section-title">Jours précédents</div><ul class="plain journal-year">${prev.map((p) => `<li><button type="button" data-sx="goto" data-k="${p.k}"><b>${esc(F.short(p.k))}</b><span>${esc(p.text)}</span></button></li>`).join('')}</ul></section>` : ''}`,
    footer: `${entry.text ? '<button type="button" class="btn ghost" data-sx="clear" aria-label="Effacer">' + icon('trash') + '<span class="hide-mobile">Effacer</span></button>' : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}Enregistrer</button>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'goto') { Sheet.close(en); openJournal(b.dataset.k); return; }
        if (b.dataset.sx === 'clear') {
          Undo.push('effacement d’une ligne de journal');
          delete state.journal[k];
          commit(); Sheet.close(en); refreshAll();
          toast('Ligne effacée', { ic: 'trash', action: { label: 'Annuler', fn: undoLast } });
          return;
        }
        if (b.dataset.sx === 'save') {
          const text = $('#jo-text', el).value.trim().slice(0, 500);
          Undo.push('écriture d’une ligne de journal');
          if (text) state.journal[k] = { text, at: new Date().toISOString() }; else delete state.journal[k];
          commit();
          evaluateAchievements();
          Sheet.close(en);
          refreshAll();
          toast(text ? 'Journal enregistré' : 'Ligne effacée', { ic: 'pen', action: { label: 'Annuler', fn: undoLast } });
        }
      });
      if (ENV.hover) setTimeout(() => { const t = $('#jo-text', el); if (t) t.focus(); }, 60);
    },
  });
}

/* ---------- Rétrospective hebdomadaire ---------- */
function openReview(ws) {
  const draft = { change: '', note: '' };
  const build = () => {
    const r = weekReview(ws);
    const saved = r.saved;
    if (saved && !draft.change) { draft.change = saved.change || ''; draft.note = saved.note || ''; }
    const diff = r.week.rate !== null && r.prev.rate !== null ? Math.round((r.week.rate - r.prev.rate) * 100) : null;
    const list = (title, items, ic, empty) => `<section><div class="section-title">${icon(ic)}${title}</div>
      ${items.length ? `<div class="rows">${items.map((x) => `<div class="row"><button type="button" class="row-hit" data-sx="habit" data-id="${x.h.id}">${tile(x.h, 'sm')}<span class="row-text"><span class="row-title">${esc(x.h.name)}</span><span class="row-meta"><span>${x.done}/${x.scheduled} jour${x.scheduled > 1 ? 's' : ''}</span>${x.partial ? `<span class="part-pill">${icon('half')}${x.partial} mini</span>` : ''}<span>${P(Math.round(x.rate * 100))}</span></span></span></button></div>`).join('')}</div>` : `<p class="small muted">${empty}</p>`}</section>`;
    return `<div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Régularité</div><div class="v">${r.week.rate === null ? '—' : P(Math.round(r.week.rate * 100))}</div><div class="d">${r.week.done}/${r.week.scheduled} prévues</div></div>
        <div class="tile-stat"><div class="k">Vs semaine d’avant</div><div class="v ${diff > 0 ? 'delta-up' : diff < 0 ? 'delta-down' : ''}">${diff === null ? '—' : `${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${Math.abs(diff)}`}<small>${diff === null ? '' : 'pts'}</small></div></div>
        <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${r.week.perfect}</div><div class="d">sur ${r.week.days}</div></div>
        <div class="tile-stat"><div class="k">Jours à zéro</div><div class="v">${r.week.zeroDays}</div><div class="d">${r.week.partial ? `${r.week.partial} sauvés en mini` : 'rien de validé'}</div></div>
      </div>
      ${list('Ce qui a tenu', r.kept, 'check', 'Aucune habitude au-dessus de 80 % cette semaine. Ça arrive.')}
      ${list('Ce qui a lâché', r.slipped, 'alert', 'Rien n’est passé sous 50 %. Belle semaine.')}
      ${r.notes.length ? `<section><div class="section-title">${icon('pen')}Ton journal de la semaine</div><ul class="plain journal-year">${r.notes.map((n) => `<li><button type="button" data-sx="note" data-k="${n.k}"><b>${esc(F.short(n.k))}</b><span>${esc(n.text)}</span></button></li>`).join('')}</ul></section>` : ''}
      <section><div class="section-title">Un seul changement pour la semaine qui vient</div>
        <div class="field"><input id="rv-change" maxlength="160" value="${esc(draft.change)}" placeholder="Ex. : passer le sport à 3 jours au lieu de 5" autocomplete="off">
          <span class="hint">Un changement par semaine se tient. Cinq, non.</span></div>
        ${r.slipped.length ? `<div class="chips" style="margin-top:10px">${r.slipped.slice(0, 3).map((x) => `<button type="button" class="chip" data-sx="suggest" data-v="${esc(`Réduire les jours de « ${x.h.name} »`)}">Réduire « ${esc(x.h.name)} »</button><button type="button" class="chip" data-sx="suggest" data-v="${esc(`Ajouter une mini-version à « ${x.h.name} »`)}">Mini-version « ${esc(x.h.name)} »</button>`).join('')}</div>` : ''}
        <div class="field" style="margin-top:14px"><span>Remarques <span class="muted">(facultatif)</span></span><textarea id="rv-note" maxlength="500" rows="3" placeholder="Ce que tu veux retenir de cette semaine.">${esc(draft.note)}</textarea></div>
      </section>
      ${saved ? `<p class="small muted">Rétrospective déjà enregistrée ${esc(F.rel(saved.at))}. Tu peux la modifier.</p>` : ''}`;
  };
  const entry = Sheet.open({
    title: `Semaine du ${F.short(ws)} au ${F.short(D.add(ws, 6))}`,
    body: build(),
    footer: `<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Fermer</button><button type="button" class="btn primary" data-sx="save">${icon('check')}Enregistrer</button>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'suggest') { $('#rv-change', el).value = b.dataset.v; return; }
        if (b.dataset.sx === 'habit') { openHabitDetail(b.dataset.id); return; }
        if (b.dataset.sx === 'note') { openJournal(b.dataset.k); return; }
        if (b.dataset.sx === 'save') {
          const r = weekReview(ws);
          Undo.push('rétrospective de la semaine');
          state.reviews[ws] = {
            at: new Date().toISOString(),
            change: $('#rv-change', el).value.trim().slice(0, 160),
            note: $('#rv-note', el).value.trim().slice(0, 500),
            kept: r.kept.map((x) => x.h.id),
            slipped: r.slipped.map((x) => x.h.id),
            rate: r.week.rate,
          };
          delete state.snoozes['review:' + ws];
          commit();
          evaluateAchievements();
          Sheet.close(en);
          refreshAll();
          toast('Rétrospective enregistrée', { msg: 'À la semaine prochaine.', ic: 'check', tone: 'good' });
        }
      });
    },
  });
  entry.refresh = () => {
    draft.change = $('#rv-change', entry.el) ? $('#rv-change', entry.el).value : draft.change;
    draft.note = $('#rv-note', entry.el) ? $('#rv-note', entry.el).value : draft.note;
    Sheet.setBody(entry, build());
  };
}

/* ---------- Ajuster une habitude qui décroche ---------- */
function openFixHabit(id) {
  const h = habitById(id);
  if (!h) return;
  const today = ui.today;
  const recent = habitRange(h, D.add(today, -13), today);
  const wd = [0, 1, 2, 3, 4, 5, 6]
    .filter((dw) => h.days.includes(dw))
    .map((dw) => {
      let s = 0; let d = 0;
      for (let k = D.add(today, -55); k <= today; k = D.add(k, 1)) { if (D.dow(k) !== dw || !inLife(h, k)) continue; s++; if (isCounted(h, k)) d++; }
      return { dw, s, d, rate: s ? d / s : null };
    })
    .sort((a, b) => (a.rate === null ? 1 : b.rate === null ? -1 : a.rate - b.rate));
  const worst = wd.filter((x) => x.rate !== null && x.rate < 0.5).slice(0, 2);
  const opt = (sx, ic, title, text, extra = '') => `<button type="button" class="card hcard" data-sx="${sx}" ${extra} style="text-align:left;width:100%"><span class="tile" style="--c:var(--accent-line);--cbg:var(--accent-soft)">${icon(ic)}</span><span style="min-width:0"><b style="display:block;font-size:15.5px">${title}</b><span class="small muted">${text}</span></span></button>`;
  Sheet.open({
    title: `Ajuster « ${h.name} »`,
    body: `<p class="small muted">${P(Math.round(recent.rate * 100))} sur les 14 derniers jours. Réduire l’exigence maintenant vaut mieux que d’abandonner dans trois semaines.</p>
      <div class="stack" style="gap:10px;margin-top:4px">
        ${h.minLabel
    ? opt('min', 'half', 'Modifier la mini-version', `Aujourd’hui : « ${esc(h.minLabel)} ». Les jours difficiles, elle sauve ta série.`)
    : opt('min', 'half', 'Ajouter une mini-version', 'Une version minimale (« 5 minutes ») qui compte quand tu ne peux pas tout faire.')}
        ${worst.length ? opt('drop', 'calendar', `Retirer ${worst.map((x) => WD_LONG[x.dw]).join(' et ')}`, `Tu tiens rarement cette habitude ${worst.length > 1 ? 'ces jours-là' : `le ${WD_LONG[worst[0].dw]}`} (${worst.map((x) => P(Math.round(x.rate * 100))).join(', ')}). Mieux vaut moins de jours tenus.`) : ''}
        ${opt('edit', 'edit', 'Modifier l’habitude', 'Changer les jours, l’heure, l’objectif de série ou le nom.')}
        ${opt('archive', 'archive', 'Archiver l’habitude', 'Elle quitte tes journées, son historique reste. Tu pourras la restaurer.')}
      </div>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        const sx = b.dataset.sx;
        if (sx === 'edit') { Sheet.close(en); openHabitEditor(h.id); return; }
        if (sx === 'archive') { Sheet.close(en); removeHabitFlow(h); return; }
        if (sx === 'drop') {
          Undo.push(`jours de « ${h.name} »`);
          const removed = worst.map((x) => x.dw);
          const left = h.days.filter((dw) => !removed.includes(dw));
          if (!left.length) { toast('Impossible', { msg: 'Il faut garder au moins un jour.', tone: 'bad', ic: 'alert' }); Undo.pop(); return; }
          h.days = left;
          h.updatedAt = new Date().toISOString();
          delete state.snoozes[h.id];
          commit(); Sheet.close(en); refreshAll();
          toast('Jours réduits', { msg: scheduleLabel(h.days), ic: 'calendar', action: { label: 'Annuler', fn: undoLast } });
          return;
        }
        if (sx === 'min') { Sheet.close(en); openMiniEditor(h.id); }
      });
    },
  });
}
function openMiniEditor(id) {
  const h = habitById(id);
  if (!h) return;
  Sheet.open({
    title: 'Mini-version',
    body: `<p class="small muted">Qu’est-ce qui compte, les jours où tu ne peux pas faire « ${esc(h.name)} » en entier ?</p>
      <div class="field"><span>Version minimale</span><input id="mn-text" maxlength="80" value="${esc(h.minLabel || '')}" placeholder="Ex. : 5 minutes" autocomplete="off">
        <span class="hint">Un bouton ${icon('half')} apparaîtra sur la ligne de l’habitude. La journée est marquée à part, ta série continue, et elle compte pour une demi-validation.</span></div>
      <div class="chips" style="margin-top:8px">${['2 minutes', '5 minutes', '10 minutes', 'La moitié', 'Juste commencer'].map((v) => `<button type="button" class="chip" data-sx="preset" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`,
    footer: `${h.minLabel ? `<button type="button" class="btn ghost" data-sx="remove">${icon('trash')}<span class="hide-mobile">Retirer</span></button>` : ''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="sheet-close">Annuler</button><button type="button" class="btn primary" data-sx="save">${icon('check')}Enregistrer</button>`,
    onMount(el, en) {
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'preset') { $('#mn-text', el).value = b.dataset.v; return; }
        if (b.dataset.sx === 'remove' || b.dataset.sx === 'save') {
          const val = b.dataset.sx === 'remove' ? '' : $('#mn-text', el).value.trim().slice(0, 80);
          Undo.push(`mini-version de « ${h.name} »`);
          h.minLabel = val;
          h.updatedAt = new Date().toISOString();
          delete state.snoozes[h.id];
          commit(); Sheet.close(en); refreshAll();
          toast(val ? 'Mini-version enregistrée' : 'Mini-version retirée', { msg: val || h.name, ic: 'half', action: { label: 'Annuler', fn: undoLast } });
        }
      });
      if (ENV.hover) setTimeout(() => { const t = $('#mn-text', el); if (t) t.focus(); }, 60);
    },
  });
}

/* ---------- Transfert vers un autre appareil ----------
   Pas de synchronisation : un fichier passe d’un appareil à l’autre par AirDrop,
   la voie native entre appareils Apple, puis on l’importe de l’autre côté. */
function openTransfer() {
  const send = `<ol class="steps">
      <li><span><b>Sur cet appareil</b>Touche « Préparer le fichier » ci-dessous. La feuille de partage s’ouvre.</span></li>
      <li><span><b>Choisis AirDrop</b>Puis touche le nom de l’autre appareil. Garde les deux appareils déverrouillés et proches.</span></li>
      <li><span><b>Sur l’autre appareil</b>Accepte le fichier, puis ouvre Cadence, va dans Réglages, « Importer une sauvegarde », et choisis le fichier reçu.</span></li>
    </ol>
    <p class="hint">Si AirDrop n’apparaît pas : enregistre le fichier dans iCloud Drive, puis récupère-le depuis l’app Fichiers de l’autre appareil.</p>`;
  const receive = `<ol class="steps">
      <li><span><b>Sur l’appareil de départ</b>Ouvre Cadence, Réglages, puis « Transférer vers un autre appareil », et envoie le fichier par AirDrop.</span></li>
      <li><span><b>Sur cet appareil</b>Accepte le fichier : il arrive dans l’app Fichiers, dossier Téléchargements.</span></li>
      <li><span><b>Importe-le</b>Touche « Importer une sauvegarde » ci-dessous et choisis le fichier.</span></li>
    </ol>
    <p class="hint">L’import remplace les données de cet appareil. Une sauvegarde est créée juste avant, au cas où.</p>`;
  let tab = 'send';
  const body = () => `<div class="seg" role="group" aria-label="Sens du transfert" style="margin-bottom:14px">
      <button type="button" data-sx="tab" data-v="send" aria-pressed="${tab === 'send'}">${icon('upload')}Envoyer</button>
      <button type="button" data-sx="tab" data-v="receive" aria-pressed="${tab === 'receive'}">${icon('download')}Recevoir</button>
    </div>
    <p class="small muted">Cadence n’a pas de compte ni de synchronisation : chaque appareil garde ses données. Pour les déplacer, on passe par un fichier.</p>
    ${tab === 'send' ? send : receive}
    <div class="btn-row" style="margin-top:4px">${tab === 'send'
    ? `<button type="button" class="btn primary" data-sx="prepare">${icon('share')}Préparer le fichier</button>`
    : `<button type="button" class="btn primary" data-sx="import">${icon('upload')}Importer une sauvegarde</button>`}</div>
    <div class="set-list" style="margin-top:14px">
      <div class="set-row"><div class="lbl"><b>Contenu du transfert</b><span>${plural(state.habits.length, 'habitude', 'habitudes')} · ${plural(countChecks(state), 'validation', 'validations')} · ${plural(state.tasks.length, 'tâche', 'tâches')} · ${plural(Object.keys(state.journal).length, 'ligne de journal', 'lignes de journal')}</span></div></div>
    </div>`;
  const entry = Sheet.open({
    title: 'Transférer vers un autre appareil',
    body: body(),
    onMount(el, en) {
      el.addEventListener('click', async (e) => {
        const b = e.target.closest('[data-sx]');
        if (!b) return;
        if (b.dataset.sx === 'tab') { tab = b.dataset.v; Sheet.setBody(en, body()); return; }
        if (b.dataset.sx === 'import') { Sheet.close(en); openImport(); return; }
        if (b.dataset.sx === 'prepare') {
          const payload = JSON.stringify(exportPayload(), null, 2);
          const name = stampName('cadence-transfert', 'json');
          const res = await saveFile(payload, name, 'application/json', { shareTitle: 'Cadence — transfert', preferShare: true });
          if (res === 'cancelled') return;
          if (res === 'shared') toast('Fichier envoyé', { msg: 'Importe-le sur l’autre appareil.', ic: 'devices' });
          else if (res === 'downloaded') toast('Fichier enregistré', { msg: name, ic: 'devices' });
          else showExportText(payload);
        }
      });
    },
  });
  entry.refresh = () => Sheet.setBody(entry, body());
}

/* =====================================================================
   MISES À JOUR — détection d’une nouvelle version, installation,
   préparation d’une demande de mise à jour
   ---------------------------------------------------------------------
   Le service worker (sw.js) garde l’app en cache pour le hors-ligne. À
   chaque ouverture, il compare index.html au fichier publié en ligne :
   s’il a changé, la nouvelle version est mise de côté et l’app propose
   de l’installer. Les données ne sont jamais touchées (stockage séparé).
   ===================================================================== */

const Updates = {
  supported: 'serviceWorker' in navigator && ENV.secure && !ENV.inFrame && !ENV.preview,
  reg: null,
  ready: false,
  readyVersion: null,
  checking: false,
  lastError: null,
  lastAuto: 0,
  async init() {
    if (!this.supported) return;
    try {
      this.reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
    } catch (e) {
      this.supported = false;
      this.lastError = e;
      return;
    }
    navigator.serviceWorker.addEventListener('message', (e) => {
      const msg = e.data || {};
      if (msg.type === 'UPDATE_READY') this.markReady(msg.version);
    });
    let hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController) this.status_check();
      hadController = true;
    });
    this.status_check();
  },
  ask(type, timeout = 12000) {
    return new Promise((resolve) => {
      const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
      if (!ctrl) { resolve(null); return; }
      const ch = new MessageChannel();
      const timer = setTimeout(() => resolve(null), timeout);
      ch.port1.onmessage = (e) => { clearTimeout(timer); resolve(e.data || null); };
      try { ctrl.postMessage({ type }, [ch.port2]); } catch (e) { clearTimeout(timer); resolve(null); }
    });
  },
  /* Une version a-t-elle été mise en cache après l’ouverture de cette page ? */
  async status_check() {
    const st = await this.ask('STATUS', 5000);
    if (st && st.updatedAt && st.updatedAt > PAGE_START) this.markReady(st.version);
  },
  markReady(version) {
    if (this.ready && this.readyVersion === version) return;
    this.ready = true;
    this.readyVersion = version || null;
    renderBanners();
    renderNav();
    renderTop();
    if (ui.view === 'reglages') renderView();
  },
  async check({ silent = false } = {}) {
    if (!this.supported) {
      if (!silent) toast('Vérification indisponible ici', { msg: ENV.inFrame || ENV.preview ? 'Elle fonctionne dans l’app installée.' : 'Ouvre l’app depuis son adresse https.', ic: 'info' });
      return;
    }
    if (navigator.onLine === false) { if (!silent) toast('Hors connexion', { msg: 'Connecte-toi à Internet pour vérifier les mises à jour.', ic: 'alert', tone: 'bad' }); return; }
    if (this.checking) return;
    this.checking = true;
    if (ui.view === 'reglages') renderView();
    try {
      try { if (this.reg) await this.reg.update(); } catch (e) { /* ignore */ }
      const res = await this.ask('CHECK', 15000);
      state.updates.lastCheck = new Date().toISOString();
      commit();
      if (!res || res.type === 'CHECK_FAILED') {
        if (!silent) toast('Vérification impossible', { msg: 'Le serveur ne répond pas. Réessaie plus tard.', ic: 'alert', tone: 'bad' });
      } else if (res.type === 'UPDATE_READY' || (res.updatedAt && res.updatedAt > PAGE_START)) {
        this.markReady(res.version);
        if (!silent) toast('Nouvelle version disponible', { msg: 'Touche « Installer » pour en profiter.', ic: 'rocket', tone: 'celebrate' });
      } else if (!silent) {
        toast('Tu as la dernière version', { msg: `Cadence ${APP.version}`, ic: 'check', tone: 'good' });
      }
    } finally {
      this.checking = false;
      if (ui.view === 'reglages') renderView();
    }
  },
  async autoCheck() {
    if (!this.supported || !state.settings.autoUpdate) return;
    if (Date.now() - this.lastAuto < 20 * 60 * 1000) return;
    this.lastAuto = Date.now();
    await this.check({ silent: true });
  },
  async install() {
    try { await Backups.create('avant mise à jour'); } catch (e) { /* ignore */ }
    await flush();
    toast('Installation…', { msg: 'Cadence redémarre avec la nouvelle version.', ic: 'rocket', duration: 1500 });
    setTimeout(() => location.reload(), 500);
  },
  status() {
    if (!this.supported) {
      return {
        badge: `<span class="status-badge">${icon('info')}Aperçu</span>`,
        text: ENV.inFrame || ENV.preview
          ? 'Dans cet aperçu, les mises à jour ne s’appliquent pas. Une fois Cadence installée sur ton appareil, elle détectera seule les nouvelles versions publiées.'
          : 'Les mises à jour automatiques nécessitent une adresse sécurisée (https), comme celle fournie par GitHub Pages.',
      };
    }
    if (this.ready) return { badge: `<span class="status-badge new">${icon('rocket')}Nouvelle version prête</span>`, text: 'Elle est déjà téléchargée. L’installation prend une seconde et conserve toutes tes données (une sauvegarde est faite juste avant).' };
    if (this.checking) return { badge: `<span class="status-badge">${icon('refresh', 'spin')}Vérification…</span>`, text: 'Recherche d’une version plus récente sur le serveur.' };
    return { badge: `<span class="status-badge ok">${icon('check')}À jour</span>`, text: 'Quand tu publies une nouvelle version sur GitHub, elle est détectée ici automatiquement, puis installée en un geste.' };
  },
};

function nextVersion(v) {
  const [a, b] = String(v).split('.').map((n) => parseInt(n, 10) || 0);
  return `${a}.${b + 1}.0`;
}
function buildUpdateRequest() {
  const items = state.updates.backlog.filter((i) => !i.done);
  const lines = [
    'Bonjour Claude,',
    '',
    `Voici une demande de mise à jour pour mon application Cadence (PWA de suivi d’habitudes). Version actuelle : ${APP.version}. Nouvelle version souhaitée : ${nextVersion(APP.version)}.`,
    'Je te joins les fichiers de l’app : index.html, sw.js et manifest.webmanifest (les icônes .png ne changent pas).',
    '',
    'Changements souhaités :',
    ...(items.length ? items.map((it, i) => `${i + 1}. ${it.text}`) : ['1. (ajoute tes idées dans Réglages → Préparer une mise à jour)']),
    '',
    'Contraintes :',
    `- Conserver toutes mes données existantes (base IndexedDB « cadence », schéma ${APP.schema}). Si le format des données change, ajouter une migration dans MIGRATIONS et incrémenter APP.schema.`,
    `- Passer APP.version à ${nextVersion(APP.version)} et ajouter une entrée en tête de CHANGELOG dans index.html.`,
    `- Mettre SW_VERSION à ${nextVersion(APP.version)} dans sw.js.`,
    '- Garder le style actuel (mode sombre, couleur principale personnalisable) et l’interface en français.',
    '- Me renvoyer les fichiers complets à remplacer dans mon dépôt GitHub.',
  ];
  return lines.join('\n');
}

/* =====================================================================
   ACTIONS — validations, célébrations, navigation, démarrage
   ===================================================================== */

/* Pose ou retire une marque dans completions/partials. */
function setMark(map, k, id, on) {
  if (on) { (state[map][k] || (state[map][k] = {}))[id] = new Date().toISOString(); return; }
  const day = state[map][k];
  if (!day) return;
  delete day[id];
  if (!Object.keys(day).length) delete state[map][k];
}
function dayGuard(h, k) {
  if (k > ui.today) { toast('Ce jour n’est pas encore arrivé', { ic: 'calendar' }); return false; }
  if (!inLife(h, k)) { toast('Jour hors de la période', { msg: 'Change la date de début de l’habitude pour remplir les jours précédents.', ic: 'info' }); return false; }
  return true;
}

function toggleHabit(id, k = ui.today) {
  const h = habitById(id);
  if (!h || !dayGuard(h, k)) return;
  const was = isDone(h, k);
  Undo.push(was ? `décochage de « ${h.name} »` : `validation de « ${h.name} »`);
  setMark('completions', k, id, !was);
  if (!was) setMark('partials', k, id, false); // une journée complète remplace la mini-version
  commit();
  if (!was) ui.pop = { id, k };
  refreshAll();
  if (!was) celebrate(h, k);
}

/* Mini-version : maintient la série les jours difficiles. */
function toggleMin(id, k = ui.today) {
  const h = habitById(id);
  if (!h || !dayGuard(h, k)) return;
  if (!h.minLabel) { openMiniEditor(id); return; }
  const was = isPartial(h, k);
  Undo.push(`mini-version de « ${h.name} »`);
  setMark('partials', k, id, !was);
  if (!was) setMark('completions', k, id, false);
  commit();
  if (!was) ui.pop = { id, k };
  refreshAll();
  if (!was) {
    const st = habitStreak(h);
    toast('Mini-version validée', { msg: `${h.minLabel}${st.current > 1 ? ` · série de ${st.current} jours maintenue` : ''}`, ic: 'half', action: { label: 'Annuler', fn: undoLast } });
    evaluateAchievements().forEach((a) => setTimeout(() => toast(`Trophée : ${a.name}`, { msg: a.desc, ic: a.icon, tone: 'celebrate' }), 700));
    commit();
  }
}

/* Dans la matrice, les appuis successifs font le tour des états possibles. */
function cycleCell(id, k) {
  const h = habitById(id);
  if (!h || !dayGuard(h, k)) return;
  if (!h.minLabel) { toggleHabit(id, k); return; }
  if (isDone(h, k)) toggleMin(id, k);
  else if (isPartial(h, k)) toggleMin(id, k);
  else toggleHabit(id, k);
}

/* ---------- Annuler ---------- */
function undoLast() {
  const label = Undo.pop();
  if (!label) { toast('Rien à annuler', { ic: 'info' }); return; }
  Stats.reset();
  commit();
  refreshAll();
  toast('Annulé', { msg: F.cap(label), ic: 'undo' });
}

function toggleTask(id) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  Undo.push(`${t.done ? 'décochage' : 'validation'} de « ${t.title} »`);
  t.done = !t.done;
  t.doneAt = t.done ? new Date().toISOString() : null;
  t.updatedAt = new Date().toISOString();
  commit();
  if (t.done) ui.pop = { id, k: null };
  refreshAll();
  if (!t.done) return;
  const events = [];
  const today = state.tasks.filter((x) => x.date === ui.today);
  if (today.length >= 2 && today.every((x) => x.done) && !state.celebrated[`${ui.today}:tasks`]) {
    state.celebrated[`${ui.today}:tasks`] = 1;
    events.push({ title: 'Checklist terminée', msg: 'Toutes les tâches du jour sont faites.', ic: 'tasks' });
  }
  evaluateAchievements().forEach((a) => events.push({ title: `Trophée : ${a.name}`, msg: a.desc, ic: a.icon, big: true }));
  if (events.length) { commit(); showEvents(events); }
}

/* Récompenses visuelles : objectif du jour, journée parfaite, paliers de série, records, trophées. */
function celebrate(h, k) {
  const events = [];
  const mark = (key) => { if (state.celebrated[key]) return false; state.celebrated[key] = 1; return true; };
  if (k === ui.today) {
    const s = dayStats(k);
    if (s.scheduled && s.done === s.scheduled && mark(`${k}:perfect`)) events.push({ title: 'Journée parfaite !', msg: `${s.done} habitude${s.done > 1 ? 's' : ''} sur ${s.scheduled}. Bravo pour ta constance.`, ic: 'star', big: true });
    else if (s.scheduled && s.done < s.scheduled && metGoal(s) && mark(`${k}:goal`)) events.push({ title: 'Objectif du jour atteint', msg: `${P(Math.round(s.pct * 100))} de ta journée est déjà faite.`, ic: 'target' });
  }
  if (isScheduled(h, k)) {
    const n = habitStreak(h).current;
    if (n >= 3 && n === h.streakGoal && mark(`${h.id}:goal${n}:${k}`)) events.push({ title: `Objectif de série atteint : ${n} jours`, msg: h.name, ic: 'trophy', big: true });
    else if (MILESTONES.includes(n) && mark(`${h.id}:s${n}:${k}`)) events.push({ title: `${n} jours de suite`, msg: h.name, ic: 'flame', big: n >= 7 });
    const rec = state.records.bestStreak;
    if (n > (rec.value || 0)) {
      const prev = rec.value || 0;
      state.records.bestStreak = { value: n, habit: h.name, date: k };
      if (prev >= 3 && mark(`${k}:record`)) events.push({ title: 'Nouveau record personnel', msg: `${n} jours de suite sur « ${h.name} ».`, ic: 'trophy', big: true });
    }
  }
  evaluateAchievements().forEach((a) => events.push({ title: `Trophée : ${a.name}`, msg: a.desc, ic: a.icon, big: true }));
  commit();
  if (events.length) showEvents(events);
}
function showEvents(events) {
  if (!state.settings.celebrations) return;
  const big = events.some((e) => e.big);
  events.slice(0, 2).forEach((e, i) => setTimeout(() => toast(e.title, { msg: e.msg, ic: e.ic, tone: 'celebrate', duration: 3400 }), i * 650));
  if (big) confetti(events.length > 1 ? 1.3 : 1);
  if (ui.view === 'stats') renderView();
}

/* ---------- Navigation ---------- */
function go(view) {
  if (!VIEWS[view]) view = 'today';
  if (view !== ui.view) { ui.prevView = ui.view; ui.view = view; }
  if (!SUBVIEWS.includes(view)) lsSet('cadence:ui:view', view);
  Sheet.closeAll();
  window.scrollTo(0, 0);
  Stats.reset();
  ui.today = todayKey();
  document.body.dataset.view = ui.view;
  renderNav(); renderTop(); renderBanners();
  renderView(true);
  if (view === 'reglages') renderBackupList();
  if (view === 'recherche') setTimeout(() => { const i = $('#search-input'); if (i) i.focus(); }, 120);
}
function shiftMonth(o, delta) {
  o.m += delta;
  if (o.m < 1) { o.m = 12; o.y -= 1; }
  if (o.m > 12) { o.m = 1; o.y += 1; }
  renderView();
}
function toCurrentMonth(o) { const [y, m] = D.parse(ui.today); o.y = y; o.m = m; renderView(); }

function moveHabit(id, dir) {
  const list = activeHabits();
  const i = list.findIndex((h) => h.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((h, idx) => { h.order = idx; });
  commit();
  renderView();
}

function addQuickTask(form, date, priority) {
  const input = form.querySelector('input[name="title"]');
  const title = input.value.trim();
  if (!title) { input.focus(); return; }
  state.tasks.push(newTask({ title: title.slice(0, 140), date, priority }));
  commit();
  const id = input.id;
  refreshAll();
  const again = document.getElementById(id);
  if (again) again.focus();
  if (date !== ui.today) toast('Tâche planifiée', { msg: `${F.dayRel(date, ui.today)} · ${title}`, ic: 'calendar' });
}

async function restoreBackup(id) {
  const meta = (await Backups.list()).find((b) => b.id === id);
  if (!meta) return;
  const ok = await ask({ title: 'Restaurer cette sauvegarde ?', message: `Sauvegarde du ${esc(F.rel(meta.at))} : ${meta.habits} habitudes, ${meta.checks} validations. Tes données actuelles seront remplacées (elles sont sauvegardées juste avant).`, buttons: [{ label: 'Restaurer', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  const snap = await Backups.read(id);
  if (!snap) { toast('Sauvegarde introuvable', { ic: 'alert', tone: 'bad' }); return; }
  await Backups.create('avant restauration');
  adoptState(migrate(snap));
  await flush();
  refreshAll();
  renderBackupList();
  toast('Sauvegarde restaurée', { ic: 'restore', tone: 'good' });
}
async function resetAll() {
  const ok = await ask({ title: 'Effacer toutes les données ?', message: 'Habitudes, validations, tâches et réglages seront supprimés de cet appareil. Une sauvegarde automatique est créée juste avant.', buttons: [{ label: 'Tout effacer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  try { await Backups.create('avant réinitialisation'); } catch (e) { /* ignore */ }
  adoptState(defaultState());
  await flush();
  go('today');
  openOnboarding();
}
async function clearDemo() {
  const ok = await ask({ title: 'Quitter le mode démo ?', message: 'Les données d’exemple seront effacées pour que tu partes sur tes propres habitudes.', buttons: [{ label: 'Effacer la démo', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  const fresh = defaultState();
  fresh.profile.name = state.profile.name;
  adoptState(fresh);
  go('today');
  openOnboarding();
}
async function loadDemo() {
  const ok = await ask({ title: 'Charger la démo ?', message: 'Tes données actuelles seront remplacées par deux mois d’exemple. Une sauvegarde est créée avant, tu pourras la restaurer.', buttons: [{ label: 'Charger la démo', value: true, style: 'primary' }, { label: 'Annuler', value: false, style: 'ghost' }] });
  if (!ok) return;
  try { await Backups.create('manuelle'); } catch (e) { /* ignore */ }
  const demo = buildDemo();
  demo.profile.name = state.profile.name;
  adoptState(demo);
  go('today');
}

const ACTIONS = {
  nav: (b) => go(b.dataset.view),
  back: () => go(ui.prevView && !SUBVIEWS.includes(ui.prevView) ? ui.prevView : 'today'),
  'toggle-habit': (b) => toggleHabit(b.dataset.id, b.dataset.k || ui.today),
  'toggle-min': (b) => toggleMin(b.dataset.id, b.dataset.k || ui.today),
  cell: (b) => cycleCell(b.dataset.id, b.dataset.k),
  'toggle-task': (b) => toggleTask(b.dataset.id),
  undo: () => undoLast(),
  'habit-open': (b) => openHabitDetail(b.dataset.id),
  'habit-edit': (b) => openHabitEditor(b.dataset.id),
  'habit-new': () => openHabitEditor(),
  'task-new': () => openTaskEditor(null, quickTask.when === 'tomorrow' ? { date: D.add(ui.today, 1) } : {}),
  'task-edit': (b) => openTaskEditor(b.dataset.id),
  fab: () => openQuickAdd(),
  'plan-filter': (b) => { state.settings.planFilter = b.dataset.v; commit(); renderView(); },
  'day-open': (b) => openDay(b.dataset.k),
  'sheet-close': () => Sheet.close(),
  customize: () => openCustomize(),
  'customize-cats': () => openCustomize('cats'),
  'mx-prev': () => shiftMonth(ui.matrix, -1),
  'mx-next': () => shiftMonth(ui.matrix, 1),
  'mx-today': () => toCurrentMonth(ui.matrix),
  'mx-cat': (b) => { ui.matrix.cat = b.dataset.v; renderView(); },
  'st-prev': () => shiftMonth(ui.stats, -1),
  'st-next': () => shiftMonth(ui.stats, 1),
  'st-today': () => toCurrentMonth(ui.stats),
  'stats-range': (b) => { ui.stats.range = +b.dataset.v; renderView(); },
  'hm-prev': () => { ui.stats.year -= 1; renderView(); },
  'hm-next': () => { if (ui.stats.year < D.parse(ui.today)[0]) { ui.stats.year += 1; renderView(); } },
  'table-toggle': (b) => { ui.tables[b.dataset.t] = !ui.tables[b.dataset.t]; renderView(); },
  'top-all': () => { ui.stats.allTop = !ui.stats.allTop; renderView(); },
  'tasks-tab': (b) => { ui.tasksTab = b.dataset.v; renderView(); },
  'tq-opt': (b) => { quickTask[b.dataset.k] = b.dataset.v; pressIn(b.parentElement, '[data-act="tq-opt"]', (x) => x.dataset.v === b.dataset.v); },
  'tasks-postpone': () => {
    let n = 0;
    state.tasks.forEach((t) => { if (!t.done && t.date < ui.today) { t.date = ui.today; t.updatedAt = new Date().toISOString(); n++; } });
    commit(); refreshAll();
    toast(`${plural(n, 'tâche reportée', 'tâches reportées')} à aujourd’hui`, { ic: 'calendar' });
  },
  'tasks-clear-done': async () => {
    const done = state.tasks.filter((t) => t.done);
    const ok = await ask({ title: `Effacer ${plural(done.length, 'tâche terminée', 'tâches terminées')} ?`, message: 'Elles disparaîtront de la liste « Terminées ».', buttons: [{ label: 'Effacer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
    if (!ok) return;
    const before = state.tasks.slice();
    state.tasks = state.tasks.filter((t) => !t.done);
    commit(); refreshAll();
    toast('Tâches terminées effacées', { ic: 'trash', action: { label: 'Annuler', fn: () => { state.tasks = before; commit(); refreshAll(); } }, duration: 5000 });
  },
  'habits-cat': (b) => { ui.habitsCat = b.dataset.v; renderView(); },
  'habits-reorder': () => { ui.reorder = !ui.reorder; renderView(); },
  'habit-up': (b) => moveHabit(b.dataset.id, -1),
  'habit-down': (b) => moveHabit(b.dataset.id, 1),
  'habit-restore': (b) => { const h = habitById(b.dataset.id); if (!h) return; h.archivedAt = null; commit(); refreshAll(); toast('Habitude restaurée', { msg: h.name, ic: 'restore' }); },
  'habit-purge': async (b) => {
    const h = habitById(b.dataset.id);
    if (!h) return;
    const ok = await ask({ title: `Supprimer définitivement « ${h.name} » ?`, message: 'Son historique et ses validations seront effacés.', buttons: [{ label: 'Supprimer', value: true, style: 'danger' }, { label: 'Annuler', value: false, style: 'ghost' }] });
    if (ok) purgeHabit(h);
  },
  'archived-toggle': () => { ui.showArchived = !ui.showArchived; renderView(); },
  'add-samples': () => { state.habits.push(...sampleHabits(ui.today)); commit(); refreshAll(); toast('8 habitudes ajoutées', { msg: 'Modifie-les à ta guise.', ic: 'sparkles' }); },
  'set-weekstart': (b) => { state.settings.weekStart = +b.dataset.v; commit(); render(); },
  'update-check': () => Updates.check(),
  'update-install': () => Updates.install(),
  'whats-new': () => openWhatsNew(),
  'backlog-toggle': (b) => { const it = state.updates.backlog.find((x) => x.id === b.dataset.id); if (it) { it.done = !it.done; commit(); renderView(); } },
  'backlog-del': (b) => { state.updates.backlog = state.updates.backlog.filter((x) => x.id !== b.dataset.id); commit(); renderView(); },
  'request-copy': () => copyText(buildUpdateRequest()),
  'request-share': () => { if (navigator.share) navigator.share({ title: 'Demande de mise à jour Cadence', text: buildUpdateRequest() }).catch(() => {}); },
  export: () => exportData(),
  import: () => openImport(),
  'backup-restore': (b) => restoreBackup(b.dataset.id),
  'reset-all': () => resetAll(),
  'demo-clear': () => clearDemo(),
  'load-demo': () => loadDemo(),
  'install-guide': () => openInstallGuide(),
  'install-hide': () => { ui.installHidden = true; lsSet('cadence:ui:install', 'hidden'); renderBanners(); },
  'preview-hide': () => { ui.previewHidden = true; renderBanners(); },
  /* Nouveautés 1.1.0 */
  'journal-edit': (b) => openJournal(b.dataset.k || ui.today),
  'review-open': (b) => openReview(b.dataset.k || reviewTarget()),
  'review-later': (b) => { state.snoozes['review:' + b.dataset.k] = D.add(ui.today, 1); commit(); renderView(); toast('À demain', { msg: 'La rétrospective reste disponible dans Statistiques.', ic: 'clock' }); },
  'alert-snooze': (b) => {
    const h = habitById(b.dataset.id);
    if (!h) return;
    state.snoozes[h.id] = D.add(ui.today, 14);
    commit(); Stats.reset(); renderView();
    toast('Alerte mise en pause', { msg: `${h.name} · 14 jours`, ic: 'clock', action: { label: 'Annuler', fn: () => { delete state.snoozes[h.id]; commit(); Stats.reset(); renderView(); } } });
  },
  'fix-habit': (b) => openFixHabit(b.dataset.id),
  transfer: () => openTransfer(),
  'export-csv': () => exportCSV(),
  'print-report': () => printReport(),
  'search-open': () => go('recherche'),
  'search-clear': () => { ui.search = ''; renderView(); setTimeout(() => { const i = $('#search-input'); if (i) i.focus(); }, 60); },
  shortcuts: () => openShortcuts(),
  'year-prev': () => { const ys = yearsWithData(); const i = ys.indexOf(ui.year); if (i < ys.length - 1) { ui.year = ys[i + 1]; renderView(); } },
  'year-next': () => { const ys = yearsWithData(); const i = ys.indexOf(ui.year); if (i > 0) { ui.year = ys[i - 1]; renderView(); } },
};

const FORMS = {
  'plan-task': (f) => addQuickTask(f, ui.today, 'medium'),
  'task-quick': (f) => addQuickTask(f, quickTask.when === 'tomorrow' ? D.add(ui.today, 1) : ui.today, quickTask.priority),
  backlog: (f) => {
    const input = f.querySelector('input[name="text"]');
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    state.updates.backlog.push({ id: uid(), text: v.slice(0, 400), done: false, createdAt: new Date().toISOString() });
    commit();
    renderView();
    const again = $('#backlog-input'); if (again) again.focus();
  },
  search: (f) => {
    const input = f.querySelector('input[name="q"]');
    ui.search = input.value;
    renderView();
    const again = $('#search-input');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  },
};

function bindEvents() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = ACTIONS[b.dataset.act];
    if (!fn) return;
    e.preventDefault();
    FloatTip.hide();
    fn(b, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('form[data-form]');
    if (!f) return;
    e.preventDefault();
    const fn = FORMS[f.dataset.form];
    if (fn) fn(f);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if ((t.id === 'mx-month' || t.id === 'st-month') && /^\d{4}-\d{2}$/.test(t.value)) {
      const [y, m] = t.value.split('-').map(Number);
      const o = t.id === 'mx-month' ? ui.matrix : ui.stats;
      o.y = y; o.m = m;
      renderView();
      return;
    }
    if (t.matches && t.matches('[data-set]')) {
      const key = t.dataset.set;
      const before = todayKey();
      if (key === 'autoUpdate') state.settings.autoUpdate = t.checked;
      if (key === 'dayStartHour') state.settings.dayStartHour = clamp(+t.value || 0, 0, 5);
      if (key === 'timeZone') state.settings.timeZone = t.value || 'auto';
      const after = todayKey();
      /* Si « aujourd’hui » recule d’un jour, les habitudes créées aujourd’hui restent visibles. */
      if (after < before) state.habits.forEach((h) => { if (h.startDate === before) h.startDate = after; });
      commit();
      render();
      if (ui.view === 'reglages') renderBackupList();
    }
  });
  document.addEventListener('toggle', (e) => { if (e.target && e.target.id === 'backups-fold' && e.target.open) renderBackupList(); }, true);
  /* Recherche au fil de la frappe : on ne redessine qu’une fois la frappe calmée. */
  const searchSoon = debounce(() => {
    const input = $('#search-input');
    if (!input || ui.view !== 'recherche') return;
    const caret = input.selectionStart;
    ui.search = input.value;
    renderView();
    const again = $('#search-input');
    if (again) { again.focus(); try { again.setSelectionRange(caret, caret); } catch (err) { /* ignore */ } }
  }, 260);
  document.addEventListener('input', (e) => { if (e.target && e.target.id === 'search-input') searchSoon(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && Sheet.top()) { e.preventDefault(); Sheet.close(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const el = document.activeElement;
    if (el && (/INPUT|TEXTAREA|SELECT/.test(el.tagName) || el.isContentEditable)) return;
    if (Sheet.top() && e.key !== '?') return;
    const key = e.key;
    const navKeys = { 1: 'today', 2: 'taches', 3: 'matrice', 4: 'stats', 5: 'habitudes' };
    if (navKeys[key]) { e.preventDefault(); go(navKeys[key]); return; }
    if (key === '/') { e.preventDefault(); go('recherche'); return; }
    if (key === '?') { e.preventDefault(); openShortcuts(); return; }
    const k = key.toLowerCase();
    if (k === 'n') { e.preventDefault(); if (ui.view === 'taches') openTaskEditor(); else if (ui.view === 'habitudes') openHabitEditor(); else openQuickAdd(); return; }
    if (k === 'j') { e.preventDefault(); openJournal(ui.today); return; }
    if (k === 'p') { e.preventDefault(); openCustomize(); return; }
    if (k === 'z') { e.preventDefault(); undoLast(); return; }
    if (key === 'ArrowLeft' || key === 'ArrowRight') {
      const o = ui.view === 'matrice' ? ui.matrix : ui.view === 'stats' ? ui.stats : null;
      if (o) { e.preventDefault(); shiftMonth(o, key === 'ArrowLeft' ? -1 : 1); }
    }
  });
  if (ENV.hover) {
    document.addEventListener('pointerover', (e) => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (el && e.pointerType === 'mouse') FloatTip.show(el, `<span style="color:var(--ink-1);font-weight:600">${esc(el.dataset.tip)}</span>`);
    });
    document.addEventListener('pointerout', (e) => { if (e.target.closest && e.target.closest('[data-tip]')) FloatTip.hide(); });
  }
  const topbar = $('#topbar');
  const onScroll = () => { topbar.classList.toggle('scrolled', window.scrollY > 24); FloatTip.hide(); };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  window.addEventListener('resize', debounce(() => { if (ui.view === 'stats') mountCharts($('#view')); }, 200));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { flush(); return; }
    tick();
    Updates.autoCheck();
  });
  window.addEventListener('pagehide', () => { flush(); });
}

function tick() {
  const k = todayKey();
  if (k !== ui.today) {
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!typing) { render(); Sheet.stack.forEach((e) => { if (e.refresh) e.refresh(); }); }
    Backups.daily();
  }
}

function pruneCelebrated() {
  const limit = D.add(todayKey(), -90);
  for (const key of Object.keys(state.celebrated)) {
    const m = key.match(/\d{4}-\d{2}-\d{2}/);
    if (!m || m[0] < limit) delete state.celebrated[key];
  }
}
/* Les mises en pause d’alertes expirées ne servent plus à rien. */
function pruneSnoozes() {
  const today = todayKey();
  for (const key of Object.keys(state.snoozes)) if (String(state.snoozes[key]) <= today) delete state.snoozes[key];
}

function showFatal(err) {
  const view = document.getElementById('view');
  if (!view) return;
  view.innerHTML = `<section class="card"><div class="empty">${icon('alert')}<b>Cadence n’a pas pu démarrer</b><span>${esc(err && err.message ? err.message : String(err))}</span><span class="small">Recharge la page. Si le problème continue, ouvre Réglages → Données pour importer une sauvegarde.</span></div></section>`;
}

async function init() {
  await Store.init();
  const raw = await loadRaw();
  if (raw) {
    if ((Number(raw.schema) || 1) < APP.schema) { try { await Backups.create('avant mise à jour', raw); } catch (e) { /* ignore */ } }
    state = migrate(raw) || defaultState();
  } else {
    state = ENV.preview ? buildDemo() : defaultState();
  }
  ui.today = todayKey();
  const [y, m] = D.parse(ui.today);
  Object.assign(ui.matrix, { y, m });
  Object.assign(ui.stats, { y, m, year: y });
  ui.year = y;
  const lastView = lsGet('cadence:ui:view');
  if (lastView && VIEWS[lastView] && lastView !== 'reglages') ui.view = lastView;
  pruneCelebrated();
  pruneSnoozes();
  evaluateAchievements();
  applyTheme();
  watchSystemTheme();
  bindEvents();
  render();
  const lastSeen = state.meta.lastSeenVersion;
  if (!state.profile.onboarded && !ENV.preview) openOnboarding();
  commit();
  Backups.daily();
  if (ENV.standalone) Store.requestPersist();
  Updates.supported = false; // copie de secours : pas de recherche de mise à jour
  setInterval(tick, 30000);
}

init().catch((e) => { console.error(e); showFatal(e); });

})();
</script>
</body>
