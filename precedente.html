function anyEarlyCheck() {
  for (const k in state.completions) {
    const day = state.completions[k];
    for (const id in day) { const h = new Date(day[id]).getHours(); if (h >= 3 && h < 7) return true; }
  }
  return false;
}
function anyMonthGoal() {
  const first = earliestStart();
  if (!first) return false;
  let [y, m] = D.parse(first);
  const [ty, tm] = D.parse(ui.today);
  while (y < ty || (y === ty && m < tm)) {
    const [a, b] = monthBounds(y, m);
    const r = rangeStats(a, b);
    if (r.scheduled >= 20 && r.rate * 100 >= state.goals.monthly) return true;
    m += 1; if (m > 12) { m = 1; y += 1; }
  }
  return false;
}
/* Renvoie la liste des trophées débloqués à l’instant. */
function evaluateAchievements() {
  const c = totals();
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    if (state.achievements[a.id]) continue;
    let ok = false;
    try { ok = a.test(c); } catch (e) { ok = false; }
    if (ok) { state.achievements[a.id] = new Date().toISOString(); fresh.push(a); }
  }
  const gr = goalRuns();
  if (gr.best > (state.records.bestGoalRun.value || 0)) state.records.bestGoalRun = { value: gr.best, date: gr.bestEnd };
  return fresh;
}

const MOTTOS = {

  zero: ['Une habitude à la fois. Commence par la plus simple.', 'La régularité compte plus que l’intensité.', 'Petit pas aujourd’hui, grand écart dans un mois.', 'Cocher la première case lance toute la journée.'],

  full: ['Journée parfaite. Savoure-la.', 'Tout est coché. Bravo pour ta constance.', '100 % aujourd’hui. Ton futur toi te remercie.'],
};
function mottoFor(s) {
  let bucket = 'none';
  if (s.scheduled) {
    const p = (s.done / s.scheduled) * 100;
    if (s.done === 0) bucket = 'zero';
    else if (p >= 100) bucket = 'full';
    else if (p >= state.goals.daily) bucket = 'goal';
    else if (p >= 50) bucket = 'mid';
    else bucket = 'low';
  }
  const list = MOTTOS[bucket];
  return list[hashStr(s.k + bucket) % list.length];
}

const Sheet = {

    layer.innerHTML = `<div class="sheet-backdrop" ${closable ? 'data-act="sheet-close"' : ''}></div>

function confetti(power = 1) {

  const colors = [state.settings.accent, state.settings.accent, '#FFFFFF', '#3987e5', '#e66767', '#3DDC97', '#9085e9'];
  const N = Math.round(110 * power);
  const parts = Array.from({ length: N }, (_, i) => {
    const fromLeft = i % 2 === 0;
    const angle = (fromLeft ? -60 : -120) * (Math.PI / 180) + (Math.random() - 0.5) * 0.9;
    const speed = 9 + Math.random() * 9;
    return { x: fromLeft ? W * 0.1 : W * 0.9, y: H * 0.72, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, w: 6 + Math.random() * 6, h: 3 + Math.random() * 5, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, c: colors[i % colors.length], life: 0 };
  });

  const frame = (t) => {
    const dt = Math.min(32, t - (frame.last || t)) / 16.67; frame.last = t;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of parts) {
      p.vy += 0.32 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      const fade = Math.max(0, 1 - (t - t0) / 2200);

    }

  };
  requestAnimationFrame(frame);
}

      lab = `<text class="strong" x="${cx}" y="${y(b.v) - 7}" text-anchor="middle">${P(b.v)}</text>`;
    }
    return `${hit}${shape}${lab}<text x="${cx}" y="${H - 8}" text-anchor="middle">${b.label}</text>`;
  }).join('');
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Régularité par jour de la semaine">${grid}${marks}</svg><div class="tip" hidden></div>`;
  const tip = el.querySelector('.tip');
  const show = (i) => {
    const b = bars[i];
    tip.innerHTML = `<div>${F.cap(b.long)}</div><div class="tr"><span class="tv">${b.v === null ? '—' : P(b.v)}</span><span>${b.scheduled ? `${b.done}/${b.scheduled} validations` : 'rien de prévu'}</span></div>`;
    tip.hidden = false;
    placeTip(tip, m.l + band * i + band / 2, b.v === null ? y(50) : y(b.v), W);
  };
  el.querySelectorAll('.hit').forEach((h) => {
    const i = +h.dataset.i;
    h.addEventListener('pointerenter', () => show(i));
    h.addEventListener('pointerdown', () => show(i));
    h.addEventListener('focus', () => show(i));
    h.addEventListener('pointerleave', () => { tip.hidden = true; });
    h.addEventListener('blur', () => { tip.hidden = true; });
  });
}

function mountCharts(root = document) {
  $$('[data-chart]', root).forEach((el) => {
    const kind = el.dataset.chart;
    try {
      if (kind === 'trend') lineChart(el, trendSeries(ui.stats.range), { goal: state.goals.daily });
      if (kind === 'weekday') barChart(el, weekdayStats(ui.stats.range === 365 ? 364 : Math.max(ui.stats.range, 28)));
    } catch (e) { console.error(e); el.innerHTML = '<p class="muted small">Graphique indisponible.</p>'; }
  });
}

/* ===================== AUJOURD’HUI ===================== */
function viewToday() {
  const k = ui.today;
  const s = dayStats(k);
  const active = activeHabits();
  const p = s.scheduled ? Math.round(s.pct * 100) : 0;
  const goal = state.goals.daily;
  const needed = Math.max(0, Math.ceil((goal / 100) * s.scheduled - s.credit - 1e-9));
  const name = (state.profile.name || '').trim();
  let chip;
  if (!s.scheduled) chip = `<span class="chip">${icon('sun')}Journée libre</span>`;
  else if (s.done === s.scheduled) chip = `<span class="chip good">${icon('star')}Journée parfaite</span>`;
  else if (metGoal(s)) chip = `<span class="chip good">${icon('check')}Objectif ${P(goal)} atteint</span>`;
  else chip = `<span class="chip accent">${icon('target')}Objectif ${P(goal)} · encore ${needed}</span>`;
  const hero = `<section class="card hero" aria-label="Progression du jour">
      <div class="ring-wrap">${ring(s.pct || 0, { size: 128, stroke: 12, id: 'today', label: `${p} % des habitudes du jour terminées`, goal })}
        <div class="ring-center"><span class="hero-ring-v">${s.done}<small>/${s.scheduled}</small></span><span class="hero-ring-l">habitudes</span></div></div>
      <div class="hero-main"><p class="label">Progression du jour</p><p class="hero-num">${p}<span>%</span></p>
        <p class="hero-sub">${s.scheduled ? `${s.done} terminée${s.done > 1 ? 's' : ''} sur ${s.scheduled} prévue${s.scheduled > 1 ? 's' : ''}${s.partial ? `, ${s.partial} en mini-version` : ''}` : 'Rien de prévu aujourd’hui'}</p></div>
      <div class="hero-goal">${chip}</div>
      <dl class="hero-stats">
        <div><dt>Enregistrées</dt><dd>${active.length}</dd></div>
        <div><dt>${s.partial ? 'Mini-versions' : 'Terminées'}</dt><dd>${s.partial ? s.partial : s.done}</dd></div>
        <div><dt>Restantes</dt><dd>${Math.max(0, s.scheduled - s.done - s.partial)}</dd></div>
      </dl>
      ${state.settings.motivation ? `<p class="motto">${icon('sparkles')}<span>${esc(mottoFor(s))}</span></p>` : ''}
    </section>`;
  const m = state.settings.modules;
  const prompts = `${m.alerts === false ? '' : alertCard()}${m.review === false ? '' : reviewCard()}`;
  return `<section class="page-head"><p class="eyebrow">${esc(F.cap(F.long(k)))}</p><h1 class="greet">${greeting()}${name ? `, <b>${esc(name)}</b>` : ''}</h1></section>
    ${prompts}
    <div class="today-grid">
      <div class="stack">${hero}${planCard(k)}</div>
      <div class="stack">${m.week ? weekCard(k) : ''}${m.streaks ? streaksCard() : ''}${m.journal === false ? '' : journalCard(k)}</div>
    </div>`;
}

/* ---------- Alerte décrochage ----------
   Une seule habitude à la fois : une liste d’alertes se transforme vite en bruit
   qu’on apprend à ignorer. */
function alertCard() {
  const list = declining();
  if (!list.length) return '';
  const { h, recent, before, streak } = list[0];
  const now = Math.round(recent.rate * 100);
  const then = Math.round(before.rate * 100);
  const others = list.length - 1;
  return `<section class="card alert-card" aria-label="Habitude en perte de vitesse">
      <div class="alert-head">${icon('alert')}<div><b>${esc(h.name)} s’essouffle</b>
        <span>${P(now)} sur les 14 derniers jours, contre ${P(then)} les 14 jours d’avant.${streak.current ? ` Série en cours : ${streak.current}${NB}j.` : ' La série est déjà retombée à zéro.'}</span></div></div>
      <p class="small muted">Mieux vaut une habitude plus petite tenue qu’une grande abandonnée. Trois façons de la remettre en route :</p>
      <div class="btn-row">
        <button type="button" class="btn sm primary" data-act="fix-habit" data-id="${h.id}">${icon('half')}Ajuster l’habitude</button>
        <button type="button" class="btn sm ghost" data-act="habit-open" data-id="${h.id}">${icon('chart')}Voir le détail</button>
        <button type="button" class="btn sm ghost" data-act="alert-snooze" data-id="${h.id}">Ignorer 14${NB}j</button>
      </div>
      ${others > 0 ? `<p class="small muted" style="margin-top:10px">${others === 1 ? 'Une autre habitude est aussi en baisse' : `${others} autres habitudes sont aussi en baisse`} : tu les verras après celle-ci.</p>` : ''}
    </section>`;
}

/* ---------- Invitation à la rétrospective ---------- */
function reviewCard() {
  const ws = reviewDue();
  if (!ws) return '';
  const r = rangeStats(ws, D.add(ws, 6));
  return `<section class="card review-card" aria-label="Rétrospective de la semaine">
      <div class="alert-head">${icon('list')}<div><b>Rétrospective de la semaine du ${esc(F.short(ws))}</b>
        <span>Cinq minutes : ce qui a tenu, ce qui a lâché, et un seul changement à décider. Régularité de la semaine : ${r.rate === null ? '—' : P(Math.round(r.rate * 100))}.</span></div></div>
      <div class="btn-row">
        <button type="button" class="btn sm primary" data-act="review-open" data-k="${ws}">${icon('check')}Commencer</button>
        <button type="button" class="btn sm ghost" data-act="review-later" data-k="${ws}">Plus tard</button>
      </div>
    </section>`;
}

/* ---------- Journal du jour ---------- */
function journalCard(k) {
  const entry = state.journal[k];
  const recent = [];
  for (let i = 1; i <= 6 && recent.length < 3; i++) { const dk = D.add(k, -i); if (state.journal[dk] && state.journal[dk].text) recent.push({ k: dk, text: state.journal[dk].text }); }
  return `<section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('pen')}Journal du jour</h2><span class="sub">Une ligne suffit.</span></div></div>
      ${entry && entry.text
    ? `<button type="button" class="journal-note" data-act="journal-edit" data-k="${k}"><span>${esc(entry.text)}</span><i>${icon('edit')}</i></button>`
    : `<button type="button" class="btn ghost block" data-act="journal-edit" data-k="${k}">${icon('plus')}Écrire la ligne du jour</button>`}
      ${recent.length ? `<ul class="plain journal-list">${recent.map((r) => `<li><button type="button" data-act="journal-edit" data-k="${r.k}"><b>${esc(F.cap(F.dayShort(r.k)))}</b><span>${esc(r.text)}</span></button></li>`).join('')}</ul>` : ''}
    </section>`;
}

const PARTS = [
  { id: 'morning', name: 'Matin', icon: 'sunrise', test: (t) => t < '12:00' },
  { id: 'afternoon', name: 'Après-midi', icon: 'sun', test: (t) => t < '18:00' },
  { id: 'evening', name: 'Soir', icon: 'moon', test: () => true },
];
function sortTasks(list) {
  return list.slice().sort((a, b) => (a.done - b.done)
    || ((PRIORITIES[a.priority] || PRIORITIES.medium).rank - (PRIORITIES[b.priority] || PRIORITIES.medium).rank)
    || String(a.time || '99').localeCompare(String(b.time || '99'))
    || String(a.createdAt).localeCompare(String(b.createdAt)));
}
function planCard(k) {
  const filter = state.settings.planFilter;
  const withTasks = state.settings.modules.tasksInPlan;
  const habits = activeHabits().filter((h) => isScheduled(h, k));
  const tasks = withTasks ? state.tasks.filter((t) => t.date === k) : [];
  const overdue = withTasks ? sortTasks(state.tasks.filter((t) => !t.done && t.date < k)) : [];
  const items = [];
  if (filter !== 'tasks') habits.forEach((h) => items.push({ type: 'habit', id: h.id, h, time: h.time || null, done: isDone(h, k), part: isPartial(h, k), name: h.name }));
  if (filter !== 'habits') tasks.forEach((t) => items.push({ type: 'task', id: t.id, t, time: t.time || null, done: t.done, part: false, name: t.title }));
  items.sort((a, b) => String(a.time || '99:99').localeCompare(String(b.time || '99:99')) || (a.type === b.type ? 0 : a.type === 'habit' ? -1 : 1) || a.name.localeCompare(b.name, 'fr'));
  const now = nowHM();
  const next = items.find((i) => !i.done && !i.part && i.time && i.time >= now);
  const rowOf = (i) => (i.type === 'habit' ? habitRow(i.h, k, { next: next === i }) : taskRow(i.t, { next: next === i }));
  const groups = PARTS.map((part) => ({ ...part, list: [] }));
  const anytime = [];
  for (const i of items) {
    if (!i.time) { anytime.push(i); continue; }
    groups.find((g) => g.test(i.time)).list.push(i);
  }
  let body = '';
  if (filter !== 'habits' && overdue.length) body += `<div class="plan-group"><h3 class="late">${icon('alert')}En retard</h3><div class="rows">${overdue.map((t) => taskRow(t, {})).join('')}</div></div>`;
  for (const g of groups) if (g.list.length) body += `<div class="plan-group"><h3>${icon(g.icon)}${g.name}</h3><div class="rows">${g.list.map(rowOf).join('')}</div></div>`;
  if (anytime.length) body += `<div class="plan-group"><h3>${icon('clock')}À tout moment</h3><div class="rows">${anytime.map(rowOf).join('')}</div></div>`;
  if (!body) {
    if (!state.habits.length) body = emptyState('repeat', 'Crée ta première habitude', 'Ajoute une habitude récurrente, puis coche-la chaque jour.', '<button type="button" class="btn primary" data-act="habit-new">' + icon('plus') + 'Nouvelle habitude</button>');
    else if (filter === 'tasks') body = emptyState('tasks', 'Aucune tâche aujourd’hui', 'Ajoute une tâche ponctuelle ci-dessous.');
    else body = emptyState('sun', 'Rien de prévu aujourd’hui', 'Tes habitudes ne sont pas programmées ce jour-là.');
  }
  const doneCount = items.filter((i) => i.done || i.part).length;
  const filters = seg([
    ['all', 'Tout'],
    ['habits', `${icon('repeat')}Habitudes`, `${habits.filter((h) => isCounted(h, k)).length}/${habits.length}`],
    ...(withTasks ? [['tasks', `${icon('tasks')}Tâches`, `${tasks.filter((t) => t.done).length}/${tasks.length}`]] : []),
  ], filter, 'plan-filter', 'aria-label="Filtrer le plan du jour"');
  const quick = withTasks && filter !== 'habits'
    ? `<form class="quick-add" data-form="plan-task" autocomplete="off"><input class="input" id="plan-task-input" name="title" placeholder="Ajouter une tâche pour aujourd’hui" enterkeyhint="done" maxlength="140" aria-label="Nouvelle tâche pour aujourd’hui"><button type="submit" class="btn" aria-label="Ajouter la tâche">${icon('plus')}</button></form>`
    : '';
  return `<section class="card" aria-label="Plan du jour">
      <div class="card-head"><div class="card-title-group"><h2>Plan du jour</h2><span class="sub">${items.length ? `${doneCount} sur ${items.length} terminé${doneCount > 1 ? 's' : ''}` : '—'}</span></div>${filters}</div>
      ${body}${quick}
    </section>`;
}

function habitRow(h, k, { next = false } = {}) {
  const done = isDone(h, k);
  const part = !done && isPartial(h, k);
  const cat = catById(h.categoryId);
  const st = habitStreak(h);
  const meta = [];
  if (part) meta.push(`<span class="part-pill">${icon('half')}Mini-version${h.minLabel ? ` · ${esc(h.minLabel)}` : ''}</span>`);
  if (h.time) meta.push(`<span>${icon('clock')}${h.time}</span>`);
  if (cat) meta.push(`<span>${catDot(cat)}${esc(cat.name)}</span>`);
  if (st.current > 0) meta.push(`<span class="flame">${icon('flame')}${st.current}${NB}j</span>`);
  if (next) meta.push('<span class="next-pill">Prochaine</span>');
  /* Le bouton principal valide l’habitude en entier ; le petit bouton valide la
     mini-version. Deux commandes distinctes valent mieux qu’un appui qui tourne
     entre trois états. */
  const mini = h.minLabel && !done
    ? `<button type="button" class="icon-btn row-mini ${part ? 'on' : ''}" data-act="toggle-min" data-id="${h.id}" data-k="${k}" aria-pressed="${part}" aria-label="${part ? 'Retirer la mini-version' : `Valider la mini-version : ${esc(h.minLabel)}`}" data-tip="Mini-version : ${esc(h.minLabel)}">${icon('half')}</button>`
    : '';
  return `<div class="row habit ${done ? 'is-done' : ''} ${part ? 'is-part' : ''}" data-row="${h.id}">
    <button type="button" class="row-hit" data-act="toggle-habit" data-id="${h.id}" data-k="${k}" aria-pressed="${done}">
      <span class="check" aria-hidden="true">${icon(part ? 'half' : 'check')}</span>${tile(h)}
      <span class="row-text"><span class="row-title">${esc(h.name)}</span><span class="row-meta">${meta.join('')}</span></span>
    </button>
    ${mini}
    <button type="button" class="icon-btn row-more" data-act="habit-open" data-id="${h.id}" aria-label="Détails : ${esc(h.name)}">${icon('more')}</button>
  </div>`;
}
function taskRow(t, { next = false, showDate = false } = {}) {
  const pr = PRIORITIES[t.priority] || PRIORITIES.medium;
  const late = !t.done && t.date < ui.today;
  const meta = [`<span class="prio prio-${esc(t.priority)}">${icon('flag')}${pr.name}</span>`];
  if (t.time) meta.push(`<span>${icon('clock')}${t.time}</span>`);
  if (late) meta.push(`<span class="late-pill">${F.dayRel(t.date, ui.today)}</span>`);
  else if (showDate) meta.push(`<span>${icon('calendar')}${F.dayRel(t.date, ui.today)}</span>`);
  if (next) meta.push('<span class="next-pill">Prochaine</span>');
  return `<div class="row task ${t.done ? 'is-done' : ''}" data-row="${t.id}">
    <button type="button" class="row-hit" data-act="toggle-task" data-id="${t.id}" aria-pressed="${t.done}">
      <span class="check sq" aria-hidden="true">${icon('check')}</span>
      <span class="tile task-tile prio-${esc(t.priority)}">${icon('flag')}</span>
      <span class="row-text"><span class="row-title">${esc(t.title)}</span><span class="row-meta">${meta.join('')}</span></span>
    </button>
    <button type="button" class="icon-btn row-more" data-act="task-edit" data-id="${t.id}" aria-label="Modifier : ${esc(t.title)}">${icon('more')}</button>
  </div>`;
}

function weekCard(k) {
  const ws = weekStartKey(k);
  let sumD = 0; let sumS = 0;
  const cells = [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const dk = D.add(ws, i);
    const s = dayStats(dk);
    const future = dk > k;
    if (!future) { sumD += s.credit; sumS += s.scheduled; }
    const label = `${F.cap(F.long(dk))} : ${future ? 'à venir' : s.scheduled ? `${P(Math.round(s.pct * 100))}, ${s.done} sur ${s.scheduled}${s.partial ? `, ${s.partial} en mini-version` : ''}` : 'rien de prévu'}`;
    return `<button type="button" class="wd ${dk === k ? 'is-today' : ''} ${future ? 'is-future' : ''}" data-act="day-open" data-k="${dk}" aria-label="${esc(label)}"><span class="wd-l">${WD_SHORT[D.dow(dk)]}</span>${miniRing(future ? 0 : s.pct)}<span class="wd-d">${D.parse(dk)[2]}</span></button>`;
  }).join('');
  return `<section class="card"><div class="card-head"><h2>${icon('calendar')}Cette semaine</h2><span class="sub">${sumS ? `Moyenne ${P(pct(sumD, sumS))}` : 'Pas encore de données'}</span></div><div class="week">${cells}</div></section>`;
}

const nextMilestone = (n) => MILESTONES.find((m) => m > n) || n + 10;
function streaksCard() {
  const list = activeHabits().map((h) => ({ h, st: habitStreak(h) })).filter((x) => x.st.current > 0).sort((a, b) => b.st.current - a.st.current).slice(0, 4);
  const t = totals();
  const gr = goalRuns();
  const items = list.length ? list.map(({ h, st }) => {
    const target = h.streakGoal && h.streakGoal > st.current ? h.streakGoal : nextMilestone(st.current);
    const v = Math.min(100, Math.round((st.current / target) * 100));
    const label = h.streakGoal && st.current >= h.streakGoal ? `Objectif de ${h.streakGoal}${NB}j atteint · prochain palier ${target}${NB}j` : `${target - st.current}${NB}j avant ${h.streakGoal && h.streakGoal === target ? 'ton objectif' : 'le prochain palier'} (${target}${NB}j)`;
    return `<div class="streak-item">${tile(h, 'sm')}<div style="min-width:0"><div class="name">${esc(h.name)}</div><div class="bar" role="img" aria-label="${v} %"><i style="--v:${v}"></i></div><div class="meta">${label}</div></div><span class="streak-val">${icon('flame')}${st.current}</span></div>`;
  }).join('') : '<p class="muted small">Coche une habitude deux jours de suite pour lancer ta première série.</p>';
  const rec = t.bestStreak;
  return `<section class="card"><div class="card-head"><h2>${icon('flame')}Séries en cours</h2><button type="button" class="link-btn" data-act="nav" data-view="stats">Statistiques</button></div>
      <div class="streak-list">${items}</div>
      <div class="record">${icon('trophy')}<div><b>Record personnel : ${rec.value}${NB}j</b><br><span>${rec.value ? `${esc(rec.habit)}${rec.date ? ` · atteint le ${F.short(rec.date)}` : ''}` : 'Ton premier record t’attend.'}</span></div></div>
      ${gr.current > 1 ? `<p class="small muted" style="margin-top:12px">${gr.current} jours de suite à ton objectif quotidien.</p>` : ''}
    </section>`;
}

/* ===================== TÂCHES ===================== */
const quickTask = { priority: 'medium', when: 'today' };
function viewTasks() {
  const k = ui.today;
  const todays = state.tasks.filter((t) => t.date === k);
  const overdue = sortTasks(state.tasks.filter((t) => !t.done && t.date < k));
  const upcoming = state.tasks.filter((t) => !t.done && t.date > k).sort((a, b) => a.date.localeCompare(b.date) || String(a.time || '99').localeCompare(String(b.time || '99')));
  const doneList = state.tasks.filter((t) => t.done).sort((a, b) => String(b.doneAt || b.date).localeCompare(String(a.doneAt || a.date)));
  const remaining = todays.filter((t) => !t.done).length + overdue.length;
  const doneToday = todays.filter((t) => t.done).length;
  const hs = dayStats(k);
  const tab = ui.tasksTab;
  let body = '';
  if (tab === 'today') {
    if (overdue.length) body += `<div class="plan-group"><h3 class="late">${icon('alert')}En retard <button type="button" class="link-btn" style="margin-left:auto;text-transform:none;letter-spacing:0" data-act="tasks-postpone">Tout reporter à aujourd’hui</button></h3><div class="rows">${overdue.map((t) => taskRow(t, {})).join('')}</div></div>`;
    if (todays.length) body += `<div class="plan-group"><h3>${icon('tasks')}Aujourd’hui</h3><div class="rows">${sortTasks(todays).map((t) => taskRow(t, {})).join('')}</div></div>`;
    if (!body) body = emptyState('tasks', 'Aucune tâche pour aujourd’hui', 'Ajoute une tâche ponctuelle avec le champ ci-dessus.');
  } else if (tab === 'upcoming') {
    const byDate = {};
    upcoming.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
    body = Object.keys(byDate).sort().map((d) => `<div class="plan-group"><h3>${icon('calendar')}${esc(F.dayRel(d, k))}</h3><div class="rows">${sortTasks(byDate[d]).map((t) => taskRow(t, {})).join('')}</div></div>`).join('') || emptyState('calendar', 'Rien à venir', 'Les tâches planifiées pour les prochains jours apparaîtront ici.');
  } else {
    const list = doneList.slice(0, 80);
    const byDay = {};
    list.forEach((t) => { const d = t.doneAt ? keyOfISO(t.doneAt) : t.date; (byDay[d] = byDay[d] || []).push(t); });
    body = Object.keys(byDay).sort().reverse().map((d) => `<div class="plan-group"><h3>${icon('check')}${esc(F.dayRel(d, k))}</h3><div class="rows">${byDay[d].map((t) => taskRow(t, { showDate: t.date !== d })).join('')}</div></div>`).join('') || emptyState('check', 'Aucune tâche terminée', 'Coche une tâche pour la retrouver ici.');
    if (doneList.length) body += `<div class="btn-row" style="margin-top:12px"><button type="button" class="btn sm ghost" data-act="tasks-clear-done">${icon('trash')}Effacer les tâches terminées</button></div>`;
  }
  const prio = Object.entries(PRIORITIES).map(([id, p]) => `<button type="button" data-act="tq-opt" data-k="priority" data-v="${id}" aria-pressed="${quickTask.priority === id}"><span class="prio prio-${id}">${icon('flag')}</span>${p.name}</button>`).join('');
  const when = [['today', 'Aujourd’hui'], ['tomorrow', 'Demain']].map(([v, l]) => `<button type="button" data-act="tq-opt" data-k="when" data-v="${v}" aria-pressed="${quickTask.when === v}">${l}</button>`).join('');
  return `<section class="page-head"><p class="eyebrow">${esc(F.cap(F.long(k)))}</p><h1 class="page-title">Checklist du jour</h1></section>
    <div class="tiles">
      <div class="tile-stat"><div class="k">Restantes</div><div class="v">${remaining}</div><div class="d">${overdue.length ? `dont ${overdue.length} en retard` : 'aujourd’hui'}</div></div>
      <div class="tile-stat"><div class="k">Terminées</div><div class="v">${doneToday}</div><div class="d">aujourd’hui</div></div>
      <div class="tile-stat"><div class="k">À venir</div><div class="v">${upcoming.length}</div><div class="d">prochains jours</div></div>
      <button type="button" class="tile-stat" data-act="nav" data-view="today"><div class="k">${icon('repeat')}Habitudes du jour</div><div class="v">${hs.done}<small>/${hs.scheduled}</small></div><div class="d">dans Aujourd’hui →</div></button>
    </div>
    <section class="card">
      <form data-form="task-quick" autocomplete="off" class="stack" style="gap:10px">
        <div class="quick-add" style="margin:0"><input class="input" id="task-quick-input" name="title" placeholder="Nouvelle tâche ponctuelle…" maxlength="140" enterkeyhint="done" aria-label="Nouvelle tâche"><button type="submit" class="btn primary">${icon('plus')}<span class="hide-mobile">Ajouter</span></button></div>
        <div class="filter-row wrap"><div class="seg" role="group" aria-label="Priorité">${prio}</div><div class="seg" role="group" aria-label="Date">${when}</div><button type="button" class="btn sm ghost" data-act="task-new">Plus d’options</button></div>
      </form>
    </section>
    <section class="card">
      <div class="card-head">${seg([['today', 'Aujourd’hui', remaining], ['upcoming', 'À venir', upcoming.length], ['done', 'Terminées', doneList.length]], tab, 'tasks-tab', 'aria-label="Afficher"')}</div>
      ${body}
    </section>`;
}

/* ===================== MATRICE ===================== */
function cellState(h, k, today) {
  if (k < h.startDate || (h.archivedAt && k >= h.archivedAt)) return 'na';
  const sch = h.days.includes(D.dow(k));
  if (k > today) return sch ? 'future' : 'off-future';
  const dn = isDone(h, k);
  if (dn) return sch ? 'done' : 'bonus';
  if (isPartial(h, k)) return sch ? 'part' : 'bonus';
  if (!sch) return 'off';
  return k === today ? 'pending' : 'miss';
}
const CELL_LABEL = { done: 'accomplie', part: 'mini-version', bonus: 'bonus (jour non prévu)', pending: 'à faire aujourd’hui', miss: 'non réalisée', off: 'non prévue — touche pour un bonus', future: 'à venir', 'off-future': 'non prévue', na: 'hors période' };

function monthNav(y, m, prev, next, id, todayAct) {
  const [ty, tm] = D.parse(ui.today);
  const isCur = y === ty && m === tm;
  return `<div class="month-nav">
      <button type="button" class="icon-btn" data-act="${prev}" aria-label="Mois précédent">${icon('chevL')}</button>
      <label class="month-label">${esc(F.monthYear(y, m))}<input type="month" id="${id}" value="${y}-${D.pad(m)}" aria-label="Choisir le mois"></label>
      <button type="button" class="icon-btn" data-act="${next}" aria-label="Mois suivant">${icon('chevR')}</button>
      ${!isCur && todayAct ? `<button type="button" class="btn sm ghost" data-act="${todayAct}">Ce mois-ci</button>` : ''}
    </div>`;
}

function viewMatrix() {
  const { y, m } = ui.matrix;
  const [a, b] = monthBounds(y, m);
  const today = ui.today;
  const n = D.dim(y, m);
  const keys = Array.from({ length: n }, (_, i) => D.key(y, m, i + 1));
  const all = state.habits.filter((h) => h.startDate <= b && (!h.archivedAt || h.archivedAt > a)).sort((p, q) => (Number(!!p.archivedAt) - Number(!!q.archivedAt)) || byOrder(p, q));
  const catIds = [...new Set(all.map((h) => h.categoryId || 'none'))];
  if (ui.matrix.cat !== 'all' && !catIds.includes(ui.matrix.cat)) ui.matrix.cat = 'all';
  const rows = ui.matrix.cat === 'all' ? all : all.filter((h) => (h.categoryId || 'none') === ui.matrix.cat);
  let sch = 0; let done = 0; let bonus = 0; let parts = 0;
  const perDay = keys.map(() => ({ s: 0, d: 0 }));
  const rowHtml = rows.map((h) => {
    let rs = 0; let rd = 0; let rc = 0;
    const c = catColor(catById(h.categoryId));
    const cells = keys.map((k, i) => {
      const st = cellState(h, k, today);
      /* Le jour même, une habitude pas encore cochée n’est pas comptée comme manquée.
         Une mini-version vaut une demi-validation, comme partout ailleurs. */
      if (st === 'done' || st === 'miss' || st === 'part') { rs++; perDay[i].s++; }
      if (st === 'done') { rd++; rc += 1; perDay[i].d += 1; }
      if (st === 'part') { parts++; rc += PARTIAL_WEIGHT; perDay[i].d += PARTIAL_WEIGHT; }
      if (st === 'pending') perDay[i].s++;
      if (st === 'bonus') bonus++;
      const label = `${h.name}, ${F.long(k)} : ${CELL_LABEL[st]}`;
      if (['done', 'part', 'bonus', 'pending', 'miss', 'off'].includes(st)) {
        return `<button type="button" class="c ${st}" data-act="cell" data-id="${h.id}" data-k="${k}" aria-label="${esc(label)}" aria-pressed="${st === 'done' || st === 'bonus'}" data-tip="${esc(label)}"></button>`;
      }
      return `<span class="c ${st === 'off-future' ? 'off' : st}" aria-hidden="true"></span>`;
    }).join('');
    sch += rs; done += rc;
    return `<div class="mx-name ${h.archivedAt ? 'archived' : ''}"><button type="button" data-act="habit-open" data-id="${h.id}">${tile(h, 'sm')}<span class="t">${esc(h.name)}</span></button></div>
      <div style="display:contents;--c:${c};--cbg:${rgba(c, 0.45)}">${cells}</div>
      <div class="mx-end"><b>${rs ? P(Math.round((rc / rs) * 100)) : '—'}</b><span>${Math.round(rc * 10) / 10}/${rs}</span></div>`;
  }).join('');
  const heads = keys.map((k) => { const dow = D.dow(k); return `<div class="mx-dh ${k === today ? 'is-today' : ''} ${dow === 0 || dow === 6 ? 'is-we' : ''}"><span>${WD_LETTER[dow]}</span><b>${D.parse(k)[2]}</b></div>`; }).join('');
  const foot = keys.map((k, i) => {
    const pd = perDay[i];
    if (k > today || !pd.s) return `<div class="mx-bar none" aria-hidden="true"><i></i></div>`;
    const v = pct(pd.d, pd.s);
    return `<div class="mx-bar ${k === today ? 'is-today' : ''}" style="--v:${v}" data-tip="${esc(`${F.cap(F.long(k))} : ${P(v)} (${pd.d}/${pd.s})`)}" aria-hidden="true"><i></i></div>`;
  }).join('');
  const ms = rangeStats(a, b);
  const rate = sch ? pct(done, sch) : null;
  const catChips = catIds.length > 1 ? `<div class="filter-row">${[['all', 'Toutes']].concat(catIds.map((id) => { const c = catById(id); return [id, c ? `${catDot(c)}${esc(c.name)}` : 'Sans catégorie']; })).map(([id, l]) => `<button type="button" class="chip" data-act="mx-cat" data-v="${id}" aria-pressed="${ui.matrix.cat === id}">${l}</button>`).join('')}</div>` : '';
  const grid = rows.length
    ? `<div class="mx-scroll" id="mx-scroll" data-month="${y}-${m}"><div class="mx" style="--n:${n}" data-color="${state.settings.matrixColor === 'categorie' ? 'cat' : 'accent'}" aria-label="Matrice des habitudes">
        <div class="mx-corner">Habitude</div>${heads}<div class="mx-th-end">Mois</div>
        ${rowHtml}
        <div class="mx-sep"></div>
        <div class="mx-foot-l">Jour</div>${foot}<div class="mx-end"></div>
      </div></div>`
    : emptyState('grid', 'Aucune habitude sur ce mois', 'Les habitudes actives sur cette période apparaîtront ici.', state.habits.length ? '' : `<button type="button" class="btn primary" data-act="habit-new">${icon('plus')}Nouvelle habitude</button>`);
  return `<section class="page-head row-head"><div><p class="eyebrow">Habit matrix</p><h1 class="page-title">Matrice mensuelle</h1></div>${monthNav(y, m, 'mx-prev', 'mx-next', 'mx-month', 'mx-today')}</section>
    <div class="tiles four">
      <div class="tile-stat"><div class="k">Régularité du mois</div><div class="v">${rate === null ? '—' : P(rate)}</div><div class="d">${sch} prévues${parts ? ` · ${parts} en mini-version` : ''}</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${ms.validations}</div><div class="d">${bonus ? `dont ${bonus} bonus` : 'cases cochées'}</div></div>
      <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${ms.perfect}</div><div class="d">100 % accompli</div></div>
      <div class="tile-stat"><div class="k">Jours à l’objectif</div><div class="v">${ms.goalDays}<small>/${ms.days}</small></div><div class="d">objectif ${P(state.goals.daily)}</div></div>
    </div>
    <section class="card">
      ${catChips ? `<div style="margin-bottom:14px">${catChips}</div>` : ''}
      ${grid}
      <div class="legend" style="margin-top:14px">
        <span><i class="c done"></i>Accomplie</span><span><i class="c part"></i>Mini-version</span><span><i class="c miss"></i>Non réalisée</span><span><i class="c pending"></i>À faire</span>
        <span><i class="c future"></i>À venir</span><span><i class="c off"></i>Non prévue</span><span><i class="c bonus"></i>Bonus</span>
      </div>
      <p class="hint" style="margin-top:10px">Touche une case pour cocher ou décocher un jour passé. Si l’habitude a une mini-version, les appuis successifs passent par accomplie, puis mini-version, puis vide.</p>
    </section>`;
}

/* ===================== STATISTIQUES ===================== */
const RANGES = [[7, '7 j'], [30, '30 j'], [90, '90 j'], [365, '12 mois']];
function viewStats() {
  const k = ui.today;
  const range = ui.stats.range;
  const goal = state.goals.daily;
  /* A. Régularité du jour */
  const s = dayStats(k);
  const yd = dayStats(D.add(k, -1));
  const pToday = s.scheduled ? Math.round(s.pct * 100) : null;
  const pYest = yd.scheduled ? Math.round(yd.pct * 100) : null;
  const w7 = rangeStats(D.add(k, -7), D.add(k, -1));
  const delta = pToday !== null && pYest !== null ? pToday - pYest : null;
  const daily = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Daily consistency</h2><span class="sub">Aujourd’hui · ${esc(F.long(k))}</span></div></div>
    <div class="consistency"><div class="ring-wrap">${ring(s.pct || 0, { size: 112, stroke: 11, id: 'st-day', label: 'Régularité du jour', goal })}<div class="ring-center"><span class="hero-ring-v">${pToday === null ? '—' : pToday}<small>${pToday === null ? '' : '%'}</small></span></div></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Complétées</div><div class="v">${s.done}<small>/${s.scheduled}</small></div>${s.partial ? `<div class="d">+ ${s.partial} en mini-version</div>` : ''}</div>
        <div class="tile-stat"><div class="k">Vs hier</div><div class="v ${delta > 0 ? 'delta-up' : delta < 0 ? 'delta-down' : ''}">${delta === null ? '—' : `${delta > 0 ? '+' : delta < 0 ? '−' : ''}${Math.abs(delta)}`}<small>${delta === null ? '' : 'pts'}</small></div></div>
        <div class="tile-stat" style="grid-column:1/-1"><div class="k">Moyenne des 7 derniers jours</div><div class="v">${w7.rate === null ? '—' : P(Math.round(w7.rate * 100))}</div></div>
      </div></div></section>`;
  /* B. Régularité du mois */
  const { y, m } = ui.stats;
  const [ma, mb] = monthBounds(y, m);
  const ms = rangeStats(ma, mb);
  const monthly = `<section class="card"><div class="card-head"><div class="card-title-group"><h2>Monthly consistency</h2><span class="sub">Objectif mensuel ${P(state.goals.monthly)}</span></div>${monthNav(y, m, 'st-prev', 'st-next', 'st-month', 'st-today')}</div>
    <div class="consistency"><div class="ring-wrap">${ring(ms.rate || 0, { size: 112, stroke: 11, id: 'st-month', label: 'Réussite du mois', goal: state.goals.monthly })}<div class="ring-center"><span class="hero-ring-v">${ms.rate === null ? '—' : Math.round(ms.rate * 100)}<small>${ms.rate === null ? '' : '%'}</small></span></div></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">
        <div class="tile-stat"><div class="k">Réussite globale</div><div class="v">${ms.rate === null ? '—' : P(Math.round(ms.rate * 100))}</div><div class="d">${ms.done}/${ms.scheduled} prévues</div></div>
        <div class="tile-stat"><div class="k">Taux de régularité</div><div class="v">${ms.regularity === null ? '—' : P(Math.round(ms.regularity * 100))}</div><div class="d">${ms.goalDays}/${ms.days} jours à l’objectif</div></div>
        <div class="tile-stat"><div class="k">Validations</div><div class="v">${ms.validations}</div><div class="d">${ms.bonus ? `dont ${ms.bonus} bonus` : 'sur le mois'}</div></div>
        <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${ms.perfect}</div><div class="d">100 % accompli</div></div>
      </div></div></section>`;
  /* C. Tendance */
  const pts = trendSeries(range);
  const vals = pts.filter((p) => p.v !== null);
  const rs = range === 365 ? rangeStats(pts[0].k, k) : rangeStats(D.add(k, -(range - 1)), k);
  const avg = rs.rate === null ? null : Math.round(rs.rate * 100);
  const best = vals.reduce((b, p) => (b === null || p.v > b.v ? p : b), null);
  const half = Math.floor(pts.length / 2);
  const sum = (list) => { const d = list.reduce((a, p) => a + p.credit, 0); const sc = list.reduce((a, p) => a + p.scheduled, 0); return sc ? (d / sc) * 100 : null; };
  const h1 = sum(pts.slice(0, half)); const h2 = sum(pts.slice(half));
  const evo = h1 === null || h2 === null ? null : Math.round(h2 - h1);
  const unit = range === 365 ? 'Hebdomadaire' : 'Quotidien';
  const trendTable = `<div class="table-wrap"><table class="data"><thead><tr><th>${range === 365 ? 'Semaine' : 'Jour'}</th><th class="r">Régularité</th><th class="r">Moyenne</th><th class="r">Faites</th></tr></thead><tbody>${pts.slice().reverse().map((p) => `<tr><td>${esc(p.label)}</td><td class="r">${p.v === null ? '—' : P(p.v)}</td><td class="r">${p.avg === null ? '—' : P(p.avg)}</td><td class="r">${p.done}/${p.scheduled}</td></tr>`).join('')}</tbody></table></div>`;

  /* Historique */

  const history = `<section class="card span-2"><div class="card-head"><div class="card-title-group"><h2>${icon('calendar')}Historique</h2><span class="sub">Chaque case est un jour. Touche-la pour voir le détail.</span></div>

  /* Rétrospectives et bilan annuel */
  const hist = reviewHistory();

    <div class="stats-grid">${trend}${weekday}${topCard}${streaks}${reviews}${trophies}${history}</div>`;

function heatmap(year) {
  const first = D.key(year, 1, 1);
  const last = D.key(year, 12, 31);
  const start = weekStartKey(first);
  const out = ['<span></span>'];
  weekOrder().forEach((d, i) => out.push(`<span class="hm-wl">${i % 2 === 0 ? WD_SHORT[d] : ''}</span>`));
  for (let w = start; w <= last; w = D.add(w, 7)) {
    let label = '';
    for (let i = 0; i < 7; i++) { const dk = D.add(w, i); if (dk.slice(8) === '01' && +dk.slice(0, 4) === year) { label = F.monthShort(+dk.slice(5, 7)); break; } }
    out.push(`<span class="hm-ml">${label}</span>`);
    for (let i = 0; i < 7; i++) {
      const dk = D.add(w, i);
      if (dk < first || dk > last) { out.push('<span class="hm-c blank"></span>'); continue; }
      if (dk > ui.today) { out.push('<span class="hm-c future"></span>'); continue; }
      const s = dayStats(dk);
      let cls = 'none';
      if (s.scheduled) { const p = s.pct; cls = p === 0 ? 'l0' : p < 0.4 ? 'l1' : p < 0.7 ? 'l2' : p < 1 ? 'l3' : 'l4'; }
      const tip = `${F.cap(F.dayShort(dk))} : ${s.scheduled ? `${P(Math.round(s.pct * 100))} (${s.done}/${s.scheduled}${s.partial ? `, ${s.partial} mini` : ''})` : 'rien de prévu'}`;
      out.push(`<button type="button" class="hm-c ${cls} ${dk === ui.today ? 'is-today' : ''}" data-act="day-open" data-k="${dk}" data-tip="${esc(tip)}" aria-label="${esc(tip)}"></button>`);
    }
  }
  return `<div class="hm" style="grid-template-columns:20px">${out.join('')}</div>`;
}

/* ===================== HABITUDES ===================== */
function viewHabits() {
  const active = activeHabits();
  const archived = archivedHabits();
  const cats = state.categories;
  const counts = {};
  active.forEach((h) => { const id = catById(h.categoryId) ? h.categoryId : 'none'; counts[id] = (counts[id] || 0) + 1; });
  if (ui.habitsCat !== 'all' && !counts[ui.habitsCat]) ui.habitsCat = 'all';
  const chips = [['all', 'Toutes', active.length]].concat(cats.filter((c) => counts[c.id]).map((c) => [c.id, `${catDot(c)}${esc(c.name)}`, counts[c.id]])).concat(counts.none ? [['none', 'Sans catégorie', counts.none]] : []);
  const groups = cats.map((c) => ({ c, list: active.filter((h) => h.categoryId === c.id) })).concat([{ c: null, list: active.filter((h) => !catById(h.categoryId)) }])
    .filter((g) => g.list.length && (ui.habitsCat === 'all' || (g.c ? g.c.id : 'none') === ui.habitsCat));
  const k = ui.today;
  const from30 = D.add(k, -29);
  const card = (h) => {
    const st = habitStreak(h);
    const r30 = habitRange(h, from30, k);
    const idx = active.indexOf(h);
    return `<article class="card hcard ${h.archivedAt ? 'archived' : ''}">
        <button type="button" class="hcard-hit" data-act="habit-open" data-id="${h.id}">${tile(h, 'lg')}
          <span style="min-width:0;flex:1"><span class="name" style="display:block">${esc(h.name)}</span>${h.description ? `<span class="desc" style="display:block">${esc(h.description)}</span>` : ''}
          <span class="facts"><span>${icon('repeat')}${scheduleLabel(h.days)}</span>${h.time ? `<span>${icon('clock')}${h.time}</span>` : ''}<span class="flame">${icon('flame')}${st.current}${NB}j</span><span>${icon('chart')}${r30.rate === null ? '—' : P(Math.round(r30.rate * 100))} sur 30${NB}j</span>${h.minLabel ? `<span>${icon('half')}${esc(h.minLabel)}</span>` : ''}</span></span>
        </button>
        <div class="hcard-actions">${ui.reorder
    ? `<button type="button" class="icon-btn" data-act="habit-up" data-id="${h.id}" aria-label="Monter" ${idx === 0 ? 'disabled' : ''}>${icon('arrowUp')}</button><button type="button" class="icon-btn" data-act="habit-down" data-id="${h.id}" aria-label="Descendre" ${idx === active.length - 1 ? 'disabled' : ''}>${icon('arrowDown')}</button>`
    : `<button type="button" class="icon-btn" data-act="habit-edit" data-id="${h.id}" aria-label="Modifier ${esc(h.name)}">${icon('edit')}</button>`}</div>
      </article>`;
  };
  const body = groups.length
    ? groups.map((g) => `<div><div class="cat-head">${g.c ? catDot(g.c) : ''}${g.c ? esc(g.c.name) : 'Sans catégorie'} <span class="n">${g.list.length}</span></div><div class="habit-cards">${g.list.map(card).join('')}</div></div>`).join('')
    : `<section class="card">${emptyState('repeat', 'Aucune habitude pour l’instant', 'Crée tes habitudes récurrentes : heure, jours, catégorie et icône.', `<div class="btn-row" style="justify-content:center"><button type="button" class="btn primary" data-act="habit-new">${icon('plus')}Nouvelle habitude</button><button type="button" class="btn" data-act="add-samples">${icon('sparkles')}Ajouter les 8 suggestions</button></div>`)}</section>`;
  const arch = archived.length ? `<section class="card"><button type="button" class="btn ghost block" style="justify-content:space-between" data-act="archived-toggle">${icon('archive')}<span style="flex:1;text-align:left">Habitudes archivées (${archived.length})</span>${icon(ui.showArchived ? 'chevD' : 'chevR')}</button>
      ${ui.showArchived ? `<div class="rows" style="margin-top:8px">${archived.map((h) => `<div class="row">${tile(h, 'sm')}<span class="row-text" style="padding:10px 4px"><span class="row-title">${esc(h.name)}</span><span class="row-meta"><span>Archivée le ${F.short(h.archivedAt)} · historique conservé</span></span></span><button type="button" class="btn sm" data-act="habit-restore" data-id="${h.id}">${icon('restore')}Restaurer</button><button type="button" class="icon-btn" data-act="habit-purge" data-id="${h.id}" aria-label="Supprimer définitivement">${icon('trash')}</button></div>`).join('')}</div>` : ''}
    </section>` : '';
  return `<section class="page-head row-head"><div><p class="eyebrow">${plural(active.length, 'habitude active', 'habitudes actives')}</p><h1 class="page-title">Mes habitudes</h1></div>
      <div class="btn-row">${active.length > 1 ? `<button type="button" class="btn sm ${ui.reorder ? 'primary' : ''}" data-act="habits-reorder">${icon(ui.reorder ? 'check' : 'list')}${ui.reorder ? 'Terminé' : 'Réorganiser'}</button>` : ''}<button type="button" class="btn sm" data-act="customize-cats">${icon('palette')}Catégories</button></div></section>
    ${chips.length > 2 ? `<div class="filter-row">${chips.map(([id, l, n]) => `<button type="button" class="chip" data-act="habits-cat" data-v="${id}" aria-pressed="${ui.habitsCat === id}">${l} <span class="muted">${n}</span></button>`).join('')}</div>` : ''}
    ${body}${arch}`;
}

/* ===================== BILAN DE L’ANNÉE ===================== */
function viewYear() {
  const years = yearsWithData();
  if (!years.includes(ui.year)) ui.year = years[0];
  const y = ui.year;
  const r = yearReport(y);
  const bars = r.months.map((mo) => ({ label: mo.label, long: mo.long, v: mo.v, done: mo.done, scheduled: mo.scheduled }));
  const maxV = bars.reduce((a, b) => (b.v !== null && b.v > a ? b.v : a), 0);
  const chart = bars.length
    ? `<div class="year-bars">${bars.map((b) => `<div class="year-bar ${b.v === null ? 'none' : ''} ${r.best && b.label === r.best.label ? 'best' : ''}" data-tip="${esc(`${F.cap(b.long)} : ${b.v === null ? 'rien de prévu' : P(b.v)}`)}">
        <i style="--v:${b.v === null ? 0 : Math.round((b.v / Math.max(maxV, 1)) * 100)}"></i><span>${esc(b.label)}</span><b>${b.v === null ? '—' : b.v}</b></div>`).join('')}</div>`
    : '<p class="muted small">Aucune donnée sur cette année.</p>';
  const nav = `<div class="month-nav">
      <button type="button" class="icon-btn" data-act="year-prev" aria-label="Année précédente" ${years.indexOf(y) === years.length - 1 ? 'disabled' : ''}>${icon('chevL')}</button>
      <span class="month-label" style="min-width:76px">${y}</span>
      <button type="button" class="icon-btn" data-act="year-next" aria-label="Année suivante" ${years.indexOf(y) === 0 ? 'disabled' : ''}>${icon('chevR')}</button>
    </div>`;
  const podium = r.per.slice(0, 3);
  const weakest = r.per.length > 3 ? r.per[r.per.length - 1] : null;
  return `<section class="page-head row-head"><div><p class="eyebrow">${r.complete ? 'Année complète' : 'Année en cours'}</p><h1 class="page-title">Bilan ${y}</h1></div>${nav}</section>
    <div class="tiles four">
      <div class="tile-stat"><div class="k">Régularité</div><div class="v">${r.year.rate === null ? '—' : P(Math.round(r.year.rate * 100))}</div><div class="d">${r.year.scheduled} habitudes prévues</div></div>
      <div class="tile-stat"><div class="k">Validations</div><div class="v">${r.year.validations}</div><div class="d">${r.year.partial ? `dont ${r.year.partial} mini-versions` : 'cases cochées'}</div></div>
      <div class="tile-stat"><div class="k">Jours parfaits</div><div class="v">${r.year.perfect}</div><div class="d">sur ${r.year.days} jours actifs</div></div>
      <div class="tile-stat"><div class="k">Plus longue série</div><div class="v">${r.bestStreak.value}<small>j</small></div><div class="d" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.bestStreak.value ? esc(r.bestStreak.name) : '—'}</div></div>
    </div>
    <section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('chart')}Mois par mois</h2><span class="sub">${r.best ? `Meilleur mois : ${F.cap(r.best.long)} (${P(r.best.v)})` : 'Régularité par mois'}${r.worst && r.best && r.worst.m !== r.best.m ? ` · Plus difficile : ${F.cap(r.worst.long)} (${P(r.worst.v)})` : ''}</span></div></div>
      ${chart}</section>
    <div class="stats-grid">
      <section class="card"><div class="card-head"><h2>${icon('trophy')}Ce qui a le mieux tenu</h2></div>
        ${podium.length ? `<div class="rank">${podium.map((x, i) => `<div class="rank-item"><span class="rank-n">${i + 1}</span>${tile(x.h, 'sm')}<div style="min-width:0"><div class="name">${esc(x.h.name)}</div><div class="bar"><i style="--v:${Math.round(x.rate * 100)}"></i></div><div class="meta">${x.done} jour${x.done > 1 ? 's' : ''} sur ${x.scheduled}${x.partial ? ` · ${x.partial} en mini-version` : ''}</div></div><div class="rank-v"><b>${P(Math.round(x.rate * 100))}</b></div></div>`).join('')}</div>` : '<p class="muted small">Pas encore de données.</p>'}
        ${weakest ? `<p class="small muted" style="margin-top:12px">La plus difficile : <b style="color:var(--ink-1)">${esc(weakest.h.name)}</b> à ${P(Math.round(weakest.rate * 100))}. Une mini-version l’aiderait peut-être à tenir.</p>` : ''}
      </section>
      <section class="card"><div class="card-head"><h2>${icon('repeat')}Ce qui a changé</h2></div>
        <div class="set-list">
          <div class="set-row"><div class="lbl"><b>Habitudes commencées</b><span>${r.added.length ? r.added.map((h) => esc(h.name)).join(', ') : 'aucune cette année'}</span></div><div class="ctl"><b>${r.added.length}</b></div></div>
          <div class="set-row"><div class="lbl"><b>Habitudes abandonnées</b><span>${r.dropped.length ? r.dropped.map((h) => esc(h.name)).join(', ') : 'aucune — tu as tout gardé'}</span></div><div class="ctl"><b>${r.dropped.length}</b></div></div>
          <div class="set-row"><div class="lbl"><b>Tâches terminées</b><span>sur l’année</span></div><div class="ctl"><b>${r.tasksDone}</b></div></div>
          <div class="set-row"><div class="lbl"><b>Rétrospectives</b><span>semaines passées en revue</span></div><div class="ctl"><b>${r.reviews}</b></div></div>
        </div>
      </section>
    </div>
    ${r.notes.length ? `<section class="card"><div class="card-head"><div class="card-title-group"><h2>${icon('pen')}Ton journal de l’année</h2><span class="sub">${plural(r.notes.length, 'ligne écrite', 'lignes écrites')}</span></div></div>
      <ul class="plain journal-year">${r.notes.slice(-40).reverse().map((n) => `<li><button type="button" data-act="journal-edit" data-k="${n.k}"><b>${esc(F.short(n.k))}</b><span>${esc(n.text)}</span></button></li>`).join('')}</ul></section>` : ''}
    <section class="card"><div class="btn-row"><button type="button" class="btn" data-act="print-report">${icon('print')}Imprimer ce bilan</button><button type="button" class="btn ghost" data-act="nav" data-view="stats">${icon('chart')}Retour aux statistiques</button></div></section>`;
}

/* ===================== RECHERCHE ===================== */
function viewSearch() {
  const q = ui.search;
  const res = searchAll(q);
  const body = !res
    ? emptyState('search', 'Cherche dans tes données', 'Tape au moins deux lettres pour trouver une habitude, une tâche ou une ligne de journal.')
    : (res.habits.length + res.tasks.length + res.notes.length === 0
      ? emptyState('search', 'Aucun résultat', `Rien ne correspond à « ${esc(q)} ».`)
      : `${res.habits.length ? `<section class="card"><div class="card-head"><h2>${icon('repeat')}Habitudes</h2><span class="sub">${res.habits.length}</span></div><div class="rows">${res.habits.map((h) => `<div class="row"><button type="button" class="row-hit" data-act="habit-open" data-id="${h.id}">${tile(h)}<span class="row-text"><span class="row-title">${esc(h.name)}${h.archivedAt ? ' (archivée)' : ''}</span><span class="row-meta"><span>${scheduleLabel(h.days)}</span>${h.minLabel ? `<span>${icon('half')}${esc(h.minLabel)}</span>` : ''}</span></span></button></div>`).join('')}</div></section>` : ''}
        ${res.tasks.length ? `<section class="card"><div class="card-head"><h2>${icon('tasks')}Tâches</h2><span class="sub">${res.tasks.length}</span></div><div class="rows">${res.tasks.map((t) => taskRow(t, { showDate: true })).join('')}</div></section>` : ''}
        ${res.notes.length ? `<section class="card"><div class="card-head"><h2>${icon('pen')}Journal</h2><span class="sub">${res.notes.length}</span></div><ul class="plain journal-year">${res.notes.map((n) => `<li><button type="button" data-act="journal-edit" data-k="${n.k}"><b>${esc(F.short(n.k))}</b><span>${esc(n.text)}</span></button></li>`).join('')}</ul></section>` : ''}`);
  return `<section class="page-head"><p class="eyebrow">Recherche</p><h1 class="page-title">Chercher</h1></section>
    <section class="card"><form data-form="search" autocomplete="off" class="quick-add" style="margin:0" role="search">
      <input class="input" id="search-input" name="q" type="search" value="${esc(q)}" placeholder="Habitude, tâche, journal…" enterkeyhint="search" aria-label="Rechercher dans tes données">
      ${q ? `<button type="button" class="btn ghost" data-act="search-clear" aria-label="Effacer">${icon('x')}</button>` : ''}
    </form></section>
    ${body}`;
}

/* ===================== AIDE ===================== */
function viewHelp() {
  return `<section class="page-head"><p class="eyebrow">Cadence ${APP.version}</p><h1 class="page-title">Aide</h1></section>
    <section class="card doc">
      <h2>Les bases</h2>
      <p>Une <b>habitude</b> revient aux jours que tu choisis. Une <b>tâche</b> se fait une fois, à une date. Tu coches tes habitudes dans <b>Aujourd’hui</b>, tu rattrapes les jours passés dans <b>Matrice</b>.</p>
      <h2>La mini-version</h2>
      <p>Pour chaque habitude, tu peux définir une version minimale : « 5 minutes » au lieu de « lire 20 minutes ». Les jours difficiles, touche le bouton ${icon('half')} sur la ligne : la journée est marquée à part et <b>ta série continue</b>.</p>
      <p>Dans les pourcentages, une mini-version compte pour <b>une demi-validation</b>. C’est un choix volontaire : ne rien compter serait injuste, et compter autant qu’une journée complète te ferait croire à des résultats que tu n’as pas.</p>
      <h2>Comment les pourcentages sont calculés</h2>
      <ul>
        <li><b>Régularité du jour</b> : validations ÷ habitudes prévues ce jour-là. Une habitude cochée un jour non prévu compte en bonus, pas dans le total.</li>
        <li><b>Taux de régularité</b> : nombre de jours où tu as atteint ton objectif quotidien, divisé par le nombre de jours actifs.</li>
        <li><b>Série</b> : jours prévus consécutifs validés. Aujourd’hui non encore coché ne casse pas la série — tu as jusqu’à ce soir.</li>
      </ul>
      <h2>L’alerte décrochage</h2>
      <p>Cadence compare tes 14 derniers jours aux 14 précédents. Quand une habitude passe sous les 62 % <i>et</i> a nettement baissé, elle te le dit avant que la série casse, et propose de réduire les jours, d’ajouter une mini-version ou d’archiver. Une seule alerte s’affiche à la fois.</p>
      <h2>La rétrospective</h2>
      <p>Chaque semaine, Cadence te propose de passer en revue la semaine écoulée : ce qui a tenu, ce qui a lâché, et <b>un seul</b> changement à décider. Un changement par semaine se tient ; cinq, non.</p>
      <h2>Tes données</h2>
      <p>Tout est enregistré sur cet appareil, à chaque modification. Une sauvegarde interne est créée chaque jour et avant chaque mise à jour. Exporte un fichier de temps en temps : c’est ce qui te permettra de retrouver tes données sur un autre appareil.</p>
      <h2>Questions fréquentes</h2>
      <p><b>J’ai oublié de cocher hier.</b> Va dans Matrice et touche la case du jour concerné, ou touche un jour dans « Cette semaine ».</p>
      <p><b>Je me suis trompé.</b> Touche <i>Annuler</i> dans la notification qui apparaît, ou va dans Réglages pour annuler la dernière action.</p>
      <p><b>Mes données sont-elles sur iCloud ?</b> Non. Elles restent dans cette app, sur cet appareil. Pour les déplacer, utilise Réglages puis Transférer vers un autre appareil.</p>
      <p><b>Puis-je supprimer une habitude sans perdre son historique ?</b> Oui : archive-la. Elle quitte ta liste du jour mais reste dans la matrice et les statistiques.</p>
      <p><b>Pourquoi pas de rappel à l’heure ?</b> iOS n’autorise pas une app web installée à programmer une notification sans serveur. Tu peux créer une automatisation dans l’app Raccourcis d’Apple qui ouvre Cadence à l’heure que tu veux.</p>
    </section>
    <section class="card"><div class="btn-row"><button type="button" class="btn" data-act="install-guide">${icon('phone')}Guide d’installation</button><button type="button" class="btn" data-act="nav" data-view="confidentialite">${icon('lock')}Confidentialité</button></div></section>`;
}

/* ===================== CONFIDENTIALITÉ ===================== */
function viewPrivacy() {
  return `<section class="page-head"><p class="eyebrow">Cadence ${APP.version}</p><h1 class="page-title">Confidentialité</h1></section>
    <section class="card doc">
      <h2>En une phrase</h2>
      <p>Cadence n’envoie aucune de tes données nulle part. Tout ce que tu saisis reste dans cette app, sur cet appareil.</p>
      <h2>Ce qui est enregistré</h2>
      <ul>
        <li>Tes habitudes, catégories, validations, mini-versions, tâches, lignes de journal et rétrospectives.</li>
        <li>Tes réglages d’affichage et tes objectifs.</li>
        <li>Un identifiant d’appareil tiré au hasard, utilisé uniquement pour nommer tes sauvegardes.</li>
      </ul>
      <h2>Où</h2>
      <p>Dans la base de données de ton navigateur, réservée à cette app : <b>${esc(Store.label())}</b>. Les sauvegardes internes y sont aussi. Rien n’est partagé avec d’autres sites ni avec d’autres apps.</p>
      <h2>Ce qui sort de l’appareil</h2>
      <ul>
        <li><b>Quand tu exportes</b> : tu obtiens un fichier, et tu décides où il va.</li>
        <li><b>Quand tu copies une demande de mise à jour</b> : le texte contient tes idées d’amélioration et les numéros de version, jamais tes validations ni ton journal.</li>
        <li><b>Rien d’autre.</b> Pas de compte, pas de mesure d’audience, pas de publicité, aucun serveur qui reçoive quoi que ce soit.</li>
      </ul>
      <h2>Ce que le réseau fait quand même</h2>
      <p>Au premier chargement, ton navigateur télécharge les fichiers de l’app depuis l’adresse où tu l’as publiée (GitHub Pages, par exemple). Ensuite, l’app fonctionne hors ligne et ne contacte cette adresse que pour vérifier s’il existe une nouvelle version. Cette requête ne contient rien de personnel, mais l’hébergeur voit, comme tout hébergeur, ton adresse IP.</p>
      <h2>Effacer tes données</h2>
      <p>Réglages puis Zone sensible puis « Effacer toutes les données ». Attention : supprimer l’icône de Cadence de ton écran d’accueil efface aussi ses données, sans confirmation. Exporte avant.</p>
      <h2>Dépôt public</h2>
      <p>Si tu as publié Cadence depuis un dépôt GitHub public, seul le <i>code</i> de l’app y est visible. Tes habitudes et ton journal n’y sont jamais envoyés.</p>
    </section>`;
}

async function renderBackupList() {
  const host = $('#backup-list');
  if (!host) return;
  const list = await Backups.list();
  host.innerHTML = list.length
    ? `<ul class="plain activity">${list.map((b) => `<li><span>${esc(BACKUP_REASONS[b.reason] || b.reason)}<br><span class="small muted">${esc(F.rel(b.at))} · ${b.habits} habitudes · ${b.checks} validations · v${esc(b.version)}</span></span><button type="button" class="btn sm" style="margin-left:auto" data-act="backup-restore" data-id="${b.id}">Restaurer</button></li>`).join('')}</ul>`
    : '<p class="small muted">Une sauvegarde est créée chaque jour, et avant chaque mise à jour ou import.</p>';
}
